<!DOCTYPE html>
<html lang="en" data-title-fr="Safari des animaux">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Visit the farm, the wild and faraway lands, tap animals to hear their real sounds, then guess who says that. English and French.">
    <title>Animal Safari</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #E4F6DF; }
        .habitat {
            position: relative;
            width: 100%;
            max-width: 1080px;
            flex: 1;
            border-radius: 36px;
            overflow: hidden;
            padding: 70px 14px 22px;
            background: var(--scene);
            box-shadow: 0 10px 0 rgba(61,53,81,0.1);
        }
        .habitat .decor { position: absolute; bottom: 6px; font-size: 44px; opacity: 0.95; pointer-events: none; }
        .habitat { padding-bottom: 70px; }
        .habitat h2 { position: absolute; top: 14px; left: 0; right: 0; margin: 0; text-align: center; font-family: 'Fredoka One', system-ui, sans-serif; font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.4rem); color: #fff; -webkit-text-stroke: 1.5px rgba(61,53,81,0.25); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(61,53,81,0.25); }
        .animals { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px 8px; }
        .animal {
            position: relative;
            border: 0;
            background: rgba(255,255,255,0.6);
            border-radius: 28px;
            padding: 10px 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: 0 5px 0 rgba(61,53,81,0.12);
            animation: kit-rise 0.45s backwards;
            transition: transform 0.15s, background 0.2s;
        }
        .animal .pic { font-size: clamp(3.2rem, 11vw, 4.6rem); line-height: 1.1; display: inline-block; animation: idle 3.2s ease-in-out infinite; }
        .animal:nth-child(3n) .pic { animation-delay: -1.1s; }
        .animal:nth-child(3n+1) .pic { animation-delay: -2.2s; }
        .animal .name { font-family: 'Fredoka One', system-ui, sans-serif; font-size: clamp(0.95rem, 3.4vw, 1.2rem); }
        .animal.playing { background: #fff; }
        .animal.playing .pic { animation: jump 0.7s cubic-bezier(0.34,1.56,0.64,1) 2; }
        .animal.playing::after { content: '🔊'; position: absolute; top: 4px; right: 8px; font-size: 1.2rem; animation: kit-pop 0.4s; }
        @keyframes idle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-3deg); } }
        @keyframes jump { 30% { transform: translateY(-26px) scale(1.15) rotate(-8deg); } 60% { transform: translateY(0) scale(1.05, 0.92); } }
        .bubble { position: absolute; left: 50%; top: -18px; transform: translate(-50%, -100%); padding: 6px 14px; border-radius: 18px; background: #fff; white-space: nowrap; font-family: 'Fredoka One', system-ui, sans-serif; font-size: 1.2rem; box-shadow: 0 4px 0 rgba(61,53,81,0.15); animation: kit-pop 0.35s; z-index: 2; pointer-events: none; }

        .quiz-ear {
            width: clamp(140px, 36vw, 200px);
            aspect-ratio: 1;
            border: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 12%, transparent 13%), linear-gradient(180deg, #FFC94D, #FF9F43);
            box-shadow: 0 9px 0 #DB7415, 0 18px 30px rgba(61,53,81,0.18);
            font-size: clamp(4rem, 12vw, 5.6rem);
        }
        .quiz-ear.listening { animation: kit-squish 0.6s infinite; }
        .quiz-ear:active { transform: translateY(8px); box-shadow: 0 1px 0 #DB7415; }
        .choices { width: 100%; max-width: 820px; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 14px; }
        .choices .animal { background: #fff; padding: 16px 6px 12px; }
        .choices .animal.dim { opacity: 0.35; }
        .choices .animal.right { box-shadow: 0 5px 0 var(--green-d), 0 0 0 5px var(--green); }
        @media (max-width: 560px) { .animals { grid-template-columns: repeat(3, 1fr); } .habitat { padding-top: 60px; border-radius: 26px; } }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <h1 class="kit-title" style="--title-shadow:#4CC26A"><span class="bob" data-fr="Safari">Animal</span> <span class="bob" style="animation-delay:-1.3s" data-fr="des animaux">Safari</span></h1>
        <p class="kit-sub" data-fr="Touche les animaux pour entendre leurs vrais cris !">Tap the animals to hear their real sounds!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" data-world="farm" style="--c:#4CC26A"><span class="kit-mode-art"><span>🐮</span></span><span class="kit-mode-label"><b data-fr="La ferme">The farm</b><small data-fr="Meuh, coin-coin, cocorico !">Moo, quack, cock-a-doodle-doo!</small></span></button>
            <button class="kit-mode" type="button" data-world="wild" style="--c:#FF9F43"><span class="kit-mode-art"><span>🦁</span></span><span class="kit-mode-label"><b data-fr="La nature sauvage">The wild</b><small data-fr="Lions, loups et pingouins">Lions, wolves and penguins</small></span></button>
            <button class="kit-mode" type="button" data-world="far" style="--c:#A66BFF"><span class="kit-mode-art"><span>🐫</span></span><span class="kit-mode-label"><b data-fr="Très loin">Far away</b><small data-fr="Chameaux, hippos et crocos">Camels, hippos and gators</small></span></button>
            <button class="kit-mode" type="button" id="go-quiz" style="--c:#4FB8FF"><span class="kit-badge" id="quiz-badge"></span><span class="kit-mode-art"><span>🎧</span></span><span class="kit-mode-label"><b data-fr="Qui fait ce bruit ?">Who says that?</b><small data-fr="Écoute et trouve l'animal">Listen and find the animal</small></span></button>
        </div>
    </main>

    <main class="kit-screen" id="world" hidden>
        <section class="habitat" id="habitat"><h2 id="habitat-name"></h2><div id="decor"></div><div class="animals" id="animals"></div></section>
    </main>

    <main class="kit-screen" id="quiz" hidden>
        <div class="kit-hud"><span class="kit-level" id="quiz-level"></span><span class="kit-stars" id="quiz-stars"></span></div>
        <button type="button" class="quiz-ear" id="quiz-ear" aria-label="Play the sound again" data-fr-aria-label="Rejouer le son">👂</button>
        <div class="kit-prompt"><span data-fr="Qui fait ce bruit ?">Who says that?</span></div>
        <div class="choices" id="choices"></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        // The real recordings are hosted by Google (the Google Search animal sounds).
        const SOUND_BASE = 'https://www.google.com/logos/fnbx/animal_sounds/';
        const A = (name, fr, file, emoji) => ({ name, fr, file, emoji });
        const WORLDS = {
            farm: { name: ['The farm', 'La ferme'], scene: 'linear-gradient(180deg, #9EDCFF 0%, #D9F2FF 45%, #9BDB7E 45.5%, #7CC864 100%)', tint: '#E4F6DF',
                decor: [['🌳', 2], ['🌻', 22], ['🏡', 48], ['🚜', 72], ['🌻', 92]],
                animals: [A('Dog', 'Chien', 'dog', '🐶'), A('Cat', 'Chat', 'cat', '🐱'), A('Cow', 'Vache', 'cow', '🐮'), A('Pig', 'Cochon', 'pig', '🐷'), A('Sheep', 'Mouton', 'sheep', '🐑'),
                    A('Duck', 'Canard', 'duck', '🦆'), A('Chicken', 'Poule', 'chicken', '🐔'), A('Rooster', 'Coq', 'rooster', '🐓'), A('Horse', 'Cheval', 'horse', '🐎'), A('Turkey', 'Dinde', 'turkey', '🦃'),
                    A('Rabbit', 'Lapin', 'rabbit', '🐰'), A('Frog', 'Grenouille', 'frog', '🐸'), A('Owl', 'Hibou', 'owl', '🦉'), A('Mouse', 'Rat', 'rat', '🐭'), A('Robin', 'Merle', 'robin', '🐦'),
                    A('Dove', 'Colombe', 'dove', '🕊️'), A('Bee', 'Abeille', 'bee', '🐝'), A('Guinea pig', 'Cochon d’Inde', 'guinea-pig', '🐹')] },
            wild: { name: ['The wild', 'La nature sauvage'], scene: 'linear-gradient(180deg, #FFB86B 0%, #FFE0A8 42%, #E8C46A 42.5%, #C9A24B 100%)', tint: '#FFEFD6',
                decor: [['🌴', 2], ['🌵', 24], ['🌳', 48], ['🌾', 72], ['🌴', 92]],
                animals: [A('Lion', 'Lion', 'lion', '🦁'), A('Tiger', 'Tigre', 'tiger', '🐯'), A('Elephant', 'Éléphant', 'elephant', '🐘'), A('Zebra', 'Zèbre', 'zebra', '🦓'), A('Giraffe', 'Girafe', 'giraffe', '🦒'),
                    A('Gorilla', 'Gorille', 'ape', '🦍'), A('Panda', 'Panda', 'panda', '🐼'), A('Wolf', 'Loup', 'wolf', '🐺'), A('Moose', 'Orignal', 'moose', '🫎'), A('Raccoon', 'Raton laveur', 'raccoon', '🦝'),
                    A('Otter', 'Loutre', 'otter', '🦦'), A('Penguin', 'Manchot', 'penguin', '🐧'), A('Swan', 'Cygne', 'swan', '🦢'), A('Shark', 'Requin', 'shark', '🦈'), A('Bat', 'Chauve-souris', 'bat', '🦇'),
                    A('Hedgehog', 'Hérisson', 'hedgehog', '🦔'), A('Leopard', 'Léopard', 'leopard', '🐆')] },
            far: { name: ['Far away', 'Très loin'], scene: 'linear-gradient(180deg, #C9B6FF 0%, #F1E3FF 44%, #F4D58D 44.5%, #E8B85C 100%)', tint: '#EFE6FF',
                decor: [['🌴', 2], ['🏜️', 24], ['⛰️', 48], ['🌵', 72], ['🌴', 92]],
                animals: [A('Camel', 'Chameau', 'camel', '🐫'), A('Buffalo', 'Buffle', 'buffalo', '🐃'), A('Yak', 'Yak', 'yak', '🐂'), A('Alpaca', 'Alpaga', 'alpaca', '🦙'), A('Antelope', 'Antilope', 'antelope', '🦌'),
                    A('Rhino', 'Rhinocéros', 'rhinoceros', '🦏'), A('Hippo', 'Hippopotame', 'hippopotamus', '🦛'), A('Alligator', 'Alligator', 'alligator', '🐊'), A('Rattlesnake', 'Serpent à sonnette', 'rattlesnake', '🐍'),
                    A('Lizard', 'Lézard', 'lizard', '🦎'), A('Scorpion', 'Scorpion', 'scorpion', '🦂'), A('Crow', 'Corbeau', 'crow', '🐦‍⬛'), A('Falcon', 'Faucon', 'falcon', '🦅')] }
        };
        const nameOf = a => T(a.name, a.fr);

        // ---------- One sound at a time; speak the name if the recording can't load ----------
        let audio = null, playReq = 0;
        function stopSound() { playReq++; if (audio) { audio.pause(); audio = null; } }
        function playAnimal(a, onEnd) {
            stopSound();
            if (Kit.muted) return;
            const req = playReq;
            const el = new Audio(SOUND_BASE + a.file + '.mp3');
            audio = el;
            const fallback = () => { if (req === playReq) { say(a.name, a.fr); if (onEnd) onEnd(); } };
            el.onended = () => { if (req === playReq && onEnd) onEnd(); };
            el.onerror = fallback;
            el.play().catch(fallback);
        }

        const start = $('#start'), world = $('#world'), quiz = $('#quiz');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#E4F6DF'); renderBadge(); }
        Kit.onLeave(world, stopSound);
        Kit.onLeave(quiz, stopSound);

        // ---------------- 🌍 HABITATS ----------------
        let currentWorld = 'farm';
        function renderWorld() {
            const w = WORLDS[currentWorld];
            $('#habitat').style.setProperty('--scene', w.scene);
            $('#habitat-name').textContent = T(...w.name);
            $('#decor').innerHTML = w.decor.map(([e, x]) => `<span class="decor" style="left:${x}%" aria-hidden="true">${e}</span>`).join('');
            $('#animals').innerHTML = w.animals.map((a, i) =>
                `<button type="button" class="animal" data-i="${i}" style="animation-delay:${i * 0.03}s" aria-label="${nameOf(a)}"><span class="pic" aria-hidden="true">${a.emoji}</span><span class="name">${nameOf(a)}</span></button>`).join('');
        }
        $('#animals').addEventListener('click', event => {
            const btn = event.target.closest('.animal');
            if (!btn) return;
            const a = WORLDS[currentWorld].animals[Number(btn.dataset.i)];
            document.querySelectorAll('.animal.playing').forEach(b => b.classList.remove('playing'));
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            btn.classList.add('playing');
            btn.insertAdjacentHTML('beforeend', `<span class="bubble">${nameOf(a)}</span>`);
            Kit.burstFrom(btn, ['#FFD54A', '#fff', '#FF6B8B'], 18, 0.8);
            sfx.pop();
            // Say the name, then play the real sound.
            say(a.name, a.fr);
            Kit.later(() => playAnimal(a, () => btn.classList.remove('playing')), 750);
            Kit.later(() => { btn.classList.remove('playing'); const b = btn.querySelector('.bubble'); if (b) b.remove(); }, 6000);
        });
        function openWorld(id) {
            currentWorld = id;
            Kit.show(world);
            Kit.tint(WORLDS[id].tint);
            renderWorld();
            say(`Welcome to ${WORLDS[id].name[0].toLowerCase()}! Tap an animal!`, `Bienvenue${NBSP}: ${WORLDS[id].name[1].toLowerCase()}${NBSP}! Touche un animal${NBSP}!`);
        }

        // ---------------- 🎧 WHO SAYS THAT? ----------------
        const QUIZ = [{ n: 2, pool: ['farm'] }, { n: 3, pool: ['farm'] }, { n: 3, pool: ['farm', 'wild'] }, { n: 4, pool: ['farm', 'wild'] }, { n: 4, pool: ['farm', 'wild', 'far'] }];
        const ROUNDS = 5;
        const quizStore = Kit.levelStore('animals-quiz-level', QUIZ.length);
        let quizLevel = quizStore.get(), quizWon = 0, answer = null, quizLocked = false, lastAnswer = null;
        function renderQuizHud(popIndex) {
            $('#quiz-level').textContent = T(`Level ${quizLevel + 1}`, `Niveau ${quizLevel + 1}`);
            Kit.stars($('#quiz-stars'), ROUNDS, quizWon, popIndex);
        }
        function listen() {
            $('#quiz-ear').classList.add('listening');
            playAnimal(answer, () => $('#quiz-ear').classList.remove('listening'));
            Kit.later(() => $('#quiz-ear').classList.remove('listening'), 5000);
        }
        function newQuiz() {
            quizLocked = false;
            const cfg = QUIZ[quizLevel];
            const pool = cfg.pool.flatMap(id => WORLDS[id].animals);
            answer = Kit.pick(pool.filter(a => a !== lastAnswer));
            lastAnswer = answer;
            const others = Kit.shuffle(pool.filter(a => a !== answer)).slice(0, cfg.n - 1);
            const choices = Kit.shuffle([answer, ...others]);
            $('#choices').style.setProperty('--n', cfg.n === 4 ? 2 : cfg.n);
            $('#choices').innerHTML = choices.map((a, i) =>
                `<button type="button" class="animal" data-file="${a.file}" style="animation-delay:${i * 0.06}s" aria-label="${nameOf(a)}"><span class="pic" aria-hidden="true">${a.emoji}</span><span class="name">${nameOf(a)}</span></button>`).join('');
            $('#choices')._choices = choices;
            renderQuizHud();
            Kit.later(listen, 500);
        }
        $('#choices').addEventListener('click', event => {
            const btn = event.target.closest('.animal');
            if (!btn || quizLocked) return;
            const a = $('#choices')._choices.find(x => x.file === btn.dataset.file);
            if (a !== answer) {
                Kit.bounce(btn, 'wobble');
                sfx.oops();
                stopSound();
                say(`That's the ${a.name.toLowerCase()}.`, `C'est ${nameOf(a).toLowerCase()}.`);
                Kit.later(() => btn.classList.add('dim'), 300);
                return;
            }
            quizLocked = true;
            btn.classList.add('right', 'playing');
            sfx.cheer();
            Kit.burstFrom(btn, ['#4CC26A', '#FFD54A', '#fff'], 30);
            quizWon++;
            let wait = 2600;
            if (quizWon >= ROUNDS) {
                quizWon = 0;
                if (quizLevel < QUIZ.length - 1) quizLevel++;
                quizStore.set(quizLevel);
                say(`Yes! The ${a.name.toLowerCase()}! Super! Level ${quizLevel + 1}!`, `Oui${NBSP}! ${nameOf(a)}${NBSP}! Super${NBSP}! Niveau ${quizLevel + 1}${NBSP}!`);
                Kit.later(() => { Kit.cheer(T(`⭐ Level ${quizLevel + 1}!`, `⭐ Niveau ${quizLevel + 1}${NBSP}!`)); Kit.confetti(100); sfx.fanfare(); }, 500);
                renderQuizHud(ROUNDS - 1);
                wait = 3600;
            } else {
                say(`Yes! The ${a.name.toLowerCase()}!`, `Oui${NBSP}! ${nameOf(a)}${NBSP}!`);
                renderQuizHud(quizWon - 1);
            }
            Kit.later(newQuiz, wait);
        });
        $('#quiz-ear').addEventListener('click', () => { if (answer) listen(); });
        function openQuiz() { Kit.show(quiz); Kit.tint('#E2F1FF'); quizWon = 0; newQuiz(); }

        // ---------------- START ----------------
        function renderBadge() { $('#quiz-badge').textContent = T(`Level ${quizLevel + 1}`, `Niv. ${quizLevel + 1}`); }
        document.querySelectorAll('[data-world]').forEach(b => b.addEventListener('click', () => { sfx.pop(); openWorld(b.dataset.world); }));
        $('#go-quiz').addEventListener('click', () => { sfx.pop(); openQuiz(); });
        Kit.onLang(() => {
            renderBadge();
            if (!world.hidden) renderWorld();
            if (!quiz.hidden) $('#choices').querySelectorAll('.animal').forEach(b => {
                const a = $('#choices')._choices.find(x => x.file === b.dataset.file);
                b.querySelector('.name').textContent = nameOf(a);
                b.setAttribute('aria-label', nameOf(a));
            });
        });
        goStart();
    }());
    </script>
</body>
</html>
