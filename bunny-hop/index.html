<!DOCTYPE html>
<html lang="en" data-title-fr="Saute, lapin !">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Tap to make the bunny hop over mushrooms, snails and logs, and munch carrots along the way. An endless meadow run from day to night. No ads. English and French.">
    <title>Bunny Hop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐇</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #D8F3C4; }
        .hop-row { display: flex; gap: 10px; align-items: flex-end; font-size: clamp(2.4rem, 9vw, 3.6rem); }
        .hop-row span { display: inline-block; filter: drop-shadow(0 6px 5px rgba(61,53,81,0.2)); }
        .hop-row .bun { transform: scaleX(-1); animation: hop 0.9s ease-in-out infinite; font-size: 1.3em; }
        @keyframes hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -34px; } }
        .kit-modes { max-width: 640px; }

        /* No fade-in on the play screen: the game should be bright from the first frame. */
        #play { padding: 0; animation: none; }
        .board { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: #8FD3FF; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        .board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

        .hud {
            position: fixed;
            left: calc(var(--safe-left) + 10px);
            right: calc(var(--safe-right) + 10px);
            top: calc(var(--safe-top) + 66px);
            z-index: 6;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            font-family: 'Fredoka One', system-ui, sans-serif;
            color: var(--ink, #3D3551);
        }
        .score { font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1; padding: 6px 18px 8px 12px; border-radius: 999px; background: #fff; box-shadow: 0 5px 0 rgba(61,53,81,0.2); }
        .score.bump { animation: bump 0.25s; }
        @keyframes bump { 50% { transform: scale(1.18); } }
        .best { display: inline-block; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; margin-top: 10px; padding: 3px 12px; border-radius: 999px; background: #fff; box-shadow: 0 3px 0 rgba(61,53,81,0.2); }
        .hearts { font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1; padding: 9px 13px; border-radius: 999px; background: #fff; box-shadow: 0 5px 0 rgba(61,53,81,0.2); display: flex; gap: 3px; }
        .hearts .off { filter: grayscale(1); opacity: 0.3; }
        .hearts.bump { animation: bump 0.3s; }
        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .pause { pointer-events: auto; display: grid; place-items: center; width: 54px; height: 54px; padding: 0; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 5px 0 rgba(61,53,81,0.2); cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .pause::before { content: ''; box-sizing: border-box; width: 20px; height: 22px; border: solid var(--ink, #3D3551); border-width: 0 7px; border-radius: 3px; }
        .pause:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(61,53,81,0.2); }

        .results {
            position: fixed; left: 50%; top: 50%; z-index: 8; translate: -50% -50%;
            width: min(92vw, 420px); padding: 26px 22px 22px; border-radius: 34px; background: #fff; text-align: center;
            box-shadow: 0 10px 0 rgba(61,53,81,0.15), 0 30px 60px rgba(0,0,0,0.35);
            animation: kit-rise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        .results h2 { margin: 0; font-family: 'Fredoka One', system-ui, sans-serif; font-weight: 400; font-size: 2.2rem; color: var(--green, #26C281); }
        .results .big { font-family: 'Fredoka One', system-ui, sans-serif; font-size: 4.2rem; line-height: 1.1; color: var(--ink); }
        .results p { margin: 4px 0 0; font-weight: 900; color: var(--muted); font-size: 1.1rem; }
        .results .new-best { color: var(--pink); font-size: 1.3rem; animation: bump 0.6s 3; }
        .results .row { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
        .results button { border: 0; border-radius: 22px; padding: 14px 22px; font-family: 'Fredoka One', system-ui, sans-serif; font-size: 1.3rem; color: #fff; background: var(--c); box-shadow: 0 6px 0 var(--cd); cursor: pointer; }
        .results button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cd); }
        .banner {
            position: fixed; left: 50%; top: 40%; z-index: 7; translate: -50% -50%; pointer-events: none;
            font-family: 'Fredoka One', system-ui, sans-serif; font-size: clamp(2.2rem, 9vw, 4.6rem); color: #fff; white-space: nowrap;
            text-shadow: 0 6px 0 var(--bc, #26A65B), 0 14px 30px rgba(0,0,0,0.4);
            animation: banner 1.4s ease-out forwards;
        }
        @keyframes banner { 0% { transform: translateY(10px); opacity: 0; } 15%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .hop-row .bun { animation: none; } }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <div class="hop-row" aria-hidden="true"><span class="bun">🐇</span><span>🍄</span><span>🥕</span><span>🐌</span></div>
        <h1 class="kit-title" style="--title-shadow:#26A65B"><span class="bob" data-fr="Saute,">Bunny</span> <span class="bob" style="animation-delay:-1.3s" data-fr="lapin !">Hop</span></h1>
        <p class="kit-sub" data-fr="Touche l'écran pour sauter. Touche encore pour un double saut !">Tap to hop. Tap again in the air for a double hop!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" id="go-cozy" style="--c:#4CC26A"><span class="kit-badge" id="cozy-best"></span><span class="kit-mode-art"><span>🌼</span></span><span class="kit-mode-label"><b data-fr="Balade">Stroll</b><small data-fr="Tout doux, 5 cœurs">Nice and slow, 5 hearts</small></span></button>
            <button class="kit-mode" type="button" id="go-speedy" style="--c:#FF9F43"><span class="kit-badge" id="speedy-best"></span><span class="kit-mode-art"><span>⚡</span></span><span class="kit-mode-label"><b data-fr="Course">Dash</b><small data-fr="Plus vite, 3 cœurs, attention aux abeilles">Faster, 3 hearts, mind the bees</small></span></button>
        </div>
    </main>

    <main class="kit-screen fit" id="play" hidden>
        <div class="board" id="board" aria-label="Meadow: tap to hop" data-fr-aria-label="Prairie : touche pour sauter">
            <canvas id="cv" aria-hidden="true"></canvas>
        </div>
        <div class="hud">
            <div><div class="score" id="score">🥕 0</div><div class="best" id="best"></div></div>
            <div class="hud-right">
                <div class="hearts" id="hearts"></div>
                <button type="button" class="pause" id="pause" aria-label="Pause"></button>
            </div>
        </div>
        <div id="results-slot"></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, say } = Kit;
        const NBSP = ' ';

        const MODES = {
            cozy: { hearts: 5, v0: 215, vmax: 370, acc: 2.5, bees: 1e9 },
            speedy: { hearts: 3, v0: 295, vmax: 540, acc: 5, bees: 80 }
        };
        // Things on the ground to hop over, all drawn by hand.
        // hw = half width and hh = height that count as solid (a little smaller than the picture, to be kind).
        const GROUND = [
            { kind: 'mushroom', hw: 17, hh: 32 },
            { kind: 'rock', hw: 22, hh: 24 },
            { kind: 'log', hw: 28, hh: 24 },
            { kind: 'hedgehog', hw: 21, hh: 24 },
            { kind: 'snail', hw: 20, hh: 24 },
            { kind: 'stump', hw: 16, hh: 36 }
        ];
        // Sky colours: day, sunset, night. Each is [top, bottom].
        const SKIES = [
            [[104, 188, 255], [200, 236, 255]],
            [[255, 146, 118], [255, 224, 150]],
            [[52, 56, 150], [112, 108, 205]]
        ];
        // The light on the meadow: day, sunset, night. Multiplied over the scenery so colours stay rich.
        const LIGHT = [[255, 255, 255], [255, 226, 196], [132, 142, 214]];

        const start = $('#start'), play = $('#play'), board = $('#board');
        const cv = $('#cv'), view = cv.getContext('2d');
        // The backdrop (sky, hills, path) never moves, so it is painted once on its own canvas and reused.
        const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
        let ctx = view, bgKey = '';
        Kit.topbar({ onBack: () => goStart() });

        const bestKey = m => `hop-best-${m}`;
        const getBest = m => Number(Kit.store.get(bestKey(m), 0)) || 0;

        // ---------- Sizes ----------
        let W = 0, H = 0, DPR = 1, S = 1, GY = 0, BX = 0;
        function resize() {
            DPR = Math.min(2, window.devicePixelRatio || 1);
            W = board.clientWidth; H = board.clientHeight;
            cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
            view.setTransform(DPR, 0, 0, DPR, 0, 0);
            bg.width = cv.width; bg.height = cv.height;
            bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
            bgKey = '';
            // On a tall, narrow phone the picture follows the width, so there is room to see what is coming.
            S = Math.max(0.62, Math.min(1.2, H / 560, W / 460));
            GY = H - Math.max(84, H * 0.2);
            BX = Math.max(74, Math.min(W * 0.2, 220));
        }

        // ---------- State ----------
        let mode = 'cozy', cfg = MODES.cozy;
        let running = false, paused = false, ending = false, raf = 0, last = 0, clock = 0, calm = false;
        let speed = 0, dist = 0, bonus = 0, score = 0, shown = -1, hearts = 0, inv = 0, nextMile = 100;
        let gap = 0, buffer = 0, lastBee = false;
        let obstacles = [], knocked = [], carrots = [], parts = [], popups = [], clouds = [], starsBg = [];
        const bunny = { y: 0, vy: 0, jumps: 0, squash: 0 };

        const GRAV = 2500, JUMP = 900, JUMP2 = 780;

        function jump() {
            if (!running || paused) return;
            // A tap just before landing is remembered, so the next hop never gets lost.
            if (bunny.jumps >= 2) { buffer = 0.16; return; }
            const second = bunny.jumps === 1 || bunny.y > 2;
            bunny.vy = (second ? JUMP2 : JUMP) * S;
            bunny.jumps = second ? 2 : 1;
            bunny.squash = 0.07;
            Kit.tone(second ? 520 : 380, { to: second ? 820 : 620, dur: 0.14, vol: 0.07, type: 'triangle' });
            for (let i = 0; i < 2; i++) puff(BX - 6 * S, GY - bunny.y, '#FFFFFF', 4);
        }
        function release() {
            // Letting go early makes a smaller hop, but never a tiny one.
            if (bunny.vy > 560 * S) bunny.vy = 560 * S;
        }
        function puff(x, y, color, r) {
            parts.push({ x, y, vx: -60 - Math.random() * 120, vy: -Math.random() * 90, g: 200, r: r * (0.6 + Math.random() * 0.6), t: 0.4, life: 0.4, color });
        }
        function sparks(x, y, colors, n, power) {
            for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * power, vy: -Math.random() * power * 0.8, g: 700, r: 3 + Math.random() * 4, t: 0.6, life: 0.6, color: Kit.pick(colors), star: true });
        }

        // Bees drift gently up and down.
        const beeAlt = o => o.alt + Math.sin(clock * 2 + o.ph) * 5;

        function spawn() {
            const x = W + 80;
            const bee = !lastBee && dist / (40 * S) > cfg.bees && Math.random() < 0.2;
            lastBee = bee;
            if (bee) {
                // Bees fly at hop height: stay on the ground and they pass overhead.
                obstacles.push({ x, kind: 'bee', hw: 13, hh: 11, alt: 128, air: true, ph: Math.random() * 6 });
                gap = speed * (1.2 + Math.random() * 0.6) + 130 * S;
                return;
            }
            const o = Object.assign({ x }, Kit.pick(GROUND));
            obstacles.push(o);
            // Sometimes two in a row once things speed up.
            if (speed > cfg.v0 * 1.25 * S && Math.random() < 0.3) obstacles.push(Object.assign({ x: x + (o.hw + 34) * S }, Kit.pick(GROUND.slice(0, 2))));
            if (Math.random() < 0.4) carrots.push({ x, alt: 118 + Math.random() * 30 });
            gap = speed * (0.9 + Math.random() * 0.9) + 130 * S;
            if (Math.random() < 0.55) carrots.push({ x: x + gap * 0.5, alt: 26 + Math.random() * 70 });
        }

        function hurt(o) {
            o.gone = true;
            // The thing we bumped tumbles away instead of just vanishing.
            knocked.push({ kind: o.kind, x: o.x, y: o.air ? GY - o.alt * S : GY, vx: 200 * S, vy: -520 * S, rot: 0 });
            hearts--; inv = 1.8;
            renderHearts(true);
            Kit.tone(240, { to: 150, dur: 0.28, vol: 0.1, type: 'sine' });
            sparks((o.x + BX) / 2, GY - bunny.y - 30 * S, ['#FFD23F', '#FFFFFF', '#FF9F1C'], 5, 240);
            if (hearts <= 0) finish();
            else say('Oops! Keep hopping!', `Oups${NBSP}! Continue${NBSP}!`);
        }

        // ---------- Loop ----------
        function step(now) {
            raf = requestAnimationFrame(step);
            const dt = Math.max(0, Math.min(0.034, (now - last) / 1000));
            last = now;
            clock += dt;
            if (running) update(dt);
            else settle(dt);
            draw();
        }
        function moveBunny(dt) {
            if (bunny.y > 0 || bunny.vy > 0) {
                bunny.vy -= GRAV * S * dt;
                bunny.y += bunny.vy * dt;
                if (bunny.y <= 0) {
                    bunny.y = 0; bunny.vy = 0; bunny.jumps = 0; bunny.squash = -0.06;
                    for (let i = 0; i < 2; i++) puff(BX, GY, '#E2CFA0', 4);
                    Kit.noise({ dur: 0.07, freq: 300, q: 0.8, vol: 0.05 });
                    if (running && buffer > 0) { buffer = 0; jump(); }
                }
            }
            bunny.squash *= Math.pow(0.002, dt);
        }
        function moveBits(dt, dx) {
            for (const k of knocked) { k.x += k.vx * dt; k.y += k.vy * dt; k.vy += 1500 * S * dt; k.rot += 2.2 * dt; }
            knocked = knocked.filter(k => k.y < H + 120);
            for (const p of parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
            parts = parts.filter(p => p.t > 0);
            for (const p of popups) { p.t -= dt; p.y -= 60 * dt; p.x -= dx * 0.5; }
            popups = popups.filter(p => p.t > 0);
        }
        // After the last heart: the world stops, the bunny lands and the last bits settle.
        function settle(dt) { moveBunny(dt); moveBits(dt, 0); }
        function update(dt) {
            speed = Math.min(cfg.vmax * S, speed + cfg.acc * S * dt);
            const dx = speed * dt;
            dist += dx;
            if (buffer > 0) buffer -= dt;
            if (inv > 0) inv -= dt;
            moveBunny(dt);

            // Things coming at us
            gap -= dx;
            if (gap <= 0) spawn();
            for (const o of obstacles) {
                o.x -= dx;
                if (o.gone || inv > 0) continue;
                let lo = 0, hi = o.hh * S;
                if (o.air) { const mid = beeAlt(o) * S; lo = mid - o.hh * S; hi = mid + o.hh * S; }
                if (Math.abs(o.x - BX) < (o.hw + 15) * S && bunny.y < hi && bunny.y + 50 * S > lo) hurt(o);
            }
            obstacles = obstacles.filter(o => o.x > -90 && !o.gone);
            for (const c of carrots) {
                c.x -= dx;
                if (!c.got && Math.abs(c.x - BX) < 36 * S && Math.abs(c.alt * S - (bunny.y + 28 * S)) < 46 * S) {
                    c.got = true; bonus += 10;
                    popups.push({ x: c.x, y: GY - c.alt * S, text: '+10', t: 0.8 });
                    sparks(c.x, GY - c.alt * S, ['#FFD23F', '#FF9F1C', '#FFFFFF', '#FF7AA8'], 5, 220);
                    Kit.tone(Kit.note(12), { dur: 0.1, vol: 0.08 });
                    Kit.tone(Kit.note(19), { at: 0.07, dur: 0.14, vol: 0.08 });
                }
            }
            carrots = carrots.filter(c => c.x > -60 && !c.got);
            moveBits(dt, dx);

            score = Math.floor(dist / (40 * S)) + bonus;
            if (score !== shown) renderScore();
            if (score >= nextMile) {
                banner(`${nextMile}!`, '#FFB627');
                Kit.sfx.sparkle();
                nextMile += 100;
            }
        }

        // ---------- Drawing ----------
        // Everything is drawn in one style: flat bright colours with a dark outline.
        const INK = '#4A2C17';
        const mix = (a, b, f) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`;
        const ink = () => { ctx.fill(); ctx.stroke(); };
        function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill(); }
        function oval(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.3); }
        function box(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }
        function star(x, y, r, color) {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
            ctx.closePath(); ctx.fillStyle = color; ctx.fill();
        }
        function grad(y0, y1, c0, c1) {
            const g = ctx.createLinearGradient(0, y0, 0, y1);
            g.addColorStop(0, c0); g.addColorStop(1, c1);
            return g;
        }
        // Each picture is drawn around (0, 0): ground things stand on it, the bee and carrot are centred on it.
        const SPRITES = {
            mushroom() {
                ctx.fillStyle = '#FFF1D6'; box(-9, -26, 18, 26, 7); ink();
                ctx.fillStyle = '#F2453D';
                ctx.beginPath(); ctx.moveTo(-27, -20); ctx.bezierCurveTo(-27, -54, 27, -54, 27, -20); ctx.quadraticCurveTo(0, -12, -27, -20); ctx.closePath(); ink();
                ctx.fillStyle = '#FFFFFF'; dot(-12, -30, 5); dot(6, -37, 6); dot(17, -26, 3.5);
            },
            rock() {
                ctx.fillStyle = '#98A4B8';
                ctx.beginPath(); ctx.moveTo(-30, 0); ctx.quadraticCurveTo(-33, -20, -16, -29); ctx.quadraticCurveTo(0, -38, 16, -28); ctx.quadraticCurveTo(33, -18, 30, 0); ctx.closePath(); ink();
                ctx.fillStyle = '#C6CFDD'; oval(-8, -23, 10, 4.5, -0.35); ctx.fill();
                ctx.fillStyle = '#76829A'; dot(13, -11, 3); dot(-17, -8, 2.2);
            },
            log() {
                ctx.fillStyle = '#B9773A'; box(-36, -30, 72, 30, 14); ink();
                ctx.fillStyle = '#5DBB4A'; oval(15, -33, 8, 4.5, -0.5); ink();
                ctx.fillStyle = '#F0C58A'; oval(-24, -15, 10, 13.5); ink();
                ctx.lineWidth = 2; ctx.strokeStyle = '#B9773A'; oval(-24, -15, 5, 7); ctx.stroke();
                ctx.strokeStyle = '#8A5324';
                ctx.beginPath(); ctx.moveTo(-4, -21); ctx.lineTo(14, -21); ctx.moveTo(4, -10); ctx.lineTo(24, -10); ctx.stroke();
            },
            hedgehog() {
                ctx.fillStyle = '#8A5A3A';
                ctx.beginPath(); ctx.moveTo(30, 0);
                for (let i = 0; i <= 10; i++) { const a = i * 0.27, r = i % 2 ? 38 : 28; ctx.lineTo(4 + Math.cos(a) * r * 0.85, -2 - Math.sin(a) * r * 0.9); }
                ctx.lineTo(-18, 0); ctx.closePath(); ink();
                ctx.fillStyle = '#F6D7A8'; oval(-20, -11, 14, 10.5, 0.15); ink();
                ctx.fillStyle = INK; dot(-33, -11, 3.2); dot(-22, -15, 2.4);
            },
            snail() {
                ctx.fillStyle = '#FFD86B';
                ctx.beginPath(); ctx.moveTo(-22, -29); ctx.lineTo(-20, -41); ctx.moveTo(-27, -28); ctx.lineTo(-31, -39); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(28, 0); ctx.quadraticCurveTo(27, -9, 12, -9); ctx.lineTo(-10, -9);
                ctx.quadraticCurveTo(-14, -9, -15, -20); ctx.quadraticCurveTo(-16, -30, -24, -29); ctx.quadraticCurveTo(-32, -27, -30, -16); ctx.quadraticCurveTo(-29, -2, -20, 0); ctx.closePath(); ink();
                ctx.fillStyle = INK; dot(-20, -42, 2.6); dot(-31, -40, 2.6); dot(-25, -21, 2.2);
                ctx.fillStyle = '#F28C38'; oval(8, -22, 17, 17); ink();
                ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.arc(8, -22, 10, 0.4, 5.2); ctx.stroke();
                ctx.beginPath(); ctx.arc(9, -21, 4, 0.8, 5.6); ctx.stroke();
            },
            stump() {
                ctx.fillStyle = '#A9683A';
                ctx.beginPath(); ctx.moveTo(-21, 0); ctx.lineTo(-17, -35); ctx.lineTo(17, -35); ctx.lineTo(21, 0); ctx.closePath(); ink();
                ctx.fillStyle = '#F0C58A'; oval(0, -36, 17, 7); ink();
                ctx.lineWidth = 2; ctx.strokeStyle = '#B9773A'; oval(0, -36, 9, 3.4); ctx.stroke();
                ctx.strokeStyle = '#7A4A22';
                ctx.beginPath(); ctx.moveTo(-8, -22); ctx.lineTo(-7, -8); ctx.moveTo(7, -24); ctx.lineTo(8, -12); ctx.stroke();
            },
            bee() {
                const flap = calm ? 0 : Math.sin(clock * 16) * 0.35;
                ctx.fillStyle = '#E8F6FF';
                oval(-2, -13, 8, 13, -0.4 + flap); ink();
                oval(9, -12, 7, 11, 0.4 - flap); ink();
                ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(16, -4); ctx.lineTo(26, 0); ctx.lineTo(16, 4); ctx.fill();
                ctx.fillStyle = '#FFD12E'; oval(0, 0, 18, 13); ink();
                ctx.save(); ctx.clip(); ctx.fillStyle = INK; ctx.fillRect(-2, -14, 6, 28); ctx.fillRect(9, -14, 6, 28); ctx.restore();
                oval(0, 0, 18, 13); ctx.stroke();
                ctx.fillStyle = '#FFFFFF'; dot(-10, -3, 4.6); ctx.fillStyle = INK; dot(-11, -3, 2.3);
            },
            carrot() {
                ctx.rotate(0.5);
                ctx.fillStyle = '#4FB84A';
                oval(-6, -19, 4.5, 9, -0.5); ink(); oval(6, -19, 4.5, 9, 0.5); ink(); oval(0, -21, 4.5, 10); ink();
                ctx.fillStyle = '#FF8A1F';
                ctx.beginPath(); ctx.moveTo(-10, -12); ctx.quadraticCurveTo(0, -18, 10, -12); ctx.quadraticCurveTo(8, 8, 0, 22); ctx.quadraticCurveTo(-8, 8, -10, -12); ctx.closePath(); ink();
                ctx.lineWidth = 2; ctx.strokeStyle = '#C9560C';
                ctx.beginPath(); ctx.moveTo(-5, -4); ctx.lineTo(1, -4); ctx.moveTo(-1, 5); ctx.lineTo(4, 5); ctx.stroke();
            },
            // The bunny faces right, with its feet at (0, 0).
            bunny(run, dizzy) {
                const sw = run ? Math.sin(clock * 9) * 5 : 0, air = bunny.y > 0;
                ctx.fillStyle = '#FFFFFF'; oval(-27, -27, 9, 9); ink();
                ctx.fillStyle = '#F6A04D';
                oval(air ? -20 : -12 - sw, air ? -8 : -5, 12, 6, air ? 0.5 : 0); ink();
                oval(9, -72, 6.5, 19, -0.35); ink();
                oval(24, -74, 6.5, 19, 0.05); ink();
                oval(0, -26, 28, 21); ink();
                oval(20, -46, 18, 17); ink();
                oval(air ? 20 : 14 + sw, air ? -10 : -5, 10, 5.5, air ? -0.5 : 0); ink();
                ctx.fillStyle = '#FFE3C2'; oval(2, -20, 16, 11); ctx.fill();
                ctx.fillStyle = '#FFF4E6'; oval(31, -41, 7.5, 6); ctx.fill();
                ctx.fillStyle = '#FF9DB5'; oval(24, -74, 3, 12, 0.05); ctx.fill(); dot(37, -43, 2.8);
                ctx.fillStyle = '#FFB59A'; dot(20, -40, 3.4);
                if (dizzy) {
                    ctx.lineWidth = 2.4;
                    ctx.beginPath(); ctx.moveTo(23, -53); ctx.lineTo(29, -50); ctx.lineTo(23, -47); ctx.stroke();
                } else {
                    ctx.fillStyle = INK; oval(26, -50, 3.4, 4.2); ctx.fill();
                    ctx.fillStyle = '#FFFFFF'; dot(27, -51.5, 1.4);
                }
            }
        };
        function sprite(kind, x, y, rot, a, b) {
            ctx.save();
            ctx.translate(x, y);
            if (rot) { ctx.translate(0, -18 * S); ctx.rotate(rot); ctx.translate(0, 18 * S); }
            ctx.scale(S, S);
            ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = INK;
            SPRITES[kind](a, b);
            ctx.restore();
        }
        const hillY = (x, amp, k, off) => { const a = (x + off) * k; return GY - amp * (0.6 + 0.5 * Math.sin(a) + 0.25 * Math.sin(a * 2.3 + 1)); };
        function hills(amp, k, off, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W + 16; x += 16) ctx.lineTo(x, hillY(x, amp, k, off));
            ctx.lineTo(W, H);
            ctx.fill();
        }
        // The backdrop is quiet on purpose: soft, pale colours and nothing that moves, so the eye can rest.
        // Only the bunny and the things on the sandy path are bright.
        function backdrop(i0, i1, f, night, sunset) {
            ctx = bgx;
            const g = ctx.createLinearGradient(0, 0, 0, GY);
            g.addColorStop(0, mix(SKIES[i0][0], SKIES[i1][0], f));
            g.addColorStop(1, mix(SKIES[i0][1], SKIES[i1][1], f));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            // The sun sinks behind the hills as night comes.
            if (night < 1) {
                const sx = W * 0.6, sy = GY * (0.3 + 0.34 * sunset + 0.9 * night);
                ctx.save();
                ctx.translate(sx, sy);
                ctx.fillStyle = '#FFE680';
                for (let a = 0; a < 12; a++) {
                    ctx.rotate(Math.PI / 6);
                    ctx.beginPath(); ctx.moveTo(-8 * S, -46 * S); ctx.lineTo(0, -(66 + (a % 2) * 12) * S); ctx.lineTo(8 * S, -46 * S); ctx.fill();
                }
                ctx.restore();
                ctx.fillStyle = '#FFCB1F'; dot(sx, sy, 38 * S);
                ctx.fillStyle = '#FFDD4A'; dot(sx, sy, 31 * S);
            }
            for (const c of clouds) {
                for (const [dy, col] of [[6, '#CFE6FA'], [0, '#FFFFFF']]) {
                    ctx.fillStyle = col;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y + dy * c.s, 22 * c.s, 0, 6.3); ctx.arc(c.x + 26 * c.s, c.y - 10 * c.s + dy * c.s, 28 * c.s, 0, 6.3);
                    ctx.arc(c.x + 58 * c.s, c.y + dy * c.s, 22 * c.s, 0, 6.3); ctx.rect(c.x, c.y + dy * c.s, 58 * c.s, 22 * c.s);
                    ctx.fill();
                }
            }
            // Far away: pale mountains, then two soft hills with a few small trees on the skyline.
            hills(190 * S, 0.0022, 900, grad(GY - 290 * S, GY, '#AFC2F2', '#D3DEF8'));
            hills(100 * S, 0.004, 0, grad(GY - 170 * S, GY, '#C6EBB0', '#B2E29E'));
            for (let x = 90 * S, i = 0; x < W + 60; x += (250 + (i * 67) % 130) * S, i++) {
                const sc = (0.42 + (i * 31 % 5) * 0.035) * S, y = hillY(x, 100 * S, 0.004, 0) + 5 * sc;
                ctx.fillStyle = '#B48A62'; ctx.fillRect(x - 4 * sc, y - 60 * sc, 8 * sc, 60 * sc);
                ctx.fillStyle = '#8FCF82'; dot(x - 18 * sc, y - 62 * sc, 20 * sc); dot(x + 19 * sc, y - 62 * sc, 20 * sc);
                ctx.fillStyle = '#9ED890'; dot(x, y - 78 * sc, 28 * sc);
            }
            hills(46 * S, 0.005, 300, grad(GY - 80 * S, GY, '#A5DB8C', '#93D07C'));

            // The sandy path the bunny runs on, with a grass lip along its far edge.
            const py = GY - 8 * S;
            ctx.fillStyle = '#6DBE5C'; ctx.fillRect(0, py - 5 * S, W, 6 * S);
            ctx.fillStyle = grad(py, H, '#F7E8BC', '#EAD49C'); ctx.fillRect(0, py, W, H - py);
            ctx.fillStyle = '#D9BC7E'; ctx.fillRect(0, py, W, 3 * S);

            // Evening and night light, multiplied over the scenery (never a grey veil).
            if (i0 !== 0 || f > 0) {
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = mix(LIGHT[i0], LIGHT[i1], f);
                ctx.fillRect(0, 0, W, H);
                ctx.globalCompositeOperation = 'source-over';
            }
            if (night > 0) {
                ctx.globalAlpha = night;
                ctx.fillStyle = '#FFFFFF';
                for (const s of starsBg) dot(s.x * W, s.y * GY * 0.42, s.r);
                const mx = W * 0.6, my = GY * 0.24;
                ctx.fillStyle = '#FFF3B8'; dot(mx, my, 27 * S);
                ctx.fillStyle = '#EADB96'; dot(mx - 9 * S, my - 6 * S, 6 * S); dot(mx + 8 * S, my + 8 * S, 4.5 * S); dot(mx + 9 * S, my - 11 * S, 3 * S);
                ctx.globalAlpha = 1;
            }
            ctx = view;
        }
        function draw() {
            if (!bg.width || !bg.height) return;
            // Day slowly turns to sunset, night, and back to day.
            const cyc = (dist / (40 * S) / 260) % 3, i0 = Math.floor(cyc), i1 = (i0 + 1) % 3;
            const f0 = Math.max(0, (cyc - i0 - 0.65) / 0.35), f = Math.round(f0 * f0 * (3 - 2 * f0) * 120) / 120;
            const night = i0 === 2 ? 1 - f : i1 === 2 ? f : 0;
            const sunset = i0 === 1 ? 1 - f : i1 === 1 ? f : 0;
            const key = i0 + ':' + f;
            if (key !== bgKey) { bgKey = key; backdrop(i0, i1, f, night, sunset); }
            ctx.drawImage(bg, 0, 0, W, H);

            // The only scenery that moves: a few pale pebbles on the path, to show the bunny is running.
            const light = LIGHT[i0].map((v, i) => v + (LIGHT[i1][i] - v) * f);
            ctx.fillStyle = `rgb(${[222, 198, 140].map((v, i) => Math.round(v * light[i] / 255)).join(',')})`;
            const gapX = 210 * S, off = dist % gapX, rows = Math.max(1, Math.floor((H - GY - 30 * S) / (22 * S)));
            for (let x = -off; x < W + gapX; x += gapX) {
                const k = Math.abs(Math.floor((x + dist) / gapX + 0.5));
                oval(x, GY + 24 * S + ((k * 37) % rows) * 22 * S, (7 + k % 3 * 2) * S, 3.2 * S); ctx.fill();
            }
            if (night > 0) {
                // Fireflies drift slowly.
                ctx.globalAlpha = night;
                for (let i = 0; i < 8; i++) {
                    const s = starsBg[i], fx = s.x * W + Math.sin(clock * 0.4 + i) * 24, fy = GY - 30 * S - s.y * 150 * S + Math.cos(clock * 0.5 + i * 2) * 10;
                    ctx.fillStyle = '#FFE96A'; dot(fx, fy, 3.8 * S);
                    ctx.fillStyle = '#FFFBD0'; dot(fx, fy, 1.8 * S);
                }
                ctx.globalAlpha = 1;
            }

            for (const c of carrots) {
                const cy = GY - c.alt * S;
                sprite('carrot', c.x, cy);
                star(c.x + 15 * S, cy - 17 * S, 5 * S, '#FFFFFF');
            }
            ctx.fillStyle = 'rgba(96,66,24,0.26)';
            for (const o of obstacles) { if (!o.air) { oval(o.x, GY + 3, (o.hw + 12) * S, 6 * S); ctx.fill(); } }
            for (const o of obstacles) sprite(o.kind, o.x, o.air ? GY - beeAlt(o) * S : GY + 2);
            for (const k of knocked) sprite(k.kind, k.x, k.y, k.rot);

            // Bunny shadow, then the bunny. It stays solid when bumped: stars spin round its head instead.
            const sh = Math.max(0.35, 1 - bunny.y / (220 * S));
            ctx.fillStyle = 'rgba(96,66,24,0.26)';
            oval(BX, GY + 3, 26 * S * sh, 7 * S * sh); ctx.fill();
            const onGround = bunny.y === 0, dizzy = inv > 0;
            // The body stays level and steady (no bobbing or rocking): only the feet move.
            const rot = onGround ? 0 : Math.max(-0.14, Math.min(0.12, -bunny.vy / (6000 * S)));
            const by = GY - bunny.y;
            ctx.save();
            ctx.translate(BX, by);
            ctx.scale(1 - bunny.squash, 1 + bunny.squash);
            ctx.translate(0, -26 * S); ctx.rotate(rot); ctx.translate(0, 26 * S);
            sprite('bunny', 0, 0, 0, onGround && running && !calm, dizzy);
            ctx.restore();
            if (dizzy) {
                for (let i = 0; i < 3; i++) {
                    const a = clock * 2 + i * 2.094;
                    star(BX + 16 * S + Math.cos(a) * 26 * S, by - 96 * S + Math.sin(a) * 7 * S, 7 * S, i === 1 ? '#FFFFFF' : '#FFD23F');
                }
            }

            // Sparkles and dust shrink away instead of fading.
            for (const p of parts) {
                const r = p.r * S * Math.max(0, p.t / p.life);
                if (p.star) star(p.x, p.y, r * 1.8, p.color);
                else { ctx.fillStyle = p.color; dot(p.x, p.y, r); }
            }
            ctx.font = `${30 * S}px "Fredoka One", system-ui, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
            for (const p of popups) {
                ctx.globalAlpha = Math.min(1, p.t * 5);
                ctx.lineWidth = 6; ctx.strokeStyle = '#D9480F'; ctx.strokeText(p.text, p.x, p.y);
                ctx.fillStyle = '#FFFFFF'; ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
        }

        // ---------- HUD ----------
        function renderScore() {
            shown = score;
            const el = $('#score');
            el.textContent = `🥕 ${score}`;
        }
        function renderHearts(bump) {
            const el = $('#hearts');
            el.innerHTML = '<span>❤️</span>'.repeat(Math.max(0, hearts)) + '<span class="off">❤️</span>'.repeat(Math.max(0, cfg.hearts - hearts));
            el.setAttribute('aria-label', T(`${hearts} hearts`, `${hearts} cœurs`));
            if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
        }
        function banner(text, color) {
            const el = document.createElement('div');
            el.className = 'banner';
            el.textContent = text;
            el.style.setProperty('--bc', color);
            play.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }

        // ---------- Pause ----------
        function pause() {
            if (!running || paused) return;
            paused = true;
            cancelAnimationFrame(raf);
            release();
            Kit.hush();
            $('#pause').hidden = true;
            $('#results-slot').innerHTML = `<div class="results" role="dialog" aria-label="${T('Paused', 'Pause')}">
                <h2>${T('Paused', 'Pause')}</h2>
                <div class="big">🥕 ${score}</div>
                <div class="row">
                    <button type="button" id="resume" style="--c:var(--orange);--cd:var(--orange-d)">${T('Keep going', 'Continuer')}</button>
                    <button type="button" id="menu" style="--c:var(--blue);--cd:var(--blue-d)">${T('Menu', 'Menu')}</button>
                </div></div>`;
            $('#resume').addEventListener('click', resume);
            $('#menu').addEventListener('click', () => goStart());
            $('#resume').focus();
        }
        function resume() {
            if (!paused) return;
            paused = false;
            $('#results-slot').innerHTML = '';
            $('#pause').hidden = false;
            last = performance.now();
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(step);
        }

        // ---------- Rounds ----------
        function startRound(m) {
            mode = m; cfg = MODES[m];
            Kit.show(play);
            resize();
            calm = Kit.reduceMotion();
            obstacles = []; knocked = []; carrots = []; parts = []; popups = [];
            // A few still clouds, kept clear of the sun, the score and the hearts (the third only on wide screens).
            clouds = [0.2, 0.92, 0.38].slice(0, W > 700 ? 3 : 2).map(cx => {
                const s = (0.7 + Math.random() * 0.45) * S;
                return { x: W * cx - 29 * s, y: Math.min(GY * 0.5, Math.max(190, GY * 0.26) + Math.random() * GY * 0.1), s };
            });
            starsBg = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 1.6 }));
            speed = cfg.v0 * S; dist = 0; bonus = 0; score = 0; shown = -1; nextMile = 100;
            hearts = cfg.hearts; inv = 0; gap = W * 1.1; buffer = 0; lastBee = false;
            bunny.y = 0; bunny.vy = 0; bunny.jumps = 0; bunny.squash = 0;
            $('#results-slot').innerHTML = '';
            $('#pause').hidden = false;
            bgKey = '';
            $('#best').textContent = T(`Best: ${getBest(m)}`, `Record${NBSP}: ${getBest(m)}`);
            renderScore(); renderHearts();
            running = true; paused = false; ending = false;
            last = performance.now();
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(step);
            banner(T('Tap to hop!', `Touche pour sauter${NBSP}!`), '#26A65B');
            say('Tap to hop!', `Touche pour sauter${NBSP}!`);
        }
        function finish() {
            if (ending) return;
            running = false; ending = true;
            $('#pause').hidden = true;
            Kit.sfx.fanfare();
            const best = getBest(mode), isBest = score > best;
            if (isBest) Kit.store.set(bestKey(mode), score);
            Kit.later(() => showResults(isBest, Math.max(best, score)), 900);
        }
        function showResults(isBest, best) {
            $('#results-slot').innerHTML = `<div class="results" role="dialog" aria-label="${T('Results', 'Résultats')}">
                <h2>${T('Great hopping!', `Bien sauté${NBSP}!`)}</h2>
                <div class="big">🥕 ${score}</div>
                ${isBest ? `<p class="new-best">${T('New best score! 🏆', `Nouveau record${NBSP}! 🏆`)}</p>` : `<p>${T(`Best: ${best}`, `Record${NBSP}: ${best}`)}</p>`}
                <div class="row">
                    <button type="button" id="again" style="--c:var(--orange);--cd:var(--orange-d)">${T('Play again', 'Rejouer')}</button>
                    <button type="button" id="menu" style="--c:var(--blue);--cd:var(--blue-d)">${T('Menu', 'Menu')}</button>
                </div></div>`;
            $('#again').addEventListener('click', () => startRound(mode));
            $('#menu').addEventListener('click', () => goStart());
            if (isBest) { Kit.confetti(); say(`New best score! ${score}!`, `Nouveau record${NBSP}! ${score}${NBSP}!`); }
            else say(`You got ${score}!`, `Tu as ${score}${NBSP}!`);
            $('#again').focus();
        }
        Kit.onLeave(play, () => { running = false; paused = false; ending = false; cancelAnimationFrame(raf); });

        function goStart() {
            Kit.show(start, { back: false });
            for (const m of ['cozy', 'speedy']) {
                const el = $(`#${m}-best`), b = getBest(m);
                el.textContent = b ? `🏆 ${b}` : '';
                el.hidden = !b;
            }
        }

        // ---------- Controls ----------
        board.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
        window.addEventListener('pointerup', release);
        window.addEventListener('pointercancel', release);
        window.addEventListener('keydown', e => {
            if (play.hidden || !running) return;
            if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); if (paused) resume(); else pause(); return; }
            if (paused) return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (!e.repeat) jump();
            }
        });
        window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });

        $('#go-cozy').addEventListener('click', () => startRound('cozy'));
        $('#go-speedy').addEventListener('click', () => startRound('speedy'));
        window.addEventListener('resize', () => { if (!play.hidden) resize(); });
        $('#pause').addEventListener('click', pause);
        // Looking away (another tab or app) pauses the run, so nothing is lost.
        document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else last = performance.now(); });
        Kit.onLang(() => { if (!start.hidden) goStart(); });
        goStart();
    }());
    </script>
</body>
</html>
