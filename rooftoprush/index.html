<!DOCTYPE html>
<html lang="en" data-title-fr="Saute ! - ba-by.ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jump! - ba-by.ca</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="/assets/js/site-lang.js?v=20261028"></script>

    <style>
        :root { --text: #3D3551; }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            background: #8FD3FF;
            overflow: hidden;
        }

        /* The game world is drawn on this canvas behind everything (also on the menus). */
        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* 🏠 ROUND TOP BUTTONS */
        .round-btn {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
            z-index: 100;
            transition: transform 0.15s;
        }
        .round-btn:hover { transform: scale(1.08) rotate(-6deg); }
        .round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
        .round-btn:focus-visible { outline: 4px solid #FF7A45; outline-offset: 3px; }
        .home-btn { left: max(14px, env(safe-area-inset-left)); }
        .back-btn { left: calc(max(14px, env(safe-area-inset-left)) + 62px); }
        .back-btn[hidden] { display: none; }

        /* 📄 MENU SCREENS (over the live world) */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            padding: 80px 16px 28px;
            text-align: center;
            overflow-y: auto;
            background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.35));
        }
        .screen[hidden] { display: none; }

        h1, h2 {
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
            line-height: 1.05;
            margin: 0;
        }
        h1 {
            font-size: 3.6rem;
            color: #FF7A45;
            text-shadow: 0 5px 0 #fff, 0 10px 22px rgba(0,0,0,0.18);
            letter-spacing: 1px;
        }
        h2 {
            font-size: 2.2rem;
            color: #FF7A45;
            text-shadow: 0 4px 0 #fff, 0 8px 18px rgba(0,0,0,0.15);
        }
        .subtitle {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 18px;
            border-radius: 999px;
            background: #fff;
            color: #D9601F;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }

        @keyframes popUp {
            from { opacity: 0; transform: translateY(24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(6deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(2deg); }
        }
        .wobble { animation: wobble 0.45s ease-in-out !important; }

        /* 🃏 PICTURE CARDS */
        .mode-cards {
            display: flex;
            justify-content: center;
            gap: 24px;
            width: min(780px, 100%);
            margin-top: 28px;
        }
        .mode-card {
            --c: #4CC26A;
            --cd: #2F9E4C;
            width: 230px;
            border: 0;
            padding: 12px 12px 14px;
            border-radius: 36px;
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 0 var(--c), 0 20px 30px rgba(0,0,0,0.15);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .mode-card:nth-child(2) { animation-delay: 0.08s; }
        .mode-card:nth-child(3) { animation-delay: 0.16s; }
        .mode-card:hover { transform: translateY(-6px) rotate(-1.5deg); }
        .mode-card:active, .mode-card.pressed { transform: translateY(8px) scale(0.97); box-shadow: 0 2px 0 var(--c), 0 6px 12px rgba(0,0,0,0.10); }
        .mode-card:focus-visible { outline: 5px solid var(--c); outline-offset: 5px; }
        .mode-art {
            display: block;
            width: 100%;
            aspect-ratio: 1.1;
            border-radius: 26px;
            overflow: hidden;
            background: #DCEEFF;
        }
        .mode-art canvas { display: block; width: 100%; height: 100%; }
        .mode-label {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            line-height: 1;
            color: var(--cd);
        }
        .star-total {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 5px 16px;
            border-radius: 999px;
            background: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: #C99400;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }

        /* 🗺️ WORLD MAP */
        .worlds {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: min(560px, 100%);
            margin-top: 18px;
        }
        .world {
            --c: #4DA3F2;
            --cd: #2B7FCC;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 28px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 6px 0 var(--c), 0 12px 22px rgba(0,0,0,0.10);
            animation: popUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .world.locked { box-shadow: 0 6px 0 #CDD3DD, 0 12px 22px rgba(0,0,0,0.06); }
        .world-icon {
            flex: none;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: var(--soft, #DCEEFF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            line-height: 1;
        }
        .world.locked .world-icon { filter: grayscale(1); opacity: 0.5; }
        .world-name {
            flex: 1;
            text-align: left;
            font-family: 'Fredoka One', cursive;
            font-size: 1.25rem;
            color: var(--cd);
        }
        .world.locked .world-name { color: #A7B0BE; }
        .tiles { display: flex; gap: 10px; }
        .tile {
            position: relative;
            width: 64px;
            height: 70px;
            border: 0;
            border-radius: 20px;
            background: var(--c);
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 5px 0 var(--cd);
            transition: transform 0.15s;
        }
        .tile small { font-size: 0.7rem; letter-spacing: 1px; }
        .tile .off { filter: grayscale(1); opacity: 0.35; }
        .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd); }
        .tile:focus-visible { outline: 4px solid var(--cd); outline-offset: 3px; }
        .tile.next { animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 5px 0 var(--cd), 0 0 0 5px #fff, 0 0 0 9px var(--c); }
        .tile.locked { background: #E8ECF2; color: #A7B0BE; box-shadow: 0 5px 0 #D2D8E1; cursor: default; }
        .tile .lock {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        /* 🐾 FRIENDS */
        .friends {
            display: grid;
            grid-template-columns: repeat(4, 130px);
            gap: 18px;
            justify-content: center;
            margin-top: 18px;
        }
        .friend {
            position: relative;
            border: 0;
            padding: 8px 8px 10px;
            border-radius: 28px;
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 7px 0 #F2C9A4, 0 12px 20px rgba(0,0,0,0.10);
            animation: popUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            transition: transform 0.15s;
        }
        .friend canvas { display: block; width: 100%; aspect-ratio: 1.1; border-radius: 20px; background: #FFF4E8; }
        .friend .cost { font-family: 'Fredoka One', cursive; font-size: 1.05rem; color: #C99400; min-height: 1.2em; }
        .friend.selected { box-shadow: 0 7px 0 #FF7A45, 0 0 0 5px #FF7A45, 0 12px 20px rgba(0,0,0,0.10); }
        .friend.selected .cost { color: #FF7A45; }
        .friend.locked canvas { filter: grayscale(1) brightness(1.1); opacity: 0.55; }
        .friend.locked { box-shadow: 0 7px 0 #D2D8E1, 0 12px 20px rgba(0,0,0,0.06); }
        .friend:active { transform: translateY(5px); }
        .friend:focus-visible { outline: 4px solid #FF7A45; outline-offset: 4px; }

        /* 🎮 IN-GAME HUD */
        .hud {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 5px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.08);
            pointer-events: none;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            white-space: nowrap;
        }
        .hud[hidden] { display: none; }
        .hud .fish-count { display: flex; align-items: center; gap: 6px; min-width: 70px; }
        .hud .fish-count.bump { animation: pulse 0.3s ease-in-out; }
        .track {
            position: relative;
            width: 150px;
            height: 12px;
            border-radius: 999px;
            background: #E8ECF2;
        }
        .track-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: #FFB627; }
        .track-flag { position: absolute; right: -10px; top: -14px; font-size: 1.2rem; }
        .track-cat { position: absolute; top: -12px; left: 0; font-size: 1.15rem; transform: translateX(-50%); }
        .hud .meters { font-size: 1.1rem; color: #7A7290; }

        .tap-hint {
            position: fixed;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: max-content;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 30;
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(255,255,255,0.92);
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: #FF7A45;
            pointer-events: none;
            animation: pulse 1.2s ease-in-out infinite;
            box-shadow: 0 5px 0 rgba(0,0,0,0.08);
        }
        .tap-hint[hidden] { display: none; }

        .countdown {
            position: fixed;
            left: 50%;
            top: 42%;
            z-index: 40;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Fredoka One', cursive;
            font-size: 7rem;
            color: #fff;
            text-shadow: 0 6px 0 #FF7A45, 0 14px 30px rgba(0,0,0,0.25);
            pointer-events: none;
        }
        .countdown.show { animation: countPop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes countPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        /* 🏁 RESULT CARD */
        .result {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .result[hidden] { display: none; }
        .result-card {
            position: relative;
            width: min(400px, 100%);
            padding: 58px 26px 26px;
            border-radius: 40px;
            background: #fff;
            text-align: center;
            box-shadow: 0 12px 0 #FFB627, 0 30px 60px rgba(0,0,0,0.2);
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .result-badge {
            position: absolute;
            top: -54px;
            left: 50%;
            transform: translateX(-50%);
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: #FFB627;
            border: 6px solid #fff;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .result-badge canvas { width: 100%; height: 100%; display: block; }
        .result-stars { display: flex; justify-content: center; gap: 8px; font-size: 2.8rem; line-height: 1; }
        .result-stars span { display: inline-block; opacity: 0; animation: starIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        .result-stars span:nth-child(1) { animation-delay: 0.3s; }
        .result-stars span:nth-child(2) { animation-delay: 0.5s; font-size: 1.25em; }
        .result-stars span:nth-child(3) { animation-delay: 0.7s; }
        .result-stars span.off { filter: grayscale(1); }
        .result-stars span.off { animation-name: starInOff; }
        @keyframes starIn { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
        @keyframes starInOff { from { opacity: 0; transform: scale(0); } to { opacity: 0.3; transform: scale(1); } }
        .result h2 { color: #FF7A45; text-shadow: none; font-size: 2.2rem; margin-top: 10px; }
        .result-fish {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 18px;
            border-radius: 999px;
            background: #EAF6FF;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: #2B7FCC;
        }
        .result-note { margin-top: 10px; font-weight: 800; color: #9B6CF0; min-height: 1.2em; }
        .result-buttons { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 18px; }
        .icon-btn {
            width: 64px;
            height: 64px;
            border: 0;
            border-radius: 50%;
            background: #F1EEF6;
            font-size: 1.7rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #DCD5E8;
        }
        .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #DCD5E8; }
        .big-btn {
            border: 0;
            border-radius: 999px;
            padding: 16px 28px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            color: #fff;
            background: #4CC26A;
            cursor: pointer;
            box-shadow: 0 7px 0 #2F9E4C, 0 12px 20px rgba(0,0,0,0.12);
            animation: pulse 1.6s ease-in-out 1s infinite;
        }
        .big-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #2F9E4C; }
        .big-btn[hidden], .icon-btn[hidden] { display: none; }
        .icon-btn:focus-visible, .big-btn:focus-visible { outline: 4px solid #FF7A45; outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            .tile.next, .big-btn, .tap-hint { animation: none !important; }
        }

        /* 📱 PHONES */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            h2 { font-size: 1.8rem; }
            .subtitle { font-size: 0.95rem; }
            .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 14px; margin-top: 22px; }
            .mode-card { width: auto; padding: 8px 8px 10px; border-radius: 30px; gap: 6px; }
            .mode-card:nth-child(3) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 7px); }
            .mode-art { border-radius: 22px; }
            .mode-label { font-size: 1.4rem; }
            .world { gap: 10px; padding: 8px 10px; border-radius: 24px; }
            .world-icon { width: 48px; height: 48px; font-size: 28px; border-radius: 16px; }
            .world-name { font-size: 1rem; }
            .tiles { gap: 8px; }
            .tile { width: 54px; height: 60px; font-size: 1.35rem; border-radius: 16px; }
            .friends { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
            .hud { font-size: 1.15rem; gap: 8px; padding: 5px 12px 5px 8px; top: calc(max(14px, env(safe-area-inset-top)) + 60px); }
            .track { width: 96px; }
            .countdown { font-size: 5rem; }
        }
        @media (max-width: 600px) and (max-height: 720px) {
            h1 { font-size: 2.3rem; }
            #start-screen .subtitle { display: none; }
        }

        /* 📐 SHORT LANDSCAPE SCREENS */
        @media (orientation: landscape) and (max-height: 600px) {
            .screen { padding: 12px 16px 14px 84px; }
            h1 { font-size: 2.2rem; text-shadow: 0 3px 0 #fff; }
            h2 { font-size: 1.5rem; }
            .subtitle { margin-top: 4px; font-size: 0.85rem; padding: 3px 12px; }
            .mode-cards { gap: 18px; margin-top: 14px; }
            .mode-card { width: 170px; padding: 8px 8px 10px; gap: 6px; border-radius: 28px; }
            .mode-art { aspect-ratio: 1.35; border-radius: 20px; }
            .mode-label { font-size: 1.2rem; }
            .star-total { margin-top: 6px; font-size: 1rem; }
            .worlds { display: grid; grid-template-columns: 1fr 1fr; width: min(820px, 100%); gap: 10px; margin-top: 10px; }
            .world { padding: 6px 10px; gap: 8px; }
            .world-icon { width: 42px; height: 42px; font-size: 24px; }
            .world-name { font-size: 0.95rem; }
            .tile { width: 48px; height: 52px; font-size: 1.2rem; }
            .friends { grid-template-columns: repeat(7, minmax(0, 88px)); width: 100%; gap: 8px; margin-top: 10px; }
            .friend .cost { font-size: 0.9rem; }
            .hud { top: max(10px, env(safe-area-inset-top)); font-size: 1.05rem; }
            .track { width: 110px; }
            .result-card { padding: 44px 18px 16px; }
            .result-badge { width: 84px; height: 84px; top: -42px; }
            .result-stars { font-size: 2rem; }
            .result h2 { font-size: 1.6rem; margin-top: 4px; }
            .result-buttons { margin-top: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="game" aria-label="Game" data-fr-aria-label="Jeu"></canvas>

    <a href="/" class="round-btn home-btn" aria-label="Back to games" title="Back to games" data-fr-aria-label="Retour aux jeux" data-fr-title="Retour aux jeux"><svg class="nav-icon" width="42" height="42" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="23" fill="#FF7A45"/><path d="M2 26 A22 22 0 0 0 46 26 A23 20 0 0 1 2 26 Z" fill="#E85A28" opacity="0.55"/><path d="M24 12.5 L35.5 22 V33.5 a2.5 2.5 0 0 1 -2.5 2.5 H28 V29 a4 4 0 0 0 -8 0 V36 H15 a2.5 2.5 0 0 1 -2.5 -2.5 V22 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></a>
    <button type="button" class="round-btn back-btn" id="back-btn" hidden aria-label="Back" title="Back" data-fr-aria-label="Retour" data-fr-title="Retour"><svg class="nav-icon" width="42" height="42" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="23" fill="#3D9BF0"/><path d="M2 26 A22 22 0 0 0 46 26 A23 20 0 0 1 2 26 Z" fill="#2177C9" opacity="0.55"/><path d="M25 14 L15 24 L25 34 M16 24 H34" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <!-- START -->
    <section class="screen" id="start-screen">
        <h1 data-fr="Saute !">Jump!</h1>
        <p class="subtitle" data-fr="L'aventure de Minou sur les toits">Kitty's rooftop adventure</p>
        <div class="mode-cards">
            <button type="button" class="mode-card" id="adventure-btn" style="--c: #4CC26A; --cd: #2F9E4C"
                    aria-label="Adventure" data-fr-aria-label="Aventure">
                <span class="mode-art"><canvas id="art-adventure" width="300" height="272"></canvas></span>
                <span class="mode-label" data-fr="Aventure">Adventure</span>
            </button>
            <button type="button" class="mode-card" id="endless-btn" style="--c: #4DA3F2; --cd: #2B7FCC"
                    aria-label="Endless run" data-fr-aria-label="Course sans fin">
                <span class="mode-art"><canvas id="art-endless" width="300" height="272"></canvas></span>
                <span class="mode-label" data-fr="Sans fin">Endless</span>
