<!DOCTYPE html>
<html lang="en" data-title-fr="Bébé Casse-tête">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Shape Snaps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
    <!-- Friendly Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="/assets/js/site-lang.js?v=20261028"></script>

    <style>
        :root {
            --accent: #FF7A7A;
            --accent-dark: #E05555;
            --accent-soft: #FFE3E0;
            --text-main: #3D3551;
            --tile-gap: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background: linear-gradient(160deg, #FFF6E9 0%, #FFE3C4 100%) fixed;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: background 0.6s ease;
        }

        /* 🎈 FLOATING BACKGROUND BUBBLES */
        .sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.55) 2px, transparent 2.5px);
            background-size: 28px 28px;
        }
        .sky span {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), var(--accent-soft) 60%, transparent 72%);
            opacity: 0.75;
            animation: floatUp linear infinite;
        }
        .sky span:nth-child(1) { left: 6%;  width: 70px;  height: 70px;  animation-duration: 18s; }
        .sky span:nth-child(2) { left: 22%; width: 34px;  height: 34px;  animation-duration: 13s; animation-delay: -6s; }
        .sky span:nth-child(3) { left: 40%; width: 90px;  height: 90px;  animation-duration: 24s; animation-delay: -12s; }
        .sky span:nth-child(4) { left: 62%; width: 46px;  height: 46px;  animation-duration: 16s; animation-delay: -3s; }
        .sky span:nth-child(5) { left: 78%; width: 110px; height: 110px; animation-duration: 28s; animation-delay: -18s; }
        .sky span:nth-child(6) { left: 90%; width: 28px;  height: 28px;  animation-duration: 12s; animation-delay: -8s; }
        @keyframes floatUp {
            from { transform: translateY(0) translateX(0); }
            50%  { transform: translateY(-60vh) translateX(18px); }
            to   { transform: translateY(-130vh) translateX(-10px); }
        }

        /* 🏠 HOME BUTTON */
        .home-btn {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            width: 52px;
            height: 52px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            text-decoration: none;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
            z-index: 100;
            transition: transform 0.15s;
        }
        .home-btn:hover { transform: scale(1.08) rotate(-6deg); }
        .home-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
        .back-btn {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: calc(max(14px, env(safe-area-inset-left)) + 62px);
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
            z-index: 100;
            transition: transform 0.15s;
        }
        .back-btn[hidden] { display: none; }
        .back-btn:hover { transform: scale(1.08) rotate(6deg); }
        .back-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }

        body .site-lang-toggle button.active { background: var(--accent); }

        /* ✨ PARTICLES CANVAS */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* --- GAME CONTAINER --- */
        .game-container {
            --grid-cols: 3;
            --piece-size: 100px;
            flex: 1;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: 80px;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* --- HEADER / PROGRESS --- */
        .level-header {
            text-align: center;
            margin-bottom: 24px;
            animation: dropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--accent);
            font-size: 3rem;
            line-height: 1.05;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 4px 0 #fff, 0 8px 18px rgba(0,0,0,0.12);
            transition: color 0.4s;
        }

        .subtitle {
            display: inline-block;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-dark);
            background: #fff;
            padding: 6px 18px;
            border-radius: 999px;
            margin-top: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.06);
        }

        /* Level progress pills */
        .level-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .level-dots span {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.85);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
            transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
        }
        .level-dots span.done { background: var(--accent-dark); }
        .level-dots span.current { width: 34px; background: var(--accent); }

        .level-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .level-progress .level-dots { margin-top: 0; }
        .level-num {
            font-family: 'Fredoka One', cursive;
            font-size: 0.95rem;
            color: #fff;
            background: var(--accent);
            padding: 3px 12px;
            border-radius: 999px;
            box-shadow: 0 3px 0 var(--accent-dark);
        }

        /* ▶️ START SCREEN */
        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            padding: 84px 20px 32px;
            overflow-y: auto;
            text-align: center;
            background: linear-gradient(160deg, #FFF4EC 0%, #FFE3F1 50%, #DDEFFF 100%);
            transition: opacity 0.35s, visibility 0.35s;
        }
        .start-screen:not(.visible) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .start-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            font-size: 52px;
            line-height: 1;
            margin-bottom: 14px;
        }
        .start-icons span { display: inline-block; animation: bob 2.6s ease-in-out infinite; }
        .start-icons span:nth-child(2) { animation-delay: -0.6s; }
        .start-icons span:nth-child(3) { animation-delay: -1.2s; }
        .start-icons span:nth-child(4) { animation-delay: -1.8s; }
        .start-screen h1 { color: #FF7A7A; font-size: 3.4rem; }
        .start-screen .subtitle { color: #E05555; }
        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: min(380px, 100%);
            margin-top: 30px;
        }
        .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 18px 24px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
            background: #4CC26A;
            box-shadow: 0 7px 0 #2F9E4C, 0 14px 24px rgba(0,0,0,0.12);
            transition: transform 0.15s, box-shadow 0.15s;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .start-btn[hidden] { display: none; }
        .start-btn + .start-btn { animation-delay: 0.1s; }
        .start-btn.secondary {
            background: #fff;
            color: #E05555;
            font-size: 1.25rem;
            box-shadow: 0 7px 0 #FFC9C2, 0 14px 24px rgba(0,0,0,0.08);
        }
        .start-btn:hover { transform: translateY(-3px) scale(1.02); }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #2F9E4C; }
        .start-btn.secondary:active { box-shadow: 0 1px 0 #FFC9C2; }
        .start-btn:focus-visible { outline: 4px solid #FF7A7A; outline-offset: 4px; }
        .start-btn small {
            font-size: 0.85rem;
            background: rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 999px;
        }
        .start-btn.choose {
            background: #fff;
            color: #2B7FCC;
            font-size: 1.15rem;
            box-shadow: 0 7px 0 #BFDFFF, 0 14px 24px rgba(0,0,0,0.08);
        }
        .start-btn.choose:active { box-shadow: 0 1px 0 #BFDFFF; }
        .start-btn.choose.locked { color: #9AA3B2; box-shadow: 0 7px 0 #DDE2EA, 0 14px 24px rgba(0,0,0,0.06); }
        .start-btn.choose.locked::after { content: '🔒'; font-size: 1rem; }
        .start-btn.wobble { animation: wobble 0.45s ease-in-out; }
        .start-btn + .start-btn + .start-btn { animation-delay: 0.2s; }

        /* 🔢 LEVEL PICKER */
        .start-main {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .start-main[hidden], .level-picker[hidden] { display: none; }
        .level-picker {
            width: min(880px, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .level-picker h2 {
            font-family: 'Fredoka One', cursive;
            color: #2B7FCC;
            font-size: 2.2rem;
            margin: 0 0 18px;
            text-shadow: 0 3px 0 #fff;
        }
        .level-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            width: 100%;
            padding: 6px 4px 14px;
        }
        .level-note {
            margin: -10px 0 18px;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--accent-dark);
        }
        .level-tile {
            --c: #FF7A7A;
            --cd: #E05555;
            position: relative;
            width: 128px;
            aspect-ratio: 1;
            border: 0;
            border-radius: 26%;
            background: var(--c);
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--cd), 0 10px 16px rgba(0,0,0,0.10);
            transition: transform 0.15s;
            animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .level-tile .tile-num { font-size: 2.6rem; line-height: 1; }
        .level-tile .tile-icon { font-size: 0.85rem; line-height: 1; letter-spacing: 1px; }
        .level-tile .tile-pieces {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.28);
            padding: 2px 8px;
            border-radius: 999px;
        }
        .level-tile.locked .tile-pieces { background: rgba(0,0,0,0.05); }
        .level-tile:hover { transform: translateY(-3px) scale(1.05); }
        .level-tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cd); }
        .level-tile:focus-visible { outline: 4px solid var(--cd); outline-offset: 3px; }
        .level-tile.locked {
            background: #E8ECF2;
            color: #A7B0BE;
            box-shadow: 0 6px 0 #D2D8E1;
        }
        .level-tile.locked .tile-icon { filter: grayscale(1); opacity: 0.5; }
        .level-tile .tile-lock {
            position: absolute;
            top: -8px;
            right: -6px;
            font-size: 1.05rem;
            background: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .level-tile.wobble { animation: wobble 0.45s ease-in-out; }
        .level-picker .start-btn { width: min(320px, 100%); margin-top: 10px; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 600px) {
            .start-screen h1 { font-size: 2.6rem; }
            .start-icons { font-size: 42px; gap: 10px; }
            .start-btn { font-size: 1.3rem; padding: 16px 20px; }
            .start-btn.secondary { font-size: 1.1rem; }
        }
        @media (max-width: 600px) {
            .level-picker h2 { font-size: 1.8rem; }
            .level-grid { gap: 14px; }
            .level-tile { width: calc((100% - 28px) / 3); max-width: 108px; }
            .level-tile .tile-num { font-size: 2.1rem; }
            .start-btn.choose { font-size: 1.05rem; }
        }
        @media (orientation: landscape) and (max-height: 600px) {
            .start-screen { padding: 12px 20px 16px 84px; }
            .start-buttons { flex-wrap: wrap; justify-content: center; gap: 12px 14px; }
            .start-buttons .start-btn { flex: 1 1 40%; }
            .start-buttons #continue-btn { flex-basis: 100%; }
            .level-picker { padding-right: 72px; }
            .level-picker h2 { font-size: 1.5rem; margin-bottom: 8px; }
            .level-grid { gap: 12px; }
            .level-tile { width: 92px; }
            .level-tile .tile-num { font-size: 1.8rem; }
            .level-tile .tile-icon { display: none; }
            .start-icons { font-size: 34px; margin-bottom: 4px; }
            .start-screen h1 { font-size: 2rem; }
            .start-buttons { flex-direction: row; width: min(640px, 100%); margin-top: 16px; }
            .start-btn { font-size: 1.15rem; padding: 14px 16px; }
            .start-btn.secondary { font-size: 1rem; }
        }

        /* --- PLAY AREA --- */
        .play-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            position: relative;
            animation: fadeIn 0.6s ease-out 0.15s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* The Board: a soft toy tray with a coloured lip */
        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), var(--piece-size));
            justify-content: center;
            align-items: center;
            gap: var(--tile-gap);
            width: max-content;
            min-width: 0;
            padding: 14px;
            border: 4px solid #fff;
            border-radius: 36px;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 10px 0 var(--accent), 0 18px 30px rgba(0,0,0,0.12);
        }

        /* Slots: soft "holes" showing the piece's shadow */
        .slot {
            width: 100%;
            min-width: 0;
            height: auto;
            aspect-ratio: 1;
            background: var(--accent-soft);
            border-radius: 28%;
            box-shadow: inset 0 5px 0 rgba(0,0,0,0.07), inset 0 0 0 3px rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s, background 0.25s;
            position: relative;
            cursor: pointer;
        }

        .slot.hint-pulse {
            animation: hintPulse 1.2s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { transform: scale(1); box-shadow: inset 0 5px 0 rgba(0,0,0,0.07), 0 0 0 0 var(--accent); }
            50% { transform: scale(1.07); box-shadow: inset 0 5px 0 rgba(0,0,0,0.07), 0 0 0 7px var(--accent); }
        }

        .slot.hovered {
            background: #fff;
            transform: scale(1.08);
            box-shadow: inset 0 5px 0 rgba(0,0,0,0.05), 0 0 0 5px var(--accent), 0 8px 20px rgba(0,0,0,0.12);
        }

        /* Emoji Display */
        .emoji-display {
            font-size: calc(var(--piece-size) * 0.62);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
        }

        /* Silhouette of the emoji in the slot */
        .emoji-placeholder {
            filter: brightness(0);
            opacity: 0.16;
        }

        /* Only target the silhouette SVG, not the SVG inside a placed piece */
        .slot > svg {
            width: 66%;
            height: 66%;
            fill: var(--accent-dark);
            opacity: 0.28;
            pointer-events: none;
        }

        /* Pieces tray */
        .pieces-row {
            display: grid;
            justify-content: center;
            grid-template-columns: repeat(var(--grid-cols), var(--piece-size));
            width: max-content;
            padding: 14px;
            gap: var(--tile-gap);
            min-height: 0;
            align-items: center;
            border-radius: 32px;
            background: rgba(255,255,255,0.35);
        }

        /* Pieces: chunky candy tiles */
        .piece {
            width: var(--piece-size);
            height: var(--piece-size);
            cursor: grab;
            touch-action: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: #fff;
            border-radius: 28%;
            box-shadow: 0 6px 0 rgba(0,0,0,0.10), 0 12px 20px rgba(0,0,0,0.10);
            padding: 4px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
            animation: bob 2.6s ease-in-out infinite;
        }
        .piece-wrapper:nth-child(2n) .piece { animation-delay: -0.9s; }
        .piece-wrapper:nth-child(3n) .piece { animation-delay: -1.7s; }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }

        .piece:hover:not(.placed):not(.dragging) {
            animation: none;
            transform: translateY(-8px) scale(1.06);
            box-shadow: 0 12px 0 rgba(0,0,0,0.08), 0 18px 26px rgba(0,0,0,0.14);
        }

        .piece svg {
            width: 80%;
            height: 80%;
            pointer-events: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
        }

        .piece:active:not(.placed) {
            cursor: grabbing;
        }

        .piece.dragging {
            position: fixed; /* Popped out of layout */
            pointer-events: none; /* Let events pass through to check for slots */
            z-index: 1000;
            animation: none;
            box-shadow: 0 0 0 4px var(--accent), 0 22px 40px rgba(0,0,0,0.25);
            will-change: transform;
            transition: none !important;
        }

        .piece.wobble {
            animation: wobble 0.45s ease-in-out;
        }

        @keyframes wobble {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-8px) rotate(-8deg); }
            40% { transform: translateX(8px) rotate(8deg); }
            60% { transform: translateX(-5px) rotate(-4deg); }
            80% { transform: translateX(5px) rotate(4deg); }
        }

        .piece.placed {
            position: absolute; /* Stick to slot */
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #fff;
            box-shadow: 0 0 0 4px var(--accent);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            70% { transform: scale(1.18) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .piece-wrapper {
            width: var(--piece-size);
            height: var(--piece-size);
        }

        /* --- VICTORY SCREEN --- */
        #victory-screen {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #victory-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .victory-card {
            position: relative;
            background: #fff;
            padding: 64px 48px 40px;
            border-radius: 44px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 0 var(--accent), 0 30px 60px rgba(0,0,0,0.18);
            transform: scale(0.6) rotate(-4deg);
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #victory-screen.visible .victory-card {
            transform: scale(1) rotate(0);

            to { transform: translateX(-50%) scale(1) rotate(0); }

        #victory-screen.visible .victory-stars span:nth-child(3) { animation-delay: 0.65s; }

        @keyframes starPop {
            from { opacity: 0; transform: scale(0) rotate(-90deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        .victory-card h1 {
            font-size: 3.4rem;

        .victory-card .subtitle {

            animation: nudge 1.6s ease-in-out 1.2s infinite;
        }

        @keyframes nudge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .next-btn:hover { animation-play-state: paused; transform: translateY(-2px) scale(1.03); }
        .next-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--accent-dark); }
        .next-btn:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 4px; }

        @media (prefers-reduced-motion: reduce) {
            .sky span, .piece, .next-btn { animation: none !important; }
        }

        @media (max-width: 600px) {
            :root { --tile-gap: 8px; }
            .game-container { padding: 76px 12px 12px; justify-content: flex-start; justify-content: safe center; }

        @media (max-width: 600px) and (max-height: 520px) {

        @media (orientation: landscape) and (max-height: 600px) {

    <script>
        /**

        // --- LEVELS DATA ---

        const LEVELS = [

                    { id: 'cherry', name: 'Cherry', fr: 'Cerise', emoji: '🍒' },

                    { id: 'duck', name: 'Duck', fr: 'Canard', emoji: '🦆' },
                    { id: 'frog', name: 'Frog', fr: 'Grenouille', emoji: '🐸' },

                ]
            },
            {
                name: "Transport", pickupSound: "honk", accent: ["#FF9F2E", "#E07F10", "#FFEBD2"], nameFr: "Transports",
                bg: "linear-gradient(160deg, #FFF8EA 0%, #FFD9A8 100%)",
                items: [
                    { id: 'car', name: 'Car', fr: 'Auto', emoji: '🚗' },
                    { id: 'boat', name: 'Boat', fr: 'Bateau', emoji: '⛵' },
                    { id: 'rocket', name: 'Rocket', fr: 'Fusée', emoji: '🚀' },
                    { id: 'plane', name: 'Plane', fr: 'Avion', emoji: '✈️' },
                    { id: 'truck', name: 'Truck', fr: 'Camion', emoji: '🚚' },
                    { id: 'bike', name: 'Bike', fr: 'Vélo', emoji: '🚴' },
                    { id: 'bus', name: 'Bus', fr: 'Autobus', emoji: '🚌' },
                    { id: 'train', name: 'Train', fr: 'Train', emoji: '🚂' },
                    { id: 'helicopter', name: 'Helicopter', fr: 'Hélicoptère', emoji: '🚁' }
                ]
            },
            {
                name: "Yummy Food", pickupSound: "twinkle", accent: ["#8C6CF0", "#6A4BD1", "#ECE5FF"], nameFr: "Miam-miam",
                bg: "linear-gradient(160deg, #F7F3FF 0%, #D9CCFF 100%)",
                items: [
                    { id: 'cake', name: 'Cake', fr: 'Gâteau', emoji: '🎂' },
                    { id: 'icecream', name: 'Ice cream', fr: 'Crème glacée', emoji: '🍦' },
                    { id: 'donut', name: 'Donut', fr: 'Beigne', emoji: '🍩' },
                    { id: 'cookie', name: 'Cookie', fr: 'Biscuit', emoji: '🍪' },
                    { id: 'cupcake', name: 'Cupcake', fr: 'Petit gâteau', emoji: '🧁' },
                    { id: 'pizza', name: 'Pizza', fr: 'Pizza', emoji: '🍕' },
                    { id: 'croissant', name: 'Croissant', fr: 'Croissant', emoji: '🥐' },
                    { id: 'popcorn', name: 'Popcorn', fr: 'Maïs soufflé', emoji: '🍿' },
                    { id: 'lollipop', name: 'Lollipop', fr: 'Sucette', emoji: '🍭' }
                ]
            }
        ];

        const PROGRESS_KEY = 'puzzles-progress';
        const lang = window.BabyLang;
        const NBSP = '\u00a0';
        const itemName = item => lang.t(item.name, item.fr || item.name);

        // A level is one puzzle of each theme with the same number of pieces.
        // Levels 1-6 use the first 4 themes; clearing level 6 unlocks the 5th theme,
        // so levels 7-12 have 5 puzzles. "Steps" count single puzzles across all levels.
        const LEVEL_PIECES = [3, 4, 4, 5, 5, 6, 6, 7, 7, 8, 8, 9];
        const LEVEL_COUNT = LEVEL_PIECES.length;
        const BONUS_LEVEL = 6; // index of level 7, the first level with the 5th theme
        const themesIn = level => (level >= BONUS_LEVEL ? LEVELS.length : LEVELS.length - 1);
        const STEPS = [];
        const LEVEL_START = [];
        LEVEL_PIECES.forEach((_, level) => {
            LEVEL_START.push(STEPS.length);
            for (let theme = 0; theme < themesIn(level); theme++) STEPS.push({ level, theme });
        });
        const TOTAL_STEPS = STEPS.length;
        let stepNumber = 0;
        let bestStep = 0;
        let currentLevelIdx = 0;
        let currentDifficulty = 3;
        try {
            const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
            if (saved && Number.isInteger(saved.best)) {
                bestStep = Math.min(Math.max(0, saved.best), TOTAL_STEPS);
            } else if (saved && saved.level >= 0 && saved.level < 4 && saved.difficulty >= 3 && saved.difficulty <= 9) {
                // Older saves stored the theme and piece count; resume at the first level with that many pieces.
                bestStep = LEVEL_START[LEVEL_PIECES.indexOf(saved.difficulty)] + saved.level;
            }
        } catch (error) { /* start fresh */ }

        const levelOf = step => STEPS[Math.min(step, TOTAL_STEPS - 1)].level;
        const clearedLevels = () => LEVEL_START.filter((start, level) => start + themesIn(level) <= bestStep).length;
        // After the last level is cleared, Continue replays the last level.
        const resumeStep = () => (bestStep >= TOTAL_STEPS ? LEVEL_START[LEVEL_COUNT - 1] : bestStep);

        function setStep(step) {
            stepNumber = step;
            currentLevelIdx = STEPS[step].theme;
            currentDifficulty = LEVEL_PIECES[STEPS[step].level];
        }
        let piecesPlaced = 0;
        let activePiece = null;
        let activeWrapper = null;
        let activePointerId = null;
        let currentPos = { x: 0, y: 0 };
        let hintTimeout = null;
        let offset = { x: 0, y: 0 };

        const els = {
            slots: document.getElementById('slots-container'),
            pieces: document.getElementById('pieces-container'),
            title: document.getElementById('level-title'),
            subtitle: document.getElementById('level-subtitle'),
            victory: document.getElementById('victory-screen'),
            nextBtn: document.getElementById('next-level-btn'),
            levelNote: document.getElementById('level-note'),
            start: document.getElementById('start-screen'),
            continueBtn: document.getElementById('continue-btn'),
            continueLevel: document.getElementById('continue-level'),
            restartBtn: document.getElementById('restart-btn'),
            chooseBtn: document.getElementById('choose-btn'),
            startMain: document.getElementById('start-main'),
            picker: document.getElementById('level-picker'),
            levelGrid: document.getElementById('level-grid'),
            back: document.getElementById('back-btn'),
            levelNum: document.getElementById('level-num'),
            dots: document.getElementById('level-dots'),
            game: document.querySelector('.game-container'),
            body: document.body
        };

        // --- INIT ---
        function init() {
            showStart();
            
            // Pointer Events handle touch, pen and mouse through one reliable path.
            document.addEventListener('pointerdown', dragStart, { passive: false });
            document.addEventListener('pointermove', drag, { passive: false });
            document.addEventListener('pointerup', dragEnd, { passive: false });
            document.addEventListener('pointercancel', cancelActiveDrag);
            document.addEventListener('lostpointercapture', event => {
                if (activePiece && event.pointerId === activePointerId) cancelActiveDrag();
            });
            window.addEventListener('blur', cancelActiveDrag);
            window.addEventListener('orientationchange', cancelActiveDrag);
            window.addEventListener('resize', () => {
                cancelActiveDrag();
                fitLayout();
            });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) cancelActiveDrag();
            });

            els.nextBtn.addEventListener('click', nextLevel);
            els.continueBtn.addEventListener('click', () => startAt(resumeStep()));
            els.restartBtn.addEventListener('click', () => startAt(0));
            els.chooseBtn.addEventListener('click', openPicker);
            // One back button: picker -> start menu, puzzle -> start menu.
            els.back.addEventListener('click', () => (els.picker.hidden ? showStart() : closePicker()));
            els.levelGrid.addEventListener('click', event => {
                const tile = event.target.closest('.level-tile');
                if (!tile) return;
                const level = Number(tile.dataset.level);
                if (level <= clearedLevels()) {
                    startAt(LEVEL_START[level]);
                } else {
                    wobble(tile);
                    speak('Clear this level first!', `Termine ce niveau d'abord${NBSP}!`);
                }
            });

            lang.mountToggle();
            lang.onChange(updateLanguage);

            setupParticles();
            setupVoice();
        }

        function loadLevel(idx) {
            cancelActiveDrag();
            const level = LEVELS[idx];
            els.title.textContent = lang.t(level.name, level.nameFr);
            els.body.style.background = level.bg;
            const root = document.documentElement.style;
            root.setProperty('--accent', level.accent[0]);
            root.setProperty('--accent-dark', level.accent[1]);
            root.setProperty('--accent-soft', level.accent[2]);
            renderDots();
            resetHint();
            els.slots.innerHTML = '';
            els.pieces.innerHTML = '';
            
            // CLEANUP: Remove any "zombie" pieces that got stuck on body
            document.querySelectorAll('.piece').forEach(p => {
                if(p.parentNode === document.body) {
                    p.remove();
                }
            });

            piecesPlaced = 0;
            els.victory.classList.remove('visible');

            // 1. Create Slots (Targets) - Use currentDifficulty number of items
            let itemsToUse = level.items.slice(0, currentDifficulty);
            els.game.dataset.count = itemsToUse.length;

            itemsToUse.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.id = item.id;
                // Use emoji if available, otherwise use SVG
                if (item.emoji) {
                    slot.innerHTML = `<span class="emoji-display emoji-placeholder">${item.emoji}</span>`;
                } else {
                    slot.innerHTML = createSVG(item.path, item.color);
                }
                els.slots.appendChild(slot);
            });

            // 2. Create Pieces (Draggables)
            // Shuffle pieces
            const shuffledItems = [...itemsToUse].sort(() => Math.random() - 0.5);
            shuffledItems.forEach(item => {
                const pieceWrapper = document.createElement('div');
                pieceWrapper.className = 'piece-wrapper';
                
                const piece = document.createElement('div');
                piece.className = 'piece';
                piece.dataset.id = item.id;
                piece.setAttribute('role', 'img');
                piece.setAttribute('aria-label', itemName(item));
                // Use emoji if available, otherwise use SVG
                if (item.emoji) {
                    piece.innerHTML = `<span class="emoji-display">${item.emoji}</span>`;
                } else {
                    piece.innerHTML = createSVG(item.path, item.color);
                }
                
                // Keep ref to wrapper
                piece.dataset.wrapper = true; 
                pieceWrapper.appendChild(piece);
                els.pieces.appendChild(pieceWrapper);
            });
            fitLayout();
            document.fonts.ready.then(fitLayout);
        }

        function fitLayout() {
            const count = Number(els.game.dataset.count);
            if (!count) return;
            const columns = count === 4 ? 2 : Math.min(count, 3);
            const rows = Math.ceil(count / columns);
            const gameStyle = getComputedStyle(els.game);
            const header = document.querySelector('.level-header');
            const headerStyle = getComputedStyle(header);
            const playStyle = getComputedStyle(document.getElementById('play-area'));
            const horizontal = playStyle.flexDirection === 'row';
            const availableWidth = els.game.clientWidth - parseFloat(gameStyle.paddingLeft) - parseFloat(gameStyle.paddingRight);
            // Reserve room for the board's shadow as well as its frame.
            const availableHeight = window.innerHeight - parseFloat(gameStyle.paddingTop) - parseFloat(gameStyle.paddingBottom)
                - header.offsetHeight - parseFloat(headerStyle.marginBottom) - 20;
            const gap = parseFloat(playStyle.gap);
            const frame = el => {
                const style = getComputedStyle(el);
                return parseFloat(style.paddingLeft) + parseFloat(style.paddingRight)
                    + parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
            };
            const boardFrame = frame(document.querySelector('.board'));
            const trayFrame = frame(els.pieces);
            const boardLip = 12; // coloured shadow under the board
            const tileGap = parseFloat(getComputedStyle(els.pieces).columnGap) || 8;
            const rowGaps = (rows - 1) * tileGap;
            const columnGaps = (columns - 1) * tileGap;
            const widthSize = horizontal
                ? (availableWidth - boardFrame - trayFrame - gap - columnGaps * 2) / (columns * 2)
                : (availableWidth - boardFrame - columnGaps) / columns;
            const heightSize = horizontal
                ? (availableHeight - boardFrame - boardLip - rowGaps) / rows
                : (availableHeight - boardFrame - trayFrame - boardLip - gap - rowGaps * 2) / (rows * 2);
            els.game.style.setProperty('--grid-cols', columns);
            els.game.style.setProperty('--piece-size', Math.max(44, Math.floor(Math.min(count <= 4 ? 140 : 120, widthSize, heightSize))) + 'px');
        }

        const levelLabel = level => lang.t(`Level ${level + 1}`, `Niveau ${level + 1}`);

        function showStart() {
            const hasProgress = bestStep > 0;
            els.continueBtn.hidden = !hasProgress;
            els.continueLevel.textContent = levelLabel(levelOf(resumeStep()));
            // With saved progress the second button starts over; otherwise it is the only "Play" button.
            els.restartBtn.classList.toggle('secondary', hasProgress);
            els.restartBtn.dataset.en = hasProgress ? '⭐ Start from the beginning' : '▶ Play!';
            els.restartBtn.dataset.fr = hasProgress ? '⭐ Recommencer au début' : `▶ Jouer${NBSP}!`;
            const canChoose = clearedLevels() > 0;
            els.chooseBtn.classList.toggle('locked', !canChoose);
            els.chooseBtn.setAttribute('aria-disabled', String(!canChoose));
            closePicker();
            lang.apply(els.start);
            els.start.classList.add('visible');
            els.back.hidden = true;
            (hasProgress ? els.continueBtn : els.restartBtn).focus({ preventScroll: true });
        }

        const THEME_ICONS = ['⭐', '🍎', '🐱', '🚗', '🧁'];
        const LEVEL_COLORS = [
            ['#FF7A7A', '#E05555'], ['#FF9F2E', '#E07F10'], ['#F5C518', '#D4A20A'], ['#4CC26A', '#2F9E4C'],
            ['#2EC4B6', '#1E9C90'], ['#4DA3F2', '#2B7FCC'], ['#8C6CF0', '#6A4BD1'], ['#F06CB4', '#D04A93'],
            ['#FF7A7A', '#E05555'], ['#FF9F2E', '#E07F10'], ['#4CC26A', '#2F9E4C'], ['#8C6CF0', '#6A4BD1']
        ];

        function wobble(el) {
            el.classList.remove('wobble');
            void el.offsetWidth;
            el.classList.add('wobble');
            el.addEventListener('animationend', () => el.classList.remove('wobble'), { once: true });
            playTone(220, 0.15);
        }

        function renderPicker() {
            const cleared = clearedLevels();
            let html = '';
            for (let n = 0; n < LEVEL_COUNT; n++) {
                // Cleared levels and the next one (the level the child has reached) can be picked.
                const open = n <= cleared;
                const pieces = LEVEL_PIECES[n];
                const [color, dark] = LEVEL_COLORS[n];
                const detail = lang.t(`${pieces} pieces`, `${pieces} pièces`);
                const label = `${levelLabel(n)}, ${detail}${open ? '' : ', ' + lang.t('locked', 'verrouillé')}`;
                html += `<button type="button" class="level-tile${open ? '' : ' locked'}" data-level="${n}"
                        aria-label="${label}" style="--c: ${color}; --cd: ${dark}; animation-delay: ${n * 0.03}s">
                    <span class="tile-num">${n + 1}</span>
                    <span class="tile-icon" aria-hidden="true">${THEME_ICONS.slice(0, themesIn(n)).join('')}</span>
                    <span class="tile-pieces" aria-hidden="true">${pieces} 🧩</span>
                    ${open ? '' : '<span class="tile-lock" aria-hidden="true">🔒</span>'}
                </button>`;
            }
            els.levelGrid.innerHTML = html;
        }

        function openPicker() {
            if (clearedLevels() === 0) {
                wobble(els.chooseBtn);
                speak('Finish a level first!', `Termine un niveau d'abord${NBSP}!`);
                return;
            }
            renderPicker();
            els.startMain.hidden = true;
            els.picker.hidden = false;
            els.back.hidden = false;
            els.start.scrollTop = 0;
            const latest = els.levelGrid.querySelector(`[data-level="${Math.min(clearedLevels(), LEVEL_COUNT - 1)}"]`);
            if (latest) latest.focus({ preventScroll: true });
        }

        function closePicker() {
            els.picker.hidden = true;
            els.startMain.hidden = false;
            if (els.start.classList.contains('visible')) els.back.hidden = true;
        }

        function startAt(number) {
            speak("Let's play!", `On joue${NBSP}!`);
            els.start.classList.remove('visible');
            els.back.hidden = false;
            setStep(number);
            loadLevel(currentLevelIdx);
        }

        function renderDots() {
            els.levelNum.textContent = levelLabel(levelOf(stepNumber));
            els.dots.innerHTML = THEME_ICONS.slice(0, themesIn(levelOf(stepNumber))).map((_, i) => {
                const state = i === currentLevelIdx ? 'current' : i < currentLevelIdx ? 'done' : '';
                return `<span class="${state}"></span>`;
            }).join('');
        }

        function findItem(id) {
            return LEVELS[currentLevelIdx].items.find(item => item.id === id);
        }

        function updateLanguage() {
            els.continueLevel.textContent = levelLabel(levelOf(resumeStep()));
            if (!els.picker.hidden) renderPicker();
            els.levelNum.textContent = levelLabel(levelOf(stepNumber));
            els.nextBtn.textContent = nextLabel();
            const level = LEVELS[currentLevelIdx];
            els.title.textContent = lang.t(level.name, level.nameFr);
            document.querySelectorAll('.piece').forEach(piece => {
                const item = findItem(piece.dataset.id);
                if (item) piece.setAttribute('aria-label', itemName(item));
            });
        }

        function createSVG(path, color) {
            return `<svg viewBox="0 0 100 100" fill="${color}">${path}</svg>`;
        }

        // --- DRAG LOGIC ---
        function dragStart(e) {
            const target = e.target.closest('.piece');
            if (!target || target.classList.contains('placed')) return;

            if (activePiece) cancelActiveDrag();

            resetHint();
            e.preventDefault();
            activePiece = target;
            activeWrapper = target.parentElement;
            activePointerId = e.pointerId;
            
            const clientX = e.clientX;
            const clientY = e.clientY;

            // Calculate offset relative to piece center to snap to finger
            const rect = activePiece.getBoundingClientRect();
            activePiece.style.setProperty('--piece-size', rect.width + 'px');
            offset.x = clientX - (rect.left + rect.width / 2);
            offset.y = clientY - (rect.top + rect.height / 2);

            // Set Initial Pos for visual placement
            currentPos.x = clientX - offset.x;
            currentPos.y = clientY - offset.y;

            // Visual State
            activePiece.classList.add('dragging');
            activePiece.style.left = currentPos.x + 'px'; // Center on finger approx
            activePiece.style.top = currentPos.y + 'px';
            activePiece.style.transform = 'translate(-50%, -50%) scale(1.1)'; // Centering transform
            // Move to body so it floats over everything
            document.body.appendChild(activePiece);
            activePiece.setPointerCapture?.(activePointerId);
            playPickup();
        }

        function drag(e) {
            if (!activePiece || e.pointerId !== activePointerId) return;
            e.preventDefault();

            const clientX = e.clientX;
            const clientY = e.clientY;

            currentPos.x = clientX - offset.x;
            currentPos.y = clientY - offset.y;

            activePiece.style.left = currentPos.x + 'px';
            activePiece.style.top = currentPos.y + 'px';

            checkHover();
        }

        function dragEnd(e) {
            if (!activePiece || e.pointerId !== activePointerId) return;
            e.preventDefault();

            const result = checkDrop();

            if (result !== 'placed') {
                const piece = activePiece;
                restoreActivePiece();
                if (result === 'wrong') {
                    // Gentle wobble so the child knows to try another spot.
                    piece.classList.remove('wobble');
                    void piece.offsetWidth;
                    piece.classList.add('wobble');
                    piece.addEventListener('animationend', () => piece.classList.remove('wobble'), { once: true });
                    playTone(220, 0.15);
                }
            }

            finishActiveDrag();
        }

        function restoreActivePiece() {
            if (!activePiece) return;
            activePiece.classList.remove('dragging');
            activePiece.style.position = '';
            activePiece.style.left = '';
            activePiece.style.top = '';
            activePiece.style.transform = '';
            activePiece.style.removeProperty('--piece-size');

            if (activeWrapper?.isConnected) {
                activeWrapper.appendChild(activePiece);
            } else {
                const wrapper = document.createElement('div');
                wrapper.className = 'piece-wrapper';
                wrapper.appendChild(activePiece);
                els.pieces.appendChild(wrapper);
            }
        }

        function finishActiveDrag() {
            if (activePiece && activePointerId !== null && activePiece.hasPointerCapture?.(activePointerId)) {
                activePiece.releasePointerCapture(activePointerId);
            }
            activePiece = null;
            activeWrapper = null;
            activePointerId = null;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('hovered'));
            resetHint();
        }

        function cancelActiveDrag() {
            if (!activePiece) return;
            restoreActivePiece();
            finishActiveDrag();
        }

        // --- COLLISION LOGIC ---
        function checkHover() {
            // Simple AABB using mouse position directly (faster than getBoundingClientRect)
            const pX = currentPos.x;
            const pY = currentPos.y;

            document.querySelectorAll('.slot').forEach(slot => {
                const rect = slot.getBoundingClientRect();
                const tolerance = 16;
                if (pX > rect.left - tolerance && pX < rect.right + tolerance && pY > rect.top - tolerance && pY < rect.bottom + tolerance) {
                    slot.classList.add('hovered');
                } else {
                    slot.classList.remove('hovered');
                }
            });
        }

        function checkDrop() {
            const pieceRect = activePiece.getBoundingClientRect();
            const pX = pieceRect.left + pieceRect.width/2;
            const pY = pieceRect.top + pieceRect.height/2;
            let result = 'missed';

            document.querySelectorAll('.slot').forEach(slot => {
                if (result === 'placed') return; // Already placed
                const rect = slot.getBoundingClientRect();
                const tolerance = 16;

                // If inside slot AND id matches
                if (pX > rect.left - tolerance && pX < rect.right + tolerance && pY > rect.top - tolerance && pY < rect.bottom + tolerance) {
                    if (slot.dataset.id === activePiece.dataset.id) {
                        snapToSlot(activePiece, slot);
                        result = 'placed';
                    } else if (!slot.querySelector('.piece.placed')) {
                        result = 'wrong';
                    }
                }
            });
            return result;
        }

        function snapToSlot(piece, slot) {
            piece.classList.remove('dragging');
            piece.classList.add('placed');
            piece.style.transform = '';
            piece.style.left = '';
            piece.style.top = '';
            piece.style.removeProperty('--piece-size');
            
            slot.appendChild(piece); // Move DOM element into slot
            
            // Celebration
            const rect = slot.getBoundingClientRect();
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
            playTone(660, 0.12);
            setTimeout(() => playTone(880, 0.15), 110);
            const item = findItem(piece.dataset.id);
            if (item) speak(item.name, item.fr || item.name);
            
            resetHint();
            piecesPlaced++;
            if (piecesPlaced === document.querySelectorAll('.slot').length) {
                setTimeout(triggerVictory, 1000);
            }
        }

        function resetHint() {
            clearTimeout(hintTimeout);
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('hint-pulse'));
            hintTimeout = setTimeout(showHint, 5000);
        }

        function showHint() {
            if (els.start.classList.contains('visible')) return;
            if (activePiece || piecesPlaced === document.querySelectorAll('.slot').length) return;
            const firstUnplaced = document.querySelector('.pieces-row .piece');
            if (!firstUnplaced) return;
            const targetId = firstUnplaced.dataset.id;
            const targetSlot = document.querySelector(`.slot[data-id="${targetId}"]`);
            if (targetSlot) targetSlot.classList.add('hint-pulse');
        }

        // --- AUDIO ---
        function setupVoice() {
            // Init speech synthesis
            if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
        }
        function speak(en, fr) {
            lang.speak(en, fr, { pitch: 1.2 });
        }

        let audioCtx = null;
        function playTone(freq, duration) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (error) { /* audio is optional */ }
        }

        // One synth voice: an oscillator gliding between two pitches with a soft envelope.
        function voice({ type = 'sine', from, to = from, at = 0, dur, vol = 0.2, wobble = 0, wobbleDepth = 0 }) {
            const start = audioCtx.currentTime + at;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(from, start);
            osc.frequency.exponentialRampToValueAtTime(to, start + dur);
            if (wobble) {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = wobble;
                lfoGain.gain.value = wobbleDepth;
                lfo.connect(lfoGain).connect(osc.frequency);
                lfo.start(start);
                lfo.stop(start + dur + 0.02);
            }
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(vol, start + Math.min(0.015, dur / 4));
            gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + dur + 0.02);
        }

        // Each theme has its own pickup sound; the pitch shifts a little every time.
        const PICKUP_SOUNDS = {
            // Springy cartoon "boing".
            boing: k => voice({ from: 520 * k, to: 170 * k, dur: 0.32, vol: 0.28, wobble: 22, wobbleDepth: 55 * k }),
            // Juicy water-drop "plop-plop".
            plop: k => {
                voice({ from: 1150 * k, to: 260 * k, dur: 0.09, vol: 0.32 });
                voice({ from: 950 * k, to: 320 * k, at: 0.11, dur: 0.08, vol: 0.14 });
            },
            // Squeaky-toy "squee-squee".
            squeak: k => {
                voice({ type: 'triangle', from: 1300 * k, to: 1900 * k, dur: 0.08, vol: 0.14, wobble: 35, wobbleDepth: 70 });
                voice({ type: 'triangle', from: 1450 * k, to: 2150 * k, at: 0.1, dur: 0.09, vol: 0.14, wobble: 35, wobbleDepth: 70 });
            },
            // Little car horn "beep-beep".
            honk: k => {
                [0, 0.14].forEach(at => {
                    voice({ type: 'square', from: 392 * k, at, dur: 0.1, vol: 0.06 });
                    voice({ type: 'square', from: 494 * k, at, dur: 0.1, vol: 0.05 });
                });
            },
            // Sparkly sprinkle "twinkle".
            twinkle: k => {
                [1047, 1319, 1568].forEach((note, i) => {
                    voice({ from: note * k, at: i * 0.06, dur: 0.2, vol: 0.12 });
                    voice({ from: note * 2 * k, at: i * 0.06, dur: 0.12, vol: 0.035 });
                });
            }
        };

        function playPickup() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const sound = PICKUP_SOUNDS[LEVELS[currentLevelIdx].pickupSound] || PICKUP_SOUNDS.boing;
                sound(0.9 + Math.random() * 0.22);
            } catch (error) { /* audio is optional */ }
        }

        // --- GAME FLOW ---
        const finishesLevel = () => currentLevelIdx === themesIn(levelOf(stepNumber)) - 1;
        const nextLabel = () => (finishesLevel()
            ? lang.t('Next level ➜', 'Niveau suivant ➜')
            : lang.t('Next puzzle ➜', 'Casse-tête suivant ➜'));

        function triggerVictory() {
            saveSolved();
            const level = levelOf(stepNumber);
            els.nextBtn.textContent = nextLabel();
            const bonus = LEVELS[LEVELS.length - 1];
            const unlocksBonus = finishesLevel() && level === BONUS_LEVEL - 1;
            if (finishesLevel()) {
                els.levelNote.textContent = unlocksBonus
                    ? lang.t(`🎉 Level ${level + 1} cleared! New puzzles: ${bonus.name} 🧁`,
                        `🎉 Niveau ${level + 1} réussi${NBSP}! Nouveaux casse-tête${NBSP}: ${bonus.nameFr} 🧁`)
                    : lang.t(`🎉 Level ${level + 1} cleared!`, `🎉 Niveau ${level + 1} réussi${NBSP}!`);
                els.levelNote.hidden = false;
            } else {
                els.levelNote.hidden = true;
            }
            els.victory.classList.add('visible');
            if (unlocksBonus) {
                speak(`Level ${level + 1} cleared! New puzzles: ${bonus.name}!`,
                    `Niveau ${level + 1} réussi${NBSP}! Nouveaux casse-tête${NBSP}: ${bonus.nameFr}${NBSP}!`);
            } else if (finishesLevel()) {
                speak(`Level ${level + 1} cleared! Amazing!`, `Niveau ${level + 1} réussi${NBSP}! Bravo${NBSP}!`);
            } else {
                speak("You did it! Amazing!", `Tu as réussi${NBSP}! Bravo${NBSP}!`);
            }
            els.nextBtn.focus({ preventScroll: true });
        }

        // Save as soon as a puzzle is solved, so leaving from the victory screen keeps the progress.
        function saveSolved() {
            bestStep = Math.min(Math.max(bestStep, stepNumber + 1), TOTAL_STEPS);
            try {
                localStorage.setItem(PROGRESS_KEY, JSON.stringify({ best: bestStep }));
            } catch (error) { /* progress is optional */ }
        }

        function nextLevel() {
            const next = stepNumber + 1;
            saveSolved();
            // After the last level, keep playing the last level.
            setStep(next >= TOTAL_STEPS ? LEVEL_START[LEVEL_COUNT - 1] : next);
            loadLevel(currentLevelIdx);
        }

        // --- PARTICLES ---
        const ctx = document.getElementById('particles').getContext('2d');
        let particles = [];
        
        function setupParticles() {
            const resize = () => {
                ctx.canvas.width = window.innerWidth;
                ctx.canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();
            loopParticles();
        }

        function createExplosion(x, y) {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D'];
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: colors[Math.floor(Math.random()*colors.length)]
                });
            }
        }

        function loopParticles() {
            ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2; // grav
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                ctx.fill();
                if(p.life <= 0) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(loopParticles);
        }

        init();

    </script>
</body>
</html>
