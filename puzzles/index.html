<!DOCTYPE html>
<html lang="en" data-title-fr="Casse-tête pour bébé">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Drag shapes, fruits, animals and vehicles onto their outlines, or rebuild a picture tile by tile. 12 levels, English and French.">
    <title>Puzzles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #DCF6EE; --size: 110px; }
        .play-area { width: 100%; max-width: 1060px; display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .board, .tray {
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), var(--size));
            gap: 12px;
            padding: 16px;
            border-radius: 32px;
        }
        .board { background: #fff; box-shadow: 0 10px 0 color-mix(in srgb, var(--accent, #3FC9C0) 45%, #fff); }
        .tray { background: color-mix(in srgb, var(--accent, #3FC9C0) 16%, #fff); box-shadow: inset 0 0 0 4px rgba(255,255,255,0.8); min-height: calc(var(--size) + 32px); }
        .slot { width: var(--size); height: var(--size); border-radius: 26px; background: #F5F1FA; display: grid; place-items: center; position: relative; }
        .slot .ghost { width: 82%; height: 82%; opacity: 0.22; filter: grayscale(1) brightness(0.4); display: grid; place-items: center; font-size: calc(var(--size) * 0.62); line-height: 1; }
        .slot .ghost svg { width: 100%; height: 100%; }
        .slot.hover { box-shadow: inset 0 0 0 5px var(--accent, #3FC9C0); }
        .slot.hint { animation: hint 1s ease-in-out 3; }
        @keyframes hint { 50% { box-shadow: inset 0 0 0 6px var(--sun); transform: scale(1.06); } }
        .piece {
            width: var(--size);
            height: var(--size);
            border-radius: 26px;
            display: grid;
            place-items: center;
            background: #fff;
            box-shadow: 0 6px 0 rgba(61,53,81,0.12);
            font-size: calc(var(--size) * 0.62);
            line-height: 1;
            touch-action: none;
            cursor: grab;
            animation: kit-rise 0.4s backwards;
        }
        .piece svg { width: 82%; height: 82%; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.12)); }
        .piece.dragging { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -50%) scale(1.12); box-shadow: 0 18px 30px rgba(61,53,81,0.25); cursor: grabbing; animation: none; }
        .piece.placed { box-shadow: none; background: transparent; cursor: default; animation: kit-pop 0.4s; }
        .slot .piece.placed { position: absolute; inset: 0; width: 100%; height: 100%; }

        /* Picture puzzles: tiles are slices of one drawing */
        .pic-board { position: relative; background-size: cover; }
        .pic-board::before { content: ''; position: absolute; inset: 16px; border-radius: 20px; background: var(--pic) center / 100% 100% no-repeat; opacity: 0.16; }
        .pic-board .slot { background: transparent; border: 3px dashed rgba(61,53,81,0.18); z-index: 1; }
        .tile { background-image: var(--pic); background-size: var(--bw) var(--bh); background-position: var(--bx) var(--by); font-size: 0; border: 4px solid #fff; }
        .slot .tile.placed { border-radius: 22px; border: 0; background: var(--pic) var(--bx) var(--by) / var(--bw) var(--bh) no-repeat; }
        .tray:empty { display: none; }
        .done-row { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        @media (max-width: 640px) { .board, .tray { gap: 8px; padding: 10px; border-radius: 24px; } }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <h1 class="kit-title" style="--title-shadow:#2EC4B6"><span class="bob" data-fr="Casse">Puz</span><span class="bob" style="animation-delay:-1.2s" data-fr="-tête">zles</span></h1>
        <p class="kit-sub" data-fr="Glisse chaque pièce à sa place !">Slide every piece into its place!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" id="go-shapes" style="--c:#2EC4B6"><span class="kit-badge" id="shapes-badge"></span><span class="kit-mode-art"><span>⭐🍎🐱</span></span><span class="kit-mode-label"><b data-fr="Formes et amis">Shape puzzles</b><small data-fr="Glisse sur la bonne ombre">Match each piece to its shadow</small></span></button>
            <button class="kit-mode" type="button" id="go-pictures" style="--c:#A66BFF"><span class="kit-badge" id="pictures-badge"></span><span class="kit-mode-art"><span>🖼️</span></span><span class="kit-mode-label"><b data-fr="Images en morceaux">Picture puzzles</b><small data-fr="Reconstruis l'image">Put the picture back together</small></span></button>
        </div>
        <button type="button" class="kit-btn small white" id="go-pick" data-fr="🔢 Choisir un niveau">🔢 Choose a level</button>
    </main>

    <main class="kit-screen" id="pick" hidden>
        <h2 class="kit-title" style="font-size:2.4rem" data-fr="Choisis un niveau">Choose a level</h2>
        <div id="picker"></div>
    </main>

    <main class="kit-screen" id="shapes" hidden>
        <div class="kit-hud"><span class="kit-level" id="shapes-level"></span><span class="kit-stars" id="shapes-dots"></span></div>
        <div class="play-area"><div class="board" id="shape-board"></div><div class="tray" id="shape-tray"></div></div>
        <div class="done-row" id="shape-done" hidden><button type="button" class="kit-btn" id="shape-next" data-fr="Suivant ➜">Next ➜</button></div>
    </main>

    <main class="kit-screen" id="pictures" hidden>
        <div class="kit-hud"><span class="kit-level" id="pic-level"></span><span class="kit-stars" id="pic-stars"></span></div>
        <div class="play-area"><div class="board pic-board" id="pic-board"></div><div class="tray" id="pic-tray"></div></div>
        <div class="done-row" id="pic-done" hidden><button type="button" class="kit-btn" id="pic-next" style="--c:#A66BFF;--cd:#7B45D6" data-fr="Suivant ➜">Next ➜</button></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const THEMES = [
            { name: ['Shapes', 'Formes'], accent: '#FF7A7A', sound: 'boing', items: [
                { id: 'circle', name: ['Circle', 'Cercle'], svg: '<circle cx="50" cy="50" r="40" fill="#FF6B6B"/>' },
                { id: 'square', name: ['Square', 'Carré'], svg: '<rect x="15" y="15" width="70" height="70" rx="10" fill="#4ECDC4"/>' },
                { id: 'triangle', name: ['Triangle', 'Triangle'], svg: '<path d="M50 14 L88 82 L12 82 Z" fill="#FFD23F" stroke="#FFD23F" stroke-width="8" stroke-linejoin="round"/>' },
                { id: 'star', name: ['Star', 'Étoile'], svg: '<path d="M50 8 L61 38 L93 39 L67 59 L77 90 L50 72 L23 90 L33 59 L7 39 L39 38 Z" fill="#A29BFE"/>' },
                { id: 'heart', name: ['Heart', 'Cœur'], svg: '<path d="M50 86 C50 86 14 62 14 36 A18 18 0 0 1 50 32 A18 18 0 0 1 86 36 C86 62 50 86 50 86 Z" fill="#FF7DB8"/>' },
                { id: 'diamond', name: ['Diamond', 'Losange'], svg: '<polygon points="50,8 88,50 50,92 12,50" fill="#54A0FF"/>' },
                { id: 'moon', name: ['Moon', 'Lune'], svg: '<path d="M70 8 C42 12 22 34 22 58 C22 80 42 94 66 90 C52 80 44 65 44 49 C44 31 54 17 70 8 Z" fill="#FDCB6E"/>' },
                { id: 'pentagon', name: ['Pentagon', 'Pentagone'], svg: '<polygon points="50,10 90,40 75,86 25,86 10,40" fill="#FAB1A0"/>' },
                { id: 'hexagon', name: ['Hexagon', 'Hexagone'], svg: '<polygon points="50,8 87,29 87,71 50,92 13,71 13,29" fill="#6C5CE7"/>' }
            ] },
            { name: ['Fruits', 'Fruits'], accent: '#4CC26A', sound: 'plop', items: [
                ['apple', '🍎', 'Apple', 'Pomme'], ['banana', '🍌', 'Banana', 'Banane'], ['grape', '🍇', 'Grapes', 'Raisins'], ['orange', '🍊', 'Orange', 'Orange'],
                ['pear', '🍐', 'Pear', 'Poire'], ['cherry', '🍒', 'Cherry', 'Cerise'], ['strawberry', '🍓', 'Strawberry', 'Fraise'], ['watermelon', '🍉', 'Watermelon', 'Pastèque'], ['pineapple', '🍍', 'Pineapple', 'Ananas']
            ] },
            { name: ['Animals', 'Animaux'], accent: '#4DA3F2', sound: 'squeak', items: [
                ['cat', '🐱', 'Cat', 'Chat'], ['fish', '🐠', 'Fish', 'Poisson'], ['bear', '🐻', 'Bear', 'Ours'], ['bird', '🐦', 'Bird', 'Oiseau'], ['pig', '🐷', 'Pig', 'Cochon'],
                ['duck', '🦆', 'Duck', 'Canard'], ['frog', '🐸', 'Frog', 'Grenouille'], ['crab', '🦀', 'Crab', 'Crabe'], ['turtle', '🐢', 'Turtle', 'Tortue']
            ] },
            { name: ['Things that go', 'Transports'], accent: '#FF9F2E', sound: 'honk', items: [
                ['car', '🚗', 'Car', 'Auto'], ['boat', '⛵', 'Boat', 'Bateau'], ['rocket', '🚀', 'Rocket', 'Fusée'], ['plane', '✈️', 'Plane', 'Avion'], ['truck', '🚚', 'Truck', 'Camion'],
                ['bike', '🚲', 'Bike', 'Vélo'], ['bus', '🚌', 'Bus', 'Autobus'], ['train', '🚂', 'Train', 'Train'], ['helicopter', '🚁', 'Helicopter', 'Hélicoptère']
            ] },
            { name: ['Yummy food', 'Miam-miam'], accent: '#8C6CF0', sound: 'sparkle', items: [
                ['cake', '🎂', 'Cake', 'Gâteau'], ['icecream', '🍦', 'Ice cream', 'Crème glacée'], ['donut', '🍩', 'Donut', 'Beigne'], ['cookie', '🍪', 'Cookie', 'Biscuit'], ['cupcake', '🧁', 'Cupcake', 'Petit gâteau'],
                ['pizza', '🍕', 'Pizza', 'Pizza'], ['croissant', '🥐', 'Croissant', 'Croissant'], ['popcorn', '🍿', 'Popcorn', 'Maïs soufflé'], ['lollipop', '🍭', 'Lollipop', 'Sucette']
            ] }
        ].map(t => ({ ...t, items: t.items.map(i => Array.isArray(i) ? { id: i[0], emoji: i[1], name: [i[2], i[3]] } : i) }));
        const art = item => item.emoji || `<svg viewBox="0 0 100 100">${item.svg}</svg>`;
        const itemName = item => T(item.name[0], item.name[1]);

        // Levels: each level is one puzzle per theme; the 5th theme joins at level 7.
        const LEVEL_PIECES = [3, 4, 4, 5, 5, 6, 6, 7, 7, 8, 8, 9];
        const themesIn = level => (level >= 6 ? 5 : 4);
        const STEPS = [], LEVEL_START = [];
        LEVEL_PIECES.forEach((_, level) => { LEVEL_START.push(STEPS.length); for (let t = 0; t < themesIn(level); t++) STEPS.push({ level, theme: t }); });
        const saved = Kit.store.json('puzzles-progress', {});
        let best = Number.isInteger(saved.best) ? Math.min(Math.max(0, saved.best), STEPS.length) : 0;
        const saveBest = step => { best = Math.min(Math.max(best, step), STEPS.length); Kit.store.setJson('puzzles-progress', { best }); };
        const cleared = () => LEVEL_START.filter((s, l) => s + themesIn(l) <= best).length;
        const resumeStep = () => (best >= STEPS.length ? LEVEL_START[LEVEL_PIECES.length - 1] : best);

        const start = $('#start'), pick = $('#pick'), shapes = $('#shapes'), pictures = $('#pictures');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#DCF6EE'); renderBadges(); }

        // ---------- Dragging (one finger or mouse, snaps or slides back) ----------
        let drag = null;
        function startDrag(event, piece, onDrop) {
            if (drag || piece.classList.contains('placed')) return;
            event.preventDefault();
            const rect = piece.getBoundingClientRect();
            drag = { piece, home: piece.parentElement, next: piece.nextSibling, onDrop, id: event.pointerId, dx: event.clientX - (rect.left + rect.width / 2), dy: event.clientY - (rect.top + rect.height / 2) };
            piece.style.width = rect.width + 'px';
            piece.style.height = rect.height + 'px';
            piece.classList.add('dragging');
            document.body.appendChild(piece);
            moveDrag(event);
            pickupSound();
        }
        function moveDrag(event) {
            if (!drag || event.pointerId !== drag.id) return;
            drag.x = event.clientX - drag.dx;
            drag.y = event.clientY - drag.dy;
            drag.piece.style.left = drag.x + 'px';
            drag.piece.style.top = drag.y + 'px';
            document.querySelectorAll('.slot').forEach(s => {
                const r = s.getBoundingClientRect();
                s.classList.toggle('hover', drag.x > r.left - 14 && drag.x < r.right + 14 && drag.y > r.top - 14 && drag.y < r.bottom + 14 && !s.querySelector('.placed'));
            });
        }
        function endDrag(event) {
            if (!drag || (event && event.pointerId !== drag.id)) return;
            const d = drag;
            drag = null;
            document.querySelectorAll('.slot.hover').forEach(s => s.classList.remove('hover'));
            const slot = [...document.querySelectorAll('.slot')].find(s => {
                const r = s.getBoundingClientRect();
                return d.x > r.left - 14 && d.x < r.right + 14 && d.y > r.top - 14 && d.y < r.bottom + 14 && !s.querySelector('.placed');
            });
            d.piece.classList.remove('dragging');
            d.piece.style.left = d.piece.style.top = d.piece.style.width = d.piece.style.height = '';
            if (event && slot && d.onDrop(d.piece, slot)) return;
            d.home.insertBefore(d.piece, d.next && d.next.parentElement === d.home ? d.next : null);
            if (event && slot) { Kit.bounce(d.piece, 'wobble'); sfx.oops(); }
        }
        window.addEventListener('pointermove', moveDrag);
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', () => endDrag(null));
        window.addEventListener('blur', () => endDrag(null));
        let pickupKind = 'boing';
        function pickupSound() {
            const k = 0.9 + Math.random() * 0.2;
            if (pickupKind === 'plop') { Kit.tone(1150 * k, { to: 260 * k, dur: 0.09, vol: 0.2 }); Kit.tone(950 * k, { at: 0.11, to: 320 * k, dur: 0.08, vol: 0.1 }); }
            else if (pickupKind === 'squeak') sfx.squeak();
            else if (pickupKind === 'honk') sfx.honk();
            else if (pickupKind === 'sparkle') sfx.sparkle();
            else Kit.tone(520 * k, { to: 170 * k, dur: 0.3, vol: 0.18, vibrato: 50 });
        }
        function sizeFor(count, cols) {
            const rows = Math.ceil(count / cols);
            const wide = innerWidth > 820;
            const w = wide ? (Math.min(innerWidth, 1060) - 120) / (cols * 2) : (innerWidth - 80) / cols;
            const h = wide ? (innerHeight - 230) / rows : (innerHeight - 260) / (rows * 2);
            return Math.max(56, Math.floor(Math.min(140, w - 12, h - 12)));
        }

        // ---------------- ⭐ SHAPE PUZZLES ----------------
        let step = 0, placed = 0, hintTimer = 0;
        function renderShapeHud() {
            const s = STEPS[step];
            $('#shapes-level').textContent = T(`Level ${s.level + 1}`, `Niveau ${s.level + 1}`) + ' · ' + T(...THEMES[s.theme].name);
            const total = themesIn(s.level);
            $('#shapes-dots').innerHTML = Array.from({ length: total }, (_, i) => `<span class="${i < s.theme ? '' : 'off'}">${['⭐', '🍎', '🐱', '🚗', '🧁'][i]}</span>`).join('');
        }
        function loadShape(n) {
            step = n;
            placed = 0;
            const s = STEPS[step], theme = THEMES[s.theme], count = LEVEL_PIECES[s.level];
            const items = theme.items.slice(0, count);
            pickupKind = theme.sound;
            Kit.tint(theme.accent + '30');
            document.documentElement.style.setProperty('--accent', theme.accent);
            const cols = count === 4 ? 2 : Math.min(count, 3);
            document.documentElement.style.setProperty('--size', sizeFor(count, cols) + 'px');
            ['#shape-board', '#shape-tray'].forEach(id => $(id).style.setProperty('--cols', cols));
            $('#shape-board').innerHTML = items.map(i => `<div class="slot" data-id="${i.id}"><span class="ghost">${art(i)}</span></div>`).join('');
            $('#shape-tray').innerHTML = Kit.shuffle(items).map((i, k) => `<div class="piece" data-id="${i.id}" role="img" aria-label="${itemName(i)}" style="animation-delay:${k * 0.05}s">${art(i)}</div>`).join('');
            $('#shape-done').hidden = true;
            renderShapeHud();
            armHint();
        }
        function armHint() {
            clearTimeout(hintTimer);
            document.querySelectorAll('.slot.hint').forEach(s => s.classList.remove('hint'));
            hintTimer = setTimeout(() => {
                if (shapes.hidden) return;
                const piece = $('#shape-tray .piece');
                if (piece) { const slot = $(`#shape-board .slot[data-id="${piece.dataset.id}"]`); if (slot) slot.classList.add('hint'); }
            }, 6000);
        }
        $('#shape-tray').addEventListener('pointerdown', event => {
            const piece = event.target.closest('.piece');
            if (!piece) return;
            armHint();
            const item = THEMES[STEPS[step].theme].items.find(i => i.id === piece.dataset.id);
            say(item.name[0], item.name[1]);
            startDrag(event, piece, (p, slot) => {
                if (slot.dataset.id !== p.dataset.id) return false;
                p.classList.add('placed');
                slot.appendChild(p);
                placed++;
                sfx.pop();
                Kit.later(() => sfx.boing(Kit.note(placed + 3)), 90);
                Kit.burstFrom(slot, [THEMES[STEPS[step].theme].accent, '#FFD54A', '#fff'], 22);
                armHint();
                if (placed === LEVEL_PIECES[STEPS[step].level]) shapeSolved();
                return true;
            });
        });
        function shapeSolved() {
            saveBest(step + 1);
            clearTimeout(hintTimer);
            const s = STEPS[step];
            const levelDone = s.theme === themesIn(s.level) - 1;
            Kit.later(() => {
                sfx.fanfare();
                Kit.confetti(levelDone ? 140 : 70);
                document.querySelectorAll('#shape-board .piece').forEach((p, i) => Kit.later(() => Kit.bounce(p, 'dance'), i * 90));
                if (levelDone) {
                    Kit.cheer(T(`🎉 Level ${s.level + 1} done!`, `🎉 Niveau ${s.level + 1} réussi${NBSP}!`), 2000);
                    say(`Level ${s.level + 1} done! Amazing!`, `Niveau ${s.level + 1} réussi${NBSP}! Bravo${NBSP}!`);
                } else {
                    Kit.cheer(T('⭐ You did it!', `⭐ Bravo${NBSP}!`), 1400);
                    say('You did it!', `Tu as réussi${NBSP}!`);
                }
                $('#shape-done').hidden = false;
                $('#shape-next').focus({ preventScroll: true });
            }, 500);
        }
        $('#shape-next').addEventListener('click', () => { sfx.pop(); loadShape(step + 1 >= STEPS.length ? LEVEL_START[LEVEL_PIECES.length - 1] : step + 1); });
        function openShapes(n) { Kit.show(shapes); loadShape(n); say("Let's play!", `On joue${NBSP}!`); }
        Kit.onLeave(shapes, () => { clearTimeout(hintTimer); endDrag(null); });

        // ---------------- 🖼️ PICTURE PUZZLES ----------------
        const PICS = [
            // Sunny farm
            '<rect width="300" height="300" fill="#9EDCFF"/><circle cx="240" cy="62" r="34" fill="#FFD54A"/><rect y="200" width="300" height="100" fill="#7ED36B"/>'
            + '<rect x="60" y="120" width="120" height="100" fill="#E8465C"/><polygon points="50,125 120,70 190,125" fill="#B92D45"/><rect x="100" y="160" width="40" height="60" fill="#fff"/>'
            + '<path d="M100 160 L140 220 M140 160 L100 220" stroke="#E8465C" stroke-width="6"/><circle cx="235" cy="225" r="22" fill="#fff"/><circle cx="252" cy="212" r="12" fill="#fff"/><circle cx="256" cy="210" r="3" fill="#333"/>'
            + '<ellipse cx="70" cy="40" rx="40" ry="16" fill="#fff"/><ellipse cx="100" cy="32" rx="26" ry="14" fill="#fff"/>',
            // Under the sea
            '<rect width="300" height="300" fill="#3FA9F5"/><rect y="250" width="300" height="50" fill="#F4D58D"/><ellipse cx="150" cy="140" rx="80" ry="50" fill="#FF9F43"/>'
            + '<polygon points="70,140 30,100 30,180" fill="#FF6B8B"/><circle cx="195" cy="130" r="10" fill="#fff"/><circle cx="198" cy="130" r="5" fill="#333"/>'
            + '<path d="M120 100 L150 140 L120 180" stroke="#fff" stroke-width="8" fill="none" opacity="0.7"/><circle cx="250" cy="70" r="12" fill="#BDE7FF"/><circle cx="265" cy="40" r="8" fill="#BDE7FF"/>'
            + '<path d="M40 250 Q30 210 50 190 Q60 230 55 250 Z" fill="#4CC26A"/><path d="M260 250 Q250 200 275 180 Q280 220 272 250 Z" fill="#4CC26A"/>',
            // Rocket in space
            '<rect width="300" height="300" fill="#1E2A5A"/><circle cx="60" cy="60" r="4" fill="#fff"/><circle cx="240" cy="40" r="3" fill="#fff"/><circle cx="260" cy="200" r="4" fill="#fff"/><circle cx="40" cy="220" r="3" fill="#fff"/>'
            + '<circle cx="230" cy="110" r="36" fill="#A66BFF"/><ellipse cx="230" cy="110" rx="60" ry="12" fill="none" stroke="#FFD54A" stroke-width="6"/>'
            + '<path d="M130 50 Q160 90 160 170 H100 Q100 90 130 50 Z" fill="#fff"/><circle cx="130" cy="115" r="16" fill="#4FB8FF" stroke="#3D3551" stroke-width="5"/>'
            + '<polygon points="100,150 76,195 100,185" fill="#E8465C"/><polygon points="160,150 184,195 160,185" fill="#E8465C"/><path d="M110 172 Q130 240 150 172 Z" fill="#FFB627"/>',
            // Rainbow and flowers
            '<rect width="300" height="300" fill="#DFF4FF"/>' + [0, 1, 2, 3, 4, 5].map(i => `<circle cx="150" cy="230" r="${140 - i * 16}" fill="${['#FF5A5F', '#FF9A2E', '#FFD93B', '#4CC26A', '#3D9BF0', '#9B6CF0'][i]}"/>`).join('')
            + '<circle cx="150" cy="230" r="44" fill="#DFF4FF"/><rect y="230" width="300" height="70" fill="#7ED36B"/>'
            + [50, 150, 250].map((x, i) => `<circle cx="${x}" cy="255" r="16" fill="${['#FF7DB8', '#FFD54A', '#A66BFF'][i]}"/><circle cx="${x}" cy="255" r="6" fill="#fff"/>`).join('')
        ].map(svg => `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'>${svg}</svg>`)}")`);
        const PIC_LEVELS = [[2, 1], [2, 2], [3, 2], [3, 3]];
        const ROUNDS = 4;
        const picStore = Kit.levelStore('puzzles-picture-level', PIC_LEVELS.length);
        let picLevel = picStore.get(), picWon = 0, picIndex = 0, picPlaced = 0;
        function renderPicHud(popIndex) {
            $('#pic-level').textContent = T(`Level ${picLevel + 1}`, `Niveau ${picLevel + 1}`);
            Kit.stars($('#pic-stars'), ROUNDS, picWon, popIndex);
        }
        function loadPicture() {
            const [cols, rows] = PIC_LEVELS[picLevel];
            const count = cols * rows;
            const size = sizeFor(count, cols);
            picPlaced = 0;
            document.documentElement.style.setProperty('--size', size + 'px');
            document.documentElement.style.setProperty('--accent', '#A66BFF');
            Kit.tint('#EFE6FF');
            const board = $('#pic-board'), tray = $('#pic-tray');
            board.style.setProperty('--cols', cols);
            tray.style.setProperty('--cols', Math.min(count, cols === 2 ? 2 : 3));
            board.style.setProperty('--pic', PICS[picIndex]);
            const bw = cols * (size + 12) - 12, bh = rows * (size + 12) - 12;
            board.innerHTML = Array.from({ length: count }, (_, i) => `<div class="slot" data-id="${i}"></div>`).join('');
            tray.innerHTML = Kit.shuffle(Array.from({ length: count }, (_, i) => i)).map((i, k) => {
                const cx = i % cols, cy = Math.floor(i / cols);
                return `<div class="piece tile" data-id="${i}" role="img" aria-label="${T('Puzzle piece', 'Pièce du casse-tête')}"
                    style="--bw:${bw}px;--bh:${bh}px;--bx:-${cx * (size + 12)}px;--by:-${cy * (size + 12)}px;animation-delay:${k * 0.05}s"></div>`;
            }).join('');
            // The picture URL holds quotes, so it is set through the style API rather than the markup.
            tray.querySelectorAll('.tile').forEach(t => t.style.setProperty('--pic', PICS[picIndex]));
            $('#pic-done').hidden = true;
            renderPicHud();
        }
        $('#pic-tray').addEventListener('pointerdown', event => {
            const piece = event.target.closest('.piece');
            if (!piece) return;
            startDrag(event, piece, (p, slot) => {
                if (slot.dataset.id !== p.dataset.id) return false;
                p.classList.add('placed');
                slot.appendChild(p);
                picPlaced++;
                sfx.pop();
                Kit.later(() => sfx.boing(Kit.note(picPlaced + 2)), 90);
                Kit.burstFrom(slot, ['#A66BFF', '#FFD54A', '#fff'], 18);
                if (picPlaced === $('#pic-board').children.length) picSolved();
                return true;
            });
        });
        function picSolved() {
            picWon++;
            let levelUp = false;
            if (picWon >= ROUNDS) {
                picWon = 0;
                levelUp = picLevel < PIC_LEVELS.length - 1;
                if (levelUp) picLevel++;
                picStore.set(picLevel);
            }
            Kit.later(() => {
                sfx.fanfare();
                Kit.confetti(levelUp ? 140 : 80);
                Kit.bounce($('#pic-board'), 'dance');
                if (levelUp) {
                    Kit.cheer(T(`🎉 Level ${picLevel + 1}: more pieces!`, `🎉 Niveau ${picLevel + 1}${NBSP}: plus de pièces${NBSP}!`), 2000);
                    say(`Wow! Level ${picLevel + 1}!`, `Bravo${NBSP}! Niveau ${picLevel + 1}${NBSP}!`);
                    renderPicHud();
                } else {
                    Kit.cheer(T('🖼️ Picture done!', `🖼️ Image finie${NBSP}!`), 1400);
                    say('You did it!', `Tu as réussi${NBSP}!`);
                    renderPicHud(picWon - 1);
                }
                $('#pic-done').hidden = false;
            }, 400);
        }
        $('#pic-next').addEventListener('click', () => { sfx.pop(); picIndex = (picIndex + 1) % PICS.length; loadPicture(); });
        function openPictures() { Kit.show(pictures); picWon = 0; loadPicture(); say('Put the picture back together!', `Reconstruis l'image${NBSP}!`); }
        Kit.onLeave(pictures, () => endDrag(null));

        // ---------------- START & PICKER ----------------
        function renderBadges() {
            $('#shapes-badge').textContent = T(`Level ${STEPS[resumeStep()].level + 1}`, `Niv. ${STEPS[resumeStep()].level + 1}`);
            $('#pictures-badge').textContent = T(`Level ${picLevel + 1}`, `Niv. ${picLevel + 1}`);
        }
        function openPick() {
            if (cleared() === 0) { Kit.bounce($('#go-pick'), 'wobble'); sfx.oops(); say('Finish level 1 first!', `Termine le niveau 1 d'abord${NBSP}!`); return; }
            Kit.show(pick);
            Kit.picker($('#picker'), { count: LEVEL_PIECES.length, open: n => n <= cleared(), onPick: n => openShapes(LEVEL_START[n]) });
        }
        $('#go-shapes').addEventListener('click', () => { sfx.pop(); openShapes(resumeStep()); });
        $('#go-pictures').addEventListener('click', () => { sfx.pop(); openPictures(); });
        $('#go-pick').addEventListener('click', openPick);
        window.addEventListener('resize', () => {
            if (drag) endDrag(null);
            if (!shapes.hidden && !placed) loadShape(step);
            if (!pictures.hidden && !picPlaced) loadPicture();
        });
        Kit.onLang(() => { renderBadges(); if (!shapes.hidden) renderShapeHud(); });
        goStart();
    }());
    </script>
</body>
</html>
