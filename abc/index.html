<!DOCTYPE html>
<html lang="en" data-title-fr="L'heure de l'ABC">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Meet the letters A to Z, find the matching picture and pop letter balloons. Spoken in English and French.">
    <title>ABC Time</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅰️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #FFE3EC; }

        /* Letter blocks: chunky jelly cubes in the letter's colour */
        .block {
            --c: #FF5A5F; --cd: #C9303A;
            position: relative;
            border: 0;
            padding: 0;
            border-radius: 22%;
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c));
            box-shadow: 0 7px 0 var(--cd), 0 12px 18px rgba(61,53,81,0.16);
            color: #fff;
            font-family: 'Fredoka One', system-ui, sans-serif;
            line-height: 1;
            display: grid;
            place-items: center;
            -webkit-text-stroke: 2px rgba(0,0,0,0.08);
            text-shadow: 0 3px 0 var(--cd);
            transition: transform 0.15s;
        }
        .block::before { content: ''; position: absolute; left: 14%; top: 10%; width: 32%; height: 11%; border-radius: 99px; background: rgba(255,255,255,0.5); }
        .block:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--cd); }

        /* ---- Meet the letters ---- */
        .meet-stage {
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 18px;
            align-items: center;
            padding: 18px;
            border-radius: 34px;
            background: #fff;
            box-shadow: 0 8px 0 rgba(61,53,81,0.08);
        }
        .meet-stage .block { width: clamp(120px, 28vw, 180px); height: clamp(120px, 28vw, 180px); font-size: clamp(4.5rem, 14vw, 7.5rem); }
        .meet-stage .block small { position: absolute; right: 12%; bottom: 8%; font-size: 0.38em; text-shadow: none; opacity: 0.95; }
        .meet-friend { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; padding: 0; }
        .meet-friend .pic { font-size: clamp(4.5rem, 16vw, 7rem); line-height: 1; filter: drop-shadow(0 8px 6px rgba(61,53,81,0.18)); }
        .meet-friend .word { font-family: 'Fredoka One', system-ui, sans-serif; font-size: clamp(1.8rem, 7vw, 2.8rem); }
        .first { color: var(--wc, var(--pink)); }
        .meet-friend .more { font-weight: 900; color: var(--muted); font-size: 0.95rem; }
        .alphabet {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
            gap: 12px;
        }
        .alphabet .block { aspect-ratio: 1; font-size: 2.2rem; animation: kit-rise 0.4s backwards; }
        .alphabet .block.seen::after { content: '⭐'; position: absolute; top: -10px; right: -8px; font-size: 1.1rem; text-shadow: none; -webkit-text-stroke: 0; }

        /* ---- Find the picture ---- */
        .find-top { display: flex; align-items: center; gap: 16px; }
        .find-top .block { width: clamp(96px, 22vw, 140px); height: clamp(96px, 22vw, 140px); font-size: clamp(3.6rem, 11vw, 5.6rem); }
        .find-top .friend-spot { position: absolute; right: -26px; bottom: -18px; font-size: 3rem; text-shadow: none; -webkit-text-stroke: 0; transform: scale(0); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
        .find-top .friend-spot.show { transform: scale(1); }
        .cards { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 14px; }
        .pic-card {
            border: 0;
            border-radius: 28px;
            background: var(--plate, #FFF1DC);
            padding: 14px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 7px 0 rgba(61,53,81,0.1);
            animation: kit-rise 0.45s cubic-bezier(0.34,1.56,0.64,1) backwards;
            transition: transform 0.15s, opacity 0.3s;
        }
        .pic-card .pic { font-size: clamp(3.4rem, 12vw, 5.2rem); line-height: 1.1; }
        .pic-card .word { font-family: 'Fredoka One', system-ui, sans-serif; font-size: clamp(1rem, 3.6vw, 1.4rem); }
        .pic-card.dim { opacity: 0.35; transform: scale(0.94); }
        .pic-card.right { box-shadow: 0 7px 0 var(--green-d), 0 0 0 5px var(--green); }

        /* ---- Letter balloons ---- */
        .sky {
            position: relative;
            width: 100%;
            max-width: 1000px;
            flex: 1;
            min-height: 360px;
            border-radius: 34px;
            overflow: hidden;
            background: linear-gradient(180deg, #9BDCFF 0%, #D6F1FF 70%, #EAF9E5 100%);
            box-shadow: inset 0 -26px 0 #9BDB8A, 0 8px 0 rgba(61,53,81,0.08);
            touch-action: manipulation;
        }
        .sky::before, .sky::after {
            content: '';
            position: absolute;
            width: 140px; height: 46px;
            border-radius: 99px;
            background: rgba(255,255,255,0.9);
            box-shadow: 40px -22px 0 6px rgba(255,255,255,0.9);
            animation: drift 40s linear infinite;
        }
        .sky::before { top: 12%; left: -160px; }
        .sky::after { top: 34%; left: -160px; animation-duration: 55s; animation-delay: -25s; transform: scale(0.7); }
        @keyframes drift { to { left: calc(100% + 160px); } }
        .balloon {
            --c: #FF5A5F; --cd: #C9303A;
            position: absolute;
            bottom: -170px;
            width: clamp(78px, 15vw, 110px);
            aspect-ratio: 0.82;
            border: 0;
            padding: 0;
            border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
            background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.75) 0 8%, transparent 9%), radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 65%, #fff), var(--c) 70%);
            box-shadow: inset -8px -10px 0 color-mix(in srgb, var(--cd) 40%, transparent);
            color: #fff;
            font-family: 'Fredoka One', system-ui, sans-serif;
            font-size: clamp(2.3rem, 7vw, 3.3rem);
            text-shadow: 0 3px 0 var(--cd);
            animation: rise var(--t, 8s) linear forwards;
        }
        .balloon::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            width: 2px;
            height: 70px;
            background: rgba(61,53,81,0.35);
        }
        .balloon > span { display: inline-block; pointer-events: none; }
        .balloon.popped { animation: popped 0.25s ease-out forwards; }
        @keyframes rise { to { transform: translateY(calc(-1 * (var(--sky-h, 600px) + 260px))) rotate(var(--sway, 4deg)); } }
        @keyframes popped { to { scale: 1.6; opacity: 0; } }

        @media (max-width: 560px) {
            .meet-stage { grid-template-columns: 1fr; justify-items: center; }
            .alphabet { grid-template-columns: repeat(6, 1fr); gap: 8px; }
            .alphabet .block { font-size: 1.6rem; }
            .cards { gap: 10px; }
        }
    </style>
</head>
<body>
    <!-- 🌟 Start -->
    <main class="kit-screen" id="start">
        <h1 class="kit-title"><span class="bob" data-fr="L'heure">ABC</span> <span class="bob" style="animation-delay:-1.3s" data-fr="de l'ABC">Time</span></h1>
        <p class="kit-sub" data-fr="Les lettres, leurs amis et des ballons à faire éclater !">Letters, their picture friends and balloons to pop!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" id="go-meet" style="--c:#FF6B8B"><span class="kit-mode-art"><span>🔤</span></span><span class="kit-mode-label"><b data-fr="Les lettres">Meet the letters</b><small data-fr="Touche une lettre pour l'entendre">Tap a letter to hear it</small></span></button>
            <button class="kit-mode" type="button" id="go-find" style="--c:#4FB8FF"><span class="kit-badge" id="find-badge"></span><span class="kit-mode-art"><span>🔍</span></span><span class="kit-mode-label"><b data-fr="Trouve l'image">Find the picture</b><small data-fr="Quelle image commence par la lettre ?">Which picture starts with the letter?</small></span></button>
            <button class="kit-mode" type="button" id="go-pop" style="--c:#FFB627"><span class="kit-badge" id="pop-badge"></span><span class="kit-mode-art"><span>🎈</span></span><span class="kit-mode-label"><b data-fr="Ballons lettres">Letter balloons</b><small data-fr="Fais éclater la bonne lettre">Pop the letter you hear</small></span></button>
        </div>
    </main>

    <!-- 🔤 Meet -->
    <main class="kit-screen" id="meet" hidden>
        <section class="meet-stage" aria-live="polite">
            <button type="button" class="block" id="meet-block" aria-label="A"><span id="meet-letter">A</span><small id="meet-lower">a</small></button>
            <button type="button" class="meet-friend" id="meet-friend">
                <span class="pic" id="meet-pic">🍎</span>
                <span class="word" id="meet-word"></span>
                <span class="more" data-fr="Touche l'image pour un autre ami">Tap the picture for another friend</span>
            </button>
        </section>
        <div class="alphabet" id="alphabet"></div>
    </main>

    <!-- 🔍 Find -->
    <main class="kit-screen" id="find" hidden>
        <div class="kit-hud"><span class="kit-level" id="find-level"></span><span class="kit-stars" id="find-stars"></span></div>
        <div class="find-top">
            <button type="button" class="block" id="find-block"><span id="find-letter">A</span><span class="friend-spot" id="find-friend"></span></button>
            <div class="kit-prompt"><span id="find-prompt"></span><button type="button" class="kit-say" id="find-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        </div>
        <div class="cards" id="cards"></div>
    </main>

    <!-- 🎈 Balloons -->
    <main class="kit-screen fit" id="pop" hidden>
        <div class="kit-hud"><span class="kit-level" id="pop-level"></span><span class="kit-stars" id="pop-stars"></span></div>
        <div class="kit-prompt"><span id="pop-prompt"></span><button type="button" class="kit-say" id="pop-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="sky" id="sky"></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';

        // Words per language always start with their letter.
        const DATA = {
            en: [
                { L:'A', items:[{e:'🍎',w:'Apple'},{e:'✈️',w:'Airplane'}] },
                { L:'B', items:[{e:'🐻',w:'Bear'},{e:'🦋',w:'Butterfly'}] },
                { L:'C', items:[{e:'🐱',w:'Cat'},{e:'🚗',w:'Car'}] },
                { L:'D', items:[{e:'🐶',w:'Dog'},{e:'🦆',w:'Duck'}] },
                { L:'E', items:[{e:'🐘',w:'Elephant'},{e:'🥚',w:'Egg'}] },
                { L:'F', items:[{e:'🐟',w:'Fish'},{e:'🌸',w:'Flower'}] },
                { L:'G', items:[{e:'🍇',w:'Grapes'},{e:'🦒',w:'Giraffe'}] },
                { L:'H', items:[{e:'🏠',w:'House'},{e:'❤️',w:'Heart'}] },
                { L:'I', items:[{e:'🍦',w:'Ice cream'},{e:'🏝️',w:'Island'}] },
                { L:'J', items:[{e:'🚙',w:'Jeep'},{e:'🧃',w:'Juice'}] },
                { L:'K', items:[{e:'🔑',w:'Key'},{e:'🦘',w:'Kangaroo'}] },
                { L:'L', items:[{e:'🦁',w:'Lion'},{e:'🍃',w:'Leaf'}] },
                { L:'M', items:[{e:'🌙',w:'Moon'},{e:'🐒',w:'Monkey'}] },
                { L:'N', items:[{e:'👃',w:'Nose'},{e:'🪹',w:'Nest'}] },
                { L:'O', items:[{e:'🍊',w:'Orange'},{e:'🦉',w:'Owl'}] },
                { L:'P', items:[{e:'🐷',w:'Pig'},{e:'🐧',w:'Penguin'}] },
                { L:'Q', items:[{e:'👑',w:'Queen'}] },
                { L:'R', items:[{e:'🌈',w:'Rainbow'},{e:'🐰',w:'Rabbit'}] },
                { L:'S', items:[{e:'⭐',w:'Star'},{e:'☀️',w:'Sun'}] },
                { L:'T', items:[{e:'🚂',w:'Train'},{e:'🐢',w:'Turtle'}] },
                { L:'U', items:[{e:'☂️',w:'Umbrella'},{e:'🦄',w:'Unicorn'}] },
                { L:'V', items:[{e:'🎻',w:'Violin'},{e:'🌋',w:'Volcano'}] },
                { L:'W', items:[{e:'🐳',w:'Whale'},{e:'🍉',w:'Watermelon'}] },
                { L:'X', items:[{e:'🎵',w:'Xylophone'}] },
                { L:'Y', items:[{e:'🪀',w:'Yo-yo'},{e:'🧶',w:'Yarn'}] },
                { L:'Z', items:[{e:'🦓',w:'Zebra'},{e:'💤',w:'Zzz'}] }
            ],
            fr: [
                { L:'A', items:[{e:'✈️',w:'Avion',art:"l'"},{e:'🐝',w:'Abeille',art:"l'"}] },
                { L:'B', items:[{e:'🐋',w:'Baleine',art:'la '},{e:'🍌',w:'Banane',art:'la '}] },
                { L:'C', items:[{e:'🐱',w:'Chat',art:'le '},{e:'🦆',w:'Canard',art:'le '}] },
                { L:'D', items:[{e:'🐬',w:'Dauphin',art:'le '},{e:'🦕',w:'Dinosaure',art:'le '}] },
                { L:'E', items:[{e:'🐘',w:'Éléphant',art:"l'"},{e:'⭐',w:'Étoile',art:"l'"}] },
                { L:'F', items:[{e:'🌸',w:'Fleur',art:'la '},{e:'🍓',w:'Fraise',art:'la '}] },
                { L:'G', items:[{e:'🦒',w:'Girafe',art:'la '},{e:'🐸',w:'Grenouille',art:'la '}] },
                { L:'H', items:[{e:'🦉',w:'Hibou',art:'le '},{e:'🦔',w:'Hérisson',art:'le '}] },
                { L:'I', items:[{e:'🏝️',w:'Île',art:"l'"},{e:'🧊',w:'Igloo',art:"l'"}] },
                { L:'J', items:[{e:'🧃',w:'Jus',art:'le '},{e:'🧸',w:'Jouet',art:'le '}] },
                { L:'K', items:[{e:'🦘',w:'Kangourou',art:'le '},{e:'🐨',w:'Koala',art:'le '}] },
                { L:'L', items:[{e:'🦁',w:'Lion',art:'le '},{e:'🌙',w:'Lune',art:'la '},{e:'🐰',w:'Lapin',art:'le '}] },
                { L:'M', items:[{e:'🏠',w:'Maison',art:'la '},{e:'🐑',w:'Mouton',art:'le '}] },
                { L:'N', items:[{e:'👃',w:'Nez',art:'le '},{e:'🪹',w:'Nid',art:'le '}] },
                { L:'O', items:[{e:'🍊',w:'Orange',art:"l'"},{e:'🐻',w:'Ours',art:"l'"}] },
                { L:'P', items:[{e:'🦋',w:'Papillon',art:'le '},{e:'🍎',w:'Pomme',art:'la '}] },
                { L:'Q', items:[{e:'4️⃣',w:'Quatre',art:'le '}] },
                { L:'R', items:[{e:'🍇',w:'Raisin',art:'le '},{e:'🤖',w:'Robot',art:'le '}] },
                { L:'S', items:[{e:'☀️',w:'Soleil',art:'le '},{e:'🐍',w:'Serpent',art:'le '}] },
                { L:'T', items:[{e:'🚂',w:'Train',art:'le '},{e:'🐢',w:'Tortue',art:'la '}] },
                { L:'U', items:[{e:'1️⃣',w:'Un',art:''},{e:'🏭',w:'Usine',art:"l'"}] },
                { L:'V', items:[{e:'🚗',w:'Voiture',art:'la '},{e:'🐄',w:'Vache',art:'la '}] },
                { L:'W', items:[{e:'🚃',w:'Wagon',art:'le '}] },
                { L:'X', items:[{e:'🎵',w:'Xylophone',art:'le '}] },
                { L:'Y', items:[{e:'🥛',w:'Yaourt',art:'le '},{e:'🪀',w:'Yo-yo',art:'le '}] },
                { L:'Z', items:[{e:'🦓',w:'Zèbre',art:'le '},{e:'0️⃣',w:'Zéro',art:'le '}] }
            ]
        };
        const letters = () => DATA[Kit.lang.lang];
        const entry = L => letters().find(d => d.L === L);
        const ALPHABET = DATA.en.map(d => d.L);

        // Each letter keeps its own colour and note.
        const PALETTE = [['#FF5A5F', '#C9303A'], ['#FF9A2E', '#C9600A'], ['#3FBF62', '#1F8A3E'], ['#3D9BF0', '#1D6FC4'],
            ['#9B6CF0', '#6A3FD1'], ['#FF7DB8', '#C93F86'], ['#2EC4B6', '#0E857A']];
        const colorOf = L => PALETTE[(L.charCodeAt(0) - 65) % PALETTE.length];
        const noteOf = L => Kit.note(L.charCodeAt(0) - 65);
        function paintBlock(el, L) { const [c, cd] = colorOf(L); el.style.setProperty('--c', c); el.style.setProperty('--cd', cd); }
        const wordHtml = (word, L) => { const first = [...word][0]; return `<span class="first" style="--wc:${colorOf(L)[1]}">${first}</span>${word.slice(first.length)}`; };
        const article = item => item.art || '';

        const start = $('#start'), meet = $('#meet'), find = $('#find'), pop = $('#pop');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); renderBadges(); }

        // ---------------- 🔤 MEET THE LETTERS ----------------
        let meetL = 'A', meetIndex = 0;
        const seen = new Set(Kit.store.json('abc-seen', []));
        function renderAlphabet() {
            $('#alphabet').innerHTML = ALPHABET.map((L, i) =>
                `<button type="button" class="block${seen.has(L) ? ' seen' : ''}" data-l="${L}" style="animation-delay:${i * 0.015}s" aria-label="${L}">${L}</button>`).join('');
            $('#alphabet').querySelectorAll('.block').forEach(b => paintBlock(b, b.dataset.l));
        }
        function showLetter(L, speak) {
            meetL = L;
            const e = entry(L);
            const item = e.items[meetIndex % e.items.length];
            paintBlock($('#meet-block'), L);
            $('#meet-letter').textContent = L;
            $('#meet-lower').textContent = L.toLowerCase();
            $('#meet-block').setAttribute('aria-label', T(`Letter ${L}`, `Lettre ${L}`));
            $('#meet-pic').textContent = item.e;
            $('#meet-word').innerHTML = wordHtml(item.w, L);
            Kit.tint(`color-mix(in srgb, ${colorOf(L)[0]} 20%, #FFF8F0)`);
            Kit.bounce($('#meet-block'));
            Kit.bounce($('#meet-pic'), 'dance');
            if (speak) {
                Kit.sfx.boing(noteOf(L));
                say(`${L}. ${L} is for ${item.w}.`, `${L}. ${L} comme ${item.w}.`, { rate: 0.9 });
            }
            if (!seen.has(L)) {
                seen.add(L);
                Kit.store.setJson('abc-seen', [...seen]);
                const b = $(`#alphabet [data-l="${L}"]`);
                if (b) b.classList.add('seen');
                if (seen.size === 26) Kit.later(() => { Kit.cheer(T('🎉 All 26 letters!', `🎉 Les 26 lettres${NBSP}!`), 2200); Kit.confetti(); Kit.sfx.fanfare(); }, 900);
            }
        }
        $('#alphabet').addEventListener('click', event => {
            const b = event.target.closest('.block');
            if (!b) return;
            Kit.bounce(b);
            meetIndex = 0;
            showLetter(b.dataset.l, true);
            Kit.burstFrom(b, colorOf(b.dataset.l), 14, 0.8);
        });
        $('#meet-block').addEventListener('click', () => { showLetter(meetL, true); Kit.burstFrom($('#meet-block'), colorOf(meetL), 20); });
        $('#meet-friend').addEventListener('click', () => {
            meetIndex++;
            const e = entry(meetL);
            const item = e.items[meetIndex % e.items.length];
            showLetter(meetL, false);
            Kit.sfx.pop();
            say(item.w, `${article(item)}${item.w.toLowerCase()}`);
            Kit.burstFrom($('#meet-pic'), colorOf(meetL), 16);
        });
        // On a computer, pressing a letter key shows that letter.
        window.addEventListener('keydown', event => {
            if (meet.hidden || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
            const L = event.key.toUpperCase();
            if (/^[A-Z]$/.test(L)) { meetIndex = 0; showLetter(L, true); const b = $(`#alphabet [data-l="${L}"]`); if (b) Kit.bounce(b); }
        });
        function openMeet() {
            Kit.show(meet);
            renderAlphabet();
            meetIndex = 0;
            showLetter(meetL, false);
            say('Tap a letter!', `Touche une lettre${NBSP}!`);
        }

        // ---------------- 🔍 FIND THE PICTURE ----------------
        const FIND_CARDS = [2, 2, 3, 3, 4, 4, 5, 6];
        const ROUNDS = 5;
        const findStore = Kit.levelStore('abc-level', FIND_CARDS.length);
        let findLevel = findStore.get(), findWon = 0, target = null, targetL = 'A', recent = [], findLocked = false;
        const PLATES = ['#FFF1DC', '#E3F6E8', '#E2F0FF', '#EFE7FF', '#FFE6F1', '#E0F7F4'];

        function pickLetter() {
            const pool = ALPHABET.filter(L => !recent.includes(L));
            const L = Kit.pick(pool);
            recent.push(L);
            if (recent.length > 8) recent.shift();
            return L;
        }
        function findPromptText() {
            return T(`Find the ${wordHtml(target.w, targetL)}`, `Trouve ${article(target)}${wordHtml(target.w, targetL)}`);
        }
        function sayFind() {
            say(`${targetL} is for ${target.w}. Find the ${target.w.toLowerCase()}!`,
                `${targetL} comme ${target.w}. Trouve ${article(target)}${target.w.toLowerCase()}${NBSP}!`, { rate: 0.9 });
        }
        function renderFindHud(popIndex) {
            $('#find-level').textContent = T(`Level ${findLevel + 1}`, `Niveau ${findLevel + 1}`);
            Kit.stars($('#find-stars'), ROUNDS, findWon, popIndex);
        }
        function newFind(keepLetter) {
            findLocked = false;
            targetL = keepLetter || pickLetter();
            const e = entry(targetL);
            target = Kit.pick(e.items);
            const count = FIND_CARDS[findLevel];
            const others = Kit.shuffle(letters().filter(d => d.L !== targetL)).slice(0, count - 1).map(d => ({ item: Kit.pick(d.items), L: d.L }));
            const choices = Kit.shuffle([{ item: target, L: targetL }, ...others]);
            paintBlock($('#find-block'), targetL);
            $('#find-letter').textContent = targetL;
            $('#find-friend').classList.remove('show');
            Kit.bounce($('#find-block'));
            Kit.tint(`color-mix(in srgb, ${colorOf(targetL)[0]} 18%, #FFF8F0)`);
            $('#find-prompt').innerHTML = findPromptText();
            const plates = Kit.shuffle(PLATES);
            $('#cards').style.setProperty('--n', count <= 3 ? count : count === 4 ? 2 : 3);
            $('#cards').innerHTML = choices.map((c, i) =>
                `<button type="button" class="pic-card" data-i="${i}" style="--plate:${plates[i % plates.length]};animation-delay:${0.1 + i * 0.06}s" aria-label="${c.item.w}">
                    <span class="pic" aria-hidden="true">${c.item.e}</span><span class="word" aria-hidden="true">${wordHtml(c.item.w, c.L)}</span></button>`).join('');
            $('#cards')._choices = choices;
            renderFindHud();
            Kit.later(sayFind, 400);
        }
        $('#cards').addEventListener('click', event => {
            const card = event.target.closest('.pic-card');
            if (!card || findLocked) return;
            const choice = $('#cards')._choices[Number(card.dataset.i)];
            if (choice.item !== target) {
                Kit.bounce(card, 'wobble');
                Kit.sfx.oops();
                say(choice.item.w, `${article(choice.item)}${choice.item.w.toLowerCase()}`);
                Kit.later(() => card.classList.add('dim'), 400);
                return;
            }
            findLocked = true;
            card.classList.add('right');
            Kit.sfx.cheer();
            Kit.burstFrom(card, colorOf(targetL), 26);
            Kit.flyTo(target.e, card.querySelector('.pic'), $('#find-friend'), {
                size: 64, done: () => {
                    $('#find-friend').textContent = target.e;
                    $('#find-friend').classList.add('show');
                    Kit.bounce($('#find-block'));
                    Kit.sfx.boing(noteOf(targetL));
                }
            });
            findWon++;
            renderFindHud(findWon - 1);
            let wait = 2400;
            if (findWon >= ROUNDS) {
                findWon = 0;
                if (findLevel < FIND_CARDS.length - 1) findLevel++;
                findStore.set(findLevel);
                say(`Yes! ${targetL} is for ${target.w}! Super! Level ${findLevel + 1}!`, `Oui${NBSP}! ${targetL} comme ${target.w}${NBSP}! Super${NBSP}! Niveau ${findLevel + 1}${NBSP}!`);
                Kit.later(() => { Kit.cheer(T(`⭐ Level ${findLevel + 1}!`, `⭐ Niveau ${findLevel + 1}${NBSP}!`), 1800); Kit.confetti(90); Kit.sfx.fanfare(); }, 1200);
                wait = 3800;
            } else {
                say(`Yes! ${targetL} is for ${target.w}!`, `Oui${NBSP}! ${targetL} comme ${target.w}${NBSP}!`);
            }
            Kit.later(() => newFind(), wait);
        });
        $('#find-say').addEventListener('click', () => target && sayFind());
        $('#find-block').addEventListener('click', () => { Kit.bounce($('#find-block')); Kit.sfx.boing(noteOf(targetL)); say(targetL, targetL); });
        function openFind() { Kit.show(find); findWon = 0; newFind(); }

        // ---------------- 🎈 LETTER BALLOONS ----------------
        const POP_LEVELS = [
            { n: 3, t: 10, set: 'ABCDEFGH' },
            { n: 4, t: 9, set: 'ABCDEFGHIJKLMNOP' },
            { n: 4, t: 8.5, set: ALPHABET.join('') },
            { n: 5, t: 8, set: ALPHABET.join('') },
            { n: 6, t: 7.5, set: ALPHABET.join('') }
        ];
        const popStore = Kit.levelStore('abc-pop-level', POP_LEVELS.length);
        let popLevel = popStore.get(), popWon = 0, popTarget = 'A', popTimer = 0, popLocked = false;
        const sky = $('#sky');
        function sayPop() { say(`Pop the letter ${popTarget}!`, `Fais éclater la lettre ${popTarget}${NBSP}!`); }
        function renderPopHud(popIndex) {
            $('#pop-level').textContent = T(`Level ${popLevel + 1}`, `Niveau ${popLevel + 1}`);
            Kit.stars($('#pop-stars'), ROUNDS, popWon, popIndex);
            $('#pop-prompt').innerHTML = T(`Pop the <span class="kit-word" style="--wc:${colorOf(popTarget)[1]}">${popTarget}</span>!`,
                `Fais éclater le <span class="kit-word" style="--wc:${colorOf(popTarget)[1]}">${popTarget}</span>${NBSP}!`);
        }
        function liveBalloons() { return [...sky.querySelectorAll('.balloon:not(.popped)')]; }
        function spawnBalloon() {
            if (pop.hidden) return;
            const cfg = POP_LEVELS[popLevel];
            const live = liveBalloons();
            if (live.length >= cfg.n) return;
            const hasTarget = live.some(b => b.dataset.l === popTarget);
            const L = !hasTarget && Math.random() < 0.75 ? popTarget : Kit.pick(cfg.set.split('').filter(x => x !== popTarget));
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'balloon';
            b.dataset.l = L;
            b.innerHTML = `<span>${L}</span>`;
            b.setAttribute('aria-label', L);
            paintBlock(b, L);
            // Spread balloons across the sky so they never stack.
            const lanes = cfg.n + 1;
            const used = live.map(x => Number(x.dataset.lane));
            const free = Array.from({ length: lanes }, (_, i) => i).filter(i => !used.includes(i));
            const lane = Kit.pick(free.length ? free : [0]);
            b.dataset.lane = lane;
            b.style.left = `calc(${(lane + 0.5) / lanes * 100}% - clamp(39px, 7.5vw, 55px))`;
            b.style.setProperty('--t', `${cfg.t * (0.85 + Math.random() * 0.3)}s`);
            b.style.setProperty('--sway', `${(Math.random() - 0.5) * 16}deg`);
            b.addEventListener('animationend', event => { if (event.animationName === 'rise' || event.animationName === 'popped') b.remove(); });
            sky.appendChild(b);
        }
        function popLoop() {
            spawnBalloon();
            clearTimeout(popTimer);
            popTimer = setTimeout(popLoop, 900 + Math.random() * 700);
        }
        sky.addEventListener('pointerdown', event => {
            const b = event.target.closest('.balloon');
            if (!b || b.classList.contains('popped') || popLocked) return;
            const L = b.dataset.l;
            if (L !== popTarget) {
                Kit.bounce(b.firstElementChild, 'wobble');
                Kit.sfx.oops();
                say(`That's ${L}.`, `C'est ${L}.`);
                return;
            }
            const rect = b.getBoundingClientRect();
            // Freeze it where it is, then burst.
            b.style.transform = getComputedStyle(b).transform;
            b.classList.add('popped');
            Kit.sfx.pop();
            Kit.sfx.boing(noteOf(L));
            Kit.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, colorOf(L), 30, 1.1);
            popWon++;
            popLocked = true;
            let wait = 1200;
            if (popWon >= ROUNDS) {
                popWon = 0;
                if (popLevel < POP_LEVELS.length - 1) popLevel++;
                popStore.set(popLevel);
                say(`Pop! ${L}! Super! Level ${popLevel + 1}!`, `Pop${NBSP}! ${L}${NBSP}! Super${NBSP}! Niveau ${popLevel + 1}${NBSP}!`);
                Kit.cheer(T(`⭐ Level ${popLevel + 1}!`, `⭐ Niveau ${popLevel + 1}${NBSP}!`), 1800);
                Kit.confetti(90);
                Kit.sfx.fanfare();
                wait = 2600;
                renderPopHud(ROUNDS - 1);
            } else {
                say(`Pop! ${L}!`, `Pop${NBSP}! ${L}${NBSP}!`);
                renderPopHud(popWon - 1);
            }
            Kit.later(() => {
                popLocked = false;
                const set = POP_LEVELS[popLevel].set.split('');
                popTarget = Kit.pick(set.filter(x => x !== popTarget));
                renderPopHud();
                sayPop();
            }, wait);
        });
        $('#pop-say').addEventListener('click', sayPop);
        function openPop() {
            Kit.show(pop);
            popWon = 0;
            popLocked = false;
            sky.innerHTML = '';
            sky.style.setProperty('--sky-h', `${sky.clientHeight || 600}px`);
            popTarget = Kit.pick(POP_LEVELS[popLevel].set.split(''));
            renderPopHud();
            Kit.later(sayPop, 300);
            popLoop();
        }
        Kit.onLeave(pop, () => { clearTimeout(popTimer); sky.innerHTML = ''; });
        window.addEventListener('resize', () => sky.style.setProperty('--sky-h', `${sky.clientHeight || 600}px`));

        // ---------------- START ----------------
        function renderBadges() {
            $('#find-badge').textContent = T(`Level ${findLevel + 1}`, `Niv. ${findLevel + 1}`);
            $('#pop-badge').textContent = T(`Level ${popLevel + 1}`, `Niv. ${popLevel + 1}`);
            Kit.tint('#FFE3EC');
        }
        $('#go-meet').addEventListener('click', () => { Kit.sfx.pop(); openMeet(); });
        $('#go-find').addEventListener('click', () => { Kit.sfx.pop(); openFind(); });
        $('#go-pop').addEventListener('click', () => { Kit.sfx.pop(); openPop(); });

        Kit.onLang(() => {
            renderBadges();
            if (!meet.hidden) showLetter(meetL, false);
            if (!find.hidden && !findLocked) newFind(targetL);
            if (!pop.hidden) renderPopHud();
        });
        goStart();
    }());
    </script>
</body>
</html>
