<!DOCTYPE html>
<html lang="en" data-title-fr="ABC">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ABC Time</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅰️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="/assets/js/site-lang.js?v=20261028"></script>

    <style data-impeccable-ignore="hard-offset-shadow bounce-easing">
        :root {
            --tint: #FFE9C7;
            --text: #3D3551;
            --muted: #8A7FA0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            background: linear-gradient(165deg, #FFFBF2 0%, var(--tint) 100%);
            transition: background 0.6s ease;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 🔤 FLOATING LETTERS */
        .sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.7) 2px, transparent 2.5px);
            background-size: 30px 30px;
        }
        .sky span {
            position: absolute;
            bottom: -140px;
            font-family: 'Fredoka One', cursive;
            line-height: 1;
            color: #fff;
            opacity: 0.7;
            animation: floatUp linear infinite;
        }
        .sky span:nth-child(1) { left: 5%;  font-size: 84px;  animation-duration: 21s; }
        .sky span:nth-child(2) { left: 23%; font-size: 44px;  animation-duration: 15s; animation-delay: -7s; }
        .sky span:nth-child(3) { left: 46%; font-size: 104px; animation-duration: 27s; animation-delay: -14s; }
        .sky span:nth-child(4) { left: 67%; font-size: 56px;  animation-duration: 18s; animation-delay: -3s; }
        .sky span:nth-child(5) { left: 85%; font-size: 92px;  animation-duration: 30s; animation-delay: -20s; }
        @keyframes floatUp {
            from { transform: translateY(0) rotate(-8deg); }
            to { transform: translateY(-130vh) rotate(10deg); }
        }

        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* 🏠 ROUND TOP BUTTONS */
        .round-btn {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
            z-index: 100;
            transition: transform 0.15s;
        }
        .round-btn:hover { transform: scale(1.08) rotate(-6deg); }
        .round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
        .round-btn:focus-visible { outline: 4px solid #FF8A3D; outline-offset: 3px; }
        .home-btn { left: max(14px, env(safe-area-inset-left)); }
        .back-btn { left: calc(max(14px, env(safe-area-inset-left)) + 62px); }
        .back-btn[hidden] { display: none; }

        ::selection { background: #FFD9A8; color: var(--text); }

        /* 📄 SCREENS */
        .screen {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            padding: 80px 16px 28px;
            text-align: center;
        }
        .screen[hidden] { display: none; }

        h1, h2 {
            font-family: 'Fredoka One', cursive;
            line-height: 1.05;
            margin: 0;
            font-weight: 400;
        }
        h1 {
            font-size: 3.2rem;
            color: #E0561A;
            text-shadow: 0 4px 0 #fff, 0 8px 18px rgba(0,0,0,0.12);
        }
        .subtitle {
            display: inline-block;
            margin: 10px 0 0;
            padding: 6px 18px;
            border-radius: 999px;
            background: #fff;
            color: #C2531A;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.06);
        }

        /* 🧱 JELLY LETTER BLOCKS */
        .block {
            --size: 180px;
            --c: #FF5A5F;
            --cd: #C9303A;
            position: relative;
            width: var(--size);
            height: var(--size);
            flex: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            border-radius: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%), var(--c);
            box-shadow: 0 calc(var(--size) * 0.065) 0 var(--cd), 0 calc(var(--size) * 0.12) calc(var(--size) * 0.16) rgba(60,40,90,0.18);
            transform-origin: 50% 100%;
            animation: idle 3.4s ease-in-out infinite;
        }
        .block::before {
            content: '';
            position: absolute;
            left: 14%;
            top: 9%;
            width: 30%;
            height: 10%;
            border-radius: 999px;
            background: #fff;
            opacity: 0.5;
        }
        .block::after {
            content: '';
            position: absolute;
            left: 49%;
            top: 9.5%;
            width: 7%;
            height: 7%;
            border-radius: 50%;
            background: #fff;
            opacity: 0.5;
        }
        .block-letter {
            position: relative;
            display: block;
            font-family: 'Fredoka One', cursive;
            font-size: calc(var(--size) * 0.66);
            line-height: 1;
            color: #fff;
            text-shadow: 0 calc(var(--size) * 0.03) 0 var(--cd);
            transform: translateY(-2%);
        }
        .block:focus-visible { outline: 5px solid var(--cd); outline-offset: 6px; }
        @keyframes idle {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.035, 0.965); }
        }
        .block.squish { animation: squish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes squish {
            0% { transform: scale(1, 1); }
            25% { transform: scale(1.18, 0.8); }
            55% { transform: scale(0.9, 1.12) translateY(-12px); }
            80% { transform: scale(1.04, 0.97); }
            100% { transform: scale(1, 1); }
        }
        .block.drop-in { animation: dropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes dropIn {
            from { transform: translateY(-70px) scale(0.6); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* The picture friend that jumps onto the block after a right answer. */
        .block-friend {
            position: absolute;
            right: -14%;
            bottom: -8%;
            width: 44%;
            height: 44%;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--size) * 0.26);
            line-height: 1;
            box-shadow: 0 5px 0 rgba(0,0,0,0.08), 0 10px 18px rgba(0,0,0,0.12);
            transform: scale(0);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .block-friend.show { transform: scale(1) rotate(8deg); }

        /* ▶️ START SCREEN */
        .title-blocks {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
        }
        .title-blocks .block { --size: 108px; animation: dropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        .title-blocks .block:nth-child(1) { rotate: -8deg; }
        .title-blocks .block:nth-child(2) { rotate: 4deg; translate: 0 -14px; animation-delay: 0.1s; }
        .title-blocks .block:nth-child(3) { rotate: -3deg; animation-delay: 0.2s; }
        .title-blocks .block.idle { animation: idle 3.4s ease-in-out infinite; }
        .title-blocks .block.idle:nth-child(2) { animation-delay: -1.1s; }
        .title-blocks .block.idle:nth-child(3) { animation-delay: -2.2s; }
        .title-blocks .block.squish { animation: squish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .start-main, .level-picker {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .start-main[hidden], .level-picker[hidden] { display: none; }
        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: min(380px, 100%);
            margin-top: 30px;
        }
        .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 18px 24px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
            background: #27A04B;
            box-shadow: 0 7px 0 #1C7A38, 0 14px 24px rgba(0,0,0,0.12);
            transition: transform 0.15s, box-shadow 0.15s;
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .start-btn[hidden] { display: none; }
        .start-btn + .start-btn { animation-delay: 0.08s; }
        .start-btn + .start-btn + .start-btn { animation-delay: 0.16s; }
        .start-btn:hover { transform: translateY(-3px) scale(1.02); }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #1C7A38; }
        .start-btn:focus-visible { outline: 4px solid #FF7A3D; outline-offset: 4px; }
        .start-btn small {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 999px;
        }
        .start-btn.secondary {
            background: #fff;
            color: #C2531A;
            font-size: 1.25rem;
            box-shadow: 0 7px 0 #FFD3B0, 0 14px 24px rgba(0,0,0,0.08);
        }
        .start-btn.secondary:active { box-shadow: 0 1px 0 #FFD3B0; }
        .start-btn.choose {
            background: #fff;
            color: #2370BA;
            font-size: 1.15rem;
            box-shadow: 0 7px 0 #BFDFFF, 0 14px 24px rgba(0,0,0,0.08);
        }
        .start-btn.choose:active { box-shadow: 0 1px 0 #BFDFFF; }
        .start-btn.choose.locked { color: #9AA3B2; box-shadow: 0 7px 0 #DDE2EA, 0 14px 24px rgba(0,0,0,0.06); }
        .start-btn.choose.locked::after { content: '🔒'; font-size: 1rem; }
        .wobble { animation: wobble 0.45s ease-in-out !important; }

        /* 🔢 LEVEL PICKER */
        .level-picker h2 {
            color: #2370BA;
            font-size: 2.2rem;
            margin: 0 0 20px;
            text-shadow: 0 3px 0 #fff;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 128px);
            justify-content: center;
            gap: 20px 18px;
            width: 100%;
            padding: 6px 4px 18px;
        }
        .level-tile {
            --c: #FF7A7A;
            --cd: #E05555;
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border: 0;
            border-radius: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0) 55%), var(--c);
            color: #fff;
            font-family: 'Fredoka One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 7px 0 var(--cd), 0 12px 18px rgba(0,0,0,0.10);
            transition: transform 0.15s;
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .tile-num { font-size: 2.8rem; line-height: 1; text-shadow: 0 3px 0 var(--cd); }
        .tile-cards { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 76%; }
        .tile-cards i {
            width: 13px;
            height: 15px;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 2px 0 var(--cd);
        }
        .level-tile:hover { transform: translateY(-3px) scale(1.05); }
        .level-tile:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--cd); }
        .level-tile:focus-visible { outline: 4px solid var(--cd); outline-offset: 4px; }
        .level-tile.locked {
            background: #E8ECF2;
            color: #A7B0BE;
            cursor: default;
            box-shadow: 0 7px 0 #D2D8E1, 0 12px 18px rgba(0,0,0,0.06);
        }
        .level-tile.locked .tile-num { text-shadow: none; }
        .level-tile.locked .tile-cards i { background: #F6F8FB; box-shadow: 0 2px 0 #D2D8E1; }
        .tile-lock {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .level-picker .start-btn { width: min(320px, 100%); margin-top: 8px; }

        /* 🎮 GAME */
        #game-screen { padding-top: 84px; }
        .hud {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 5px 0 rgba(0,0,0,0.06), 0 10px 20px rgba(0,0,0,0.06);
        }
        .hud[hidden] { display: none; }
        .level-badge {
            font-family: 'Fredoka One', cursive;
            font-size: 1.05rem;
            color: #fff;
            background: #FF7A3D;
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 0 3px 0 #C2531A;
            white-space: nowrap;
        }
        .stars { display: flex; gap: 3px; font-size: 1.45rem; line-height: 1; }
        .stars span { display: inline-block; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s, opacity 0.3s; }
        .stars span.off { filter: grayscale(1); opacity: 0.28; }
        .stars span.pop { transform: scale(1.6) rotate(25deg); }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            width: 100%;
        }
        .letter-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
        }
        .prompt {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 8px 22px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.08);
            font-family: 'Fredoka One', cursive;
            font-size: 1.55rem;
            color: var(--text);
        }
        .prompt .first { color: var(--cd); }
        .say-again {
            width: 48px;
            height: 48px;
            flex: none;
            border: 0;
            border-radius: 50%;
            background: #FFF1E3;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .say-again:active { transform: scale(0.9); }
        .say-again:focus-visible { outline: 4px solid #FF7A3D; outline-offset: 2px; }

        /* 🃏 PICTURE CARDS */
        .choices {
            --card: 190px;
            --gap: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--gap);
            width: 100%;
            max-width: calc(var(--card) * 4 + var(--gap) * 3);
            padding-bottom: 10px;
        }
        .choices.n2 { --card: 210px; }
        .choices.n3 { --card: 196px; }
        .choices.n4 { --card: 176px; }
        .choices.n5, .choices.n6 { --card: 160px; max-width: calc(var(--card) * 3 + var(--gap) * 2); }
        .card {
            position: relative;
            width: var(--card);
            border: 0;
            padding: calc(var(--card) * 0.07) calc(var(--card) * 0.07) calc(var(--card) * 0.08);
            border-radius: calc(var(--card) * 0.2);
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--card) * 0.05);
            font: inherit;
            color: inherit;
            box-shadow: 0 8px 0 #EADFD3, 0 16px 26px rgba(80,50,30,0.10);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s, opacity 0.35s, filter 0.35s;
            animation: popUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .card:hover { transform: translateY(-5px) rotate(-1.5deg); }
        .card:active { transform: translateY(7px) scale(0.97); box-shadow: 0 1px 0 #EADFD3, 0 6px 12px rgba(80,50,30,0.08); }
        .card:focus-visible { outline: 5px solid #FF7A3D; outline-offset: 4px; }
        .card-pic {
            width: 100%;
            aspect-ratio: 1.15;
            border-radius: calc(var(--card) * 0.15);
            background:
                radial-gradient(circle at 22% 20%, rgba(255,255,255,0.85) 0 10%, transparent 11%),
                radial-gradient(circle at 82% 84%, rgba(255,255,255,0.6) 0 7%, transparent 8%),
                var(--plate, #FFF1DC);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--card) * 0.44);
            line-height: 1;
        }
        .card-pic span { display: inline-block; animation: bob 2.8s ease-in-out infinite; }
        .card:nth-child(2n) .card-pic span { animation-delay: -0.9s; }
        .card:nth-child(3n) .card-pic span { animation-delay: -1.8s; }
        .card-word {
            font-family: 'Fredoka One', cursive;
            font-size: calc(var(--card) * 0.12);
            line-height: 1.1;
            color: var(--text);
            overflow-wrap: anywhere;
        }
        .card-word .first {
            color: var(--cd);
            font-size: 1.3em;
        }
        .card.in { animation: none; }
        .card.wrong-try { animation: wobble 0.45s ease-in-out; }
        .card.dim {
            opacity: 0.42;
            filter: saturate(0.35);
            transform: scale(0.92);
            pointer-events: none;
            box-shadow: 0 3px 0 #EADFD3;
        }
        .card.right {
            transform: translateY(-10px) scale(1.06);
            box-shadow: 0 10px 0 var(--cd), 0 22px 34px rgba(80,50,30,0.16);
        }
        .card.right .card-pic span { animation: hop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .choices.done .card:not(.right) { opacity: 0.42; filter: saturate(0.35); transform: scale(0.92); }

        .flyer {
            position: fixed;
            z-index: 110;
            pointer-events: none;
            line-height: 1;
            transform: translate(-50%, -50%);
        }

        .cheer {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 120;
            transform: translate(-50%, -50%) scale(0);
            padding: 22px 34px;
            border-radius: 36px;
            background: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #FF7A3D;
            white-space: nowrap;
            box-shadow: 0 10px 0 #FF7A3D, 0 24px 50px rgba(0,0,0,0.18);
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cheer.show { transform: translate(-50%, -50%) scale(1); }

        @keyframes popUp {
            from { opacity: 0; transform: translateY(24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(3deg); }
        }
        @keyframes hop {
            0% { transform: scale(1); }
            40% { transform: scale(1.3) translateY(-10px) rotate(-8deg); }
            100% { transform: scale(1); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-7deg); }
            40% { transform: rotate(6deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(2deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .sky span, .block, .title-blocks .block.idle, .card-pic span { animation: none !important; }
        }

        /* 📱 PHONES */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 0.95rem; }
            .title-blocks { gap: 10px; margin-bottom: 20px; }
            .title-blocks .block { --size: 84px; }
            .start-btn { font-size: 1.3rem; padding: 16px 20px; }
            .start-btn.secondary { font-size: 1.1rem; }
            .start-btn.choose { font-size: 1.05rem; }
            .level-picker h2 { font-size: 1.8rem; }
            .level-grid { grid-template-columns: repeat(3, minmax(0, 100px)); gap: 16px 14px; }
            .tile-num { font-size: 2.3rem; }
            .tile-cards i { width: 10px; height: 12px; }

            #game-screen { padding: 124px 12px 20px; }
            .hud { gap: 6px; padding: 5px 10px 5px 5px; left: auto; right: max(12px, env(safe-area-inset-right)); transform: none; top: calc(max(14px, env(safe-area-inset-top)) + 58px); }
            .level-badge { font-size: 0.9rem; padding: 4px 10px; }
            .stars { font-size: 1.1rem; gap: 1px; }
            .stage { gap: 18px; }
            .letter-side { gap: 18px; }
            .stage .block { --size: 132px; }
            .prompt { font-size: 1.2rem; padding: 6px 6px 6px 16px; }

            .stage .block { --size: 108px; }
            .title-blocks .block { --size: 70px; }
            .start-buttons { margin-top: 20px; gap: 14px; }

        /* 📐 SHORT LANDSCAPE SCREENS */
        @media (orientation: landscape) and (max-height: 600px) {
            .screen { padding: 12px 16px 14px 84px; }
            h1 { font-size: 1.9rem; text-shadow: 0 3px 0 #fff; }

            #game-screen { padding: 12px 16px 12px 84px; }
            .hud { top: auto; bottom: max(10px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); right: auto; transform: none; flex-direction: column; padding: 6px; gap: 6px; border-radius: 26px; }

<body>
    <div class="sky" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span></div>

    <!-- START -->

    <div class="cheer" id="cheer" aria-live="polite"></div>

    <script>
        const lang = window.BabyLang;
        const NBSP = ' ';

        /* Separate data per language - words start with the correct letter */
        const DATA = {
          en: [

          ],
          fr: [
            { L:'A', items:[{e:'✈️',w:'Avion',art:"l'"},{e:'🐝',w:'Abeille',art:"l'"}] },
            { L:'B', items:[{e:'🐋',w:'Baleine',art:'la '},{e:'🍌',w:'Banane',art:'la '}] },
            { L:'C', items:[{e:'🐱',w:'Chat',art:'le '},{e:'🦆',w:'Canard',art:'le '}] },
            { L:'D', items:[{e:'🐬',w:'Dauphin',art:'le '},{e:'🦕',w:'Dinosaure',art:'le '}] },
            { L:'E', items:[{e:'🐘',w:'Éléphant',art:"l'"},{e:'⭐',w:'Étoile',art:"l'"}] },
            { L:'F', items:[{e:'🌸',w:'Fleur',art:'la '},{e:'🍓',w:'Fraise',art:'la '}] },

            { L:'H', items:[{e:'🦉',w:'Hibou',art:'le '},{e:'🦔',w:'Hérisson',art:'le '}] },
            { L:'I', items:[{e:'🏝️',w:'Île',art:"l'"},{e:'🧊',w:'Igloo',art:"l'"}] },
            { L:'J', items:[{e:'🧃',w:'Jus',art:'le '},{e:'🧸',w:'Jouet',art:'le '}] },
            { L:'K', items:[{e:'🦘',w:'Kangourou',art:'le '},{e:'🐨',w:'Koala',art:'le '}] },
            { L:'L', items:[{e:'🦁',w:'Lion',art:'le '},{e:'🌙',w:'Lune',art:'la '},{e:'🐰',w:'Lapin',art:'le '}] },
            { L:'M', items:[{e:'🏠',w:'Maison',art:'la '},{e:'🐑',w:'Mouton',art:'le '}] },
            { L:'N', items:[{e:'👃',w:'Nez',art:'le '},{e:'🪹',w:'Nid',art:'le '}] },
            { L:'O', items:[{e:'🍊',w:'Orange',art:"l'"},{e:'🐻',w:'Ours',art:"l'"}] },
            { L:'P', items:[{e:'🦋',w:'Papillon',art:'le '},{e:'🍎',w:'Pomme',art:'la '}] },
            { L:'Q', items:[{e:'4️⃣',w:'Quatre',art:'le '}] },
            { L:'R', items:[{e:'🍇',w:'Raisin',art:'le '},{e:'🤖',w:'Robot',art:'le '}] },
            { L:'S', items:[{e:'☀️',w:'Soleil',art:'le '},{e:'🐍',w:'Serpent',art:'le '}] },
            { L:'T', items:[{e:'🚂',w:'Train',art:'le '},{e:'🐢',w:'Tortue',art:'la '}] },
            { L:'U', items:[{e:'1️⃣',w:'Un',art:''},{e:'🏭',w:'Usine',art:"l'"}] },
            { L:'V', items:[{e:'🚗',w:'Voiture',art:'la '},{e:'🐄',w:'Vache',art:'la '}] },
            { L:'W', items:[{e:'🚃',w:'Wagon',art:'le '}] },
            { L:'X', items:[{e:'🎵',w:'Xylophone',art:'le '}] },
            { L:'Y', items:[{e:'🥛',w:'Yaourt',art:'le '},{e:'🪀',w:'Yo-yo',art:'le '}] },
            { L:'Z', items:[{e:'🦓',w:'Zèbre',art:'le '},{e:'0️⃣',w:'Zéro',art:'le '}] }
          ]
        };

        // Each letter keeps its own colour; the deep tone is also used for the first letter of its words.
        const PALETTE = [
            ['#FF5A5F', '#C9303A'], ['#FF9A2E', '#C9600A'], ['#3FBF62', '#1F8A3E'], ['#3D9BF0', '#1D6FC4'],
            ['#9B6CF0', '#6A3FD1'], ['#FF7DB8', '#C93F86'], ['#2EC4B6', '#0E857A']
        ];
        const letterColor = letter => PALETTE[(letter.charCodeAt(0) - 65) % PALETTE.length];
        const PLATES = ['#FFF1DC', '#E3F6E8', '#E2F0FF', '#EFE7FF', '#FFE6F1', '#E0F7F4'];

        // Levels like the puzzles game: the number of pictures to choose from grows slowly.
        const LEVEL_CARDS = [2, 2, 3, 3, 4, 4, 5, 6];
        const LEVEL_COUNT = LEVEL_CARDS.length;
        const ROUNDS_PER_LEVEL = 5;
        const LEVEL_TILES = [
            ['#FF7A7A', '#E05555'], ['#FF9F2E', '#E07F10'], ['#4CC26A', '#2F9E4C'], ['#2EC4B6', '#1E9C90'],
            ['#4DA3F2', '#2B7FCC'], ['#8C6CF0', '#6A4BD1'], ['#F06CB4', '#D04A93'], ['#FF7A7A', '#E05555']
        ];

        // --- SAVED PROGRESS ---
        const LEVEL_KEY = 'abc-level';
        const CLEARED_KEY = 'abc-cleared';
        let level = 0;
        let cleared = 0;
        function loadProgress() {
            try {
                const savedLevel = localStorage.getItem(LEVEL_KEY);
                if (savedLevel === null && localStorage.getItem('abc-max-difficulty') !== null) {
                    // Old version: 4 levels of 3, 4, 5 and 6 choices.
                    const oldMax = Math.min(3, Math.max(0, parseInt(localStorage.getItem('abc-max-difficulty'), 10) || 0));
                    cleared = [0, 4, 6, 7][oldMax];
                    level = cleared;
                    ['abc-lang', 'abc-max-difficulty', 'abc-current-difficulty', 'abc-correct-answers'].forEach(k => localStorage.removeItem(k));
                    saveProgress();
                    return;
                }
                const l = parseInt(savedLevel, 10);
                const c = parseInt(localStorage.getItem(CLEARED_KEY), 10);
                if (l >= 0 && l < LEVEL_COUNT) level = l;
                if (c >= 0 && c <= LEVEL_COUNT) cleared = c;
            } catch (error) { /* start fresh */ }
        }
        function saveProgress() {
            try {
                localStorage.setItem(LEVEL_KEY, String(level));
                localStorage.setItem(CLEARED_KEY, String(cleared));
            } catch (error) { /* optional */ }
        }
        loadProgress();

        const els = {
            start: document.getElementById('start-screen'),
            startMain: document.getElementById('start-main'),
            titleBlocks: document.getElementById('title-blocks'),
            continueBtn: document.getElementById('continue-btn'),
            continueLevel: document.getElementById('continue-level'),
            playBtn: document.getElementById('play-btn'),
            chooseBtn: document.getElementById('choose-btn'),
            picker: document.getElementById('level-picker'),
            levelGrid: document.getElementById('level-grid'),
            game: document.getElementById('game-screen'),
            hud: document.getElementById('hud'),
            back: document.getElementById('back-btn'),
            badge: document.getElementById('level-badge'),
            stars: document.getElementById('stars'),
            block: document.getElementById('letter-block'),
            letter: document.getElementById('letter'),
            friend: document.getElementById('letter-friend'),
            prompt: document.getElementById('prompt'),
            promptText: document.getElementById('prompt-text'),
            choices: document.getElementById('choices'),
            cheer: document.getElementById('cheer')
        };

        // --- SOUND ---
        let audioCtx = null;
        function note(freq, at = 0, dur = 0.35, vol = 0.2, type = 'sine') {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const start = audioCtx.currentTime + at;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + dur + 0.02);
            } catch (error) { /* audio is optional */ }
        }
        // Jelly "boing": a note bending up.
        function boing(freq) {
            try {
                note(freq, 0, 0.35, 0.2);
                const start = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq / 2, start);
                osc.frequency.exponentialRampToValueAtTime(freq, start + 0.12);
                gain.gain.setValueAtTime(0.12, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.2);
            } catch (error) { /* audio is optional */ }
        }
        const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        const letterNote = letter => PENTATONIC[(letter.charCodeAt(0) - 65) % PENTATONIC.length];
        const cheerSound = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, i * 0.08, 0.3, 0.16));
        const whoosh = () => [0, 0.05, 0.1, 0.15, 0.2].forEach((at, i) => note(500 + i * 120, at, 0.12, 0.06, 'triangle'));
        const oopsSound = () => note(196, 0, 0.18, 0.14, 'triangle');
        const speak = (en, fr) => lang.speak(en, fr, { pitch: 1.15, rate: 0.92 });

        function bounce(el, cls) {
            el.classList.remove('squish', 'wobble', 'wrong-try', 'drop-in');
            void el.offsetWidth;
            el.classList.add(cls);
            el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
        }

        // --- SCREENS ---
        let roundTimer = null;
        let speakTimer = null;
        function show(screen) {
            els.start.hidden = screen !== els.start;
            els.game.hidden = screen !== els.game;
            els.hud.hidden = screen !== els.game;
            els.back.hidden = screen === els.start;
            window.scrollTo(0, 0);
            if (screen !== els.game) {
                clearTimeout(roundTimer);
                clearTimeout(speakTimer);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        const levelLabel = n => lang.t(`Level ${n + 1}`, `Niveau ${n + 1}`);

        function setBlock(block, letter) {
            const [c, cd] = letterColor(letter);
            block.style.setProperty('--c', c);
            block.style.setProperty('--cd', cd);
        }

        function renderTitleBlocks() {
            els.titleBlocks.innerHTML = ['A', 'B', 'C'].map(L =>
                `<button type="button" class="block" data-letter="${L}" aria-label="${L}"><span class="block-letter">${L}</span></button>`).join('');
            els.titleBlocks.querySelectorAll('.block').forEach(block => {
                setBlock(block, block.dataset.letter);
                block.addEventListener('animationend', () => block.classList.add('idle'), { once: true });
            });
        }
        els.titleBlocks.addEventListener('click', event => {
            const block = event.target.closest('.block');
            if (!block) return;
            const L = block.dataset.letter;
            bounce(block, 'squish');
            boing(letterNote(L));
            speak(L, L);
            const r = block.getBoundingClientRect();
            createExplosion(r.left + r.width / 2, r.top + r.height / 2, letterColor(L)[0], 14);
        });

        function showStart() {
            const hasProgress = level > 0 || cleared > 0;
            els.continueBtn.hidden = !hasProgress;
            els.continueLevel.textContent = levelLabel(level);
            // With saved progress the second button starts over; otherwise it is the only "Play" button.
            els.playBtn.classList.toggle('secondary', hasProgress);
            els.playBtn.dataset.en = hasProgress ? '⭐ Start from the beginning' : '▶ Play!';
            els.playBtn.dataset.fr = hasProgress ? '⭐ Recommencer au début' : `▶ Jouer${NBSP}!`;
            els.chooseBtn.classList.toggle('locked', cleared === 0);
            els.chooseBtn.setAttribute('aria-disabled', String(cleared === 0));
            closePicker();
            lang.apply(els.start);
            show(els.start);
        }

        function renderPicker() {
            let html = '';
            for (let n = 0; n < LEVEL_COUNT; n++) {
                const open = n <= cleared;
                const cards = LEVEL_CARDS[n];
                const [c, cd] = LEVEL_TILES[n];
                const detail = lang.t(`${cards} pictures`, `${cards} images`);
                const label = `${levelLabel(n)}, ${detail}${open ? '' : ', ' + lang.t('locked', 'verrouillé')}`;
                html += `<button type="button" class="level-tile${open ? '' : ' locked'}" data-level="${n}"
                        aria-label="${label}" style="--c: ${c}; --cd: ${cd}; animation-delay: ${n * 0.04}s">
                    <span class="tile-num">${n + 1}</span>
                    <span class="tile-cards" aria-hidden="true">${'<i></i>'.repeat(cards)}</span>
                    ${open ? '' : '<span class="tile-lock" aria-hidden="true">🔒</span>'}
                </button>`;
            }
            els.levelGrid.innerHTML = html;
        }

        function openPicker() {
            if (cleared === 0) {
                bounce(els.chooseBtn, 'wobble');
                oopsSound();
                speak('Finish level 1 first!', `Termine le niveau 1 d'abord${NBSP}!`);
                return;
            }
            renderPicker();
            els.startMain.hidden = true;
            els.picker.hidden = false;
            window.scrollTo(0, 0);
            const latest = els.levelGrid.querySelector(`[data-level="${Math.min(cleared, LEVEL_COUNT - 1)}"]`);
            if (latest) latest.focus({ preventScroll: true });
        }

        function closePicker() {
            els.picker.hidden = true;
            els.startMain.hidden = false;
        }

        els.levelGrid.addEventListener('click', event => {
            const tile = event.target.closest('.level-tile');
            if (!tile) return;
            if (tile.classList.contains('locked')) {
                bounce(tile, 'wobble');
                oopsSound();
                return;
            }
            startGame(Number(tile.dataset.level));
        });

        // --- 🔤 GAME ---
        let roundsWon = 0;
        let target = null;
        let targetLetter = null;
        let recentLetters = [];
        let locked = true;

        const letters = () => DATA[lang.lang];
        const article = item => item.art || '';

        function startGame(n) {
            level = n;
            roundsWon = 0;
            saveProgress();
            show(els.game);
            boing(523.25);
            newRound();
        }

        function pickLetter() {
            const data = letters();
            const weights = data.map(d => (recentLetters.includes(d.L) ? 0.05 : 1));
            let r = Math.random() * weights.reduce((a, b) => a + b, 0);
            for (let i = 0; i < data.length; i++) {
                r -= weights[i];
                if (r <= 0) return data[i];
            }
            return data[data.length - 1];
        }

        const shuffle = list => list.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
        const pickItem = entry => entry.items[Math.floor(Math.random() * entry.items.length)];

        function wordHtml(word) {
            const first = [...word][0];
            return `<span class="first">${first}</span>${word.slice(first.length)}`;
        }

        function renderHud() {
            els.badge.textContent = levelLabel(level);
            els.stars.innerHTML = Array.from({ length: ROUNDS_PER_LEVEL }, (_, i) =>
                `<span class="${i < roundsWon ? '' : 'off'}">⭐</span>`).join('');
        }

        function renderPrompt() {
            if (!target) return;
            els.promptText.innerHTML = lang.t(`Find the ${wordHtml(target.w)}`, `Trouve ${article(target)}${wordHtml(target.w)}`);
            els.block.setAttribute('aria-label', lang.t(`Letter ${targetLetter.L}`, `Lettre ${targetLetter.L}`));
        }

        function sayPrompt() {
            const L = targetLetter.L;
            const w = target.w;
            speak(`${L} is for ${w}. Can you find the ${w.toLowerCase()}?`,
                `${L} comme ${w}. Peux-tu trouver ${article(target)}${w.toLowerCase()}${NBSP}?`);
        }

        function newRound() {
            clearTimeout(roundTimer);
            clearTimeout(speakTimer);
            locked = false;
            const data = letters();
            targetLetter = pickLetter();
            recentLetters.push(targetLetter.L);
            if (recentLetters.length > 8) recentLetters.shift();
            target = pickItem(targetLetter);

            const count = LEVEL_CARDS[level];
            const others = shuffle(data.filter(d => d.L !== targetLetter.L)).slice(0, count - 1).map(pickItem);
            const choices = shuffle([target, ...others]);

            setBlock(els.block, targetLetter.L);
            els.prompt.style.setProperty('--cd', letterColor(targetLetter.L)[1]);
            els.letter.textContent = targetLetter.L;
            els.friend.classList.remove('show');
            bounce(els.block, 'drop-in');
            document.documentElement.style.setProperty('--tint', `color-mix(in srgb, ${letterColor(targetLetter.L)[0]} 22%, #FFFBF2)`);

            els.choices.className = `choices n${count}`;
            els.choices.innerHTML = '';
            const plates = shuffle(PLATES);
            choices.forEach((item, i) => {
                const owner = data.find(d => d.items.includes(item));
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'card';
                btn.style.animationDelay = `${0.15 + i * 0.06}s`;
                btn.style.setProperty('--cd', letterColor(owner.L)[1]);
                btn.style.setProperty('--plate', plates[i % plates.length]);
                btn.setAttribute('aria-label', item.w);
                btn.innerHTML = `<span class="card-pic" aria-hidden="true"><span>${item.e}</span></span>
                    <span class="card-word" aria-hidden="true">${wordHtml(item.w)}</span>`;
                btn._item = item;
                // Once it has popped in, drop the entrance so state styles (dim, right) can take over.
                btn.addEventListener('animationend', () => btn.classList.add('in'), { once: true });
                els.choices.appendChild(btn);
            });

            renderHud();
            renderPrompt();
            speakTimer = setTimeout(sayPrompt, 450);
        }

        // The right picture jumps from its card onto the letter block.
        function flyToBlock(card) {
            const from = card.querySelector('.card-pic span').getBoundingClientRect();
            const to = els.friend.getBoundingClientRect();
            const flyer = document.createElement('div');
            flyer.className = 'flyer';
            flyer.textContent = target.e;
            flyer.style.left = `${from.left + from.width / 2}px`;
            flyer.style.top = `${from.top + from.height / 2}px`;
            flyer.style.fontSize = getComputedStyle(card.querySelector('.card-pic')).fontSize;
            document.body.appendChild(flyer);
            const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
            const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
            const endScale = parseFloat(getComputedStyle(els.friend).fontSize) / parseFloat(flyer.style.fontSize);
            const animation = flyer.animate([
                { transform: 'translate(-50%, -50%) scale(1) rotate(0)' },
                { transform: `translate(calc(-50% + ${dx * 0.5}px), calc(-50% + ${dy * 0.5 - 90}px)) scale(1.35) rotate(-14deg)`, offset: 0.45 },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${endScale}) rotate(8deg)` }
            ], { duration: 650, easing: 'cubic-bezier(0.45, 0, 0.2, 1)', fill: 'forwards' });
            whoosh();
            animation.onfinish = () => {
                flyer.remove();
                els.friend.textContent = target.e;
                els.friend.classList.add('show');
                bounce(els.block, 'squish');
                boing(letterNote(targetLetter.L));
                const r = els.block.getBoundingClientRect();
                createExplosion(r.left + r.width / 2, r.top + r.height / 2, letterColor(targetLetter.L)[0], 30);
            };
        }

        els.choices.addEventListener('click', event => {
            const card = event.target.closest('.card');
            if (!card || locked) return;
            const item = card._item;
            if (item !== target) {
                bounce(card, 'wrong-try');
                oopsSound();
                speak(item.w, `${article(item)}${item.w.toLowerCase()}`);
                setTimeout(() => card.classList.add('dim'), 450);
                return;
            }

            locked = true;
            card.classList.add('right');
            els.choices.classList.add('done');
            cheerSound();
            const pic = card.querySelector('.card-pic').getBoundingClientRect();
            createExplosion(pic.left + pic.width / 2, pic.top + pic.height / 2, letterColor(targetLetter.L)[0], 24);
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) {
                els.friend.textContent = target.e;
                els.friend.classList.add('show');
            } else {
                setTimeout(() => flyToBlock(card), 250);
            }

            roundsWon++;
            renderHud();
            const star = els.stars.children[roundsWon - 1];
            if (star) { star.classList.add('pop'); setTimeout(() => star.classList.remove('pop'), 350); }

            const L = targetLetter.L;
            const w = target.w;
            let delay = 2600;
            if (roundsWon >= ROUNDS_PER_LEVEL) {
                roundsWon = 0;
                cleared = Math.max(cleared, level + 1);
                if (level < LEVEL_COUNT - 1) level++;
                saveProgress();
                speak(`Yes! ${L} is for ${w}! Super! Level ${level + 1}!`,
                    `Oui${NBSP}! ${L} comme ${w}${NBSP}! Super${NBSP}! Niveau ${level + 1}${NBSP}!`);
                setTimeout(() => {
                    showCheer(lang.t(`⭐ Super! ${levelLabel(level)}`, `⭐ Super${NBSP}! ${levelLabel(level)}`), 1900);
                    cheerSound();
                    setTimeout(cheerSound, 350);
                    const r = els.cheer.getBoundingClientRect();
                    createExplosion(r.left + r.width / 2, r.top + r.height / 2, '#FFC93B', 40);
                }, 1300);
                delay = 4000;
            } else {
                speak(`Yes! ${L} is for ${w}!`, `Oui${NBSP}! ${L} comme ${w}${NBSP}!`);
            }
            roundTimer = setTimeout(newRound, delay);
        });

        els.block.addEventListener('click', () => {
            if (!targetLetter) return;
            bounce(els.block, 'squish');
            boing(letterNote(targetLetter.L));
            speak(`${targetLetter.L}. ${targetLetter.L} is for ${target.w}.`, `${targetLetter.L}. ${targetLetter.L} comme ${target.w}.`);
        });

        document.getElementById('say-again').addEventListener('click', () => target && sayPrompt());

        function showCheer(text, ms) {
            els.cheer.textContent = text;
            els.cheer.classList.add('show');
            setTimeout(() => els.cheer.classList.remove('show'), ms);
        }

        // --- NAVIGATION ---
        els.continueBtn.addEventListener('click', () => startGame(level));
        els.playBtn.addEventListener('click', () => startGame(0));
        els.chooseBtn.addEventListener('click', openPicker);
        document.getElementById('picker-back').addEventListener('click', closePicker);
        els.back.addEventListener('click', showStart);

        lang.mountToggle();
        lang.onChange(() => {
            if (!els.start.hidden) {
                els.continueLevel.textContent = levelLabel(level);
                if (!els.picker.hidden) renderPicker();
            } else if (!locked) {
                // Words differ per language, so start a fresh round in the new language.
                newRound();
            } else {
                renderHud();
            }
        });

        // --- ✨ PARTICLES ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: Math.random() * -8 - 1,
                    size: Math.random() * 8 + 4,
                    life: 1,
                    color: Math.random() > 0.75 ? '#FFFFFF' : color,
                    star: Math.random() > 0.6
                });
            }
        }

        function drawStar(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.life * 6);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * p.size, -Math.sin((18 + i * 72) * Math.PI / 180) * p.size);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * p.size / 2.2, -Math.sin((54 + i * 72) * Math.PI / 180) * p.size / 2.2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                if (p.star) {
                    drawStar(p);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateParticles();
        renderTitleBlocks();
        showStart();
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    </script>
</body>
</html>
