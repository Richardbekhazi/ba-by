<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Plant seeds, water them, bring out the sun, and grow a cheerful toddler garden. No timers or losing.">
    <title>My Tiny Garden - ba-by.ca</title>
    <link rel="stylesheet" href="/assets/css/toddler-play.css">
    <script type="module" src="/assets/js/tiny-garden.js"></script>
</head>
<body data-game="garden">
    <nav class="topbar" aria-label="Game settings">
        <a class="home" href="/" aria-label="Back to games">🏠</a>
        <div class="settings">
            <button type="button" data-language="en" aria-label="English" aria-pressed="true">EN</button>
            <button type="button" data-language="fr" aria-label="Français" aria-pressed="false">FR</button>
            <button type="button" id="sound" aria-label="Sound on" aria-pressed="true">🔊</button>
            <button type="button" id="help" aria-label="Hear instructions">💬</button>
        </div>
    </nav>
    <main class="game">
        <header class="heading"><h1 id="title">My Tiny Garden</h1><p id="instruction">Choose a seed to plant!</p></header>
        <div id="stage" class="stage" role="img" aria-label="Your little garden"></div>
        <ol id="steps" class="steps" aria-label="Growing steps"></ol>
        <div id="controls" class="toolbar" aria-label="Garden tools"></div>
        <div id="palette" class="palette" aria-label="Seeds"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <noscript>Please enable JavaScript to play.</noscript>
    </main>
</body>
</html>
