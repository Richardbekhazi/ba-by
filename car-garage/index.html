<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Wash, paint, and decorate a happy toy car, then drive through meadows, beaches, and starry nights. Big touch controls and no racing or losing for toddlers.">
    <title>Little Car Garage - ba-by.ca</title>
    <link rel="stylesheet" href="/assets/css/toddler-play.css?v=20261028-lang">
    <link rel="stylesheet" href="/assets/css/car-garage.css?v=20261028-lang">
    <script defer src="/assets/js/toddler-loader.js?v=20261028-lang"></script>
</head>
<body data-game="garage">
    <nav class="topbar" aria-label="Game settings">
        <a class="home" href="/" aria-label="Back to games"><svg class="nav-icon" width="32" height="32" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect x="31" y="7" width="6" height="11" rx="2" fill="#E04B4B"/><rect x="10" y="21" width="28" height="21" rx="6" fill="#FFC93C"/><path d="M7 24 L24 9 L41 24" fill="none" stroke="#FF5A5F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 42 V33 a4.5 4.5 0 0 1 9 0 V42 Z" fill="#8C6CF0"/><rect x="29" y="27" width="6" height="6" rx="2" fill="#7CCBFF"/><rect x="13" y="27" width="5" height="5" rx="2" fill="#fff" opacity="0.7"/></svg></a>
        <div class="settings">
            <button type="button" data-language="en" aria-label="English" aria-pressed="true">EN</button>
            <button type="button" data-language="fr" aria-label="Français" aria-pressed="false">FR</button>
            <button type="button" id="sound" aria-label="Sound on" aria-pressed="true">🔊</button>
            <button type="button" id="help" aria-label="Hear instructions">💬</button>
        </div>
    </nav>
    <main class="game">
        <div id="game-loading" role="status" aria-live="polite" style="padding:16px;text-align:center;background:white;color:#31415a;border-radius:16px">
            <p id="loading-detail">Opening your game... / Le jeu arrive...</p>
            <button type="button" style="min-height:48px;padding:12px" onclick="var url = new window.URL(location.href); url.searchParams.set('reload', Date.now()); location.replace(url.href);">Reload game / Recharger</button>
        </div>
        <header class="heading"><h1 id="title">Little Car Garage</h1><p id="instruction">Wash, paint, decorate, and drive!</p></header>
        <div id="stage" class="stage rub-area" tabindex="0" role="group" aria-label="Toy car. Rub to wash it."></div>
        <div id="palette" class="palette" aria-label="Car colors"></div>
        <div id="controls" class="toolbar" aria-label="Garage tools"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <noscript>Please enable JavaScript to play.</noscript>
    </main>
</body>
</html>
