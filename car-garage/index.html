<!DOCTYPE html>
<html lang="en" data-title-fr="Petit garage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Wash a car, bus or truck, fix its wheels, paint it and go for a drive. Gentle play with no timers or losing.">
    <title>Little Car Garage</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #FFEBD6; }
        .steps { display: flex; gap: 8px; }
        .step { width: 58px; height: 58px; border-radius: 20px; display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,0.6); box-shadow: 0 4px 0 rgba(61,53,81,0.1); position: relative; }
        .step.now { background: #fff; box-shadow: 0 4px 0 var(--orange-d), 0 0 0 4px var(--orange); transform: scale(1.08); }
        .step.done::after { content: '✓'; position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; font: 400 14px/24px 'Fredoka One', system-ui; text-align: center; }
        .stage { position: relative; width: 100%; max-width: min(820px, calc((100vh - 300px) * 1.55)); max-width: min(820px, calc((100dvh - 300px) * 1.55)); min-width: min(100%, 300px); border-radius: 34px; overflow: hidden; touch-action: none; box-shadow: 0 10px 0 rgba(61,53,81,0.1);
            background: linear-gradient(180deg, #E9E4F6 0%, #F7F3FF 66%, #B9B2CC 66%, #A39BBA 100%); }
        .stage.road { background: linear-gradient(180deg, var(--sky1, #8ED6FF) 0%, var(--sky2, #DDF3FF) 52%, #8FD27A 52%, #78C062 64%, #5C5F73 64%, #4A4D60 100%); }
        .stage.road.night { --sky1: #121A44; --sky2: #3B3F7A; }
        .stage svg.vehicle { position: relative; z-index: 2; display: block; width: 100%; height: auto; }
        .scenery { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .lane { position: absolute; left: 0; width: 200%; display: flex; justify-content: space-around; animation: roll var(--t, 6s) linear infinite; }
        .lane span { font-size: var(--s, 48px); line-height: 1; }
        .lane.stripes { bottom: 15%; height: 8px; background: repeating-linear-gradient(90deg, #fff 0 60px, transparent 60px 130px); opacity: 0.85; }
        @keyframes roll { to { transform: translateX(-50%); } }
        .stage.road svg.vehicle { width: 70%; margin: 9% auto 2%; animation: drive-bump 0.5s ease-in-out infinite; }
        .stage.road .wheel { animation: spin 0.6s linear infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes drive-bump { 50% { transform: translateY(-1.2%); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .vehicle.hop { animation: hop 0.6s cubic-bezier(0.34,1.56,0.64,1) !important; }
        @keyframes hop { 40% { transform: translateY(-14%) rotate(-3deg); } }
        .wheel.loose { animation: loose 0.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; cursor: pointer; }
        @keyframes loose { 25% { transform: rotate(-12deg) translateY(-2px); } 75% { transform: rotate(12deg) translateY(2px); } }
        .beam { opacity: 0; transition: opacity 0.3s; }
        .lights-on .beam { opacity: 0.85; }
        .tool-cursor { position: absolute; z-index: 4; font-size: 64px; line-height: 1; pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg); filter: drop-shadow(0 6px 4px rgba(61,53,81,0.25)); }
        .tool-cursor.idle { opacity: 0; }
        .rubbing .tool-cursor { animation: scrub 0.25s ease-in-out infinite alternate; }
        @keyframes scrub { to { transform: translate(-46%, -54%) rotate(10deg); } }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .swatch { width: 60px; height: 60px; border-radius: 50%; border: 5px solid #fff; background: var(--c); box-shadow: 0 5px 0 rgba(61,53,81,0.15); }
        .swatch[aria-pressed="true"] { box-shadow: 0 0 0 5px var(--ink), 0 5px 0 rgba(61,53,81,0.15); }
        .sticker { width: 64px; height: 64px; border: 0; border-radius: 22px; background: #fff; font-size: 34px; box-shadow: 0 5px 0 rgba(61,53,81,0.12); }
        .sticker[aria-pressed="true"] { box-shadow: 0 5px 0 var(--pink-d), 0 0 0 4px var(--pink); }
        .shine { animation: shine 1.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
        @keyframes shine { 0% { opacity: 0; transform: scale(0.2); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4) rotate(40deg); } }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <h1 class="kit-title" style="--title-shadow:#FF9F43"><span class="bob" data-fr="Petit">Little</span> <span class="bob" style="animation-delay:-1.3s" data-fr="garage">Garage</span></h1>
        <p class="kit-sub" data-fr="Lave, répare, peins… et en route !">Wash, fix, paint… and off we go!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" data-v="car" style="--c:#FF5A5F"><span class="kit-mode-art"><span>🚗</span></span><span class="kit-mode-label"><b data-fr="Auto">Car</b><small data-fr="Petite et rapide">Small and zippy</small></span></button>
            <button class="kit-mode" type="button" data-v="bus" style="--c:#FFB627"><span class="kit-mode-art"><span>🚌</span></span><span class="kit-mode-label"><b data-fr="Autobus">Bus</b><small data-fr="Plein d'amis">Full of friends</small></span></button>
            <button class="kit-mode" type="button" data-v="truck" style="--c:#4FB8FF"><span class="kit-mode-art"><span>🚚</span></span><span class="kit-mode-label"><b data-fr="Camion">Truck</b><small data-fr="Gros et fort">Big and strong</small></span></button>
        </div>
    </main>

    <main class="kit-screen" id="garage" hidden>
        <div class="steps" id="steps"></div>
        <div class="kit-prompt"><span id="prompt"></span><button type="button" class="kit-say" id="say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="stage" id="stage" tabindex="0" role="button" aria-label="Garage" data-fr-aria-label="Garage"><div class="scenery" id="scenery"></div><div class="tool-cursor idle" id="cursor"></div></div>
        <div class="controls" id="controls"></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const NS = 'http://www.w3.org/2000/svg';
        const PAINTS = [['#FF5A5F', 'Red', 'Rouge'], ['#FF9A2E', 'Orange', 'Orange'], ['#FFC93B', 'Yellow', 'Jaune'], ['#4CC26A', 'Green', 'Vert'], ['#3D9BF0', 'Blue', 'Bleu'], ['#9B6CF0', 'Purple', 'Violet'], ['#FF8FC4', 'Pink', 'Rose']];
        const STICKERS = [{ id: 'star', e: '⭐' }, { id: 'heart', e: '💖' }, { id: 'flame', e: '🔥' }, { id: 'bolt', e: '⚡' }];
        const VEHICLES = {
            car: { color: '#FF5A5F', name: ['car', "l'auto"], wheels: [[118, 206], [290, 206]], stickerAt: [200, 150],
                body: '<path class="paint" d="M40 196 Q40 150 80 146 L120 140 Q150 92 210 90 Q262 90 292 140 L338 148 Q366 154 366 196 Z"/><path d="M134 140 Q160 104 206 102 L206 140 Z M220 102 Q258 104 280 140 L220 140 Z" fill="#CDEBFF" stroke="#3D3551" stroke-width="5" stroke-linejoin="round"/>',
                light: [360, 166] },
            bus: { color: '#FFC93B', name: ['bus', "l'autobus"], wheels: [[96, 210], [304, 210]], stickerAt: [200, 168],
                body: '<rect class="paint" x="26" y="70" width="350" height="130" rx="26"/>' + [0, 1, 2, 3].map(i => `<rect x="${48 + i * 70}" y="88" width="56" height="44" rx="10" fill="#CDEBFF" stroke="#3D3551" stroke-width="5"/>`).join('') + '<rect x="330" y="88" width="34" height="80" rx="8" fill="#CDEBFF" stroke="#3D3551" stroke-width="5"/>'
                    + '<text x="76" y="122" font-size="28" stroke="none">🐻</text><text x="146" y="122" font-size="28" stroke="none">🐰</text><text x="216" y="122" font-size="28" stroke="none">🐱</text>',
                light: [372, 180] },
            truck: { color: '#3D9BF0', name: ['truck', 'le camion'], wheels: [[100, 210], [300, 210]], stickerAt: [140, 140],
                body: '<rect class="paint" x="22" y="64" width="232" height="136" rx="16"/><path class="paint" d="M260 200 V108 Q260 96 272 96 H322 Q340 96 350 114 L372 152 V200 Z"/><path d="M278 110 H318 Q330 110 336 122 L352 150 H278 Z" fill="#CDEBFF" stroke="#3D3551" stroke-width="5" stroke-linejoin="round"/>',
                light: [370, 180] }
        };

        function vehicleSVG(kind, color) {
            const v = VEHICLES[kind];
            const wheels = v.wheels.map(([x, y], i) => `<g class="wheel" data-w="${i}"><circle cx="${x}" cy="${y}" r="34" fill="#2D2A38"/><circle cx="${x}" cy="${y}" r="16" fill="#D6D2E2"/>
                <circle cx="${x}" cy="${y - 9}" r="3" fill="#8C86A0"/><circle cx="${x + 9}" cy="${y}" r="3" fill="#8C86A0"/><circle cx="${x}" cy="${y + 9}" r="3" fill="#8C86A0"/><circle cx="${x - 9}" cy="${y}" r="3" fill="#8C86A0"/></g>`).join('');
            return `<svg class="vehicle" viewBox="0 0 400 260" aria-hidden="true">
                <ellipse cx="200" cy="246" rx="170" ry="10" fill="rgba(0,0,0,0.15)"/>
                <path class="beam" d="M${v.light[0]} ${v.light[1] - 10} L420 ${v.light[1] - 40} L420 ${v.light[1] + 30} Z" fill="#FFF3A6"/>
                <g id="body" fill="${color}" stroke="#3D3551" stroke-width="6" stroke-linejoin="round">${v.body}</g>
                <circle cx="${v.light[0] - 6}" cy="${v.light[1]}" r="9" fill="#FFE27A" stroke="#3D3551" stroke-width="4"/>
                <g id="stickers"></g>${wheels}<g id="mud"></g><g id="sparkles"></g></svg>`;
        }

        const STEPS = [
            { id: 'wash', icon: '🧽', tool: '🧽', say: ['Rub off the mud!', `Frotte pour enlever la boue${NBSP}!`] },
            { id: 'fix', icon: '🔧', tool: '🔧', say: ['Tap the wobbly wheels to fix them!', `Touche les roues qui bougent pour les réparer${NBSP}!`] },
            { id: 'paint', icon: '🎨', tool: '', say: ['Pick a color and some stickers!', `Choisis une couleur et des autocollants${NBSP}!`] },
            { id: 'drive', icon: '🛣️', tool: '', say: ['Vroom! Time for a drive!', `Vroum${NBSP}! On part en promenade${NBSP}!`] }
        ];
        const start = $('#start'), garage = $('#garage');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#FFEBD6'); }

        let kind = 'car', color = '#FF5A5F', stepIndex = 0, items = [], fixes = [], stickers = new Set(), rubbing = null;
        const svgEl = () => $('#stage svg.vehicle');
        function add(parent, tag, attrs) { const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); parent.appendChild(el); return el; }
        function sparkle(x, y, n) {
            for (let i = 0; i < n; i++) {
                const t = add($('#sparkles'), 'text', { x: x + (Math.random() - 0.5) * 160, y: y + (Math.random() - 0.5) * 80, 'font-size': 26, class: 'shine', 'text-anchor': 'middle' });
                t.textContent = '✨';
                t.style.animationDelay = `${i * 0.1}s`;
                setTimeout(() => t.remove(), 1600 + i * 100);
            }
        }
        function renderVehicle() {
            $('#stage').querySelectorAll('svg.vehicle').forEach(s => s.remove());
            $('#stage').insertAdjacentHTML('beforeend', vehicleSVG(kind, color));
            renderStickers();
        }
        function renderStickers() {
            const g = $('#stickers');
            if (!g) return;
            g.innerHTML = '';
            const [sx, sy] = VEHICLES[kind].stickerAt;
            [...stickers].forEach((id, i) => { const t = add(g, 'text', { x: sx - 50 + i * 44, y: sy, 'font-size': 40, 'text-anchor': 'middle', 'dominant-baseline': 'middle' }); t.textContent = STICKERS.find(s => s.id === id).e; });
        }
        function renderSteps() {
            $('#steps').innerHTML = STEPS.map((s, i) => `<span class="step${i === stepIndex ? ' now' : i < stepIndex ? ' done' : ''}" aria-hidden="true">${s.icon}</span>`).join('');
            $('#prompt').textContent = T(...STEPS[stepIndex].say);
            $('#cursor').textContent = STEPS[stepIndex].tool;
            renderControls();
        }
        function renderControls() {
            const s = STEPS[stepIndex].id, c = $('#controls');
            if (s === 'paint') {
                c.innerHTML = PAINTS.map(([hex, en, fr]) => `<button type="button" class="swatch" data-c="${hex}" style="--c:${hex}" aria-label="${T(en, fr)}" aria-pressed="${hex === color}"></button>`).join('')
                    + STICKERS.map(st => `<button type="button" class="sticker" data-s="${st.id}" aria-pressed="${stickers.has(st.id)}" aria-label="${st.id}">${st.e}</button>`).join('')
                    + `<button type="button" class="kit-btn small" id="to-drive" style="--c:#4CC26A;--cd:#2F9E4C">${T('🛣️ Drive!', `🛣️ En route${NBSP}!`)}</button>`;
            } else if (s === 'drive') {
                c.innerHTML = `<button type="button" class="kit-btn small" id="honk" style="--c:#FFB627;--cd:#E08A00">${T('📯 Honk', '📯 Klaxon')}</button>
                    <button type="button" class="kit-btn small" id="lights" style="--c:#9B6CF0;--cd:#7B45D6">${T('💡 Lights', '💡 Phares')}</button>
                    <button type="button" class="kit-btn small" id="finish" style="--c:#4CC26A;--cd:#2F9E4C">${T('🏁 Back to the garage', '🏁 Retour au garage')}</button>`;
            } else c.innerHTML = '';
        }
        function sayStep() { say(...STEPS[stepIndex].say); }
        function goStep(i) {
            stepIndex = i;
            const s = STEPS[i].id;
            $('#stage').classList.toggle('road', s === 'drive');
            $('#stage').classList.remove('night', 'lights-on');
            $('#scenery').innerHTML = '';
            renderSteps();
            items = [];
            if (s === 'wash') {
                for (let k = 0; k < 10; k++) {
                    const x = 60 + Math.random() * 290, y = 100 + Math.random() * 90, r = 16 + Math.random() * 10;
                    const el = add($('#mud'), 'path', { d: `M${x - r} ${y} Q${x - r} ${y - r} ${x} ${y - r} Q${x + r + 6} ${y - r} ${x + r} ${y} Q${x + r} ${y + r} ${x} ${y + r} Q${x - r - 6} ${y + r} ${x - r} ${y} Z`, fill: k % 2 ? '#8B5E3C' : '#A47148' });
                    items.push({ x, y, el });
                }
            } else if (s === 'fix') {
                fixes = VEHICLES[kind].wheels.map(() => 0);
                svgEl().querySelectorAll('.wheel').forEach(w => w.classList.add('loose'));
            } else if (s === 'drive') {
                $('#scenery').innerHTML = `<div class="lane" style="top:6%;--t:24s;--s:46px"><span>☁️</span><span></span><span>☁️</span><span></span><span>☁️</span><span></span><span>☁️</span><span></span></div>
                    <div class="lane" style="top:30%;--t:9s;--s:54px"><span>🌳</span><span>🏡</span><span>🌲</span><span>🌻</span><span>🌳</span><span>🏡</span><span>🌲</span><span>🌻</span></div>
                    <div class="lane stripes" style="--t:1.2s"></div>`;
                sfx.honk();
            }
            sayStep();
        }
        function stepDone() {
            sfx.cheer();
            sparkle(200, 150, 6);
            const lines = { wash: ['Shiny and clean!', `Propre et brillant${NBSP}!`], fix: ['All the wheels are fixed!', `Toutes les roues sont réparées${NBSP}!`] };
            say(...lines[STEPS[stepIndex].id]);
            Kit.later(() => goStep(stepIndex + 1), 1500);
        }

        // ---------- Wash: rub. Fix: tap wheels ----------
        function toScene(e) { const m = svgEl().getScreenCTM(); return m ? new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
        function moveCursor(e) { const r = $('#stage').getBoundingClientRect(); $('#cursor').style.left = e.clientX - r.left + 'px'; $('#cursor').style.top = e.clientY - r.top + 'px'; }
        let lastSound = 0;
        function rubAt(p) {
            let cleaned = 0;
            items = items.filter(it => { if (Math.hypot(it.x - p.x, it.y - p.y) < 42) { it.el.remove(); cleaned++; return false; } return true; });
            const now = performance.now();
            if (now - lastSound > 140) { lastSound = now; Kit.noise({ dur: 0.12, freq: 2400, vol: 0.05 }); }
            if (cleaned) {
                sfx.plink(Math.floor(Math.random() * 8));
                const r = svgEl().getBoundingClientRect();
                Kit.burst(r.left + p.x / 400 * r.width, r.top + p.y / 260 * r.height, ['#fff', '#BFE3F5'], 6, 0.6);
                if (!items.length) stepDone();
            }
        }
        function tapWheel(w) {
            const i = Number(w.dataset.w);
            if (fixes[i] >= 3) { sfx.click(); return; }
            fixes[i]++;
            Kit.tone(1200, { dur: 0.05, vol: 0.08, type: 'square' }); Kit.tone(1700, { at: 0.06, dur: 0.05, vol: 0.06, type: 'square' });
            const [x, y] = VEHICLES[kind].wheels[i];
            sparkle(x, y, 1);
            if (fixes[i] >= 3) { w.classList.remove('loose'); sfx.boing(Kit.note(4 + i)); }
            if (fixes.every(f => f >= 3)) stepDone();
        }
        $('#stage').addEventListener('pointerdown', e => {
            const s = STEPS[stepIndex].id;
            if (s === 'fix') { const w = e.target.closest && e.target.closest('.wheel'); if (w) { moveCursor(e); $('#cursor').classList.remove('idle'); tapWheel(w); } return; }
            if (s === 'drive') { const v = svgEl(); v.classList.remove('hop'); void v.getBoundingClientRect(); v.classList.add('hop'); setTimeout(() => v.classList.remove('hop'), 650); sfx.boing(330); return; }
            if (s !== 'wash' || rubbing || !e.isPrimary) return;
            e.preventDefault();
            rubbing = e.pointerId;
            try { $('#stage').setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            $('#stage').classList.add('rubbing');
            $('#cursor').classList.remove('idle');
            moveCursor(e);
            rubAt(toScene(e));
        });
        $('#stage').addEventListener('pointermove', e => {
            if (e.pointerType === 'mouse' && STEPS[stepIndex].tool) { $('#cursor').classList.remove('idle'); moveCursor(e); }
            if (rubbing !== e.pointerId) return;
            moveCursor(e);
            rubAt(toScene(e));
        });
        const stop = e => { if (rubbing !== e.pointerId) return; rubbing = null; $('#stage').classList.remove('rubbing'); if (e.pointerType !== 'mouse') $('#cursor').classList.add('idle'); };
        $('#stage').addEventListener('pointerup', stop);
        $('#stage').addEventListener('pointercancel', stop);
        $('#stage').addEventListener('keydown', e => {
            if (e.key !== ' ' && e.key !== 'Enter') return;
            e.preventDefault();
            const s = STEPS[stepIndex].id;
            if (s === 'wash' && items.length) rubAt({ x: items[0].x, y: items[0].y });
            if (s === 'fix') { const w = [...svgEl().querySelectorAll('.wheel')].find((_, i) => fixes[i] < 3); if (w) tapWheel(w); }
        });

        // ---------- Paint & drive controls ----------
        $('#controls').addEventListener('click', e => {
            const sw = e.target.closest('.swatch'), st = e.target.closest('.sticker');
            if (sw) {
                color = sw.dataset.c;
                $('#body').setAttribute('fill', color);
                $('#controls').querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', String(b === sw)));
                sfx.splash();
                sparkle(200, 140, 4);
                const p = PAINTS.find(x => x[0] === color);
                say(p[1], p[2]);
                return;
            }
            if (st) {
                const id = st.dataset.s;
                if (stickers.has(id)) stickers.delete(id); else stickers.add(id);
                st.setAttribute('aria-pressed', String(stickers.has(id)));
                renderStickers();
                sfx.pop();
                return;
            }
            if (e.target.closest('#to-drive')) { sfx.pop(); goStep(3); return; }
            if (e.target.closest('#honk')) { sfx.honk(); return; }
            if (e.target.closest('#lights')) { $('#stage').classList.toggle('lights-on'); $('#stage').classList.toggle('night'); sfx.click(); return; }
            if (e.target.closest('#finish')) {
                sfx.fanfare();
                Kit.confetti(110);
                Kit.cheer(T('🏁 What a ride!', `🏁 Quelle balade${NBSP}!`), 1600);
                say('What a ride! Let’s fix another one!', `Quelle balade${NBSP}! On en répare un autre${NBSP}!`);
                const order = Object.keys(VEHICLES);
                Kit.later(() => openGarage(order[(order.indexOf(kind) + 1) % order.length]), 1700);
            }
        });
        $('#say').addEventListener('click', sayStep);

        function openGarage(v) {
            kind = v;
            color = VEHICLES[v].color;
            stickers = new Set();
            Kit.show(garage);
            Kit.tint('#FFEBD6');
            renderVehicle();
            goStep(0);
        }
        document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { sfx.pop(); openGarage(b.dataset.v); }));
        Kit.onLang(() => { if (!garage.hidden) renderSteps(); });
        goStart();
    }());
    </script>
</body>
</html>
