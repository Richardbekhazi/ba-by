<!DOCTYPE html>
<html lang="en" data-title-fr="Héros des bulles">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bubble Hero</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
    <!-- Friendly Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF6B8B;
            --primary-dark: #E04870;
            --secondary: #3FC9C0;
            --secondary-dark: #2AA198;
            --sun: #FFD54A;
            --sun-dark: #F2A900;
            --text: #3D3551;
            --muted: #7A7290;
            --glass: rgba(255, 255, 255, 0.82);
            --safe-top: max(12px, env(safe-area-inset-top));
            --safe-left: max(12px, env(safe-area-inset-left));
            --safe-right: max(12px, env(safe-area-inset-right));
            --safe-bottom: max(12px, env(safe-area-inset-bottom));
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            background: #BFE9FF;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
        button:focus-visible, a:focus-visible { outline: 4px solid var(--secondary); outline-offset: 3px; }

        /* 🎛 TOP BAR */
        .topbar {
            position: fixed;
            top: var(--safe-top);
            left: var(--safe-left);
            right: var(--safe-right);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 110;
            pointer-events: none;
        }
        body:not([data-state="play"]):not([data-state="paused"]) #pause-btn { display: none; }
        body[data-state="menu"] .bars,
        body[data-state="over"] .bars { visibility: hidden; }

        .round-btn {
            pointer-events: auto;
            flex: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: var(--glass);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            font-size: 24px;
            line-height: 1;
            text-decoration: none;
            box-shadow: 0 4px 0 rgba(61, 53, 81, 0.18), 0 8px 18px rgba(61, 53, 81, 0.12);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .round-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }

        .bars {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 340px;
            margin-left: auto;
        }

        .bar {
            position: relative;
            height: 24px;
            border-radius: 999px;
            background: rgba(255,255,255,0.75);
            border: 3px solid #fff;
            box-shadow: 0 4px 12px rgba(61, 53, 81, 0.12);
            overflow: hidden;
        }

        .bar-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 100%;
            border-radius: 999px;
            transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bar-fill::after {
            content: '';
            position: absolute;
            left: 8px; right: 8px; top: 3px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255,255,255,0.5);
        }

        #hp-fill { background: linear-gradient(90deg, #FF8FA3, #FF4F7B); }
        #xp-fill { background: linear-gradient(90deg, #FFE27A, #FFB627); width: 0%; }
        .bar.hurt { animation: barShake 0.35s; }

        .bar-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 0 6px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            color: var(--text);
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            z-index: 1;
        }
        .bar-label b { font-weight: 400; }

        /* 🏷 UPGRADE CHIPS */
        .chips {
            position: fixed;
            left: var(--safe-left);
            bottom: var(--safe-bottom);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: min(70vw, 420px);
            pointer-events: none;
            z-index: 15;
        }
        .chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px 3px 4px;
            border-radius: 999px;
            background: var(--glass);
            border: 2px solid #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 0.8rem;
            color: var(--muted);
            box-shadow: 0 2px 6px rgba(61,53,81,0.1);
            animation: chipIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .chip img { width: 22px; height: 22px; object-fit: contain; }

        /* 📣 BANNERS */
        .banner {
            position: fixed;
            left: 0; right: 0;
            top: 22%;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.2rem, 10vw, 4.4rem);
            color: #fff;
            -webkit-text-stroke: 2px rgba(61,53,81,0.25);
            text-shadow: 0 5px 0 var(--primary-dark), 0 12px 24px rgba(61,53,81,0.25);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.4);
            z-index: 18;
            padding: 0 16px;
        }
        .banner.show { animation: bannerPop 2.4s ease-out forwards; }
        .banner.boss { color: #FFE3EA; text-shadow: 0 5px 0 #7B2FBE, 0 12px 24px rgba(61,53,81,0.3); }

        .combo {
            position: fixed;
            top: calc(var(--safe-top) + 74px);
            right: var(--safe-right);
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            color: var(--sun);
            -webkit-text-stroke: 1px var(--sun-dark);
            text-shadow: 0 3px 0 var(--sun-dark);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
        }
        .combo.show { opacity: 1; }
        .combo.bump { animation: comboBump 0.25s; }

        /* 👑 BOSS BAR */
        .boss-bar {
            position: fixed;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 6px);
            transform: translateX(-50%) translateY(calc(100% + 60px));
            opacity: 0;
            width: min(520px, calc(100vw - 32px));
            z-index: 16;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            pointer-events: none;
        }
        .boss-bar.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .boss-bar .bar { height: 26px; }
        #boss-fill { background: linear-gradient(90deg, #B57BFF, #7B2FBE); }

        /* 🃏 OVERLAYS */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: calc(var(--safe-top) + 62px) 16px calc(var(--safe-bottom) + 8px);
            background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.72), rgba(220,240,255,0.88));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s, visibility 0s 0.25s;
        }
        .overlay.active { opacity: 1; visibility: visible; transition: opacity 0.25s; }
        #start-overlay { background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15), rgba(220,240,255,0.55)); backdrop-filter: none; -webkit-backdrop-filter: none; }

        .overlay-inner {
            margin: auto 0;
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 8px 0;
        }

        .title {
            margin: 0;
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
            font-size: clamp(2.6rem, 13vw, 5rem);
            line-height: 1;
            color: #fff;
            -webkit-text-stroke: 2px rgba(61,53,81,0.18);
            text-shadow: 0 6px 0 var(--primary), 0 14px 26px rgba(61,53,81,0.22);
            overflow-wrap: anywhere;
        }
        .title span { display: inline-block; animation: floaty 2.6s ease-in-out infinite; }
        .title.sad { text-shadow: 0 6px 0 #9C8FBF, 0 14px 26px rgba(61,53,81,0.22); }
        .title.gold { text-shadow: 0 6px 0 var(--sun-dark), 0 14px 26px rgba(61,53,81,0.22); }

        .subtitle {
            margin: 0;
            font-size: clamp(1rem, 4vw, 1.25rem);
            font-weight: 800;
            color: var(--muted);
            max-width: 30ch;
        }

        .how {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 4px 0 6px;
        }
        .how div {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 18px;
            background: #fff;
            font-weight: 800;
            color: var(--text);
            box-shadow: 0 4px 0 rgba(61,53,81,0.08);
        }
        .how span { font-size: 1.5rem; }

        .big-btn {
            min-width: 220px;
            border: none;
            border-radius: 999px;
            padding: 16px 40px;
            font-family: 'Fredoka One', cursive;
            font-size: clamp(1.6rem, 7vw, 2.1rem);
            color: #fff;
            background: linear-gradient(180deg, #FF8CA6, var(--primary));
            box-shadow: 0 7px 0 var(--primary-dark), 0 14px 24px rgba(224,72,112,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            animation: breathe 2s ease-in-out infinite;
        }
        .big-btn:active { transform: translateY(7px); box-shadow: 0 0 0 var(--primary-dark); }
        .big-btn.alt {
            background: linear-gradient(180deg, #62DDD5, var(--secondary));
            box-shadow: 0 7px 0 var(--secondary-dark), 0 14px 24px rgba(42,161,152,0.3);
            animation: none;
        }
        .big-btn.small { min-width: 0; font-size: 1.3rem; padding: 12px 28px; animation: none; }

        .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

        .best {
            font-family: 'Fredoka One', cursive;
            color: var(--sun-dark);
            font-size: 1.1rem;
            min-height: 1.4em;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .summary div {
            min-width: 96px;
            padding: 10px 14px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 4px 0 rgba(61,53,81,0.08);
        }
        .summary b { display: block; font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 1.8rem; color: var(--primary); }
        .summary small { font-weight: 800; color: var(--muted); font-size: 0.85rem; }
        .new-best { font-family: 'Fredoka One', cursive; color: var(--sun-dark); font-size: 1.3rem; animation: breathe 1s ease-in-out infinite; }

        /* Level up cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .card {
            --c: var(--secondary);
            position: relative;
            width: 220px;
            min-height: 270px;
            padding: 22px 16px 18px;
            border-radius: 30px;
            border: 5px solid #fff;
            background: linear-gradient(180deg, #fff 55%, color-mix(in srgb, var(--c) 16%, #fff));
            box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 55%, #fff), 0 18px 30px rgba(61,53,81,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            animation: cardIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
            transition: transform 0.15s;
        }
        .card:nth-child(2) { animation-delay: 0.07s; }
        .card:nth-child(3) { animation-delay: 0.14s; }
        .card:hover { transform: translateY(-8px) rotate(-1deg); }
        .card:active { transform: scale(0.95); }

        .card-key {
            position: absolute;
            top: 10px; left: 12px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--c) 20%, #fff);
            color: color-mix(in srgb, var(--c) 70%, #000);
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            display: grid;
            place-items: center;
        }
        .card-new {
            position: absolute;
            top: -12px; right: 14px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--sun);
            color: #7A5200;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            box-shadow: 0 3px 0 var(--sun-dark);
        }
        .card-icon {
            width: 96px; height: 96px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c) 25%, #fff));
            box-shadow: inset 0 -6px 0 color-mix(in srgb, var(--c) 25%, transparent);
        }
        .card-icon img { width: 66px; height: 66px; object-fit: contain; animation: floaty 2.2s ease-in-out infinite; }
        .card-name { font-family: 'Fredoka One', cursive; font-size: 1.4rem; line-height: 1.1; color: var(--text); }
        .card-desc { font-weight: 800; font-size: 1rem; color: var(--muted); }
        .pips { display: flex; gap: 5px; margin-top: auto; }
        .pips i { width: 12px; height: 12px; border-radius: 50%; background: #E8E4F0; }
        .pips i.on { background: var(--c); }
        .pips i.next { background: var(--c); opacity: 0.45; animation: breathe 0.9s ease-in-out infinite; }

        @media (max-width: 720px) {
            .cards { flex-direction: column; align-items: center; gap: 12px; }
            .card {
                width: min(420px, 100%);
                min-height: 0;
                flex-direction: row;
                flex-wrap: wrap;
                text-align: left;
                padding: 14px 16px 14px 14px;
                column-gap: 14px;
                row-gap: 2px;
            }
            .card-key { display: none; }
            .card-icon { width: 68px; height: 68px; grid-row: span 3; }
            .card-icon img { width: 48px; height: 48px; }
            .card-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
            .card-name { font-size: 1.2rem; }
            .card-desc { font-size: 0.92rem; }
            .pips { margin-top: 4px; }
        }
        @media (min-width: 721px) {
            .card-text { display: contents; }
        }
        @media (orientation: landscape) and (max-height: 520px) {
            .title { font-size: 2.4rem; }
            .overlay-inner { gap: 8px; }
            .cards { flex-direction: row; flex-wrap: nowrap; }
            .card { width: 190px; min-height: 0; flex-direction: column; text-align: center; padding: 14px 10px 12px; }
            .card-text { display: contents; }
            .card-icon { width: 64px; height: 64px; }
            .card-icon img { width: 44px; height: 44px; }
            .card-name { font-size: 1.1rem; }
            .card-desc { font-size: 0.85rem; }
            .how { display: none; }
            .big-btn { padding: 10px 30px; font-size: 1.5rem; }
        }

        .lang-slot { min-height: 48px; }

        @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes cardIn { from { transform: translateY(60px) scale(0.8); opacity: 0; } }
        @keyframes chipIn { from { transform: scale(0); } }
        @keyframes comboBump { 50% { transform: scale(1.35); } }
        @keyframes barShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes bannerPop {
            0% { opacity: 0; transform: scale(0.4); }
            12% { opacity: 1; transform: scale(1.12); }
            20% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1) translateY(-20px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
    <script src="/assets/js/site-lang.js?v=20261028"></script>
</head>
<body data-state="menu">

    <canvas id="game" aria-label="Bubble Hero play area" data-fr-aria-label="Zone de jeu Héros des bulles"></canvas>

    <!-- 🎛 Top bar -->
    <div class="topbar">
        <a href="/" class="round-btn" title="Back to Games" data-fr-title="Retour aux jeux" aria-label="Back to Games" data-fr-aria-label="Retour aux jeux"><svg class="nav-icon" width="42" height="42" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="23" fill="#FF7A45"/><path d="M2 26 A22 22 0 0 0 46 26 A23 20 0 0 1 2 26 Z" fill="#E85A28" opacity="0.55"/><path d="M24 12.5 L35.5 22 V33.5 a2.5 2.5 0 0 1 -2.5 2.5 H28 V29 a4 4 0 0 0 -8 0 V36 H15 a2.5 2.5 0 0 1 -2.5 -2.5 V22 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></a>

    <script>
        /**
         * BUBBLE HERO v7
         * Frame-rate independent survivor game for kids: a little star pops
         * grumpy blobs with auto-firing bubbles, collects stars and picks powers.

         */
        (function () {
            'use strict';

            const canvas = document.getElementById('game');

            const $ = id => document.getElementById(id);
            const T = (en, fr) => BabyLang.t(en, fr);
            const TAU = Math.PI * 2;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const store = {
                get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } },
                set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage blocked */ } }

            // ---------- World ----------
            let W = 0, H = 0, DPR = 1;
            let bgGradient = null;

            let shake = 0;

            const game = {};
            const player = {};
            let enemies, bullets, gems, particles, texts, orbiters, bgBubbles = [];
            let spawnTimer, combo, comboTimer, pendingLevelUps;

            const pointer = { active: false, type: 'mouse', startX: 0, startY: 0, px: 0, py: 0 };
            const keys = new Set();
            let target = { x: 0, y: 0 };

            // ---------- Powers ----------
            const POWERS = [
                { id: 'multi',  max: 6, color: '#4FB8FF', img: 'beer_t.png',      name: ['More Bubbles', 'Plus de bulles'],     desc: ['+1 bubble every shot', '+1 bulle à chaque tir'],
                  apply: p => { p.bulletCount++; } },
                { id: 'rate',   max: 6, color: '#FF9F43', img: 'lightning_t.png', name: ['Speedy Shots', 'Tir rapide'],        desc: ['Bubbles fly out faster', 'Les bulles partent plus vite'],
                  apply: p => { p.fireRate = Math.max(12, p.fireRate - 8); } },
                { id: 'big',    max: 5, color: '#A66BFF', img: 'bag_t.png',       name: ['Big Bubbles', 'Grosses bulles'],      desc: ['Bigger and stronger', 'Plus grosses et plus fortes'],
                  apply: p => { p.bulletSize += 4; p.damage += 0.5; } },
                { id: 'pierce', max: 5, color: '#5D6D7E', img: 'anvil_t.png',     name: ['Tough Bubbles', 'Bulles solides'],    desc: ['Go through one more Grumpy', 'Traverse un Grognon de plus'],
                  apply: p => { p.pierce++; p.damage += 0.25; } },
                { id: 'moon',   max: 6, color: '#F5C542', img: 'planet_t.png',    name: ['Moon Friend', 'Lune amie'],           desc: ['A moon spins around you', 'Une lune tourne autour de toi'],
                  apply: p => { p.moons++; } },
                { id: 'splash', max: 4, color: '#2EC4B6', img: 'boomb_t.png',     name: ['Splash Pop', 'Pop éclaboussure'],     desc: ['Pops splash on Grumpies nearby', 'Les pops éclaboussent autour'],
                  apply: p => { p.splash++; } },
                { id: 'magnet', max: 4, color: '#FF5E7E', img: 'magnet_t.png',    name: ['Star Magnet', 'Aimant à étoiles'],    desc: ['Pull stars from far away', 'Attire les étoiles de loin'],

                  apply: p => { p.speed += 0.25; } },
                { id: 'luck',   max: 4, color: '#2ECC71', img: 'trinket_t.png',   name: ['Lucky Charm', 'Porte-bonheur'],       desc: ['More stars and hearts', "Plus d'étoiles et de cœurs"],

                  apply: p => { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 25); } },
                { id: 'heal',   max: 99, color: '#FF8FA3', img: 'lollipop_t.png', name: ['Yummy Treat', 'Bonbon miam'],        desc: ['Heal 50 health', 'Soigne 50 points de vie'],
                  apply: p => { p.hp = Math.min(p.maxHp, p.hp + 50); }, repeat: true }
            ];

            // ---------- Audio ----------
            let audio = null, master = null;
            let muted = store.get('bubbles-muted', '0') === '1';
            const lastSound = {};
            const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

            function ensureAudio() {
                if (!audio) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    audio = new AC();
                    master = audio.createGain();
                    master.gain.value = muted ? 0 : 0.55;
                    master.connect(audio.destination);
                }
                if (audio.state === 'suspended') audio.resume();
            }

            function tone(freq, endFreq, dur, type, vol, delay) {
                if (!audio || muted) return;
                const t0 = audio.currentTime + (delay || 0);
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t0);
                if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain);
                gain.connect(master);
                osc.start(t0);
                osc.stop(t0 + dur + 0.02);
            }

            function sound(type, n) {
                if (!audio || muted) return;
                const now = performance.now();
                const gap = { shoot: 70, hit: 45, pop: 30, star: 35 }[type] || 0;
                if (gap && now - (lastSound[type] || 0) < gap) return;
                lastSound[type] = now;
                const note = semis => 523.25 * Math.pow(2, semis / 12);
                switch (type) {
                    case 'shoot': tone(880, 1320, 0.07, 'sine', 0.04); break;
                    case 'hit':   tone(420, 300, 0.06, 'triangle', 0.06); break;
                    case 'pop': {
                        const f = note(PENTA[Math.min(PENTA.length - 1, n || 0)]);
                        tone(f * 0.5, f * 1.5, 0.09, 'sine', 0.16);
                        tone(f * 2, f * 3, 0.05, 'triangle', 0.04, 0.015);
                        break;
                    }
                    case 'star': tone(note(12 + ((n || 0) % 5) * 2), null, 0.12, 'sine', 0.07); break;
                    case 'heart': tone(note(7), note(12), 0.18, 'sine', 0.12); tone(note(12), note(19), 0.2, 'sine', 0.1, 0.1); break;
                    case 'hurt': tone(330, 150, 0.25, 'square', 0.06); tone(220, 110, 0.3, 'sine', 0.12); break;
                    case 'level': [0, 4, 7, 12, 16].forEach((s, i) => tone(note(s), null, 0.22, 'triangle', 0.1, i * 0.07)); break;
                    case 'pick': tone(note(12), note(24), 0.16, 'sine', 0.12); break;
                    case 'boss': [0, 0.35, 0.7].forEach(d => tone(110, 70, 0.3, 'sawtooth', 0.06, d)); break;
                    case 'win': [0, 4, 7, 12, 7, 12, 16, 19, 24].forEach((s, i) => tone(note(s), null, 0.25, 'triangle', 0.1, i * 0.09)); break;
                    case 'over': [7, 4, 0, -5].forEach((s, i) => tone(note(s), null, 0.3, 'sine', 0.12, i * 0.16)); break;
                }
            }

            function setMuted(value) {
                muted = value;
                store.set('bubbles-muted', muted ? '1' : '0');
                $('mute-btn').textContent = muted ? '🔇' : '🔊';
                if (master) master.gain.value = muted ? 0 : 0.55;
            }

            // ---------- Sprites ----------
            // Bubbles are drawn hundreds of times a frame, so one glossy sprite is pre-rendered and scaled.
            const bubbleSprite = document.createElement('canvas');
            (function makeBubbleSprite() {
                const s = 128, r = 60;
                bubbleSprite.width = bubbleSprite.height = s;
                const c = bubbleSprite.getContext('2d');
                c.translate(s / 2, s / 2);
                const body = c.createRadialGradient(-10, -14, r * 0.2, 0, 0, r);
                body.addColorStop(0, 'rgba(255,255,255,0.10)');
                body.addColorStop(0.7, 'rgba(160,225,255,0.30)');
                body.addColorStop(0.92, 'rgba(120,200,255,0.75)');
                body.addColorStop(1, 'rgba(255,255,255,0.95)');
                c.fillStyle = body;
                c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
                const rim = c.createLinearGradient(-r, -r, r, r);
                rim.addColorStop(0, 'rgba(255,140,200,0.85)');
                rim.addColorStop(0.35, 'rgba(255,230,120,0.7)');
                rim.addColorStop(0.65, 'rgba(120,255,210,0.7)');
                rim.addColorStop(1, 'rgba(140,150,255,0.85)');
                c.strokeStyle = rim;
                c.lineWidth = 4;
                c.beginPath(); c.arc(0, 0, r - 2, 0, TAU); c.stroke();
                c.fillStyle = 'rgba(255,255,255,0.95)';
                c.beginPath(); c.ellipse(-r * 0.38, -r * 0.4, r * 0.22, r * 0.12, -0.7, 0, TAU); c.fill();
                c.beginPath(); c.arc(-r * 0.12, -r * 0.62, r * 0.06, 0, TAU); c.fill();
            }());

            function drawBubble(x, y, r, alpha) {
                ctx.globalAlpha = alpha === undefined ? 1 : alpha;
                ctx.drawImage(bubbleSprite, x - r * 1.067, y - r * 1.067, r * 2.133, r * 2.133);
                ctx.globalAlpha = 1;
            }

            // ---------- Setup ----------
            function resize() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.round(W * DPR);
                canvas.height = Math.round(H * DPR);
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                bgGradient = ctx.createLinearGradient(0, 0, 0, H);
                bgGradient.addColorStop(0, '#A9E4FF');
                bgGradient.addColorStop(0.55, '#D7F1FF');
                bgGradient.addColorStop(1, '#F6E3FF');
                const want = Math.round(Math.min(40, (W * H) / 22000));
                while (bgBubbles.length < want) bgBubbles.push(newBgBubble(true));
                bgBubbles.length = want;
                if (player.x !== undefined) {
                    player.x = clamp(player.x, player.r, W - player.r);
                    player.y = clamp(player.y, player.r + 60, H - player.r);
                    target.x = clamp(target.x, 0, W);
                    target.y = clamp(target.y, 0, H);
                }
            }

            function newBgBubble(anywhere) {
                const depth = Math.random();
                return {
                    x: Math.random() * W,
                    y: anywhere ? Math.random() * H : H + 40,
                    r: 4 + depth * 22,
                    vy: 0.15 + depth * 0.5,
                    sway: Math.random() * TAU,
                    a: 0.25 + depth * 0.35
                };
            }

            function reset() {
                Object.assign(game, { level: 1, xp: 0, xpToNext: 5, boss: null, time: 0, pops: 0 });
                Object.assign(player, {
                    x: W / 2, y: H / 2 + 20, r: 30, vx: 0, vy: 0,
                    hp: 100, maxHp: 100, invuln: 0, blink: 0, squash: 0,
                    speed: 1, damage: 1, luck: 0, fireRate: 50, fireTimer: 20,
                    bulletSpeed: 7.5, bulletSize: 13, bulletCount: 1, pierce: 0,
                    moons: 0, splash: 0, magnet: 120, shield: 0, levels: {}
                });
                target = { x: player.x, y: player.y };
                enemies = []; bullets = []; gems = []; particles = []; texts = []; orbiters = [];
                spawnTimer = 30; combo = 0; comboTimer = 0; pendingLevelUps = 0;
                $('boss-bar').classList.remove('show');
                renderChips();
                updateHud();
            }

            // ---------- Spawning ----------
            const KINDS = {
                blob:  { color: '#FFB3C7', dark: '#E5779A', r: 24, speed: 1.05, hp: l => 1 + l * 0.25, hurt: 8 },
                tank:  { color: '#C9B6FF', dark: '#8E72DB', r: 34, speed: 0.65, hp: l => 3 + l * 0.55, hurt: 12 },
                zoom:  { color: '#FFD18A', dark: '#E59A2E', r: 18, speed: 1.9,  hp: l => 1 + l * 0.15, hurt: 6 },
                boss:  { color: '#9F8CFF', dark: '#5E45C9', r: 80, speed: 0.7,  hp: l => 40 + l * 12,  hurt: 15 }
            };

            function edgePoint(margin) {
                const side = Math.floor(Math.random() * 4);
                if (side === 0) return { x: Math.random() * W, y: -margin };
                if (side === 1) return { x: W + margin, y: Math.random() * H };
                if (side === 2) return { x: Math.random() * W, y: H + margin };
                return { x: -margin, y: Math.random() * H };
            }

            function spawnEnemy(kind, at) {
                const k = KINDS[kind];
                const p = at || edgePoint(k.r + 20);
                const hp = k.hp(game.level);
                const e = {
                    kind, x: p.x, y: p.y, r: k.r * (kind === 'boss' ? 1 : 0.9 + Math.random() * 0.2),
                    speed: k.speed * (0.85 + Math.random() * 0.3) * (1 + Math.min(0.4, game.level * 0.015)),
                    hp, maxHp: hp, hurt: k.hurt, color: k.color, dark: k.dark,
                    flash: 0, kx: 0, ky: 0, wob: Math.random() * TAU, orbitCd: 0, born: 0,
                    dashTimer: 90 + Math.random() * 90, dash: 0, summon: 240
                };
                enemies.push(e);
                return e;
            }

            function spawnWave() {
                const lvl = game.level;
                const roll = Math.random();
                let kind = 'blob';
                if (lvl >= 3 && roll < 0.22) kind = 'tank';
                else if (lvl >= 2 && roll < 0.45) kind = 'zoom';
                spawnEnemy(kind);
                // From level 8, now and then a whole ring of blobs arrives together.
                if (lvl >= 8 && !game.boss && Math.random() < 0.025) {
                    const n = 6 + Math.min(6, Math.floor(lvl / 2));
                    const rad = Math.max(W, H) * 0.62;
                    for (let i = 0; i < n; i++) {
                        const a = (i / n) * TAU;
                        spawnEnemy('blob', { x: player.x + Math.cos(a) * rad, y: player.y + Math.sin(a) * rad });
                    }
                }
            }

            function spawnBoss() {
                const e = spawnEnemy('boss', { x: W / 2, y: -120 });
                game.boss = e;
                banner(T('Big Grumpy is coming!', 'Le Gros Grognon arrive !'), true);
                $('boss-bar').classList.add('show');
                sound('boss');
                addShake(10);
            }

            // ---------- Actions ----------
            function nearestEnemy() {
                let best = null, bestD = Infinity;
                for (const e of enemies) {
                    if (e.dead || e.x < -e.r || e.x > W + e.r || e.y < -e.r || e.y > H + e.r) continue;
                    const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
                    if (d < bestD) { bestD = d; best = e; }
                }
                return best;
            }

            function fire() {
                const t = nearestEnemy();
                if (!t) return false;
                const base = Math.atan2(t.y - player.y, t.x - player.x);
                const n = player.bulletCount;
                const spread = n > 1 ? Math.min(0.22, 1.1 / n) : 0;
                for (let i = 0; i < n; i++) {
                    const a = base + (i - (n - 1) / 2) * spread;
                    bullets.push({
                        x: player.x + Math.cos(a) * player.r * 0.6,
                        y: player.y + Math.sin(a) * player.r * 0.6,
                        vx: Math.cos(a) * player.bulletSpeed,
                        vy: Math.sin(a) * player.bulletSpeed,
                        r: player.bulletSize, grow: 0,
                        damage: player.damage, pierce: player.pierce, hit: new Set(), life: 220,
                        wob: Math.random() * TAU
                    });
                }
                player.squash = 1;
                sound('shoot');
                return true;
            }

            function damageEnemy(e, amount, fromX, fromY, knock) {
                if (e.dead) return;
                e.hp -= amount;
                e.flash = 7;
                const a = Math.atan2(e.y - fromY, e.x - fromX);
                const push = e.kind === 'boss' ? knock * 0.15 : knock;
                e.kx += Math.cos(a) * push;
                e.ky += Math.sin(a) * push;
                burst(e.x - Math.cos(a) * e.r * 0.8, e.y - Math.sin(a) * e.r * 0.8, '#BFEFFF', 4, 3);
                if (e.hp <= 0) killEnemy(e);
                else sound('hit');
            }

            function killEnemy(e) {
                e.dead = true;
                game.pops++;
                combo++;
                comboTimer = 90;
                showCombo();
                sound('pop', Math.min(10, combo - 1));
                ring(e.x, e.y, e.r * 1.6, e.color);
                confetti(e.x, e.y, e.kind === 'boss' ? 70 : 10);
                if (combo >= 2 && combo % 5 === 0) floatText(e.x, e.y - e.r, T('Wow!', 'Bravo !'), '#FF6B8B', 26);

                if (player.splash > 0) {
                    const reach = 60 + player.splash * 25;
                    ring(e.x, e.y, reach, '#7FE8DE');
                    for (const o of enemies) {
                        if (o === e || o.dead) continue;
                        if ((o.x - e.x) ** 2 + (o.y - e.y) ** 2 < (reach + o.r) ** 2) {
                            damageEnemy(o, player.damage * (0.4 + player.splash * 0.2), e.x, e.y, 6);
                        }
                    }
                }

                if (e.kind === 'boss') {
                    game.boss = null;
                    $('boss-bar').classList.remove('show');
                    addShake(18);
                    sound('win');
                    banner(T('Hooray! You did it!', 'Hourra ! Tu as réussi !'));
                    for (let i = 0; i < 12; i++) dropGem(e.x, e.y, 1, 7);
                    dropHeart(e.x, e.y, 40);
                    player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
                    bossLevelUp();
                    return;
                }

                let drops = 1;
                if (Math.random() < 0.06 + player.luck * 0.08) drops += 1 + Math.floor(Math.random() * 2);
                for (let i = 0; i < drops; i++) dropGem(e.x, e.y, starValue(e.kind), 3);
                if (Math.random() < 0.03 + player.luck * 0.012) dropHeart(e.x, e.y, 15);
            }

            // Bigger stars appear as the game goes on: yellow = 1, blue = 3, pink = 10.
            function starValue(kind) {
                const lvl = game.level, roll = Math.random();
                if (kind === 'tank') return lvl >= 10 && roll < 0.35 ? 10 : 3;
                if (lvl >= 12 && roll < 0.08 + Math.min(0.12, (lvl - 12) * 0.01)) return 10;
                if (lvl >= 5 && roll < 0.22 + Math.min(0.2, (lvl - 5) * 0.015)) return 3;
                return 1;
            }

            function dropGem(x, y, value, spread) {
                const a = Math.random() * TAU, s = Math.random() * spread;
                gems.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, value, kind: 'star', spin: Math.random() * TAU, pulled: false, age: 0 });
            }

            function dropHeart(x, y, heal) {
                gems.push({ x, y, vx: 0, vy: -2, value: heal, kind: 'heart', spin: 0, pulled: false, age: 0 });
            }

            // A few seconds inside a safe bubble after each upgrade.
            function grace(ticks) {
                player.invuln = Math.max(player.invuln, ticks);
                player.shield = Math.max(player.shield || 0, ticks);
            }

            function hurtPlayer(amount, from) {
                if (player.invuln > 0) return;
                player.hp = Math.max(0, player.hp - amount);
                player.invuln = 80;
                addShake(9);
                sound('hurt');
                burst(player.x, player.y, '#FF8FA3', 12, 6);
                const a = Math.atan2(player.y - from.y, player.x - from.x);
                player.vx += Math.cos(a) * 9;
                player.vy += Math.sin(a) * 9;
                from.kx -= Math.cos(a) * 14;
                from.ky -= Math.sin(a) * 14;
                const bar = $('hp-bar');
                bar.classList.remove('hurt'); void bar.offsetWidth; bar.classList.add('hurt');
                if (navigator.vibrate && pointer.type === 'touch') { try { navigator.vibrate(60); } catch (err) { /* ignore */ } }
                updateHud();
                if (player.hp <= 0) gameOver();
            }

            // ---------- Effects ----------
            function addShake(n) { if (!reduceMotion) shake = Math.max(shake, n); }
            function pushParticle(p) { if (particles.length < 500) particles.push(p); }

            function burst(x, y, color, n, speed) {
                for (let i = 0; i < n; i++) {
                    const a = Math.random() * TAU, s = (0.4 + Math.random()) * speed;
                    pushParticle({ type: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.05, r: 2 + Math.random() * 4, color });
                }
            }

            const CONFETTI = ['#FF6B8B', '#FFD54A', '#3FC9C0', '#A66BFF', '#4FB8FF', '#FF9F43'];
            function confetti(x, y, n) {
                for (let i = 0; i < n; i++) {
                    const a = Math.random() * TAU, s = 2 + Math.random() * 6;
                    pushParticle({
                        type: Math.random() < 0.35 ? 'star' : 'paper', x, y,

                        r: 4 + Math.random() * 5, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4,
                        color: CONFETTI[(Math.random() * CONFETTI.length) | 0], gravity: 0.12
                    });
                }
            }

            function ring(x, y, r, color) {

            function floatText(x, y, text, color, size) {

            }

            let bannerTimer = 0;
            function banner(text, boss) {
                const el = $('banner');

            }

            function showCombo() {
                const el = $('combo');
