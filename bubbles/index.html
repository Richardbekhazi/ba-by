                el.classList.add('show');
                el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
            }

            // ---------- Update ----------
            function update(k) {
                game.time += k / 60;

                // Movement: keyboard nudges the target, pointer sets it.
                const kx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
                const ky = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);
                if (kx || ky) {
                    const len = Math.hypot(kx, ky);
                    target.x = clamp(player.x + (kx / len) * 60, 0, W);
                    target.y = clamp(player.y + (ky / len) * 60, 0, H);
                }
                const follow = 1 - Math.pow(1 - 0.1 * player.speed, k);
                const ox = player.x, oy = player.y;
                const maxStep = 9 * player.speed * k;
                let mx = (target.x - player.x) * follow, my = (target.y - player.y) * follow;
                const step = Math.hypot(mx, my);
                if (step > maxStep) { mx *= maxStep / step; my *= maxStep / step; }
                player.x += mx + player.vx * k;
                player.y += my + player.vy * k;
                player.vx *= Math.pow(0.85, k); player.vy *= Math.pow(0.85, k);
                player.x = clamp(player.x, player.r, W - player.r);
                player.y = clamp(player.y, player.r + 4, H - player.r);
                player.mvx = (player.x - ox) / k; player.mvy = (player.y - oy) / k;
                if (Math.hypot(player.mvx, player.mvy) > 2.5 && Math.random() < 0.5 * k) {
                    pushParticle({ type: 'star', x: player.x - player.mvx * 3, y: player.y - player.mvy * 3, vx: 0, vy: 0.3, life: 0.8, decay: 0.035, r: 3 + Math.random() * 3, rot: 0, vr: 0.1, color: '#FFE27A' });
                }
                player.invuln = Math.max(0, player.invuln - k);
                player.shield = Math.max(0, (player.shield || 0) - k);
                player.squash = Math.max(0, player.squash - 0.12 * k);

                // Shooting
                player.fireTimer -= k;
                if (player.fireTimer <= 0) player.fireTimer = fire() ? player.fireRate : 6;

                // Spawning
                if (!game.boss || Math.random() < 0.35) {
                    spawnTimer -= k;
                    if (spawnTimer <= 0) {
                        spawnWave();
                        spawnTimer = Math.max(20, 84 - game.level * 2.6 - game.time * 0.15);
                    }
                }

                // Moons
                while (orbiters.length < player.moons) orbiters.push({});
                const moonR = 78 + player.moons * 4;
                orbiters.forEach((o, i) => {
                    o.a = time * 0.045 + (i / orbiters.length) * TAU;
                    o.x = player.x + Math.cos(o.a) * moonR;
                    o.y = player.y + Math.sin(o.a) * moonR;
                });

                // Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.x += b.vx * k; b.y += b.vy * k;
                    b.life -= k; b.grow = Math.min(1, b.grow + 0.2 * k);
                    if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) bullets.splice(i, 1);
                }

                // Enemies
                for (const e of enemies) {
                    if (e.dead) continue;
                    e.born = Math.min(1, e.born + 0.06 * k);
                    e.wob += 0.08 * k;
                    e.flash = Math.max(0, e.flash - k);
                    e.orbitCd = Math.max(0, e.orbitCd - k);

                    const dx = player.x - e.x, dy = player.y - e.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    let sp = e.speed;
                    if (e.kind === 'zoom') {
                        e.dashTimer -= k;
                        if (e.dashTimer <= 0) { e.dash = 30; e.dashTimer = 120 + Math.random() * 80; }
                        if (e.dash > 0) { e.dash -= k; sp *= 2.4; }
                    }
                    if (e.kind === 'boss') {
                        e.summon -= k;
                        if (e.summon <= 0) {
                            e.summon = Math.max(140, 260 - game.level * 4);
                            for (let j = 0; j < 4; j++) {
                                const a = (j / 4) * TAU + time * 0.01;
                                spawnEnemy('blob', { x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r }).born = 0.3;
                            }
                            addShake(4);
                        }
                    }
                    e.x += ((dx / dist) * sp + e.kx) * k;
                    e.y += ((dy / dist) * sp + e.ky) * k;
                    e.kx *= Math.pow(0.82, k); e.ky *= Math.pow(0.82, k);

                    if (dist < player.r * 0.8 + e.r * 0.85) hurtPlayer(e.hurt, e);

                    for (const b of bullets) {
                        if (b.life <= 0 || b.hit.has(e)) continue;
                        const rr = e.r + b.r;
                        if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) {
                            b.hit.add(e);
                            if (b.pierce > 0) b.pierce--; else b.life = 0;
                            damageEnemy(e, b.damage, b.x - b.vx, b.y - b.vy, 7);
                            if (e.dead) break;
                        }
                    }

                    if (!e.dead && e.orbitCd <= 0) {
                        for (const o of orbiters) {
                            const rr = e.r + 16;
                            if ((e.x - o.x) ** 2 + (e.y - o.y) ** 2 < rr * rr) {
                                e.orbitCd = 20;
                                damageEnemy(e, player.damage * 0.8, o.x, o.y, 9);
                                break;
                            }
                        }
                    }
                }

                // Gentle crowd separation so Grumpies don't merge into one blob.
                for (let i = 0; i < enemies.length; i++) {
                    const a = enemies[i];
                    if (a.dead) continue;
                    for (let j = i + 1; j < enemies.length; j++) {
                        const b = enemies[j];
                        if (b.dead) continue;
                        const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * 0.85;
                        const d2 = dx * dx + dy * dy;
                        if (d2 > 0 && d2 < min * min) {
                            const d = Math.sqrt(d2), push = (min - d) * 0.25 * k / d;
                            const wa = a.kind === 'boss' ? 0 : 1, wb = b.kind === 'boss' ? 0 : 1;
                            a.x -= dx * push * wa; a.y -= dy * push * wa;
                            b.x += dx * push * wb; b.y += dy * push * wb;
                        }
                    }
                }
                enemies = enemies.filter(e => !e.dead);
                if (game.boss) updateBossBar();

                // Stars and hearts
                for (let i = gems.length - 1; i >= 0; i--) {
                    const g = gems[i];
                    g.age += k; g.spin += 0.05 * k;
                    g.x += g.vx * k; g.y += g.vy * k;
                    g.vx *= Math.pow(0.9, k); g.vy *= Math.pow(0.9, k);
                    const dx = player.x - g.x, dy = player.y - g.y, d = Math.hypot(dx, dy) || 1;
                    if (g.age > 15 && (g.pulled || d < player.magnet)) {
                        g.pulled = true;
                        const pull = 0.9 + Math.min(10, 1200 / d) * 0.12;
                        g.vx += (dx / d) * pull * k; g.vy += (dy / d) * pull * k;
                    }
                    if (d < player.r + 8) {
                        gems.splice(i, 1);
                        if (g.kind === 'heart') {
                            player.hp = Math.min(player.maxHp, player.hp + g.value);
                            floatText(player.x, player.y - player.r, `+${g.value} ❤️`, '#FF4F7B', 22);
                            sound('heart');
                            updateHud();
                        } else {
                            gainXp(g.value);
                        }
                    }
                }
                if (gems.length > 250) gems.splice(0, gems.length - 250);

                // Combo
                if (comboTimer > 0) {
                    comboTimer -= k;
                    if (comboTimer <= 0) { combo = 0; $('combo').classList.remove('show'); }
                }

                // Level ups wait for a calm frame so the cards never pop up mid-hit.
                if (pendingLevelUps > 0 && state === 'play') {
                    pendingLevelUps--;
                    openLevelUp();
                }
            }

            function updateFx(k) {
                time += k;
                shake = Math.max(0, shake - 0.8 * k);
                for (const b of bgBubbles) {
                    b.y -= b.vy * k;
                    b.sway += 0.01 * k;
                    if (b.y < -40) Object.assign(b, newBgBubble(false));
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= p.decay * k;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    if (p.type === 'ring') { p.r += (p.max - p.r) * 0.25 * k; continue; }
                    p.x += p.vx * k; p.y += p.vy * k;
                    if (p.gravity) p.vy += p.gravity * k;
                    p.vx *= Math.pow(0.95, k); p.vy *= Math.pow(0.97, k);
                    if (p.rot !== undefined) p.rot += p.vr * k;
                }
                for (let i = texts.length - 1; i >= 0; i--) {
                    const t = texts[i];
                    t.y -= 0.8 * k; t.life -= 0.022 * k;
                    if (t.life <= 0) texts.splice(i, 1);
                }
            }

            // Beating a boss is worth exactly one level: 65% of level 11 becomes 65% of level 12.
            function bossLevelUp() {
                const pct = game.xp / game.xpToNext;
                game.level++;
                game.xpToNext = Math.round(game.xpToNext * 1.28 + 3);
                game.xp = Math.floor(pct * game.xpToNext);
                pendingLevelUps++;
                floatText(player.x, player.y - player.r - 30, T('+1 level!', '+1 niveau !'), '#A66BFF', 28);
                updateHud();
            }

            function gainXp(n) {
                game.xp += n;
                sound('star', game.xp);
                while (game.xp >= game.xpToNext) {
                    game.xp -= game.xpToNext;
                    game.level++;
                    game.xpToNext = Math.round(game.xpToNext * 1.28 + 3);
                    if (game.level % 5 === 0 && !game.boss) spawnBoss();
                    pendingLevelUps++;
                }
                updateHud();
            }

            // ---------- Drawing ----------
            function draw() {
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, W, H);

                // Soft sun glow
                const glow = ctx.createRadialGradient(W * 0.82, H * 0.1, 0, W * 0.82, H * 0.1, Math.max(W, H) * 0.5);
                glow.addColorStop(0, 'rgba(255,255,255,0.75)');
                glow.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, W, H);

                for (const b of bgBubbles) drawBubble(b.x + Math.sin(b.sway) * 12, b.y, b.r, b.a);

                ctx.save();
                if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

                if (state !== 'menu') {
                    for (const g of gems) drawGem(g);
                    for (const p of particles) if (p.type === 'ring') drawParticle(p);
                    for (const e of enemies) drawEnemy(e);
                    for (const b of bullets) {
                        const r = b.r * (0.5 + b.grow * 0.5) * (1 + Math.sin(time * 0.3 + b.wob) * 0.06);
                        drawBubble(b.x, b.y, r, 1);
                    }
                    for (const o of orbiters) drawMoon(o.x, o.y, 15);
                    drawPlayer();
                    for (const p of particles) if (p.type !== 'ring') drawParticle(p);
                    drawTexts();
                    drawOffscreenArrows();
                } else {
                    drawPlayer(W / 2 + Math.sin(time * 0.02) * W * 0.3, H - 70 + Math.sin(time * 0.05) * 10);
                }
                ctx.restore();

                // Hurt vignette
                if (player.invuln > 50 && !(player.shield > 0)) {
                    ctx.fillStyle = `rgba(255,79,123,${((player.invuln - 50) / 20) * 0.18})`;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            function starPath(c, r, inner, points) {
                c.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const rr = i % 2 === 0 ? r : r * inner;
                    const a = (i / (points * 2)) * TAU - Math.PI / 2;
                    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
                }
                c.closePath();
            }

            function drawPlayer(px, py) {
                const x = px === undefined ? player.x : px;
                const y = py === undefined ? player.y : py;
                const r = player.r || 30;
                const shielded = player.shield > 0;
                if (!shielded && player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0) return;
                if (shielded && (player.shield > 40 || Math.floor(player.shield / 5) % 2 === 0)) {
                    drawBubble(x, y, r * 1.75 * (1 + Math.sin(time * 0.15) * 0.04), 0.75);
                }
                const mvx = player.mvx || 0, mvy = player.mvy || 0;
                const tilt = clamp(mvx * 0.03, -0.35, 0.35);
                const sq = (player.squash || 0) * 0.12;

                ctx.save();
                ctx.translate(x, y);

                const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.8);
                halo.addColorStop(0, 'rgba(255,236,140,0.55)');
                halo.addColorStop(1, 'rgba(255,236,140,0)');
                ctx.fillStyle = halo;
                ctx.beginPath(); ctx.arc(0, 0, r * 1.8, 0, TAU); ctx.fill();

                ctx.rotate(tilt + Math.sin(time * 0.04) * 0.06);
                ctx.scale(1 + sq, 1 - sq);

                ctx.lineJoin = 'round';
                starPath(ctx, r, 0.55, 5);
                ctx.lineWidth = r * 0.34;
                ctx.strokeStyle = '#F2A900';
                ctx.stroke();
                const fill = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
                fill.addColorStop(0, '#FFF6B8');
                fill.addColorStop(1, '#FFC929');
                ctx.lineWidth = r * 0.2;
                ctx.strokeStyle = fill;
                ctx.fillStyle = fill;
                ctx.stroke();
                ctx.fill();

                // Face looks the way the star is moving.
                const lx = clamp(mvx * 0.6, -3, 3), ly = clamp(mvy * 0.6, -3, 3) + 2;
                const blinking = (time % 220) < 7;
                ctx.fillStyle = '#3D3551';
                for (const s of [-1, 1]) {
                    if (blinking) {
                        ctx.fillRect(s * r * 0.26 - r * 0.1 + lx, -r * 0.02 + ly, r * 0.2, r * 0.05);
                    } else {
                        ctx.beginPath(); ctx.ellipse(s * r * 0.26 + lx, ly, r * 0.08, r * 0.11, 0, 0, TAU); ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(s * r * 0.26 + lx + r * 0.03, ly - r * 0.04, r * 0.035, 0, TAU); ctx.fill();
                        ctx.fillStyle = '#3D3551';
                    }
                }
                ctx.fillStyle = 'rgba(255,120,150,0.55)';
                for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * 0.42 + lx, r * 0.18 + ly, r * 0.1, r * 0.06, 0, 0, TAU); ctx.fill(); }
                ctx.strokeStyle = '#3D3551';
                ctx.lineWidth = r * 0.06;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (player.invuln > 0 && !shielded) ctx.arc(lx, r * 0.3 + ly, r * 0.1, Math.PI * 1.1, Math.PI * 1.9);
                else ctx.arc(lx, r * 0.12 + ly, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }

            function blobPath(e, r) {
                const pts = 12;
                ctx.beginPath();
                for (let i = 0; i <= pts; i++) {
                    const a = (i / pts) * TAU;
                    const w = 1 + Math.sin(a * 3 + e.wob) * 0.05 + Math.cos(a * 2 - e.wob * 0.7) * 0.04;
                    const px = Math.cos(a) * r * w, py = Math.sin(a) * r * w * 0.94;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
            }

            function drawEnemy(e) {
                const pop = easeOutBack(e.born);
                const r = e.r * pop;
                if (r <= 1) return;
                const hitScale = e.flash > 0 ? 1 + e.flash * 0.015 : 1;

                ctx.save();
                ctx.translate(e.x, e.y);

                // Shadow
                ctx.fillStyle = 'rgba(61,53,81,0.10)';
                ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.8, r * 0.18, 0, 0, TAU); ctx.fill();

                ctx.scale(hitScale, 1 / hitScale);
                if (e.kind === 'zoom') {
                    const a = Math.atan2(player.y - e.y, player.x - e.x);
                    ctx.save();
                    ctx.rotate(a);
                    ctx.fillStyle = e.dark;
                    ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.7); ctx.lineTo(-r * 1.5, 0); ctx.lineTo(-r * 0.6, r * 0.7); ctx.fill();
                    ctx.restore();
                    if (e.dash > 0) { ctx.strokeStyle = 'rgba(255,180,80,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, TAU); ctx.stroke(); }
                }

                blobPath(e, r);
                const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
                body.addColorStop(0, e.flash > 0 ? '#fff' : lighten(e.color));
                body.addColorStop(1, e.flash > 0 ? '#FFF0F5' : e.color);
                ctx.fillStyle = body;
                ctx.fill();
                ctx.lineWidth = Math.max(2.5, r * 0.09);
                ctx.strokeStyle = e.dark;
                ctx.stroke();

                // Shine
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.45, r * 0.2, r * 0.11, -0.6, 0, TAU); ctx.fill();

                if (e.kind === 'tank') {
                    ctx.fillStyle = e.dark;
                    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * 0.62, -r * 0.78, r * 0.18, r * 0.24, s * 0.4, 0, TAU); ctx.fill(); }
                }
                if (e.kind === 'boss') {
                    ctx.save();
                    ctx.translate(0, -r * 0.92);
                    ctx.fillStyle = '#FFD54A';
                    ctx.strokeStyle = '#F2A900';
                    ctx.lineWidth = 4;
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.4, r * 0.12); ctx.lineTo(-r * 0.46, -r * 0.3); ctx.lineTo(-r * 0.2, -r * 0.08);
                    ctx.lineTo(0, -r * 0.38); ctx.lineTo(r * 0.2, -r * 0.08); ctx.lineTo(r * 0.46, -r * 0.3); ctx.lineTo(r * 0.4, r * 0.12);
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#FF6B8B';
                    ctx.beginPath(); ctx.arc(0, -r * 0.05, r * 0.06, 0, TAU); ctx.fill();
                    ctx.restore();
                }

                // Face: grumpy brows, pupils that follow the star, blush.
                const look = Math.atan2(player.y - e.y, player.x - e.x);
                const lx = Math.cos(look) * r * 0.07, ly = Math.sin(look) * r * 0.07;
                const eyeX = r * 0.3, eyeY = -r * 0.08, eyeR = r * 0.17;
                for (const s of [-1, 1]) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(s * eyeX, eyeY, eyeR, 0, TAU); ctx.fill();
                    ctx.fillStyle = '#3D3551';
                    ctx.beginPath(); ctx.arc(s * eyeX + lx, eyeY + ly, eyeR * 0.55, 0, TAU); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(s * eyeX + lx + eyeR * 0.2, eyeY + ly - eyeR * 0.2, eyeR * 0.18, 0, TAU); ctx.fill();
                }
                ctx.strokeStyle = '#3D3551';
                ctx.lineCap = 'round';
                ctx.lineWidth = Math.max(2.5, r * 0.07);
                for (const s of [-1, 1]) {
                    ctx.beginPath();
                    ctx.moveTo(s * (eyeX + eyeR * 0.9), eyeY - eyeR * 1.35);
                    ctx.lineTo(s * (eyeX - eyeR * 0.7), eyeY - eyeR * 0.95);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(255,110,140,0.4)';
                for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * 0.55, r * 0.22, r * 0.12, r * 0.07, 0, 0, TAU); ctx.fill(); }
                ctx.beginPath();
                if (e.flash > 0) { ctx.arc(0, r * 0.32, r * 0.1, 0, TAU); ctx.fillStyle = '#3D3551'; ctx.fill(); }
                else { ctx.arc(0, r * 0.45, r * 0.16, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
                ctx.restore();

                // Health pip only once hurt
                if (e.kind !== 'boss' && e.hp < e.maxHp) {
                    const w = e.r * 1.4, pct = Math.max(0, e.hp / e.maxHp);
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    roundRect(e.x - w / 2 - 2, e.y - e.r - 16, w + 4, 9, 5); ctx.fill();
                    ctx.fillStyle = pct > 0.5 ? '#3FC9C0' : '#FF6B8B';
                    roundRect(e.x - w / 2, e.y - e.r - 14, w * pct, 5, 3); ctx.fill();
                }
            }

            function drawMoon(x, y, r) {
                ctx.save();
                ctx.translate(x, y);
                const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 1, 0, 0, r * 1.6);
                g.addColorStop(0, 'rgba(255,245,190,0.9)');
                g.addColorStop(1, 'rgba(255,245,190,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.fill();
                ctx.fillStyle = '#FFF2B3';
                ctx.strokeStyle = '#F5C542';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
                ctx.fillStyle = 'rgba(245,197,66,0.45)';
                ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.35, r * 0.22, 0, TAU); ctx.fill();
                ctx.beginPath(); ctx.arc(-r * 0.45, r * 0.4, r * 0.15, 0, TAU); ctx.fill();
                ctx.fillStyle = '#3D3551';
                ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.05, r * 0.1, 0, TAU); ctx.arc(r * 0.2, -r * 0.05, r * 0.1, 0, TAU); ctx.fill();
                ctx.strokeStyle = '#3D3551'; ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(-r * 0.05, r * 0.2, r * 0.22, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
                ctx.restore();
            }

            function drawGem(g) {
                const bob = Math.sin(g.age * 0.1 + g.spin) * 2;
                ctx.save();
                ctx.translate(g.x, g.y + bob);
                if (g.kind === 'heart') {
                    const s = 1 + Math.sin(g.age * 0.15) * 0.1;
                    ctx.scale(s, s);
                    ctx.fillStyle = '#FF4F7B';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 10);
                    ctx.bezierCurveTo(-16, -2, -10, -16, 0, -7);
                    ctx.bezierCurveTo(10, -16, 16, -2, 0, 10);
                    ctx.fill(); ctx.stroke();
                } else {
                    const tier = g.value >= 10 ? 2 : g.value >= 3 ? 1 : 0;
                    const r = [8, 11, 14][tier];
                    if (tier === 2) {
                        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 2.2);
                        glow.addColorStop(0, 'rgba(255,120,200,0.55)');
                        glow.addColorStop(1, 'rgba(255,120,200,0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();
                    }
                    ctx.rotate(Math.sin(g.spin) * 0.4 + (tier === 2 ? g.age * 0.04 : 0));
                    ctx.lineJoin = 'round';
                    starPath(ctx, r, 0.5, 5);
                    ctx.fillStyle = ['#FFD54A', '#7FD8FF', '#FF7EC8'][tier];
                    ctx.strokeStyle = ['#F2A900', '#2E9BD6', '#D63C93'][tier];
                    ctx.lineWidth = 3;
                    ctx.stroke(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.25, r * 0.18, 0, TAU); ctx.fill();
                }
                ctx.restore();
            }

            function drawParticle(p) {
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
                if (p.type === 'ring') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 6 * p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
                } else if (p.type === 'paper') {
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.r, -p.r * 0.35, p.r * 2, p.r * 0.7);
                    ctx.restore();
                } else if (p.type === 'star') {
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    starPath(ctx, p.r, 0.45, 5);
                    ctx.fillStyle = p.color; ctx.fill();
                    ctx.restore();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TAU); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawTexts() {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (const t of texts) {
                    ctx.globalAlpha = Math.min(1, t.life * 2);
                    ctx.font = `${t.size}px "Fredoka One", sans-serif`;
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = '#fff';
                    ctx.strokeText(t.text, t.x, t.y);
                    ctx.fillStyle = t.color;
                    ctx.fillText(t.text, t.x, t.y);
                }
                ctx.globalAlpha = 1;
            }

            // Little arrows at the screen edge point at the boss while it's off screen.
            function drawOffscreenArrows() {
                const e = game.boss;
                if (!e || (e.x > 0 && e.x < W && e.y > 0 && e.y < H)) return;
                const a = Math.atan2(e.y - H / 2, e.x - W / 2);
                const x = clamp(e.x, 30, W - 30), y = clamp(e.y, 90, H - 30);
                ctx.save();
                ctx.translate(x, y); ctx.rotate(a);
                ctx.globalAlpha = 0.6 + Math.sin(time * 0.2) * 0.3;
                ctx.fillStyle = e.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-10, 12); ctx.closePath();
                ctx.fill(); ctx.stroke();
                ctx.restore();
            }

            // ---------- HUD ----------
            function updateHud() {
                $('hp-fill').style.width = `${clamp((player.hp / player.maxHp) * 100, 0, 100)}%`;
                $('xp-fill').style.width = `${clamp((game.xp / game.xpToNext) * 100, 0, 100)}%`;
                $('hp-text').textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;
                $('xp-text').textContent = `${game.xp}/${game.xpToNext}`;
                $('lvl-num').textContent = game.level;
            }

            let lastBossPct = -1;
            function updateBossBar() {
                const pct = Math.round(clamp(game.boss.hp / game.boss.maxHp, 0, 1) * 100);
                if (pct === lastBossPct) return;
                lastBossPct = pct;
                $('boss-fill').style.width = `${pct}%`;
                $('boss-text').textContent = `${pct}%`;
            }

            function renderChips() {
                const box = $('chips');
                box.innerHTML = '';
                POWERS.forEach(p => {
                    const lvl = (player.levels && player.levels[p.id]) || 0;
                    if (!lvl || p.repeat) return;
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.title = T(p.name[0], p.name[1]);
                    chip.innerHTML = `<img src="${ICONS + p.img}" alt=""><span>${lvl}</span>`;
                    box.appendChild(chip);
                });
            }

            // ---------- Screens ----------
            function setState(next) {
                state = next;
                document.body.dataset.state = next;
            }

            function show(id) {
                ['start-overlay', 'upgrade-overlay', 'pause-overlay', 'over-overlay'].forEach(o => $(o).classList.toggle('active', o === id));
            }

            function startGame() {
                ensureAudio();
                clearSave();
                reset();
                setState('play');
                show(null);
                banner(T('Go, little star!', 'Vas-y, petite étoile !'));
            }

            // ---------- Save & continue ----------
            // The run is saved every few seconds and whenever the game is paused or left,
            // so closing the tab or a phone call never loses progress.
            const SAVE_KEY = 'bubbles-save';
            function saveGame() {
                if (state !== 'play' && state !== 'paused' && state !== 'levelup') return;
                const alive = enemies.filter(e => !e.dead);
                store.set(SAVE_KEY, JSON.stringify({
                    v: 1, w: W, h: H,
                    game: { level: game.level, xp: game.xp, xpToNext: game.xpToNext, time: game.time, pops: game.pops },
                    player,
                    enemies: alive,
                    boss: game.boss ? alive.indexOf(game.boss) : -1,
                    gems: gems.map(g => ({ x: g.x, y: g.y, value: g.value, kind: g.kind })),
                    pending: pendingLevelUps + (state === 'levelup' ? 1 : 0),
                    spawnTimer
                }));
            }
            function loadSave() {
                try {
                    const data = JSON.parse(store.get(SAVE_KEY, 'null'));
                    return data && data.v === 1 && data.game ? data : null;
                } catch (e) { return null; }
            }
            function clearSave() {
                try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage blocked */ }
                renderContinue();
            }
            function continueGame() {
                const data = loadSave();
                if (!data) { startGame(); return; }
                ensureAudio();
                reset();
                const sx = W / (data.w || W), sy = H / (data.h || H);
                Object.assign(game, data.game, { boss: null });
                Object.assign(player, data.player, { vx: 0, vy: 0 });
                player.x = clamp(player.x * sx, player.r, W - player.r);
                player.y = clamp(player.y * sy, player.r, H - player.r);
                target = { x: player.x, y: player.y };
                enemies = (data.enemies || []).map(e => Object.assign(e, { x: e.x * sx, y: e.y * sy, flash: 0, kx: 0, ky: 0, born: 1 }));
                if (data.boss >= 0 && enemies[data.boss]) {
                    game.boss = enemies[data.boss];
                    $('boss-bar').classList.add('show');
                    lastBossPct = -1;
                    updateBossBar();
                }
                gems = (data.gems || []).map(g => Object.assign(g, { x: g.x * sx, y: g.y * sy, vx: 0, vy: 0, spin: Math.random() * TAU, pulled: false, age: 20 }));
                pendingLevelUps = data.pending || 0;
                spawnTimer = data.spawnTimer || 30;
                renderChips();
                updateHud();
                setState('play');
                show(null);
                grace(150);
                banner(T('Welcome back!', 'Te revoilà !'));
            }
            function renderContinue() {
                const data = loadSave();
                const btn = $('continue-btn'), play = $('play-btn');
                btn.hidden = !data;
                if (data) {
                    btn.dataset.en = `▶ Continue · Level ${data.game.level}`;
                    btn.dataset.fr = `▶ Continuer · niveau ${data.game.level}`;
                    play.dataset.en = 'New game';
                    play.dataset.fr = 'Nouvelle partie';
                } else {
                    play.dataset.en = 'Play!';
                    play.dataset.fr = 'On joue !';
                }
                play.classList.toggle('alt', !!data);
                play.classList.toggle('small', !!data);
                btn.textContent = T(btn.dataset.en || '', btn.dataset.fr || '');
                play.textContent = T(play.dataset.en, play.dataset.fr);
            }

            let currentChoices = [];
            function openLevelUp() {
                setState('levelup');
                sound('level');
                confetti(player.x, player.y, 30);
                const avail = POWERS.filter(p => {
                    const lvl = player.levels[p.id] || 0;
                    if (lvl >= p.max) return false;
                    if (p.id === 'heal') return player.hp < player.maxHp * 0.7;
                    return true;
                });
                // Favour powers the child already likes a little, but keep it varied.
                const pool = avail.slice();
                if (pool.length < 3 && !pool.some(p => p.id === 'heal')) pool.push(POWERS.find(p => p.id === 'heal'));
                currentChoices = [];
                while (currentChoices.length < 3 && pool.length) {
                    const weights = pool.map(p => 1 + ((player.levels[p.id] || 0) > 0 ? 0.5 : 0));
                    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
                    let idx = 0;
                    while ((r -= weights[idx]) > 0) idx++;
                    currentChoices.push(pool.splice(idx, 1)[0]);
                }
                renderCards();
                $('upgrade-title').textContent = T(`Level ${game.level}!`, `Niveau ${game.level} !`);
                show('upgrade-overlay');
                setTimeout(() => { const first = document.querySelector('#cards .card'); if (first && !pointer.active) first.focus({ preventScroll: true }); }, 50);
            }

            function renderCards() {
                const box = $('cards');
                box.innerHTML = '';
                currentChoices.forEach((p, i) => {
                    const lvl = player.levels[p.id] || 0;
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'card';
                    card.style.setProperty('--c', p.color);
                    const pips = p.repeat ? '' : `<div class="pips">${Array.from({ length: p.max }, (_, n) =>
                        `<i class="${n < lvl ? 'on' : n === lvl ? 'next' : ''}"></i>`).join('')}</div>`;
                    card.innerHTML = `
                        <span class="card-key">${i + 1}</span>
                        ${lvl === 0 && !p.repeat ? `<span class="card-new">${T('New!', 'Nouveau !')}</span>` : ''}
                        <span class="card-icon"><img src="${ICONS + p.img}" alt=""></span>
                        <span class="card-text">
                            <span class="card-name">${T(p.name[0], p.name[1])}</span>
                            <span class="card-desc">${T(p.desc[0], p.desc[1])}</span>
                            ${pips}
                        </span>`;
                    card.addEventListener('click', () => choose(p));
                    box.appendChild(card);
                });
            }

            function choose(p) {
                if (state !== 'levelup') return;
                p.apply(player);
                player.levels[p.id] = (player.levels[p.id] || 0) + 1;
                sound('pick');
                floatText(player.x, player.y - player.r - 10, T(p.name[0], p.name[1]), p.color, 22);
                ring(player.x, player.y, 90, p.color);
                renderChips();
                updateHud();
                show(null);
                setState('play');
                grace(150);
                saveGame();
            }

            function pause() {
                if (state !== 'play') return;
                setState('paused');
                show('pause-overlay');
                saveGame();
            }

            function resume() {
                if (state !== 'paused') return;
                setState('play');
                show(null);
                ensureAudio();
            }

            function gameOver() {
                setState('over');
                clearSave();
                sound('over');
                addShake(14);
                confetti(player.x, player.y, 24);
                const isBest = game.level > bestLevel;
                if (isBest) { bestLevel = game.level; store.set('bubbles-best', String(bestLevel)); }
                $('sum-level').textContent = game.level;
                $('sum-pops').textContent = game.pops;
                const s = Math.floor(game.time);
                $('sum-time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
                $('new-best').hidden = !isBest;
                $('boss-bar').classList.remove('show');
                renderBest();
                setTimeout(() => { if (state === 'over') show('over-overlay'); }, 700);
            }

            function renderBest() {
                const text = bestLevel ? T(`🏆 Best: Level ${bestLevel}`, `🏆 Record : niveau ${bestLevel}`) : '';
                $('best-start').textContent = text;
                $('best-over').textContent = text;
            }

            // ---------- Input ----------
            function toWorld(e) { return { x: e.clientX, y: e.clientY }; }

            canvas.addEventListener('pointerdown', e => {
                ensureAudio();
                if (state !== 'play') return;
                const p = toWorld(e);
                pointer.active = true;
                pointer.type = e.pointerType;
                if (e.pointerType === 'mouse') {
                    target.x = p.x; target.y = p.y;
                } else {
                    // Touch steers relative to where the finger lands, so the star is never hidden under it.
                    pointer.startX = p.x; pointer.startY = p.y;
                    pointer.px = player.x; pointer.py = player.y;
                    target.x = player.x; target.y = player.y;
                }
                try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            });

            canvas.addEventListener('pointermove', e => {
                if (state !== 'play') return;
                const p = toWorld(e);
                if (e.pointerType === 'mouse') {
                    target.x = p.x; target.y = p.y;
                } else if (pointer.active) {
                    const gain = 1.35;
                    target.x = clamp(pointer.px + (p.x - pointer.startX) * gain, 0, W);
                    target.y = clamp(pointer.py + (p.y - pointer.startY) * gain, 0, H);
                }
            });

            const endPointer = () => { pointer.active = false; };
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);

            window.addEventListener('keydown', e => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && state === 'play') e.preventDefault();
                keys.add(e.code);
                if (state === 'levelup' && /^Digit[1-3]$/.test(e.code)) {
                    const p = currentChoices[Number(e.code.slice(5)) - 1];
                    if (p) choose(p);
                } else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') pause();
                else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'paused') resume();
                // Keyboard mashing on the menu resumes a saved game rather than wiping it.
                else if ((e.code === 'Enter' || e.code === 'Space') && state === 'menu' && document.activeElement === document.body) {
                    if (loadSave()) continueGame(); else startGame();
                }
            });
            window.addEventListener('keyup', e => keys.delete(e.code));
            window.addEventListener('blur', () => { keys.clear(); pause(); });
            document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); saveGame(); } });
            window.addEventListener('pagehide', saveGame);
            setInterval(saveGame, 2000);

            $('continue-btn').addEventListener('click', continueGame);
            $('play-btn').addEventListener('click', startGame);
            $('again-btn').addEventListener('click', startGame);
            $('resume-btn').addEventListener('click', resume);
            $('restart-btn').addEventListener('click', startGame);
            $('pause-btn').addEventListener('click', () => { if (state === 'play') pause(); else resume(); });
            $('mute-btn').addEventListener('click', () => { ensureAudio(); setMuted(!muted); });

            BabyLang.onChange(() => {
                renderBest();
                renderContinue();
                renderChips();
                if (state === 'levelup') {
                    renderCards();
                    $('upgrade-title').textContent = T(`Level ${game.level}!`, `Niveau ${game.level} !`);
                }
            });

            // ---------- Loop ----------
            let last = performance.now();
            function frame(now) {
                const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
                last = now;
                const k = dt * 60;
                if (state === 'play') update(k);
                if (state !== 'paused') updateFx(k);
                draw();
                requestAnimationFrame(frame);
            }

            // ---------- Helpers ----------
            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
            function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
            function roundRect(x, y, w, h, r) {
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), h, r);
                else ctx.rect(x, y, Math.max(0, w), h);
            }
            const lightCache = {};
            function lighten(hex) {
                if (lightCache[hex]) return lightCache[hex];
                const n = parseInt(hex.slice(1), 16);
                const mix = c => Math.round(c + (255 - c) * 0.55);
                return (lightCache[hex] = `rgb(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)})`);
            }

            resize();
            reset();
            setMuted(muted);
            renderBest();
            renderContinue();
            window.addEventListener('resize', resize);
            requestAnimationFrame(frame);
        }());
    </script>
</body>
</html>
