<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A gentle toddler animal wash. Rub away mud, make bubbles, and rinse happy animals. No timers or losing.">
    <title>Wash the Animals - ba-by.ca</title>
    <link rel="stylesheet" href="/assets/css/toddler-play.css?v=20261008-mobile1">
    <script defer src="/assets/js/toddler-loader.js?v=20261008-mobile1"></script>
</head>
<body data-game="wash">
    <nav class="topbar" aria-label="Game settings">
        <a class="home" href="/" aria-label="Back to games">🏠</a>
        <div class="settings">
            <button type="button" data-language="en" aria-label="English" aria-pressed="true">EN</button>
            <button type="button" data-language="fr" aria-label="Français" aria-pressed="false">FR</button>
            <button type="button" id="sound" aria-label="Sound on" aria-pressed="true">🔊</button>
            <button type="button" id="help" aria-label="Hear instructions">💬</button>
        </div>
    </nav>
    <main class="game">
        <div id="game-loading" role="status" aria-live="polite" style="padding:16px;text-align:center;background:white;color:#31415a;border-radius:16px">
            <p id="loading-detail">Opening your game... / Le jeu arrive...</p>
            <button type="button" style="min-height:48px;padding:12px" onclick="var url = new window.URL(location.href); url.searchParams.set('reload', Date.now()); location.replace(url.href);">Reload game / Recharger</button>
        </div>
        <header class="heading"><h1 id="title">Wash the Animals</h1><p id="instruction">Rub the muddy spots!</p></header>
        <div id="stage" class="stage rub-area" tabindex="0" role="button" aria-label="Rub the muddy animal"></div>
        <div id="controls" class="toolbar" aria-label="Washing tools"></div>
        <div id="palette" class="palette"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <noscript>Please enable JavaScript to play.</noscript>
    </main>
</body>
</html>
