<!DOCTYPE html>
<html lang="en" data-title-fr="Le bain des animaux">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A gentle bath game: scrub the mud off a puppy, piglet, kitten or bunny, rinse, dry and dress them up. No timers or losing.">
    <title>Animal Wash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛁</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #DDF3FF; }
        #bath { gap: 12px; }
        /* The bath friends: always on screen, tap one to swap who is in the tub. */
        .friends { display: flex; gap: 10px; justify-content: center; }
        .friend { width: 66px; height: 66px; border: 0; border-radius: 50%; background: #fff; font-size: 38px; line-height: 1; display: grid; place-items: center; padding: 0; box-shadow: 0 5px 0 rgba(61,53,81,0.12); transition: transform 0.15s; }
        .friend:hover { transform: translateY(-3px) rotate(-6deg); }
        .friend[aria-pressed="true"] { box-shadow: 0 5px 0 var(--c-d), 0 0 0 4px var(--c); transform: scale(1.1); }
        .friend[aria-pressed="true"] span { animation: kit-bob 2.4s ease-in-out infinite; display: inline-block; }
        .stage { position: relative; width: 100%; max-width: min(760px, calc((100vh - 330px) * 1.25)); max-width: min(760px, calc((100dvh - 330px) * 1.25)); min-width: min(100%, 280px); border-radius: 34px; overflow: hidden; background: linear-gradient(180deg, #FFF7EC 0%, #FFE9D0 62%, #CFEFFF 62%, #A9E0FF 100%); box-shadow: 0 10px 0 rgba(61,53,81,0.1); touch-action: none; }
        .stage svg { display: block; width: 100%; height: auto; }
        .tool-cursor { position: absolute; z-index: 3; font-size: 64px; line-height: 1; pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg); filter: drop-shadow(0 6px 4px rgba(61,53,81,0.25)); transition: opacity 0.2s; }
        .tool-cursor.idle { opacity: 0; }
        .rubbing .tool-cursor { animation: scrub 0.25s ease-in-out infinite alternate; }
        @keyframes scrub { to { transform: translate(-46%, -54%) rotate(10deg); } }
        /* Tools: any one, any time. The one that helps next gently pulses. */
        .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .tool { position: relative; width: 74px; height: 74px; border: 0; border-radius: 24px; background: #fff; font-size: 40px; line-height: 1; padding: 0; box-shadow: 0 5px 0 rgba(61,53,81,0.12); transition: transform 0.15s; }
        .tool[aria-pressed="true"] { box-shadow: 0 5px 0 var(--blue-d), 0 0 0 4px var(--blue); transform: translateY(-3px); }
        .tool.hint:not([aria-pressed="true"])::after { content: ''; position: absolute; inset: -6px; border-radius: 28px; border: 4px solid var(--sun); animation: hint 1.4s ease-out infinite; pointer-events: none; }
        @keyframes hint { 0% { opacity: 0.9; transform: scale(0.92); } 100% { opacity: 0; transform: scale(1.15); } }
        .wear { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .wear button { width: 64px; height: 64px; border: 0; border-radius: 22px; background: #fff; font-size: 36px; padding: 0; box-shadow: 0 5px 0 rgba(61,53,81,0.12); }
        .wear button[aria-pressed="true"] { box-shadow: 0 5px 0 var(--pink-d), 0 0 0 4px var(--pink); }
        .pet { transform-origin: 200px 250px; }
        .pet.giggle { animation: giggle 0.6s ease-in-out; }
        .pet.hop-in { animation: hop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes giggle { 25% { transform: rotate(-4deg) scale(1.02); } 75% { transform: rotate(4deg) scale(1.02); } }
        @keyframes hop-in { from { transform: translateY(-120px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
        .duck { cursor: pointer; animation: bob-duck 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes bob-duck { 50% { transform: translateY(-6px) rotate(-6deg); } }
        .shine { animation: shine 1.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
        @keyframes shine { 0% { opacity: 0; transform: scale(0.2); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4) rotate(40deg); } }
        @media (max-width: 560px) {
            .friend { width: 56px; height: 56px; font-size: 32px; }
            .tool { width: 58px; height: 58px; font-size: 32px; border-radius: 20px; }
            .wear button { width: 52px; height: 52px; font-size: 30px; border-radius: 18px; }
            .stage { max-width: 100%; }
        }
        /* Wide screens: friends on the left, tools on the right, a big tub in the middle. */
        @media (orientation: landscape) and (min-width: 640px) {
            #bath { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); align-items: center; justify-items: center; column-gap: 18px; row-gap: 10px; padding: calc(var(--safe-top) + 4px) var(--safe-right) var(--safe-bottom) var(--safe-left); height: 100vh; height: 100dvh; }
            #bath .kit-prompt { grid-column: 2; grid-row: 1; max-width: min(100%, 560px); }
            .friends { grid-column: 1; grid-row: 1 / 3; flex-direction: column; padding-top: 56px; }
            .stage { grid-column: 2; grid-row: 2; max-width: min(100%, 900px, calc((100vh - 130px) * 1.25)); max-width: min(100%, 900px, calc((100dvh - 130px) * 1.25)); }
            .side { grid-column: 3; grid-row: 1 / 3; padding-top: 56px; }
            .tools { display: grid; grid-template-columns: repeat(2, 74px); }
            .wear { display: grid; grid-template-columns: repeat(2, 64px); }
        }
        @media (orientation: landscape) and (max-height: 600px) {
            #bath { column-gap: 14px; row-gap: 6px; padding-bottom: 8px; }
            .stage { max-width: min(100%, calc((100dvh - 90px) * 1.25)); }
            .side { gap: 8px; }
            .tools { display: grid; grid-template-columns: repeat(2, 58px); gap: 8px; }
            .tool { width: 58px; height: 58px; font-size: 30px; border-radius: 20px; }
            .wear { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
            .wear button { width: 44px; height: 44px; font-size: 24px; border-radius: 14px; }
            .friend { width: 52px; height: 52px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <main class="kit-screen" id="bath">
        <div class="friends" id="friends" role="group" aria-label="Bath friends" data-fr-aria-label="Les amis du bain"></div>
        <div class="kit-prompt"><span id="prompt"></span><button type="button" class="kit-say" id="say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="stage" id="stage" role="button" tabindex="0" aria-label="Bath. Rub with the tool." data-fr-aria-label="Bain. Frotte avec l'outil."><div class="tool-cursor idle" id="cursor"></div></div>
        <div class="side">
            <div class="tools" id="tools" role="group" aria-label="Bath tools" data-fr-aria-label="Outils du bain"></div>
            <div class="wear" id="wear" hidden></div>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const PETS = {
            puppy: { e: '🐶', name: ['Puppy', 'Chiot'], hi: ['Woof! Hi, I am Puppy!', `Ouaf${NBSP}! Salut, je suis le chiot${NBSP}!`], c: '#FFB627', cd: '#D99100', fur: '#F2B96B', dark: '#C9873E', belly: '#FFE2B5', nose: '#3D3551' },
            piglet: { e: '🐷', name: ['Piglet', 'Cochonnet'], hi: ['Oink! Hi, I am Piglet!', `Groin${NBSP}! Salut, je suis le cochonnet${NBSP}!`], c: '#FF8FB1', cd: '#E0688D', fur: '#FFB3C6', dark: '#F07FA0', belly: '#FFD6E2', nose: '#F07FA0' },
            kitten: { e: '🐱', name: ['Kitten', 'Chaton'], hi: ['Meow! Hi, I am Kitten!', `Miaou${NBSP}! Salut, je suis le chaton${NBSP}!`], c: '#A66BFF', cd: '#7B45D6', fur: '#B8A9D9', dark: '#8C79C2', belly: '#EDE6FF', nose: '#FF8FB1' },
            bunny: { e: '🐰', name: ['Bunny', 'Lapin'], hi: ['Hop hop! Hi, I am Bunny!', `Hop hop${NBSP}! Salut, je suis le lapin${NBSP}!`], c: '#3FC9C0', cd: '#2AA198', fur: '#F4F4F8', dark: '#C9C9D9', belly: '#FFFFFF', nose: '#FF8FB1' }
        };
        const TOOLS = [
            { id: 'sponge', e: '🧽', name: ['Sponge', 'Éponge'] },
            { id: 'shower', e: '🚿', name: ['Shower', 'Douche'] },
            { id: 'towel', e: '🧺', name: ['Towel', 'Serviette'] },
            { id: 'dress', e: '🎀', name: ['Dress up', 'Déguisement'] },
            { id: 'mud', e: '🟤', name: ['Mud', 'Boue'] }
        ];
        const WEAR = [
            { id: 'hat', e: '👒', x: 200, y: 52, s: 70 }, { id: 'bow', e: '🎀', x: 150, y: 72, s: 46 },
            { id: 'glasses', e: '🕶️', x: 200, y: 122, s: 64 }, { id: 'crown', e: '👑', x: 200, y: 50, s: 60 },
            { id: 'scarf', e: '🧣', x: 200, y: 182, s: 64 }, { id: 'flower', e: '🌸', x: 252, y: 78, s: 42 }
        ];
        const NS = 'http://www.w3.org/2000/svg';

        function petSVG(kind) {
            const p = PETS[kind];
            const ears = {
                puppy: `<ellipse cx="138" cy="112" rx="24" ry="48" fill="${p.dark}" transform="rotate(22 138 112)"/><ellipse cx="262" cy="112" rx="24" ry="48" fill="${p.dark}" transform="rotate(-22 262 112)"/>`,
                piglet: `<path d="M140 78 L150 34 L184 62 Z" fill="${p.dark}"/><path d="M260 78 L250 34 L216 62 Z" fill="${p.dark}"/>`,
                kitten: `<path d="M140 86 L146 30 L188 64 Z" fill="${p.fur}"/><path d="M152 76 L154 46 L176 64 Z" fill="${p.nose}"/><path d="M260 86 L254 30 L212 64 Z" fill="${p.fur}"/><path d="M248 76 L246 46 L224 64 Z" fill="${p.nose}"/>`,
                bunny: `<ellipse cx="170" cy="36" rx="18" ry="56" fill="${p.fur}"/><ellipse cx="170" cy="40" rx="9" ry="40" fill="${p.nose}" opacity="0.6"/><ellipse cx="230" cy="36" rx="18" ry="56" fill="${p.fur}"/><ellipse cx="230" cy="40" rx="9" ry="40" fill="${p.nose}" opacity="0.6"/>`
            }[kind];
            const snout = kind === 'piglet'
                ? `<ellipse cx="200" cy="146" rx="30" ry="20" fill="${p.dark}"/><ellipse cx="190" cy="146" rx="5" ry="7" fill="#C2557A"/><ellipse cx="210" cy="146" rx="5" ry="7" fill="#C2557A"/>`
                : kind === 'puppy'
                    ? `<ellipse cx="200" cy="148" rx="28" ry="20" fill="${p.belly}"/><ellipse cx="200" cy="140" rx="12" ry="8" fill="${p.nose}"/>`
                    : `<path d="M192 138 L208 138 L200 148 Z" fill="${p.nose}"/>${kind === 'kitten' ? '<path d="M150 146 L118 140 M150 154 L118 158 M250 146 L282 140 M250 154 L282 158" stroke="#3D3551" stroke-width="3" stroke-linecap="round"/>' : ''}`;
            return `<g class="pet" id="pet">
                <ellipse cx="200" cy="222" rx="100" ry="76" fill="${p.fur}"/>
                <ellipse cx="200" cy="232" rx="58" ry="46" fill="${p.belly}"/>
                ${ears}
                <circle cx="200" cy="120" r="72" fill="${p.fur}"/>
                <circle cx="174" cy="114" r="10" fill="#3D3551"/><circle cx="226" cy="114" r="10" fill="#3D3551"/>
                <circle cx="177" cy="110" r="3.5" fill="#fff"/><circle cx="229" cy="110" r="3.5" fill="#fff"/>
                <ellipse cx="150" cy="140" rx="14" ry="9" fill="#FF8FB1" opacity="0.5"/><ellipse cx="250" cy="140" rx="14" ry="9" fill="#FF8FB1" opacity="0.5"/>
                ${snout}
                <path d="M186 160 Q200 172 214 160" fill="none" stroke="#3D3551" stroke-width="4" stroke-linecap="round"/>
            </g>`;
        }
        function sceneSVG(kind) {
            return `<svg viewBox="0 0 400 320" id="scene" aria-hidden="true">
                <rect x="20" y="20" width="60" height="44" rx="10" fill="#fff" opacity="0.8"/><rect x="320" y="30" width="56" height="40" rx="10" fill="#fff" opacity="0.8"/>
                ${petSVG(kind)}
                <g id="mud"></g><g id="bubbles"></g><g id="drops"></g><g id="worn"></g><g id="sparkles"></g>
                <path d="M30 240 H370 Q366 308 300 312 H100 Q34 308 30 240 Z" fill="#fff"/>
                <path d="M30 240 H370" stroke="#BFE3F5" stroke-width="10" stroke-linecap="round"/>
                <rect x="70" y="306" width="18" height="12" rx="4" fill="#C9D6E2"/><rect x="312" y="306" width="18" height="12" rx="4" fill="#C9D6E2"/>
                <g class="duck" id="duck"><ellipse cx="330" cy="236" rx="22" ry="14" fill="#FFD54A"/><circle cx="342" cy="220" r="11" fill="#FFD54A"/><path d="M351 220 l10 3 l-10 3 Z" fill="#FF9F43"/><circle cx="345" cy="217" r="2" fill="#3D3551"/></g>
            </svg>`;
        }

        Kit.topbar();
        Kit.tint('#DDF3FF');

        // Each friend remembers its own mud, bubbles, drops and outfit while the child swaps between them.
        const state = {};
        let pet = 'puppy', tool = 'sponge', rubbing = null, giggleAt = 0, cleanCheered = false;
        const S = () => state[pet];
        const svgEl = () => $('#scene');
        function add(parent, tag, attrs) {
            const el = document.createElementNS(NS, tag);
            Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
            parent.appendChild(el);
            return el;
        }
        // Spots on the head and body where mud, bubbles and drops can sit.
        function spots(n, avoid = []) {
            const list = [];
            let guard = 0;
            while (list.length < n && guard++ < 400) {
                const onHead = Math.random() < 0.45;
                const x = onHead ? 200 + (Math.random() - 0.5) * 120 : 200 + (Math.random() - 0.5) * 170;
                const y = onHead ? 120 + (Math.random() - 0.5) * 110 : 205 + Math.random() * 35;
                if ([...list, ...avoid].every(p => Math.hypot(p.x - x, p.y - y) > 30)) list.push({ x, y });
            }
            return list;
        }
        const mudPath = (x, y, r) => `M${x - r} ${y} Q${x - r - 6} ${y - r} ${x} ${y - r + 2} Q${x + r + 8} ${y - r - 4} ${x + r} ${y + 2} Q${x + r + 4} ${y + r} ${x + 2} ${y + r - 2} Q${x - r - 4} ${y + r + 6} ${x - r} ${y} Z`;

        // Draw the friend's saved dirt (data only, so it survives swapping friends).
        function drawDirt() {
            ['mud', 'bubbles', 'drops'].forEach(id => { $('#' + id).innerHTML = ''; });
            S().items.forEach(it => {
                if (it.type === 'mud') it.el = add($('#mud'), 'path', { d: mudPath(it.x, it.y, it.r), fill: it.shade });
                else if (it.type === 'bubble') it.el = add($('#bubbles'), 'circle', { cx: it.x, cy: it.y, r: it.r, fill: '#fff', 'fill-opacity': 0.8, stroke: '#9AD7F5', 'stroke-width': 3 });
                else it.el = add($('#drops'), 'path', { d: `M${it.x} ${it.y - 14} Q${it.x + 10} ${it.y} ${it.x} ${it.y + 8} Q${it.x - 10} ${it.y} ${it.x} ${it.y - 14} Z`, fill: '#5BC0F5' });
            });
        }
        function addItem(type, x, y) {
            const it = { type, x, y, r: type === 'mud' ? 16 + Math.random() * 10 : 8 + Math.random() * 10, shade: Math.random() < 0.5 ? '#8B5E3C' : '#A47148' };
            S().items.push(it);
            if (type === 'mud') it.el = add($('#mud'), 'path', { d: mudPath(x, y, it.r), fill: it.shade });
            else if (type === 'bubble') it.el = add($('#bubbles'), 'circle', { cx: x, cy: y, r: it.r, fill: '#fff', 'fill-opacity': 0.8, stroke: '#9AD7F5', 'stroke-width': 3 });
            else it.el = add($('#drops'), 'path', { d: `M${x} ${y - 14} Q${x + 10} ${y} ${x} ${y + 8} Q${x - 10} ${y} ${x} ${y - 14} Z`, fill: '#5BC0F5' });
            return it;
        }
        const count = type => S().items.filter(it => it.type === type).length;

        // What would help next: mud → sponge, bubbles → shower, drops → towel, clean → dress up.
        function nextTool() {
            if (count('mud')) return 'sponge';
            if (count('bubble')) return 'shower';
            if (count('drop')) return 'towel';
            return 'dress';
        }
        const LINES = {
            sponge: ['Rub with the sponge! Scrub off the mud!', `Frotte avec l'éponge${NBSP}! Enlève la boue${NBSP}!`],
            shower: ['Rinse off the bubbles with the shower!', `Rince les bulles avec la douche${NBSP}!`],
            towel: ['Dry with the towel!', `Sèche avec la serviette${NBSP}!`],
            dress: ['All clean! Pick something to wear, or splash some mud!', `Tout propre${NBSP}! Choisis un habit, ou remets de la boue${NBSP}!`]
        };
        function renderPrompt() {
            const n = nextTool();
            $('#prompt').textContent = T(...LINES[n]);
            document.querySelectorAll('.tool').forEach(b => b.classList.toggle('hint', b.dataset.t === n));
        }
        function renderTools() {
            $('#tools').innerHTML = TOOLS.map(t => `<button type="button" class="tool" data-t="${t.id}" aria-pressed="${t.id === tool}" aria-label="${T(...t.name)}">${t.e}</button>`).join('');
            $('#cursor').textContent = tool === 'dress' ? '' : TOOLS.find(t => t.id === tool).e;
            $('#wear').hidden = tool !== 'dress';
            renderPrompt();
        }
        function renderFriends() {
            $('#friends').innerHTML = Object.entries(PETS).map(([id, p]) => `<button type="button" class="friend" data-pet="${id}" style="--c:${p.c};--c-d:${p.cd}" aria-pressed="${id === pet}" aria-label="${T(...p.name)}"><span>${p.e}</span></button>`).join('');
        }
        function setTool(id, speak) {
            tool = id;
            renderTools();
            if (id === 'dress') renderWear();
            if (speak) say(...(id === 'mud' ? ['Splat! Make it muddy!', `Splat${NBSP}! Plein de boue${NBSP}!`] : LINES[id] || TOOLS.find(t => t.id === id).name));
        }
        function sayHint() { say(...LINES[nextTool()]); }

        function shine(n) {
            for (let i = 0; i < n; i++) {
                const { x, y } = spots(1)[0] || { x: 200, y: 140 };
                const t = add($('#sparkles'), 'text', { x, y, 'font-size': 26, class: 'shine', 'text-anchor': 'middle' });
                t.textContent = '✨';
                t.style.animationDelay = `${i * 0.12}s`;
                setTimeout(() => t.remove(), 1700 + i * 120);
            }
        }

        // A part of the bath is done: cheer a little, then pick the tool that helps next.
        let stageCheerAt = 0;
        function afterClean(type) {
            if (count(type)) return;
            const lines = { mud: ['No more mud!', `Plus de boue${NBSP}!`], bubble: ['Squeaky clean!', `Tout propre${NBSP}!`], drop: ['All dry and fluffy!', `Tout sec et tout doux${NBSP}!`] };
            if (performance.now() - stageCheerAt < 400) return;
            stageCheerAt = performance.now();
            const n = nextTool();
            if (n === 'dress' && !cleanCheered) {
                cleanCheered = true;
                sfx.fanfare();
                Kit.confetti(90);
                Kit.cheer(T('🛁 All clean!', `🛁 Tout propre${NBSP}!`), 1500);
                shine(8);
                Kit.bounce($('#pet'), 'giggle');
                say(...LINES.dress);
            } else {
                sfx.cheer();
                shine(5);
                Kit.bounce($('#pet'), 'giggle');
                say(...lines[type]);
            }
            // Gently hand over the next tool, so a toddler can keep rubbing.
            setTimeout(() => { if (tool === { mud: 'sponge', bubble: 'shower', drop: 'towel' }[type]) setTool(n, false); else renderPrompt(); }, 700);
        }

        // ---------- Rubbing ----------
        function toScene(event) {
            const m = svgEl().getScreenCTM();
            return m ? new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse()) : { x: 0, y: 0 };
        }
        function moveCursor(event) {
            const r = $('#stage').getBoundingClientRect();
            $('#cursor').style.left = event.clientX - r.left + 'px';
            $('#cursor').style.top = event.clientY - r.top + 'px';
        }
        const onPet = p => Math.hypot(p.x - 200, p.y - 120) < 90 || (Math.abs(p.x - 200) < 110 && p.y > 150 && p.y < 300);
        let lastRubSound = 0, lastSplat = 0;
        function rubAt(p) {
            if (tool === 'dress') return;
            const now = performance.now();
            if (tool === 'mud') {
                if (!onPet(p) || now - lastSplat < 120) return;
                lastSplat = now;
                const splat = addItem('mud', p.x + (Math.random() - 0.5) * 16, p.y + (Math.random() - 0.5) * 16);
                splat.el.animate([{ transform: 'scale(0.2)' }, { transform: 'scale(1)' }], { duration: 250, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
                splat.el.style.transformBox = 'fill-box';
                splat.el.style.transformOrigin = 'center';
                Kit.noise({ dur: 0.12, freq: 500, q: 1.2, vol: 0.12 });
                cleanCheered = false;
                renderPrompt();
                return;
            }
            const removes = { sponge: ['mud'], shower: ['bubble', 'mud'], towel: ['drop'] }[tool];
            const gone = { mud: 0, bubble: 0, drop: 0 };
            S().items = S().items.filter(it => {
                if (removes.includes(it.type) && Math.hypot(it.x - p.x, it.y - p.y) < (it.type === 'mud' && tool === 'shower' ? 30 : 44)) {
                    it.el.remove();
                    gone[it.type]++;
                    return false;
                }
                return true;
            });
            if (now - lastRubSound > 140) {
                lastRubSound = now;
                if (tool === 'sponge') Kit.noise({ dur: 0.12, freq: 2400, vol: 0.05 });
                else if (tool === 'shower') {
                    Kit.noise({ dur: 0.18, freq: 3200, q: 0.4, vol: 0.06 });
                    add($('#sparkles'), 'circle', { cx: p.x, cy: p.y + 10, r: 4, fill: '#7FD0F7' }).animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(60px)', opacity: 0 }], { duration: 600 }).onfinish = function () { this.effect.target.remove(); };
                } else Kit.noise({ dur: 0.1, freq: 800, vol: 0.04 });
            }
            // Scrubbing mud makes foam; rinsing foam leaves water drops to dry.
            if (gone.mud && tool === 'sponge') for (let i = 0; i < gone.mud; i++) addItem('bubble', p.x + (Math.random() - 0.5) * 30, p.y + (Math.random() - 0.5) * 30);
            if ((gone.bubble || gone.mud) && tool === 'shower' && Math.random() < 0.8) addItem('drop', p.x + (Math.random() - 0.5) * 26, p.y + (Math.random() - 0.5) * 20);
            const cleaned = gone.mud + gone.bubble + gone.drop;
            if (cleaned) {
                sfx.plink(Math.floor(Math.random() * 8));
                const r = svgEl().getBoundingClientRect();
                Kit.burst(r.left + p.x / 400 * r.width, r.top + p.y / 320 * r.height, tool === 'sponge' ? ['#fff', '#BFE3F5'] : ['#7FD0F7', '#fff'], 6, 0.6);
                Object.keys(gone).forEach(type => { if (gone[type]) afterClean(type); });
                renderPrompt();
            }
        }
        $('#stage').addEventListener('pointerdown', event => {
            const target = event.target;
            if (target.closest && target.closest('#duck')) { sfx.squeak(); Kit.bounce($('#duck')); return; }
            if (rubbing !== null || !event.isPrimary) return;
            event.preventDefault();
            rubbing = { id: event.pointerId, moved: 0, x: event.clientX, y: event.clientY };
            try { $('#stage').setPointerCapture(event.pointerId); } catch (e) { /* ignore */ }
            $('#stage').classList.add('rubbing');
            if (tool !== 'dress') $('#cursor').classList.remove('idle');
            moveCursor(event);
            rubAt(toScene(event));
        });
        $('#stage').addEventListener('pointermove', event => {
            if (event.pointerType === 'mouse' && rubbing === null && tool !== 'dress') { $('#cursor').classList.remove('idle'); moveCursor(event); }
            if (!rubbing || event.pointerId !== rubbing.id) return;
            rubbing.moved += Math.hypot(event.clientX - rubbing.x, event.clientY - rubbing.y);
            rubbing.x = event.clientX; rubbing.y = event.clientY;
            moveCursor(event);
            rubAt(toScene(event));
        });
        const stopRub = event => {
            if (!rubbing || (event && event.pointerId !== rubbing.id)) return;
            // A tap (no rubbing) on the pet makes it giggle.
            if (rubbing.moved < 8 && event && event.target.closest && event.target.closest('#pet') && tool !== 'mud' && performance.now() - giggleAt > 600) {
                giggleAt = performance.now();
                Kit.bounce($('#pet'), 'giggle');
                Kit.tone(660, { to: 880, dur: 0.12, vol: 0.1 }); Kit.tone(880, { at: 0.12, to: 740, dur: 0.12, vol: 0.1 });
            }
            rubbing = null;
            $('#stage').classList.remove('rubbing');
            if (event && event.pointerType !== 'mouse') $('#cursor').classList.add('idle');
        };
        $('#stage').addEventListener('pointerup', stopRub);
        $('#stage').addEventListener('pointercancel', stopRub);
        $('#stage').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !rubbing) $('#cursor').classList.add('idle'); });
        // Keyboard: Space / Enter uses the tool on the next spot.
        $('#stage').addEventListener('keydown', event => {
            if (event.key !== ' ' && event.key !== 'Enter') return;
            event.preventDefault();
            const types = { sponge: 'mud', shower: 'bubble', towel: 'drop' };
            const it = S().items.find(i => i.type === types[tool]);
            if (it) rubAt({ x: it.x, y: it.y });
            else if (tool === 'mud') rubAt(spots(1)[0]);
        });

        // ---------- Dress up ----------
        function renderWear() {
            const worn = S().worn;
            $('#wear').innerHTML = WEAR.map(w => `<button type="button" data-id="${w.id}" aria-pressed="${worn.has(w.id)}" aria-label="${w.id}">${w.e}</button>`).join('');
            $('#worn').innerHTML = '';
            WEAR.filter(w => worn.has(w.id)).forEach(w => { const t = add($('#worn'), 'text', { x: w.x, y: w.y, 'font-size': w.s, 'text-anchor': 'middle', 'dominant-baseline': 'middle' }); t.textContent = w.e; });
        }
        $('#wear').addEventListener('click', event => {
            const b = event.target.closest('button');
            if (!b) return;
            const id = b.dataset.id, worn = S().worn;
            if (worn.has(id)) worn.delete(id);
            else {
                worn.add(id);
                if (id === 'hat') worn.delete('crown');
                if (id === 'crown') worn.delete('hat');
            }
            renderWear();
            sfx.pop();
            Kit.bounce($('#pet'), 'giggle');
            if (worn.has(id)) { shine(3); say('So cute!', `Trop mignon${NBSP}!`); }
        });
        $('#tools').addEventListener('click', event => {
            const b = event.target.closest('.tool');
            if (!b) return;
            sfx.pop();
            setTool(b.dataset.t, true);
        });
        $('#say').addEventListener('click', sayHint);

        // ---------- Friends ----------
        function freshFriend() {
            const items = [];
            spots(11).forEach(({ x, y }) => items.push({ type: 'mud', x, y, r: 18 + Math.random() * 10, shade: Math.random() < 0.5 ? '#8B5E3C' : '#A47148' }));
            return { items, worn: new Set() };
        }
        function openFriend(kind, greet) {
            pet = kind;
            if (!state[kind]) state[kind] = freshFriend();
            cleanCheered = nextTool() === 'dress';
            $('#stage').querySelectorAll('svg').forEach(s => s.remove());
            $('#stage').insertAdjacentHTML('afterbegin', sceneSVG(kind));
            drawDirt();
            renderWear();
            renderFriends();
            setTool(nextTool(), false);
            if (greet) {
                Kit.bounce($('#pet'), 'hop-in');
                sfx.splash();
                say(PETS[kind].hi[0] + ' ' + LINES[nextTool()][0], PETS[kind].hi[1] + ' ' + LINES[nextTool()][1]);
            }
        }
        $('#friends').addEventListener('click', event => {
            const b = event.target.closest('.friend');
            if (!b || b.dataset.pet === pet) { if (b) Kit.bounce($('#pet'), 'giggle'); return; }
            sfx.pop();
            openFriend(b.dataset.pet, true);
        });

        Kit.onLang(() => { renderFriends(); renderTools(); });
        Kit.show($('#bath'), { back: false });
        openFriend('puppy', false);
    }());
    </script>
</body>
