<!DOCTYPE html>
<html lang="en" data-title-fr="Chiffres 1-2-3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Count from 1 to 10 with hopping friends, answer how many, and feed hungry animals. English, French, Tagalog, Arabic and Ilokano voices.">
    <title>Numbers 1-2-3</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #E2F0FF; }
        .num { border: 0; padding: 0; background: none; width: 100%; aspect-ratio: 1; transition: transform 0.15s; animation: kit-rise 0.4s backwards; }
        .num svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 6px rgba(61,53,81,0.15)); }
        .num:active { transform: scale(0.92); }
        .num-digit { font-family: 'Fredoka One', system-ui, sans-serif; }

        .voices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .voice { border: 3px solid #fff; border-radius: 999px; padding: 8px 16px; background: rgba(255,255,255,0.8); font-weight: 900; box-shadow: 0 4px 0 rgba(61,53,81,0.1); }
        .voice[aria-pressed="true"] { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); }

        /* Stage where friends hop in to be counted */
        .stage {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 210px;
            border-radius: 34px;
            background: linear-gradient(180deg, #BFE8FF 0%, #E6F6FF 60%, #B7E59B 60.5%, #9AD77D 100%);
            box-shadow: 0 8px 0 rgba(61,53,81,0.08);
            display: flex;
            flex-wrap: wrap;
            align-content: flex-end;
            justify-content: center;
            gap: 4px 10px;
            padding: 20px 16px 18px;
            overflow: hidden;
        }
        .stage .sun { position: absolute; top: 14px; right: 22px; font-size: 44px; animation: kit-bob 4s ease-in-out infinite; }
        .stage .big { position: absolute; left: 18px; top: 10px; width: 90px; }
        .critter { position: relative; font-size: clamp(2.6rem, 9vw, 3.8rem); line-height: 1.05; animation: hop-in 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards; }
        .critter b, .thing b, .bowl b {
            position: absolute;
            top: -6px; right: -8px;
            min-width: 30px; height: 30px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--c, var(--pink));
            color: #fff;
            border: 3px solid #fff;
            font: 400 1rem/24px 'Fredoka One', system-ui, sans-serif;
            text-align: center;
            animation: kit-pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes hop-in { 0% { transform: translateY(-120px) scale(0.6); opacity: 0; } 70% { transform: translateY(8px) scale(1.05, 0.9); opacity: 1; } }
        .grid10 { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }

        /* How many */
        .tray { width: 100%; max-width: 900px; min-height: 180px; padding: 18px; border-radius: 34px; background: #FFF6E6; box-shadow: inset 0 0 0 6px #FFE8C2, 0 8px 0 rgba(61,53,81,0.08);
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 12px; }
        .thing { position: relative; border: 0; background: none; padding: 4px; font-size: clamp(2.8rem, 10vw, 4rem); line-height: 1; animation: kit-rise 0.4s backwards; }
        .thing.counted { filter: drop-shadow(0 0 0 #fff); transform: scale(1.08); }
        .choices { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(var(--k5, 5), minmax(0, 1fr)); gap: 10px; }
        .choices .num { max-width: 130px; justify-self: center; }

        /* Feed */
        .feed-row { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
        .friend { font-size: clamp(5rem, 18vw, 8rem); line-height: 1; transition: transform 0.2s; }
        .friend.happy { animation: kit-dance 0.9s ease-in-out 2; }
        .bowl { position: relative; min-width: 200px; min-height: 110px; padding: 12px 14px 26px; border-radius: 20px 20px 90px 90px; background: linear-gradient(180deg, #FF9FB6, #FF6B8B); box-shadow: inset 0 -10px 0 rgba(0,0,0,0.12), 0 6px 0 var(--pink-d);
            display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 2px; }
        .bowl button { border: 0; background: none; padding: 0; font-size: 2.2rem; line-height: 1; }
        .bowl b { top: -14px; right: -12px; min-width: 40px; height: 40px; font-size: 1.4rem; line-height: 34px; --c: var(--blue); }
        .goal { width: 84px; }
        .pantry { width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
        .food { border: 0; border-radius: 22px; background: #fff; padding: 8px 0; font-size: clamp(2.2rem, 8vw, 3rem); box-shadow: 0 5px 0 rgba(61,53,81,0.1); transition: opacity 0.2s, transform 0.15s; }
        .food.used { opacity: 0.18; transform: scale(0.8); }
        @media (max-width: 560px) { .grid10 { gap: 8px; } .choices { gap: 6px; } .stage .big { width: 64px; } }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <h1 class="kit-title" style="--title-shadow:#3D9BF0"><span class="bob">1</span> <span class="bob" style="animation-delay:-0.8s">2</span> <span class="bob" style="animation-delay:-1.6s">3</span></h1>
        <p class="kit-sub" data-fr="Compte avec tes amis, de 1 à 10 !">Count with your friends, from 1 to 10!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" id="go-play" style="--c:#4FB8FF"><span class="kit-mode-art"><span>🐰</span></span><span class="kit-mode-label"><b data-fr="Touche et compte">Tap &amp; count</b><small data-fr="Des amis sautent pour compter">Friends hop out to count</small></span></button>
            <button class="kit-mode" type="button" id="go-count" style="--c:#FF9F43"><span class="kit-badge" id="count-badge"></span><span class="kit-mode-art"><span>🐥</span></span><span class="kit-mode-label"><b data-fr="Combien ?">How many?</b><small data-fr="Compte, puis choisis le chiffre">Count, then pick the number</small></span></button>
            <button class="kit-mode" type="button" id="go-feed" style="--c:#4CC26A"><span class="kit-badge" id="feed-badge"></span><span class="kit-mode-art"><span>🥕</span></span><span class="kit-mode-label"><b data-fr="Nourris l'ami">Feed the friend</b><small data-fr="Donne le bon nombre">Give just the right number</small></span></button>
        </div>
    </main>

    <main class="kit-screen" id="play" hidden>
        <div class="voices" id="voices" role="group" aria-label="Counting voice" data-fr-aria-label="Voix pour compter"></div>
        <div class="stage" id="play-stage" aria-live="polite"><span class="sun" aria-hidden="true">☀️</span></div>
        <div class="grid10" id="play-grid"></div>
    </main>

    <main class="kit-screen" id="count" hidden>
        <div class="kit-hud"><span class="kit-level" id="count-level"></span><span class="kit-stars" id="count-stars"></span></div>
        <div class="kit-prompt"><span id="count-prompt"></span><button type="button" class="kit-say" id="count-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="tray" id="tray"></div>
        <div class="choices" id="choices"></div>
    </main>

    <main class="kit-screen" id="feed" hidden>
        <div class="kit-hud"><span class="kit-level" id="feed-level"></span><span class="kit-stars" id="feed-stars"></span></div>
        <div class="kit-prompt"><span id="feed-prompt"></span><button type="button" class="kit-say" id="feed-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="feed-row">
            <div class="friend" id="friend" aria-hidden="true">🐰</div>
            <div class="goal" id="goal"></div>
            <div class="bowl" id="bowl"><b id="bowl-count">0</b></div>
        </div>
        <div class="pantry" id="pantry"></div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const NUMBERS = [
            { n: 1,  c: '#FF5A5F', d: '#D93A40', en: 'One',   fr: 'Un',     tl: 'Isa' },
            { n: 2,  c: '#FF9A2E', d: '#E07A10', en: 'Two',   fr: 'Deux',   tl: 'Dalawa' },
            { n: 3,  c: '#F5B800', d: '#C99400', en: 'Three', fr: 'Trois',  tl: 'Tatlo' },
            { n: 4,  c: '#4CC26A', d: '#2F9E4C', en: 'Four',  fr: 'Quatre', tl: 'Apat' },
            { n: 5,  c: '#2EC4B6', d: '#1E9C90', en: 'Five',  fr: 'Cinq',   tl: 'Lima' },
            { n: 6,  c: '#3D9BF0', d: '#2077C9', en: 'Six',   fr: 'Six',    tl: 'Anim' },
            { n: 7,  c: '#9B6CF0', d: '#764BD1', en: 'Seven', fr: 'Sept',   tl: 'Pito' },
            { n: 8,  c: '#F06CB4', d: '#CC4A92', en: 'Eight', fr: 'Huit',   tl: 'Walo' },
            { n: 9,  c: '#A0703F', d: '#7A5129', en: 'Nine',  fr: 'Neuf',   tl: 'Siyam' },
            { n: 10, c: '#FF7A59', d: '#D9552F', en: 'Ten',   fr: 'Dix',    tl: 'Sampu' }
        ];
        const num = n => NUMBERS[n - 1];

        // A chunky number block with that many dots underneath.
        function numberArt(n) {
            const { c, d } = num(n);
            const rows = n <= 5 ? [n] : [5, n - 5];
            const dots = rows.map((count, r) => {
                const y = rows.length === 1 ? 78 : 73 + r * 9;
                const x0 = 50 - (count - 1) * 4.5;
                return Array.from({ length: count }, (_, i) => `<circle cx="${x0 + i * 9}" cy="${y}" r="3.4" fill="#fff"/>`).join('');
            }).join('');
            const digitY = rows.length === 1 ? 61 : 57;
            const size = n === 10 ? 46 : 54;
            return `<svg viewBox="0 0 100 100" aria-hidden="true">
                <rect x="8" y="15" width="84" height="80" rx="28" fill="${d}"/>
                <rect x="8" y="7" width="84" height="80" rx="28" fill="${c}"/>
                <rect x="20" y="14" width="26" height="9" rx="4.5" fill="#fff" opacity="0.45"/>
                <text class="num-digit" x="50" y="${digitY + 3}" text-anchor="middle" font-size="${size}" fill="${d}">${n}</text>
                <text class="num-digit" x="50" y="${digitY}" text-anchor="middle" font-size="${size}" fill="#fff">${n}</text>${dots}</svg>`;
        }
        const numButton = (n, i) => `<button type="button" class="num" data-n="${n}" style="animation-delay:${(i || 0) * 0.035}s" aria-label="${n}">${numberArt(n)}</button>`;

        // ---------- Counting voices: site language, or Tagalog / Arabic / Ilokano ----------
        const VOICES = [{ id: 'en', label: 'English' }, { id: 'fr', label: 'Français' }, { id: 'tl', label: 'Tagalog' }, { id: 'ar', label: 'العربية' }, { id: 'ilo', label: 'Ilokano' }];
        let extraVoice = ['tl', 'ar', 'ilo'].includes(Kit.store.get('numbers-voice', '')) ? Kit.store.get('numbers-voice', '') : null;
        const voiceId = () => extraVoice || Kit.lang.lang;
        let numberAudio = null;
        function sayNumber(n) {
            if (Kit.muted) return;
            const v = voiceId();
            if (numberAudio) { numberAudio.pause(); numberAudio = null; }
            if (v === 'ar' || v === 'ilo') {
                Kit.hush();
                numberAudio = new Audio(`sounds/${v}_${String(n).padStart(2, '0')}.mp3`);
                numberAudio.play().catch(() => {});
                return;
            }
            if (v === 'tl') {
                if (!('speechSynthesis' in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(num(n).tl);
                const tlVoice = speechSynthesis.getVoices().find(x => /^(fil|tl)/i.test(x.lang));
                u.lang = tlVoice ? tlVoice.lang : 'fil-PH';
                if (tlVoice) u.voice = tlVoice;
                u.pitch = 1.2;
                speechSynthesis.speak(u);
                return;
            }
            say(num(n).en, num(n).fr);
        }
        function renderVoices() {
            $('#voices').innerHTML = VOICES.map(v => `<button type="button" class="voice" data-v="${v.id}" lang="${v.id}" aria-pressed="${voiceId() === v.id}">${v.label}</button>`).join('');
        }
        $('#voices').addEventListener('click', event => {
            const chip = event.target.closest('.voice');
            if (!chip) return;
            const v = chip.dataset.v;
            if (v === 'en' || v === 'fr') { extraVoice = null; Kit.store.set('numbers-voice', ''); Kit.lang.set(v); }
            else { extraVoice = v; Kit.store.set('numbers-voice', v); }
            renderVoices();
            sfx.pop();
            sayNumber(1);
        });

        const start = $('#start'), play = $('#play'), count = $('#count'), feed = $('#feed');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#E2F0FF'); renderBadges(); }

        // ---------------- 🐰 TAP & COUNT ----------------
        const CRITTERS = ['🐰', '🐥', '🐸', '🐞', '🐢', '🦊', '🐼', '🐱', '🐶', '🐧'];
        let playRun = 0;
        $('#play-grid').addEventListener('click', event => {
            const btn = event.target.closest('.num');
            if (!btn) return;
            const n = Number(btn.dataset.n);
            const run = ++playRun;
            Kit.bounce(btn);
            Kit.sfx.boing(Kit.note(n - 1));
            Kit.tint(num(n).c + '33');
            const stage = $('#play-stage');
            stage.querySelectorAll('.critter, .big').forEach(x => x.remove());
            stage.insertAdjacentHTML('beforeend', `<span class="big" aria-hidden="true">${numberArt(n)}</span>`);
            const critter = CRITTERS[n - 1];
            sayNumber(n);
            // One friend hops in per count, each with its number tag.
            for (let i = 0; i < n; i++) {
                Kit.later(() => {
                    if (run !== playRun) return;
                    stage.insertAdjacentHTML('beforeend', `<span class="critter" style="--c:${num(i + 1).c}" aria-hidden="true">${critter}<b>${i + 1}</b></span>`);
                    Kit.sfx.plink(i);
                    if (n > 1) sayNumber(i + 1);
                }, 900 + i * 720);
            }
            Kit.later(() => {
                if (run !== playRun) return;
                sayNumber(n);
                Kit.sfx.cheer();
                Kit.burstFrom(stage, [num(n).c, '#FFD54A', '#fff'], 30);
            }, 900 + n * 720 + 200);
        });
        function openPlay() {
            Kit.show(play);
            renderVoices();
            $('#play-grid').innerHTML = NUMBERS.map((x, i) => numButton(x.n, i)).join('');
            $('#play-stage').querySelectorAll('.critter, .big').forEach(x => x.remove());
            say('Tap a number!', `Touche un chiffre${NBSP}!`);
        }

        // ---------------- 🐥 HOW MANY ----------------
        const COUNT_MAX = [2, 3, 4, 5, 6, 7, 8, 9, 10];
        const ROUNDS = 5;
        const countStore = Kit.levelStore('numbers-count-level', COUNT_MAX.length);
        const THINGS = ['🐥', '🍎', '⭐', '🐟', '🚗', '🍓', '🐞', '🦋', '🧁', '🎈', '🐸', '🌸'];
        let countLevel = countStore.get(), countWon = 0, countTarget = 0, lastTarget = 0, counted = 0, countLocked = false;
        function renderCountHud(popIndex) {
            $('#count-level').textContent = T(`Level ${countLevel + 1}`, `Niveau ${countLevel + 1}`);
            Kit.stars($('#count-stars'), ROUNDS, countWon, popIndex);
            $('#count-prompt').textContent = T('How many?', `Combien${NBSP}?`);
        }
        function newCount() {
            countLocked = false;
            counted = 0;
            const max = COUNT_MAX[countLevel];
            do { countTarget = Kit.randInt(1, max); } while (countTarget === lastTarget && max > 1);
            lastTarget = countTarget;
            const thing = Kit.pick(THINGS);
            $('#tray').innerHTML = Array.from({ length: countTarget }, (_, i) =>
                `<button type="button" class="thing" style="animation-delay:${i * 0.05}s" aria-label="${thing}">${thing}</button>`).join('');
            $('#choices').style.setProperty('--k5', Math.min(max, 5));
            $('#choices').innerHTML = Array.from({ length: max }, (_, i) => numButton(i + 1, i)).join('');
            renderCountHud();
            say('How many? Tap to count!', `Combien${NBSP}? Touche pour compter${NBSP}!`);
        }
        $('#tray').addEventListener('click', event => {
            const thing = event.target.closest('.thing');
            if (!thing || thing.classList.contains('counted') || countLocked) return;
            counted++;
            thing.classList.add('counted');
            thing.style.setProperty('--c', num(counted).c);
            thing.insertAdjacentHTML('beforeend', `<b>${counted}</b>`);
            Kit.bounce(thing);
            Kit.sfx.plink(counted - 1);
            sayNumber(counted);
        });
        $('#choices').addEventListener('click', event => {
            const btn = event.target.closest('.num');
            if (!btn || countLocked) return;
            const n = Number(btn.dataset.n);
            if (n !== countTarget) { Kit.bounce(btn, 'wobble'); Kit.sfx.oops(); sayNumber(n); return; }
            countLocked = true;
            Kit.bounce(btn);
            Kit.sfx.cheer();
            Kit.tint(num(n).c + '33');
            Kit.burstFrom(btn, [num(n).c, '#FFD54A', '#fff'], 30);
            $('#tray').querySelectorAll('.thing').forEach((t, i) => Kit.later(() => Kit.bounce(t, 'dance'), i * 80));
            countWon++;
            let wait = 1800;
            if (countWon >= ROUNDS) {
                countWon = 0;
                if (countLevel < COUNT_MAX.length - 1) countLevel++;
                countStore.set(countLevel);
                say(`Yes, ${num(n).en.toLowerCase()}! Super! Level ${countLevel + 1}!`, `Oui, ${num(n).fr.toLowerCase()}${NBSP}! Super${NBSP}! Niveau ${countLevel + 1}${NBSP}!`);
                Kit.later(() => { Kit.cheer(T(`⭐ Level ${countLevel + 1}!`, `⭐ Niveau ${countLevel + 1}${NBSP}!`)); Kit.confetti(90); Kit.sfx.fanfare(); }, 500);
                renderCountHud(ROUNDS - 1);
                wait = 3000;
            } else {
                say(`Yes, ${num(n).en.toLowerCase()}!`, `Oui, ${num(n).fr.toLowerCase()}${NBSP}!`);
                renderCountHud(countWon - 1);
            }
            Kit.later(newCount, wait);
        });
        $('#count-say').addEventListener('click', () => say('How many?', `Combien${NBSP}?`));
        function openCount() { Kit.show(count); countWon = 0; newCount(); }

        // ---------------- 🥕 FEED THE FRIEND ----------------
        const FRIENDS = [
            { face: '🐰', food: '🥕', en: ['bunny', 'carrot', 'carrots'], fr: ['au lapin', 'carotte', 'carottes', 'une'] },
            { face: '🐵', food: '🍌', en: ['monkey', 'banana', 'bananas'], fr: ['au singe', 'banane', 'bananes', 'une'] },
            { face: '🐭', food: '🍓', en: ['mouse', 'strawberry', 'strawberries'], fr: ['à la souris', 'fraise', 'fraises', 'une'] },
            { face: '🐶', food: '🦴', en: ['puppy', 'bone', 'bones'], fr: ['au chiot', 'os', 'os', 'un'] },
            { face: '🐻', food: '🐟', en: ['bear', 'fish', 'fish'], fr: ["à l'ours", 'poisson', 'poissons', 'un'] },
            { face: '🐿️', food: '🌰', en: ['squirrel', 'nut', 'nuts'], fr: ["à l'écureuil", 'noisette', 'noisettes', 'une'] }
        ];
        const FEED_MAX = [3, 5, 7, 10];
        const feedStore = Kit.levelStore('numbers-feed-level', FEED_MAX.length);
        let feedLevel = feedStore.get(), feedWon = 0, friend = FRIENDS[0], feedTarget = 1, lastFeed = 0, inBowl = 0, feedLocked = false;
        function feedWords(n) {
            const [animal, one, many] = friend.en;
            const [toAnimal, frOne, frMany, art] = friend.fr;
            return {
                en: `Give the ${animal} ${n} ${n === 1 ? one : many}!`,
                fr: `Donne ${n === 1 ? art : n} ${n === 1 ? frOne : frMany} ${toAnimal}${NBSP}!`,
                yumEn: `Yum! ${n} ${n === 1 ? one : many}!`,
                yumFr: `Miam${NBSP}! ${n === 1 ? art : n} ${n === 1 ? frOne : frMany}${NBSP}!`
            };
        }
        function renderFeedHud(popIndex) {
            const w = feedWords(feedTarget);
            $('#feed-level').textContent = T(`Level ${feedLevel + 1}`, `Niveau ${feedLevel + 1}`);
            Kit.stars($('#feed-stars'), ROUNDS, feedWon, popIndex);
            $('#feed-prompt').textContent = T(w.en, w.fr);
        }
        function newFeed() {
            feedLocked = false;
            inBowl = 0;
            friend = Kit.pick(FRIENDS.filter(f => f !== friend));
            const max = FEED_MAX[feedLevel];
            do { feedTarget = Kit.randInt(1, max); } while (feedTarget === lastFeed && max > 1);
            lastFeed = feedTarget;
            $('#friend').textContent = friend.face;
            $('#friend').classList.remove('happy');
            $('#bowl').querySelectorAll('button').forEach(b => b.remove());
            $('#bowl-count').textContent = '0';
            $('#goal').innerHTML = numberArt(feedTarget);
            $('#pantry').innerHTML = Array.from({ length: 10 }, (_, i) => `<button type="button" class="food" data-i="${i}" aria-label="${friend.food}">${friend.food}</button>`).join('');
            renderFeedHud();
            const w = feedWords(feedTarget);
            say(w.en, w.fr);
        }
        $('#pantry').addEventListener('click', event => {
            const food = event.target.closest('.food');
            if (!food || feedLocked || food.classList.contains('used')) return;
            food.classList.add('used');
            inBowl++;
            const n = inBowl;
            $('#bowl-count').textContent = n;
            Kit.bounce($('#bowl-count'));
            Kit.sfx.plink(n - 1);
            sayNumber(n);
            Kit.flyTo(friend.food, food, $('#bowl'), {
                size: 44, ms: 420, arc: 60, done: () => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.dataset.i = food.dataset.i;
                    item.textContent = friend.food;
                    item.setAttribute('aria-label', T('Take it back', 'Reprendre'));
                    $('#bowl').appendChild(item);
                }
            });
            if (n === feedTarget) feedDone();
        });
        // Tapping food in the bowl puts it back, to fix a count.
        $('#bowl').addEventListener('click', event => {
            const item = event.target.closest('button');
            if (!item || feedLocked) return;
            const food = $(`#pantry .food[data-i="${item.dataset.i}"]`);
            if (food) food.classList.remove('used');
            item.remove();
            inBowl--;
            $('#bowl-count').textContent = inBowl;
            Kit.sfx.oops();
        });
        function feedDone() {
            feedLocked = true;
            Kit.later(() => {
                $('#friend').classList.add('happy');
                Kit.sfx.munch();
                Kit.later(Kit.sfx.cheer, 300);
                Kit.burstFrom($('#friend'), [num(feedTarget).c, '#FFD54A', '#fff'], 30);
                feedWon++;
                const w = feedWords(feedTarget);
                let wait = 2200;
                if (feedWon >= ROUNDS) {
                    feedWon = 0;
                    if (feedLevel < FEED_MAX.length - 1) feedLevel++;
                    feedStore.set(feedLevel);
                    say(`${w.yumEn} Super! Level ${feedLevel + 1}!`, `${w.yumFr} Super${NBSP}! Niveau ${feedLevel + 1}${NBSP}!`);
                    Kit.later(() => { Kit.cheer(T(`⭐ Level ${feedLevel + 1}!`, `⭐ Niveau ${feedLevel + 1}${NBSP}!`)); Kit.confetti(90); Kit.sfx.fanfare(); }, 600);
                    renderFeedHud(ROUNDS - 1);
                    wait = 3400;
                } else {
                    say(w.yumEn, w.yumFr);
                    renderFeedHud(feedWon - 1);
                }
                Kit.later(newFeed, wait);
            }, 650);
        }
        $('#feed-say').addEventListener('click', () => { const w = feedWords(feedTarget); say(w.en, w.fr); });
        function openFeed() { Kit.show(feed); feedWon = 0; newFeed(); }

        // ---------------- START ----------------
        function renderBadges() {
            $('#count-badge').textContent = T(`Level ${countLevel + 1}`, `Niv. ${countLevel + 1}`);
            $('#feed-badge').textContent = T(`Level ${feedLevel + 1}`, `Niv. ${feedLevel + 1}`);
        }
        $('#go-play').addEventListener('click', () => { sfx.pop(); openPlay(); });
        $('#go-count').addEventListener('click', () => { sfx.pop(); openCount(); });
        $('#go-feed').addEventListener('click', () => { sfx.pop(); openFeed(); });
        Kit.onLang(() => {
            extraVoice = null;
            Kit.store.set('numbers-voice', '');
            renderBadges();
            if (!play.hidden) renderVoices();
            if (!count.hidden) renderCountHud();
            if (!feed.hidden) renderFeedHud();
        });
        goStart();
    }());
    </script>
</body>
</html>
