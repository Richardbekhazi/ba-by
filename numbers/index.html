<!DOCTYPE html>
<html lang="en" data-title-fr="Chiffres 1-2-3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Numbers 1-2-3</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <script src="/assets/js/site-lang.js?v=20261028"></script>

    <style>
        :root {
            --tint: #FFE9D2;
            --text: #3D3551;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, #FFFAF3 0%, var(--tint) 100%);
            transition: background 0.6s ease;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 🔢 FLOATING NUMBERS */
        .sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.65) 2px, transparent 2.5px);
            background-size: 28px 28px;
        }
        .sky span {
            position: absolute;
            bottom: -140px;
            font-family: 'Fredoka One', cursive;
            line-height: 1;
            color: #fff;
            opacity: 0.75;
            animation: floatUp linear infinite;
        }
        .sky span:nth-child(1) { left: 6%;  font-size: 80px;  animation-duration: 21s; }
        .sky span:nth-child(2) { left: 25%; font-size: 46px;  animation-duration: 15s; animation-delay: -7s; }
        .sky span:nth-child(3) { left: 46%; font-size: 100px; animation-duration: 27s; animation-delay: -14s; }
        .sky span:nth-child(4) { left: 68%; font-size: 56px;  animation-duration: 18s; animation-delay: -3s; }
        .sky span:nth-child(5) { left: 86%; font-size: 88px;  animation-duration: 30s; animation-delay: -20s; }
        @keyframes floatUp {
            from { transform: translateY(0) rotate(-8deg); }
            to { transform: translateY(-130vh) rotate(10deg); }
        }

        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* 🏠 ROUND TOP BUTTONS */
        .round-btn {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
            z-index: 100;
            transition: transform 0.15s;
        }
        .round-btn:hover { transform: scale(1.08) rotate(-6deg); }
        .round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
        .round-btn:focus-visible { outline: 4px solid #FF7A45; outline-offset: 3px; }
        .home-btn { left: max(14px, env(safe-area-inset-left)); }
        .back-btn { left: calc(max(14px, env(safe-area-inset-left)) + 62px); }
        .back-btn[hidden] { display: none; }

        /* 📄 SCREENS */
        .screen {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            padding: 80px 16px 28px;
            text-align: center;
        }
        .screen[hidden] { display: none; }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
            font-size: 3.2rem;
            line-height: 1.05;
            margin: 0;
            color: #FF7A45;
            text-shadow: 0 4px 0 #fff, 0 8px 18px rgba(0,0,0,0.12);
        }
        .subtitle {
            display: inline-block;
            margin: 10px 0 0;
            padding: 6px 18px;
            border-radius: 999px;
            background: #fff;
            color: #D9601F;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.06);
        }

        /* 🧱 NUMBER BLOCKS */
        .num {
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            font: inherit;
            animation: popUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .num-art {
            display: block;
            width: var(--size, 110px);
            height: var(--size, 110px);
            overflow: visible;
            filter: drop-shadow(0 12px 14px rgba(60,40,90,0.14));
            transform-origin: 50% 90%;
            animation: idle 3.4s ease-in-out infinite;
        }
        .num:nth-child(2n) .num-art { animation-delay: -1.1s; }
        .num:nth-child(3n) .num-art { animation-delay: -2.2s; }
        .num:focus-visible { outline: 4px solid #FF7A45; outline-offset: 4px; border-radius: 24px; }
        .num.squish .num-art { animation: squish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .num.wobble .num-art { animation: wobble 0.45s ease-in-out; }
        .num-digit { font-family: 'Fredoka One', cursive; }

        @keyframes idle {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.035, 0.965); }
        }
        @keyframes squish {
            0% { transform: scale(1, 1); }
            25% { transform: scale(1.2, 0.8); }
            55% { transform: scale(0.88, 1.14) translateY(-10px); }
            80% { transform: scale(1.04, 0.97); }
            100% { transform: scale(1, 1); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(3deg); }
        }
        @keyframes popUp {
            from { opacity: 0; transform: translateY(24px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(3deg); }
        }
        @keyframes hop {
            0% { transform: translateY(0) scale(1); }
            35% { transform: translateY(-26px) scale(1.12, 0.92); }
            65% { transform: translateY(0) scale(0.94, 1.08); }
            100% { transform: translateY(0) scale(1); }
        }

        /* 🃏 MODE PICTURE CARDS */
        .mode-cards {
            display: flex;
            justify-content: center;
            gap: 24px;
            width: min(780px, 100%);
            margin-top: 28px;
        }
        .mode-card {
            --c: #4CC26A;
            --cd: #2F9E4C;
            --soft: #DDF5E2;
            width: 230px;
            border: 0;
            padding: 12px 12px 14px;
            border-radius: 36px;
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 0 var(--c), 0 20px 30px rgba(0,0,0,0.12);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .mode-card:nth-child(2) { animation-delay: 0.08s; }
        .mode-card:nth-child(3) { animation-delay: 0.16s; }
        .mode-card:hover { transform: translateY(-6px) rotate(-1.5deg); }
        .mode-card:active, .mode-card.pressed { transform: translateY(8px) scale(0.97); box-shadow: 0 2px 0 var(--c), 0 6px 12px rgba(0,0,0,0.10); }
        .mode-card:focus-visible { outline: 5px solid var(--c); outline-offset: 5px; }
        .mode-art {
            position: relative;
            width: 100%;
            aspect-ratio: 1.1;
            border-radius: 26px;
            background:
                radial-gradient(circle at 25% 20%, rgba(255,255,255,0.8) 0 12%, transparent 13%),
                radial-gradient(circle at 80% 85%, rgba(255,255,255,0.6) 0 9%, transparent 10%),
                var(--soft);
            overflow: hidden;
        }
        .art-item { position: absolute; line-height: 1; }
        .art-item > svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
        .art-item > * { animation: bob 2.8s ease-in-out infinite; display: block; }
        .art-item:nth-child(2) > * { animation-delay: -0.9s; }
        .art-item:nth-child(3) > * { animation-delay: -1.8s; }
        .art-item:nth-child(4) > * { animation-delay: -0.4s; }
        .mode-label {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            line-height: 1;
            color: var(--cd);
        }

        /* 🎈 PLAY MODE */
        .voices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }
        .voice-chip {
            border: 0;
            border-radius: 999px;
            padding: 7px 14px;
            background: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            color: #7A7290;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.07);
        }
        .voice-chip.active { background: #FF7A45; color: #fff; box-shadow: 0 3px 0 #D9601F; }
        .voice-chip:focus-visible { outline: 3px solid #FF7A45; outline-offset: 2px; }
        .play-grid {
            display: grid;
            grid-template-columns: repeat(5, auto);
            gap: 18px 22px;
            justify-content: center;
            margin-top: 22px;
        }
        .play-grid .num { --size: 124px; }
        .balloon {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            font-size: 44px;
            line-height: 1;
            transform: translate(-50%, -50%);
            animation: balloonUp 2.4s cubic-bezier(0.25, 0.6, 0.4, 1) forwards;
        }
        .balloon b {
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }
        @keyframes balloonUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            15% { opacity: 1; transform: translate(calc(-50% + var(--dx) * 0.3), calc(-50% - 40px)) scale(1.1); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 60vh)) scale(1); }
        }

        /* 🔍 PROMPT + PROGRESS (Count & Feed) */
        .prompt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 8px 8px 22px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.08);
            font-family: 'Fredoka One', cursive;
            font-size: 1.55rem;
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .prompt .big { color: #FF7A45; font-size: 1.2em; }
        .say-again {
            width: 48px;
            height: 48px;
            flex: none;
            border: 0;
            border-radius: 50%;
            background: #FFF0E3;
            font-size: 22px;
            cursor: pointer;
        }
        .say-again:active { transform: scale(0.92); }
        .say-again:focus-visible { outline: 3px solid #FF7A45; outline-offset: 2px; }
        .progress {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }
        .level-badge {
            font-family: 'Fredoka One', cursive;
            color: #fff;
            background: #FF7A45;
            padding: 3px 12px;
            border-radius: 999px;
            box-shadow: 0 3px 0 #D9601F;
        }
        .stars { display: flex; gap: 4px; font-size: 1.4rem; }
        .stars span { display: inline-block; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .stars span.off { filter: grayscale(1); opacity: 0.3; }
        .stars span.pop { transform: scale(1.5) rotate(20deg); }

        /* 🐥 COUNT MODE */
        .count-stage, .feed-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tray {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: min(440px, 100%);
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 32px;
            background: rgba(255,255,255,0.75);
            box-shadow: 0 6px 0 rgba(0,0,0,0.05);
        }
        .thing {
            position: relative;
            width: 68px;
            height: 68px;
            border: 0;
            border-radius: 22px;
            background: #FFF6EC;
            font-size: 42px;
            line-height: 1;
            cursor: pointer;
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            transition: background 0.2s, transform 0.15s;
        }
        .thing:active { transform: scale(0.92); }
        .thing.counted { background: #FFE0C7; }
        .thing .tag {
            position: absolute;
            top: -8px;
            right: -6px;
            min-width: 28px;
            height: 28px;
            padding: 0 6px;
            border-radius: 999px;
            background: #FF7A45;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1rem;
            line-height: 28px;
            box-shadow: 0 3px 0 #D9601F;
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 20px;
            margin-top: 22px;
        }
        .choices .num { --size: 112px; }
        .choices.four { max-width: 270px; }

        /* 🥕 FEED MODE */
        .feed-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
            margin-top: 18px;
        }
        .friend {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .friend-face {
            font-size: 96px;
            line-height: 1;
            animation: bob 2.8s ease-in-out infinite;
        }
        .friend.happy .friend-face { animation: hop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 2; }
        .bowl {
            position: relative;
            width: 220px;
            min-height: 92px;
            margin-top: -6px;
            padding: 12px 12px 18px;
            border-radius: 18px 18px 110px 110px;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFE9D6 100%);
            box-shadow: inset 0 -8px 0 rgba(217,96,31,0.15), 0 8px 0 #F2C9A4, 0 14px 22px rgba(0,0,0,0.10);
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 2px;
        }
        .bowl button {
            border: 0;
            background: transparent;
            padding: 0;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .bowl-count {
            position: absolute;
            right: -14px;
            top: -14px;
            min-width: 44px;
            height: 44px;
            padding: 0 8px;
            border-radius: 999px;
            background: #FF7A45;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            line-height: 44px;
            box-shadow: 0 4px 0 #D9601F;
        }
        .goal {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .goal .num { --size: 108px; cursor: default; }
        .goal-food { font-size: 40px; line-height: 1; }
        .pantry {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 10px;
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 30px;
            background: rgba(255,255,255,0.75);
            box-shadow: 0 6px 0 rgba(0,0,0,0.05);
        }
        .food {
            width: 60px;
            height: 60px;
            border: 0;
            border-radius: 20px;
            background: #FFF6EC;
            font-size: 38px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        .food:active { transform: scale(0.9); }
        .food.used { opacity: 0; pointer-events: none; transform: scale(0.5); }
        .flyer {
            position: fixed;
            z-index: 70;
            pointer-events: none;
            line-height: 1;
            transform: translate(-50%, -50%);
            transition: left 0.38s cubic-bezier(0.5, 0, 0.3, 1.4), top 0.38s cubic-bezier(0.5, 0, 0.3, 1.4), font-size 0.38s;
        }

        .cheer {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 120;
            transform: translate(-50%, -50%) scale(0);
            padding: 22px 34px;
            border-radius: 36px;
            background: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #FF7A45;
            white-space: nowrap;
            box-shadow: 0 10px 0 #FF7A45, 0 24px 50px rgba(0,0,0,0.18);
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cheer.show { transform: translate(-50%, -50%) scale(1); }

        @media (prefers-reduced-motion: reduce) {
            .sky span, .num-art, .art-item > *, .friend-face { animation: none !important; }
        }

        /* 📱 PHONES */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 0.95rem; }
            .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 14px; margin-top: 22px; }
            .mode-card { width: auto; padding: 8px 8px 10px; border-radius: 30px; gap: 6px; }
            .mode-card:nth-child(3) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 7px); }
            .mode-art { border-radius: 22px; }
            .mode-label { font-size: 1.4rem; }

            .voice-chip { padding: 6px 10px; font-size: 0.85rem; }
            .play-grid { grid-template-columns: repeat(3, auto); gap: 12px 16px; margin-top: 16px; }
            .play-grid .num { --size: 92px; }
            .play-grid .num:last-child { grid-column: 2; }

            .prompt { font-size: 1.2rem; gap: 8px; padding: 6px 6px 6px 16px; }
            .say-again { width: 42px; height: 42px; font-size: 19px; }
            .tray { gap: 8px; padding: 12px; margin-top: 16px; }
            .thing { width: 56px; height: 56px; font-size: 34px; border-radius: 18px; }
            .choices { gap: 12px 14px; margin-top: 18px; }
            .choices .num { --size: 92px; }

            .feed-stage { gap: 14px; margin-top: 14px; }
            .friend-face { font-size: 72px; }
            .bowl { width: 170px; min-height: 80px; }
            .bowl button { font-size: 24px; }
            .goal .num { --size: 84px; }
            .goal-food { font-size: 32px; }
            .pantry { grid-template-columns: repeat(5, 52px); gap: 8px; padding: 12px; margin-top: 18px; }
            .food { width: 52px; height: 52px; font-size: 32px; border-radius: 16px; }
            .cheer { font-size: 1.6rem; padding: 18px 24px; }
        }
        @media (max-width: 600px) and (max-height: 720px) {
            h1 { font-size: 2rem; }
            #start-screen .subtitle { display: none; }
            .play-grid .num { --size: 80px; }
            .play-grid { gap: 8px 14px; }
            .tray { margin-top: 12px; }
            .thing { width: 50px; height: 50px; font-size: 30px; }
            .choices { margin-top: 14px; }
            .choices .num { --size: 84px; }
            .friend-face { font-size: 64px; }
            .pantry { margin-top: 14px; }
        }

        /* 💻 PC: things to count on the left, number choices on the right */
        @media (orientation: landscape) and (min-width: 860px) {
            .count-stage { flex-direction: row; align-items: center; gap: 40px; margin-top: 10px; }
            .count-stage .choices { margin-top: 20px; }
        }

        /* 📐 SHORT LANDSCAPE SCREENS */
        @media (orientation: landscape) and (max-height: 600px) {
            .screen { padding: 12px 16px 14px 84px; }
            h1 { font-size: 1.9rem; text-shadow: 0 3px 0 #fff; }
            .subtitle { margin-top: 4px; font-size: 0.85rem; padding: 3px 12px; }
            .mode-cards { display: flex; gap: 18px; margin-top: 14px; }
            .mode-card { width: 170px; padding: 8px 8px 10px; gap: 6px; border-radius: 28px; }
            .mode-card:nth-child(3) { width: 170px; }
            .mode-art { aspect-ratio: 1.35; border-radius: 20px; }
            .mode-label { font-size: 1.2rem; }

            .voices { margin-top: 6px; }
            .play-grid { margin-top: 10px; gap: 8px 14px; }
            .play-grid .num { --size: min(86px, calc((100vh - 150px) / 2)); }

            .prompt { font-size: 1.1rem; padding: 5px 5px 5px 14px; }
            .say-again { width: 38px; height: 38px; font-size: 17px; }
            .progress { margin-top: 6px; }
            .count-stage, .feed-wrap { flex-direction: row; gap: 20px; }
            .tray { margin-top: 8px; padding: 10px; max-width: 330px; gap: 6px; }
            .thing { width: 48px; height: 48px; font-size: 30px; border-radius: 14px; }
            .choices { margin-top: 8px; max-width: 260px; }
            .choices .num { --size: 84px; }
            .feed-stage { margin-top: 6px; gap: 14px; }
            .friend-face { font-size: 60px; }
            .bowl { width: 150px; min-height: 64px; padding: 8px 8px 12px; }
            .bowl button { font-size: 22px; }
            .goal .num { --size: 74px; }
            .goal-food { font-size: 28px; }
            .pantry { margin-top: 6px; grid-template-columns: repeat(5, 46px); gap: 6px; padding: 10px; }
            .food { width: 46px; height: 46px; font-size: 28px; border-radius: 14px; }
        }
    </style>
</head>
<body>
    <div class="sky" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
    <canvas id="particles"></canvas>

    <a href="/" class="round-btn home-btn" aria-label="Back to games" title="Back to games" data-fr-aria-label="Retour aux jeux" data-fr-title="Retour aux jeux"><svg class="nav-icon" width="42" height="42" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="23" fill="#FF7A45"/><path d="M2 26 A22 22 0 0 0 46 26 A23 20 0 0 1 2 26 Z" fill="#E85A28" opacity="0.55"/><path d="M24 12.5 L35.5 22 V33.5 a2.5 2.5 0 0 1 -2.5 2.5 H28 V29 a4 4 0 0 0 -8 0 V36 H15 a2.5 2.5 0 0 1 -2.5 -2.5 V22 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></a>
    <button type="button" class="round-btn back-btn" id="back-btn" hidden aria-label="Back to start" title="Back to start" data-fr-aria-label="Retour au début" data-fr-title="Retour au début"><svg class="nav-icon" width="42" height="42" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="23" fill="#3D9BF0"/><path d="M2 26 A22 22 0 0 0 46 26 A23 20 0 0 1 2 26 Z" fill="#2177C9" opacity="0.55"/><path d="M25 14 L15 24 L25 34 M16 24 H34" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <!-- START -->
    <section class="screen" id="start-screen">
        <h1 data-fr="Les chiffres">Numbers</h1>
        <p class="subtitle" data-fr="Comptons ensemble !">Let's count together!</p>
        <div class="mode-cards">
            <button type="button" class="mode-card" id="play-btn" style="--c: #4CC26A; --cd: #2F9E4C; --soft: #DDF5E2"
                    aria-label="Play with numbers" data-fr-aria-label="Joue avec les chiffres">
                <span class="mode-art" id="art-play" aria-hidden="true"></span>
                <span class="mode-label" data-fr="Joue">Play</span>
            </button>
            <button type="button" class="mode-card" id="count-btn" style="--c: #4DA3F2; --cd: #2B7FCC; --soft: #DCEEFF"
                    aria-label="How many?" data-fr-aria-label="Combien ?">
                <span class="mode-art" id="art-count" aria-hidden="true"></span>
                <span class="mode-label" data-fr="Compte">Count</span>
            </button>
            <button type="button" class="mode-card" id="feed-btn" style="--c: #FF9A2E; --cd: #E07A10; --soft: #FFEBD2"
                    aria-label="Feed the animals" data-fr-aria-label="Nourris les animaux">
                <span class="mode-art" id="art-feed" aria-hidden="true"></span>
                <span class="mode-label" data-fr="Nourris">Feed</span>
            </button>
        </div>
    </section>

    <!-- 🎈 PLAY -->
    <section class="screen" id="play-screen" hidden>
        <h1 data-fr="Touche un chiffre !">Tap a number!</h1>
        <div class="voices" id="voices" role="group" aria-label="Number voice" data-fr-aria-label="Voix des chiffres"></div>
        <div class="play-grid" id="play-grid"></div>
    </section>

    <!-- 🐥 COUNT -->
    <section class="screen" id="count-screen" hidden>
        <div class="prompt">
            <span id="count-prompt"></span>
            <button type="button" class="say-again" id="count-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button>
        </div>
        <div class="progress">
            <span class="level-badge" id="count-level"></span>
            <div class="stars" id="count-stars" aria-hidden="true"></div>
        </div>
        <div class="count-stage">
            <div class="tray" id="tray"></div>
            <div class="choices" id="count-choices"></div>
        </div>
    </section>

    <!-- 🥕 FEED -->
    <section class="screen" id="feed-screen" hidden>
        <div class="prompt">
            <span id="feed-prompt"></span>
            <button type="button" class="say-again" id="feed-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button>
        </div>
        <div class="progress">
            <span class="level-badge" id="feed-level"></span>
            <div class="stars" id="feed-stars" aria-hidden="true"></div>
        </div>
        <div class="feed-wrap">
            <div class="feed-stage">
                <div class="friend" id="friend">
                    <div class="friend-face" id="friend-face" aria-hidden="true"></div>
                    <div class="bowl" id="bowl" aria-live="polite">
                        <span class="bowl-count" id="bowl-count">0</span>
                    </div>
                </div>
                <div class="goal">
                    <div id="goal-num"></div>
                    <div class="goal-food" id="goal-food" aria-hidden="true"></div>
                </div>
            </div>
            <div class="pantry" id="pantry"></div>
        </div>
    </section>

    <div class="cheer" id="cheer" aria-live="polite"></div>

    <script>
        const lang = window.BabyLang;
        const NBSP = ' ';

        // Numbers 1-10: colour, darker edge, note, and words for the browser voices.
        const NUMBERS = [
            { n: 1,  c: '#FF5A5F', d: '#D93A40', note: 261.63, en: 'One',   fr: 'Un',     tl: 'Isa' },
            { n: 2,  c: '#FF9A2E', d: '#E07A10', note: 293.66, en: 'Two',   fr: 'Deux',   tl: 'Dalawa' },
            { n: 3,  c: '#F5B800', d: '#C99400', note: 329.63, en: 'Three', fr: 'Trois',  tl: 'Tatlo' },
            { n: 4,  c: '#4CC26A', d: '#2F9E4C', note: 349.23, en: 'Four',  fr: 'Quatre', tl: 'Apat' },
            { n: 5,  c: '#2EC4B6', d: '#1E9C90', note: 392.00, en: 'Five',  fr: 'Cinq',   tl: 'Lima' },
            { n: 6,  c: '#3D9BF0', d: '#2077C9', note: 440.00, en: 'Six',   fr: 'Six',    tl: 'Anim' },
            { n: 7,  c: '#9B6CF0', d: '#764BD1', note: 493.88, en: 'Seven', fr: 'Sept',   tl: 'Pito' },
            { n: 8,  c: '#F06CB4', d: '#CC4A92', note: 523.25, en: 'Eight', fr: 'Huit',   tl: 'Walo' },
            { n: 9,  c: '#A0703F', d: '#7A5129', note: 587.33, en: 'Nine',  fr: 'Neuf',   tl: 'Siyam' },
            { n: 10, c: '#FF7A59', d: '#D9552F', note: 659.25, en: 'Ten',   fr: 'Dix',    tl: 'Sampu' }
        ];
        const numData = n => NUMBERS[n - 1];

        const els = {
            start: document.getElementById('start-screen'),
            play: document.getElementById('play-screen'),
            count: document.getElementById('count-screen'),
            feed: document.getElementById('feed-screen'),
            back: document.getElementById('back-btn'),
            cheer: document.getElementById('cheer')
        };

        // --- 🧱 NUMBER BLOCK ART: digit plus the same number of dots ---
        function numberArt(n) {
            const { c, d } = numData(n);
            const rows = n <= 5 ? [n] : [5, n - 5];
            const dots = rows.map((count, r) => {
                const y = rows.length === 1 ? 78 : 73 + r * 9;
                const start = 50 - (count - 1) * 4.5;
                return Array.from({ length: count }, (_, i) =>
                    `<circle cx="${start + i * 9}" cy="${y}" r="3.4" fill="#fff"/>`).join('');
            }).join('');
            const digitY = rows.length === 1 ? 61 : 57;
            const size = n === 10 ? 46 : 54;
            return `<svg class="num-art" viewBox="0 0 100 100" aria-hidden="true">
                <rect x="8" y="15" width="84" height="80" rx="28" fill="${d}"/>
                <rect x="8" y="7" width="84" height="80" rx="28" fill="${c}"/>
                <rect x="20" y="14" width="26" height="9" rx="4.5" fill="#fff" opacity="0.45"/>
                <circle cx="54" cy="18" r="3.5" fill="#fff" opacity="0.45"/>
                <text class="num-digit" x="50" y="${digitY + 3}" text-anchor="middle" font-size="${size}" fill="${d}">${n}</text>
                <text class="num-digit" x="50" y="${digitY}" text-anchor="middle" font-size="${size}" fill="#fff">${n}</text>
                ${dots}
            </svg>`;
        }

        function makeNum(n, i = 0) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'num';
            btn.dataset.n = n;
            btn.style.animationDelay = `${i * 0.04}s`;
            btn.setAttribute('aria-label', String(n));
            btn.innerHTML = numberArt(n);
            return btn;
        }

        // --- 🔊 SOUND ---
        let audioCtx = null;
        function note(freq, at = 0, dur = 0.3, vol = 0.18, type = 'sine') {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const start = audioCtx.currentTime + at;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + dur + 0.02);
            } catch (error) { /* audio is optional */ }
        }
        const boing = freq => { note(freq, 0, 0.3, 0.2); note(freq / 2, 0, 0.14, 0.1, 'triangle'); };
        const cheerSound = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, i * 0.08, 0.3, 0.15));
        const oopsSound = () => note(196, 0, 0.18, 0.14, 'triangle');
        const plink = i => note(523.25 * Math.pow(2, i / 7), 0, 0.18, 0.12, 'triangle');

        const speak = (en, fr) => lang.speak(en, fr, { pitch: 1.2 });

        // Number voice: follows the site language, or Tagalog / Arabic / Ilokano chosen on the Play screen.
        const VOICES = [
            { id: 'en', label: 'English' },
            { id: 'fr', label: 'Français' },
            { id: 'tl', label: 'Tagalog' },
            { id: 'ar', label: 'العربية' },
            { id: 'ilo', label: 'Ilokano' }
        ];
        const VOICE_KEY = 'numbers-voice';
        let extraVoice = null;
        try {
            const saved = localStorage.getItem(VOICE_KEY);
            if (['tl', 'ar', 'ilo'].includes(saved)) extraVoice = saved;
        } catch (error) { /* use the site language */ }
        const voiceLang = () => extraVoice || lang.lang;
        let numberAudio = null;

        function sayNumber(n) {
            const v = voiceLang();
            if (numberAudio) { numberAudio.pause(); numberAudio = null; }
            if (v === 'ar' || v === 'ilo') {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                numberAudio = new Audio(`sounds/${v}_${String(n).padStart(2, '0')}.mp3`);
                numberAudio.play().catch(() => {});
                return;
            }
            if (v === 'tl') {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(numData(n).tl);
                const voices = window.speechSynthesis.getVoices();
                const tlVoice = voices.find(x => /^(fil|tl)/i.test(x.lang));
                u.lang = tlVoice ? tlVoice.lang : 'fil-PH';
                if (tlVoice) u.voice = tlVoice;
                u.pitch = 1.2;
                window.speechSynthesis.speak(u);
                return;
            }
            speak(numData(n).en, numData(n).fr);
        }

        function renderVoices() {
            document.getElementById('voices').innerHTML = VOICES.map(v =>
                `<button type="button" class="voice-chip${voiceLang() === v.id ? ' active' : ''}" data-voice="${v.id}" lang="${v.id}">${v.label}</button>`).join('');
        }
        document.getElementById('voices').addEventListener('click', event => {
            const chip = event.target.closest('.voice-chip');
            if (!chip) return;
            const v = chip.dataset.voice;
            if (v === 'en' || v === 'fr') {
                extraVoice = null;
                lang.set(v);
            } else {
                extraVoice = v;
            }
            try { localStorage.setItem(VOICE_KEY, extraVoice || ''); } catch (error) { /* optional */ }
            renderVoices();
            sayNumber(1);
        });

        // --- SHARED HELPERS ---
        function bounce(el, cls) {
            el.classList.remove('squish', 'wobble');
            void el.offsetWidth;
            el.classList.add(cls);
            el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
        }
        function centerOf(el) {
            const r = el.getBoundingClientRect();
            return [r.left + r.width / 2, r.top + r.height / 2];
        }
        function tint(n) {
            document.documentElement.style.setProperty('--tint', numData(n).c + '44');
        }
        function showCheer(text, ms = 1400) {
            els.cheer.textContent = text;
            els.cheer.classList.add('show');
            setTimeout(() => els.cheer.classList.remove('show'), ms);
        }
        const shuffle = list => list.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
        const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
        let timers = [];
        const later = (fn, ms) => timers.push(setTimeout(fn, ms));
        function clearTimers() { timers.forEach(clearTimeout); timers = []; }

        // Each game keeps its level; five right answers earn the next one.
        const ROUNDS = 5;
        function loadLevel(key, max) {
            try {
                const v = Number(localStorage.getItem(key));
                return v >= 0 && v < max ? v : 0;
            } catch (error) { return 0; }
        }
        function saveLevel(key, v) { try { localStorage.setItem(key, String(v)); } catch (error) { /* optional */ } }
        const levelLabel = n => lang.t(`Level ${n + 1}`, `Niveau ${n + 1}`);
        function renderStars(el, won) {
            el.innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<span class="${i < won ? '' : 'off'}">⭐</span>`).join('');
        }
        function popStar(el, won) {
            const star = el.children[won - 1];
            if (star) { star.classList.add('pop'); setTimeout(() => star.classList.remove('pop'), 350); }
        }

        // --- SCREENS ---
        function show(screen) {
            [els.start, els.play, els.count, els.feed].forEach(s => { s.hidden = s !== screen; });
            els.back.hidden = screen === els.start;
            clearTimers();
            window.scrollTo(0, 0);
        }

        const artItem = (html, left, top, width, turn = 0) =>
            `<span class="art-item" style="left: ${left}%; top: ${top}%; width: ${width}%; transform: rotate(${turn}deg)">${html}</span>`;
        const emojiItem = (emoji, left, top, size) =>
            `<span class="art-item" style="left: ${left}%; top: ${top}%; font-size: ${size}"><span>${emoji}</span></span>`;

        function renderStart() {
            document.getElementById('art-play').innerHTML =
                artItem(numberArt(1), 4, 40, 36, -6) + artItem(numberArt(3), 60, 40, 36, 6) + artItem(numberArt(2), 31, 8, 38);
            document.getElementById('art-count').innerHTML =
                emojiItem('🐥', 10, 20, '3.1rem') + emojiItem('🐥', 54, 14, '3.1rem') + emojiItem('🐥', 32, 54, '3.1rem')
                + artItem(numberArt(3), 64, 54, 30, 8);
            document.getElementById('art-feed').innerHTML =
                emojiItem('🐰', 10, 18, '4.4rem') + emojiItem('🥕', 62, 16, '2.4rem') + emojiItem('🥕', 70, 46, '2.4rem') + emojiItem('🥕', 52, 64, '2.4rem');
        }

        // --- 🎈 PLAY ---
        function startPlay() {
            renderVoices();
            const grid = document.getElementById('play-grid');
            grid.innerHTML = '';
            NUMBERS.forEach((num, i) => grid.appendChild(makeNum(num.n, i)));
            show(els.play);
        }

        document.getElementById('play-grid').addEventListener('click', event => {
            const btn = event.target.closest('.num');
            if (!btn) return;
            const n = Number(btn.dataset.n);
            bounce(btn, 'squish');
            boing(numData(n).note);
            sayNumber(n);
            tint(n);
            // Balloons pop out one at a time, each with a rising note: a little counting song.
            const [x, y] = centerOf(btn);
            for (let i = 0; i < n; i++) {
                setTimeout(() => {
                    const b = document.createElement('span');
                    b.className = 'balloon';
                    b.innerHTML = `🎈<b>${i + 1}</b>`;
                    b.style.left = `${x}px`;
                    b.style.top = `${y}px`;
                    b.style.setProperty('--dx', `${(Math.random() - 0.5) * 220}px`);
                    b.style.filter = `hue-rotate(${i * 36}deg)`;
                    document.body.appendChild(b);
                    plink(i);
                    setTimeout(() => b.remove(), 2500);
                }, 250 + i * 170);
            }
        });

        // --- 🐥 COUNT ---
        // Each level: the biggest number to count and how many number blocks to choose from.
        const COUNT_LEVELS = [{ max: 3, choices: 2 }, { max: 5, choices: 3 }, { max: 7, choices: 3 }, { max: 10, choices: 4 }];
        const COUNT_KEY = 'numbers-count-level';
        const THINGS = ['🐥', '🍎', '⭐', '🐟', '🚗', '🍓', '🐞', '🦋', '🧁', '🎈', '🐸', '🌸'];
        let countLevel = loadLevel(COUNT_KEY, COUNT_LEVELS.length);
        let countWon = 0;
        let countTarget = 0;
        let lastCountTarget = 0;
        let counted = 0;
        let countLocked = false;
        const countEls = {
            prompt: document.getElementById('count-prompt'),
            level: document.getElementById('count-level'),
            stars: document.getElementById('count-stars'),
            tray: document.getElementById('tray'),
            choices: document.getElementById('count-choices')
        };

        function renderCountHud() {
            countEls.prompt.innerHTML = lang.t('How many?', `Combien${NBSP}?`);
            countEls.level.textContent = levelLabel(countLevel);
            renderStars(countEls.stars, countWon);
        }

        function newCountRound() {
            countLocked = false;
            counted = 0;
            const { max, choices } = COUNT_LEVELS[countLevel];
            do { countTarget = randInt(1, max); } while (countTarget === lastCountTarget && max > 1);
            lastCountTarget = countTarget;
            const thing = THINGS[randInt(0, THINGS.length - 1)];
            countEls.tray.innerHTML = Array.from({ length: countTarget }, (_, i) =>
                `<button type="button" class="thing" style="animation-delay: ${i * 0.05}s" aria-label="${thing}">${thing}</button>`).join('');
            const pool = shuffle(Array.from({ length: Math.max(max, choices) }, (_, i) => i + 1).filter(n => n !== countTarget));
            const options = shuffle([countTarget, ...pool.slice(0, choices - 1)]);
            countEls.choices.innerHTML = '';
            countEls.choices.classList.toggle('four', options.length === 4);
            options.forEach((n, i) => countEls.choices.appendChild(makeNum(n, i)));
            renderCountHud();
            speak('How many?', `Combien${NBSP}?`);
        }

        function startCount() {
            countWon = 0;
            show(els.count);
            newCountRound();
        }

        // Tapping each thing counts it out loud.
        countEls.tray.addEventListener('click', event => {
            const thing = event.target.closest('.thing');
            if (!thing || thing.classList.contains('counted') || countLocked) return;
            counted++;
            thing.classList.add('counted');
            thing.insertAdjacentHTML('beforeend', `<span class="tag">${counted}</span>`);
            plink(counted - 1);
            sayNumber(counted);
        });

        countEls.choices.addEventListener('click', event => {
            const btn = event.target.closest('.num');
            if (!btn || countLocked) return;
            const n = Number(btn.dataset.n);
            if (n !== countTarget) {
                bounce(btn, 'wobble');
                oopsSound();
                return;
            }
            countLocked = true;
            bounce(btn, 'squish');
            cheerSound();
            tint(n);
            const [x, y] = centerOf(btn);
            createExplosion(x, y, numData(n).c, 30);
            countWon++;
            renderStars(countEls.stars, countWon);
            popStar(countEls.stars, countWon);
            const word = numData(n);
            let delay = 1500;
            if (countWon >= ROUNDS) {
                countWon = 0;
                if (countLevel < COUNT_LEVELS.length - 1) countLevel++;
                saveLevel(COUNT_KEY, countLevel);
                speak(`Yes, ${word.en.toLowerCase()}! Super! Level ${countLevel + 1}!`,
                    `Oui, ${word.fr.toLowerCase()}${NBSP}! Super${NBSP}! Niveau ${countLevel + 1}${NBSP}!`);
                later(() => showCheer(lang.t(`⭐ Super! Level ${countLevel + 1}`, `⭐ Super${NBSP}! Niveau ${countLevel + 1}`), 1700), 400);
                delay = 2700;
            } else {
                speak(`Yes, ${word.en.toLowerCase()}!`, `Oui, ${word.fr.toLowerCase()}${NBSP}!`);
            }
            later(newCountRound, delay);
        });
        document.getElementById('count-say').addEventListener('click', () => speak('How many?', `Combien${NBSP}?`));

        // --- 🥕 FEED ---
        const FRIENDS = [
            { face: '🐰', food: '🥕', en: ['bunny', 'carrot', 'carrots'],         fr: ['au lapin', 'carotte', 'carottes', 'une'] },
            { face: '🐵', food: '🍌', en: ['monkey', 'banana', 'bananas'],        fr: ['au singe', 'banane', 'bananes', 'une'] },
            { face: '🐭', food: '🍓', en: ['mouse', 'strawberry', 'strawberries'], fr: ['à la souris', 'fraise', 'fraises', 'une'] },
            { face: '🐶', food: '🦴', en: ['puppy', 'bone', 'bones'],             fr: ['au chiot', 'os', 'os', 'un'] },
            { face: '🐻', food: '🐟', en: ['bear', 'fish', 'fish'],               fr: ["à l'ours", 'poisson', 'poissons', 'un'] }
        ];
        const FEED_LEVELS = [3, 5, 7, 10];
        const FEED_KEY = 'numbers-feed-level';
        let feedLevel = loadLevel(FEED_KEY, FEED_LEVELS.length);
        let feedWon = 0;
        let friend = FRIENDS[0];
        let lastFriend = null;
        let feedTarget = 0;
        let lastFeedTarget = 0;
        let inBowl = 0;
        let feedLocked = false;
        const feedEls = {
            prompt: document.getElementById('feed-prompt'),
            level: document.getElementById('feed-level'),
            stars: document.getElementById('feed-stars'),
            friend: document.getElementById('friend'),
            face: document.getElementById('friend-face'),
            bowl: document.getElementById('bowl'),
            count: document.getElementById('bowl-count'),
            goal: document.getElementById('goal-num'),
            goalFood: document.getElementById('goal-food'),
            pantry: document.getElementById('pantry')
        };

        function feedWords(n) {
            const [animal, one, many] = friend.en;
            const [toAnimal, frOne, frMany, article] = friend.fr;
            return {
                en: `Give the ${animal} ${n} ${n === 1 ? one : many}!`,
                fr: `Donne ${n === 1 ? article : n} ${n === 1 ? frOne : frMany} ${toAnimal}${NBSP}!`,
                enYum: `Yum! ${n} ${n === 1 ? one : many}!`,
                frYum: `Miam${NBSP}! ${n === 1 ? article[0].toUpperCase() + article.slice(1) : n} ${n === 1 ? frOne : frMany}${NBSP}!`
            };
        }

        function renderFeedHud() {
            const words = feedWords(feedTarget);
            feedEls.prompt.textContent = lang.t(words.en, words.fr);
            feedEls.level.textContent = levelLabel(feedLevel);
            renderStars(feedEls.stars, feedWon);
        }

        function updateBowlCount() {
            feedEls.count.textContent = inBowl;
        }

        function newFeedRound() {
            feedLocked = false;
            inBowl = 0;
            friend = shuffle(FRIENDS.filter(f => f !== lastFriend))[0];
            lastFriend = friend;
            const max = FEED_LEVELS[feedLevel];
            do { feedTarget = randInt(1, max); } while (feedTarget === lastFeedTarget && max > 1);
            lastFeedTarget = feedTarget;
            feedEls.friend.classList.remove('happy');
            feedEls.face.textContent = friend.face;
            feedEls.bowl.querySelectorAll('button').forEach(b => b.remove());
            updateBowlCount();
            feedEls.goal.innerHTML = '';
            const goal = makeNum(feedTarget);
            goal.tabIndex = -1;
            feedEls.goal.appendChild(goal);
            feedEls.goalFood.textContent = friend.food;
            feedEls.pantry.innerHTML = Array.from({ length: 10 }, (_, i) =>
                `<button type="button" class="food" data-i="${i}" aria-label="${friend.food}">${friend.food}</button>`).join('');
            renderFeedHud();
            const words = feedWords(feedTarget);
            speak(words.en, words.fr);
        }

        function startFeed() {
            feedWon = 0;
            show(els.feed);
            newFeedRound();
        }

        // Tap food to drop it into the bowl; it counts out loud.
        feedEls.pantry.addEventListener('click', event => {
            const food = event.target.closest('.food');
            if (!food || feedLocked || food.classList.contains('used')) return;
            food.classList.add('used');
            inBowl++;
            const n = inBowl;
            const [fx, fy] = centerOf(food);
            const [bx, by] = centerOf(feedEls.bowl);
            const flyer = document.createElement('span');
            flyer.className = 'flyer';
            flyer.textContent = friend.food;
            flyer.style.left = `${fx}px`;
            flyer.style.top = `${fy}px`;
            flyer.style.fontSize = getComputedStyle(food).fontSize;
            document.body.appendChild(flyer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                flyer.style.left = `${bx}px`;
                flyer.style.top = `${by}px`;
            }));
            setTimeout(() => {
                flyer.remove();
                const item = document.createElement('button');
                item.type = 'button';
                item.dataset.i = food.dataset.i;
                item.textContent = friend.food;
                item.setAttribute('aria-label', lang.t('Take it back', 'Reprendre'));
                feedEls.bowl.appendChild(item);
            }, 380);
            updateBowlCount();
            plink(n - 1);
            sayNumber(n);
            if (n === feedTarget) feedDone();
        });

        // Tap food in the bowl to take it back (to fix a count).
        feedEls.bowl.addEventListener('click', event => {
            const item = event.target.closest('button');
            if (!item || feedLocked) return;
            const food = feedEls.pantry.querySelector(`.food[data-i="${item.dataset.i}"]`);
            if (food) food.classList.remove('used');
            item.remove();
            inBowl--;
            updateBowlCount();
            oopsSound();
        });

        function feedDone() {
            feedLocked = true;
            later(() => {
                feedEls.friend.classList.add('happy');
                cheerSound();
                const [x, y] = centerOf(feedEls.face);
                createExplosion(x, y, numData(feedTarget).c, 30);
                tint(feedTarget);
                feedWon++;
                renderStars(feedEls.stars, feedWon);
                popStar(feedEls.stars, feedWon);
                const words = feedWords(feedTarget);
                let delay = 1900;
                if (feedWon >= ROUNDS) {
                    feedWon = 0;
                    if (feedLevel < FEED_LEVELS.length - 1) feedLevel++;
                    saveLevel(FEED_KEY, feedLevel);
                    speak(`${words.enYum} Super! Level ${feedLevel + 1}!`, `${words.frYum} Super${NBSP}! Niveau ${feedLevel + 1}${NBSP}!`);
                    later(() => showCheer(lang.t(`⭐ Super! Level ${feedLevel + 1}`, `⭐ Super${NBSP}! Niveau ${feedLevel + 1}`), 1700), 600);
                    delay = 3000;
                } else {
                    speak(words.enYum, words.frYum);
                }
                later(newFeedRound, delay);
            }, 700);
        }
        document.getElementById('feed-say').addEventListener('click', () => {
            const words = feedWords(feedTarget);
            speak(words.en, words.fr);
        });

        // --- NAVIGATION ---
        document.querySelectorAll('.mode-card').forEach(card => card.addEventListener('pointerdown', () => {
            card.classList.add('pressed');
            setTimeout(() => card.classList.remove('pressed'), 180);
            boing(523.25);
        }));
        document.getElementById('play-btn').addEventListener('click', startPlay);
        document.getElementById('count-btn').addEventListener('click', startCount);
        document.getElementById('feed-btn').addEventListener('click', startFeed);
        els.back.addEventListener('click', () => {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            show(els.start);
        });

        lang.mountToggle();
        lang.onChange(() => {
            extraVoice = null;
            try { localStorage.setItem(VOICE_KEY, ''); } catch (error) { /* optional */ }
            if (!els.play.hidden) renderVoices();
            if (!els.count.hidden) renderCountHud();
            if (!els.feed.hidden) renderFeedHud();
        });

        // --- ✨ PARTICLES ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: Math.random() * -8 - 1,
                    size: Math.random() * 8 + 4,
                    life: 1,
                    color: Math.random() > 0.75 ? '#FFFFFF' : color,
                    star: Math.random() > 0.6
                });
            }
        }
        function drawStar(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.life * 6);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * p.size, -Math.sin((18 + i * 72) * Math.PI / 180) * p.size);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * p.size / 2.2, -Math.sin((54 + i * 72) * Math.PI / 180) * p.size / 2.2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                if (p.star) drawStar(p);
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateParticles();
        renderStart();
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
    </script>
</body>
</html>
