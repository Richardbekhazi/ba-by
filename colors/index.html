<!DOCTYPE html>
<html lang="en" data-title-fr="Couleurs en gelée">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Squishy jelly colors: explore, find the color, mix paints and paint a picture. English and French.">
    <title>Jelly Colors</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #FFF1D6; }
        .jelly { position: relative; border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: kit-rise 0.4s backwards; }
        .jelly svg { width: 100%; max-width: 150px; aspect-ratio: 1; filter: drop-shadow(0 6px 6px rgba(61,53,81,0.15)); }
        .jelly .face-happy { display: none; }
        .jelly.happy .face-happy { display: inline; }
        .jelly.happy .face-normal { display: none; }
        .jelly .eye { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        .jelly-name { font-family: 'Fredoka One', system-ui, sans-serif; font-size: clamp(1.05rem, 3.5vw, 1.4rem); color: var(--cd); }
        .jelly-hint { position: absolute; top: -6px; right: 6%; font-size: 1.8rem; }
        .jelly-grid { width: 100%; max-width: 960px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 16px 12px; }
        .find-grid { width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 16px; }

        /* Mix */
        .mix-row { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 3vw, 22px); font-family: 'Fredoka One', system-ui, sans-serif; font-size: 2.4rem; color: var(--muted); }
        .slot { width: clamp(84px, 22vw, 130px); aspect-ratio: 1; border-radius: 30px; background: #fff; box-shadow: inset 0 0 0 5px #EFE8F6, 0 6px 0 rgba(61,53,81,0.08); display: grid; place-items: center; font-size: 2.6rem; color: #CFC6DD; }
        .slot svg { width: 80%; }
        .slot.result { width: clamp(110px, 28vw, 170px); }
        .slot.swirl { background: conic-gradient(var(--a), var(--b), var(--a)); animation: spin 0.95s linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .mix-name { min-height: 2.2rem; font-family: 'Fredoka One', system-ui, sans-serif; font-size: 2rem; color: var(--cd, var(--ink)); }
        .paints { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
        .paint { border: 0; background: #fff; border-radius: 26px; padding: 10px; width: clamp(78px, 20vw, 104px); aspect-ratio: 1; box-shadow: 0 6px 0 rgba(61,53,81,0.1); }
        .paint svg { width: 100%; height: 100%; }
        .paint:active { transform: translateY(5px); box-shadow: none; }
        .recipes { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 760px; }
        .recipe { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: #fff; font-weight: 900; color: var(--muted); box-shadow: 0 3px 0 rgba(61,53,81,0.08); }
        .recipe i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08); font-style: normal; text-align: center; line-height: 22px; }
        .recipe i.unknown { background: #EEE8F5; color: #A79EBC; }
        .recipe.new { animation: kit-pop 0.6s; background: #FFF6CC; }

        /* Paint the picture */
        .paint-wrap { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
        .picture { width: 100%; border-radius: 30px; background: #fff; padding: 12px; box-shadow: 0 8px 0 rgba(61,53,81,0.08); }
        .picture svg { width: 100%; height: auto; display: block; border-radius: 22px; touch-action: manipulation; }
        .picture [data-r] { cursor: pointer; transition: fill 0.25s; stroke: #3D3551; stroke-width: 4; stroke-linejoin: round; }
        .picture [data-r].splash { animation: kit-pop 0.4s; transform-box: fill-box; transform-origin: center; }
        .palette { display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }
        .swatch { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #fff; background: var(--c); box-shadow: 0 5px 0 rgba(61,53,81,0.15); }
        .swatch[aria-pressed="true"] { transform: scale(1.12); box-shadow: 0 0 0 5px var(--ink), 0 5px 0 rgba(61,53,81,0.15); }
        .paint-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        @media (max-width: 680px) {
            .paint-wrap { grid-template-columns: 1fr; }
            .palette { grid-template-columns: repeat(6, 1fr); justify-items: center; }
            .swatch { width: 48px; height: 48px; border-width: 4px; }
            .jelly-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <h1 class="kit-title" style="--title-shadow:#FF9A2E"><span class="bob" data-fr="Couleurs">Jelly</span> <span class="bob" style="animation-delay:-1.3s" data-fr="en gelée">Colors</span></h1>
        <p class="kit-sub" data-fr="Écrase les gelées, trouve, mélange et peins !">Squish the jellies, find, mix and paint!</p>
        <div class="kit-modes">
            <button class="kit-mode" type="button" id="go-explore" style="--c:#FF5A5F"><span class="kit-mode-art" id="art-explore"></span><span class="kit-mode-label"><b data-fr="Les couleurs">Meet the colors</b><small data-fr="Touche une gelée">Tap a jelly</small></span></button>
            <button class="kit-mode" type="button" id="go-find" style="--c:#3D9BF0"><span class="kit-badge" id="find-badge"></span><span class="kit-mode-art"><span>🔍</span></span><span class="kit-mode-label"><b data-fr="Trouve la couleur">Find the color</b><small data-fr="Où est le rouge ?">Where is red?</small></span></button>
            <button class="kit-mode" type="button" id="go-mix" style="--c:#9B6CF0"><span class="kit-mode-art"><span>🧪</span></span><span class="kit-mode-label"><b data-fr="Mélange">Mix colors</b><small data-fr="Deux couleurs en font une nouvelle">Two colors make a new one</small></span></button>
            <button class="kit-mode" type="button" id="go-paint" style="--c:#4CC26A"><span class="kit-mode-art"><span>🖌️</span></span><span class="kit-mode-label"><b data-fr="Peins l'image">Paint the picture</b><small data-fr="Choisis une couleur, touche l'image">Pick a color, tap the picture</small></span></button>
        </div>
    </main>

    <main class="kit-screen" id="explore" hidden><div class="jelly-grid" id="explore-grid"></div></main>

    <main class="kit-screen" id="find" hidden>
        <div class="kit-hud"><span class="kit-level" id="find-level"></span><span class="kit-stars" id="find-stars"></span></div>
        <div class="kit-prompt"><span id="find-prompt"></span><button type="button" class="kit-say" id="find-say" aria-label="Say it again" data-fr-aria-label="Répéter">🔊</button></div>
        <div class="find-grid" id="find-grid"></div>
    </main>

    <main class="kit-screen" id="mix" hidden>
        <div class="mix-row"><div class="slot" id="slot-a">?</div>+<div class="slot" id="slot-b">?</div>=<div class="slot result" id="slot-r">?</div></div>
        <div class="mix-name" id="mix-name"></div>
        <div class="paints" id="paints"></div>
        <div class="kit-level" id="recipes-title"></div>
        <div class="recipes" id="recipes"></div>
    </main>

    <main class="kit-screen" id="paint" hidden>
        <div class="paint-wrap">
            <div class="picture" id="picture"></div>
            <div class="palette" id="palette" role="group" aria-label="Paint colors" data-fr-aria-label="Couleurs de peinture"></div>
        </div>
        <div class="paint-tools">
            <button type="button" class="kit-btn small" id="next-pic" style="--c:#4CC26A;--cd:#2F9E4C" data-fr="🖼️ Autre image">🖼️ Another picture</button>
            <button type="button" class="kit-btn small white" id="clear-pic" data-fr="🧽 Effacer">🧽 Clear</button>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const COLORS = [
            { id: 'red',    name: 'Red',    fr: 'Rouge',  frThe: 'le rouge',  hex: '#FF5A5F', dark: '#D93A40', emoji: '🍎', note: 0 },
            { id: 'orange', name: 'Orange', fr: 'Orange', frThe: "l'orange",  hex: '#FF9A2E', dark: '#E07A10', emoji: '🥕', note: 1 },
            { id: 'yellow', name: 'Yellow', fr: 'Jaune',  frThe: 'le jaune',  hex: '#FFD93B', dark: '#E0B400', emoji: '🐥', note: 2, label: '#B88A00' },
            { id: 'green',  name: 'Green',  fr: 'Vert',   frThe: 'le vert',   hex: '#4CC26A', dark: '#2F9E4C', emoji: '🐸', note: 3 },
            { id: 'blue',   name: 'Blue',   fr: 'Bleu',   frThe: 'le bleu',   hex: '#3D9BF0', dark: '#2077C9', emoji: '🐳', note: 4 },
            { id: 'purple', name: 'Purple', fr: 'Violet', frThe: 'le violet', hex: '#9B6CF0', dark: '#764BD1', emoji: '🍇', note: 5 },
            { id: 'pink',   name: 'Pink',   fr: 'Rose',   frThe: 'le rose',   hex: '#FF8FC4', dark: '#E2609F', emoji: '🐷', note: 6 },
            { id: 'brown',  name: 'Brown',  fr: 'Brun',   frThe: 'le brun',   hex: '#A0703F', dark: '#7A5129', emoji: '🐻', note: 7 },
            { id: 'black',  name: 'Black',  fr: 'Noir',   frThe: 'le noir',   hex: '#33303D', dark: '#15131B', emoji: '🐈‍⬛', note: 8 },
            { id: 'white',  name: 'White',  fr: 'Blanc',  frThe: 'le blanc',  hex: '#FFFFFF', dark: '#C9CED8', emoji: '☁️', note: 9, label: '#7A8394' },
            { id: 'gray',   name: 'Gray',   fr: 'Gris',   frThe: 'le gris',   hex: '#9AA3B2', dark: '#6F7889', emoji: '🐘', note: 10 }
        ];
        const EXTRA = {
            sky:   { id: 'sky',   name: 'Sky blue',     fr: 'Bleu ciel',  hex: '#8FD0FF', dark: '#5AAEE8', note: 9, label: '#3A8FD0' },
            cream: { id: 'cream', name: 'Light yellow', fr: 'Jaune pâle', hex: '#FFF0A0', dark: '#E8D266', note: 10, label: '#B89A00' }
        };
        const byId = id => COLORS.find(c => c.id === id) || EXTRA[id];
        const nameOf = c => T(c.name, c.fr);
        const sayColor = c => say(c.name, c.fr);

        function jellyArt(c, i) {
            const outline = c.id === 'white' ? 'stroke="#DCE1EA" stroke-width="3"' : '';
            const eye = c.id === 'black' ? '#fff' : '#2D2A38';
            const tilt = [-3, 2, -1, 3, -2][(i || 0) % 5];
            return `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${tilt} 50 52)">
                <rect x="8" y="15" width="84" height="80" rx="28" fill="${c.dark}"/>
                <rect x="8" y="7" width="84" height="80" rx="28" fill="${c.hex}" ${outline}/>
                <rect x="20" y="14" width="26" height="9" rx="4.5" fill="#fff" opacity="0.5"/>
                <g class="face-normal"><ellipse class="eye" cx="36" cy="46" rx="6" ry="7.5" fill="${eye}"/><ellipse class="eye" cx="64" cy="46" rx="6" ry="7.5" fill="${eye}"/>
                <path d="M42 60 Q50 67 58 60" stroke="${eye}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
                <g class="face-happy"><path d="M29 48 Q36 39 43 48" stroke="${eye}" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M57 48 Q64 39 71 48" stroke="${eye}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 57 Q50 74 62 57 Z" fill="${eye}"/></g>
                <ellipse cx="24" cy="58" rx="6.5" ry="4.5" fill="#FF7FA8" opacity="0.5"/><ellipse cx="76" cy="58" rx="6.5" ry="4.5" fill="#FF7FA8" opacity="0.5"/></g></svg>`;
        }
        function dropArt(c) {
            const outline = c.id === 'white' ? 'stroke="#DCE1EA" stroke-width="3"' : '';
            return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 C50 8 16 46 16 66 A34 34 0 0 0 84 66 C84 46 50 8 50 8 Z" fill="${c.hex}" ${outline}/>
                <path d="M32 62 Q32 50 42 40" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/></svg>`;
        }
        function jellyButton(c, i, opts) {
            return `<button type="button" class="jelly" data-id="${c.id}" style="--cd:${c.label || c.dark};animation-delay:${i * 0.04}s" aria-label="${nameOf(c)}">
                ${jellyArt(c, i)}${opts.hint ? `<span class="jelly-hint" aria-hidden="true">${c.emoji}</span>` : ''}${opts.name ? `<span class="jelly-name">${nameOf(c)}</span>` : ''}</button>`;
        }
        function smile(btn, ms) { btn.classList.add('happy'); clearTimeout(btn._smile); btn._smile = setTimeout(() => btn.classList.remove('happy'), ms || 900); }
        const tintFor = c => Kit.tint(c.id === 'white' ? '#EEF1F6' : c.hex + '44');

        const start = $('#start'), explore = $('#explore'), find = $('#find'), mix = $('#mix'), paint = $('#paint');
        Kit.topbar({ onBack: () => goStart() });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#FFF1D6'); renderBadges(); }
        $('#art-explore').innerHTML = `<span style="width:110px;display:block">${jellyArt(COLORS[0], 0)}</span>`;

        // ---------------- 🎨 EXPLORE ----------------
        function openExplore() {
            Kit.show(explore);
            $('#explore-grid').innerHTML = COLORS.map((c, i) => jellyButton(c, i, { name: true, hint: true })).join('');
            say('Tap a jelly!', `Touche une gelée${NBSP}!`);
        }
        $('#explore-grid').addEventListener('click', event => {
            const btn = event.target.closest('.jelly');
            if (!btn) return;
            const c = byId(btn.dataset.id);
            Kit.bounce(btn);
            smile(btn);
            sfx.boing(Kit.note(c.note));
            sayColor(c);
            Kit.burstFrom(btn, [c.id === 'white' ? '#DCE1EA' : c.hex, '#fff'], 18);
            tintFor(c);
        });

        // ---------------- 🔍 FIND ----------------
        const FIND = [2, 3, 4, 6];
        const ROUNDS = 5;
        const findStore = Kit.levelStore('colors-find-level', FIND.length);
        let findLevel = findStore.get(), findWon = 0, target = COLORS[0], findLocked = false;
        function renderFind(popIndex) {
            $('#find-level').textContent = T(`Level ${findLevel + 1}`, `Niveau ${findLevel + 1}`);
            Kit.stars($('#find-stars'), ROUNDS, findWon, popIndex);
            const article = target.frThe.slice(0, target.frThe.length - target.fr.length);
            $('#find-prompt').innerHTML = T(`Where is <span class="kit-word" style="--wc:${target.label || target.dark}">${target.name.toLowerCase()}</span>? ${target.emoji}`,
                `Où est ${article}<span class="kit-word" style="--wc:${target.label || target.dark}">${target.fr.toLowerCase()}</span>${NBSP}? ${target.emoji}`);
        }
        const sayFind = () => say(`Where is ${target.name.toLowerCase()}?`, `Où est ${target.frThe}${NBSP}?`);
        function newFind() {
            findLocked = false;
            target = Kit.pick(COLORS.filter(c => c !== target));
            const n = FIND[findLevel];
            const choices = Kit.shuffle([target, ...Kit.shuffle(COLORS.filter(c => c !== target)).slice(0, n - 1)]);
            $('#find-grid').style.setProperty('--n', n <= 4 ? Math.min(n, 4) : 3);
            $('#find-grid').innerHTML = choices.map((c, i) => jellyButton(c, i, {})).join('');
            renderFind();
            sayFind();
        }
        $('#find-grid').addEventListener('click', event => {
            const btn = event.target.closest('.jelly');
            if (!btn || findLocked) return;
            const c = byId(btn.dataset.id);
            if (c !== target) { Kit.bounce(btn, 'wobble'); sfx.oops(); sayColor(c); return; }
            findLocked = true;
            Kit.bounce(btn);
            smile(btn, 1500);
            sfx.cheer();
            tintFor(c);
            Kit.burstFrom(btn, [c.id === 'white' ? '#DCE1EA' : c.hex, '#FFD54A', '#fff'], 34);
            findWon++;
            let wait = 1500;
            if (findWon >= ROUNDS) {
                findWon = 0;
                if (findLevel < FIND.length - 1) findLevel++;
                findStore.set(findLevel);
                say(`Yes, ${c.name.toLowerCase()}! Super! Level ${findLevel + 1}!`, `Oui, ${c.fr.toLowerCase()}${NBSP}! Super${NBSP}! Niveau ${findLevel + 1}${NBSP}!`);
                Kit.later(() => { Kit.cheer(T(`⭐ Level ${findLevel + 1}!`, `⭐ Niveau ${findLevel + 1}${NBSP}!`)); Kit.confetti(90); sfx.fanfare(); }, 400);
                renderFind(ROUNDS - 1);
                wait = 2800;
            } else {
                say(`Yes, ${c.name.toLowerCase()}!`, `Oui, ${c.fr.toLowerCase()}${NBSP}!`);
                renderFind(findWon - 1);
            }
            Kit.later(newFind, wait);
        });
        $('#find-say').addEventListener('click', sayFind);
        function openFind() { Kit.show(find); findWon = 0; newFind(); }

        // ---------------- 🧪 MIX ----------------
        const PAINTS = ['red', 'yellow', 'blue', 'white'].map(byId);
        const RECIPES = [
            { mix: ['red', 'yellow'], result: 'orange' }, { mix: ['yellow', 'blue'], result: 'green' }, { mix: ['red', 'blue'], result: 'purple' },
            { mix: ['red', 'white'], result: 'pink' }, { mix: ['blue', 'white'], result: 'sky' }, { mix: ['yellow', 'white'], result: 'cream' }
        ];
        const key = (a, b) => [a, b].sort().join('+');
        const found = new Set(Kit.store.json('colors-mixes', []));
        let picks = [], mixing = false;
        function renderRecipes(newKey) {
            $('#recipes-title').textContent = T(`📖 My colors: ${found.size} / ${RECIPES.length}`, `📖 Mes couleurs${NBSP}: ${found.size} / ${RECIPES.length}`);
            $('#recipes').innerHTML = RECIPES.map(r => {
                const k = key(...r.mix), known = found.has(k);
                const [a, b] = r.mix.map(byId), res = byId(r.result);
                return `<div class="recipe${k === newKey ? ' new' : ''}"><i style="--c:${a.hex}"></i>+<i style="--c:${b.hex}"></i>=${known ? `<i style="--c:${res.hex}"></i>` : '<i class="unknown">?</i>'}</div>`;
            }).join('');
        }
        function clearMix() {
            picks = [];
            ['#slot-a', '#slot-b', '#slot-r'].forEach(s => { $(s).className = 'slot' + (s === '#slot-r' ? ' result' : ''); $(s).textContent = '?'; });
            $('#mix-name').textContent = '';
        }
        function openMix() {
            Kit.show(mix);
            clearMix();
            $('#paints').innerHTML = PAINTS.map(c => `<button type="button" class="paint" data-id="${c.id}" aria-label="${nameOf(c)}">${dropArt(c)}</button>`).join('');
            renderRecipes();
            say('Tap two colors to mix them!', `Touche deux couleurs pour les mélanger${NBSP}!`);
        }
        $('#paints').addEventListener('click', event => {
            const btn = event.target.closest('.paint');
            if (!btn || mixing) return;
            if (picks.length === 2) clearMix();
            const c = byId(btn.dataset.id);
            Kit.bounce(btn);
            sfx.boing(Kit.note(c.note));
            picks.push(c);
            const slot = picks.length === 1 ? $('#slot-a') : $('#slot-b');
            slot.innerHTML = dropArt(c);
            Kit.bounce(slot);
            if (picks.length === 2) mixColors();
        });
        function mixColors() {
            mixing = true;
            const [a, b] = picks;
            const recipe = RECIPES.find(r => key(...r.mix) === key(a.id, b.id));
            const result = a.id === b.id || !recipe ? a : byId(recipe.result);
            const k = key(a.id, b.id);
            const isNew = recipe && !found.has(k);
            const r = $('#slot-r');
            r.textContent = '';
            r.style.setProperty('--a', a.hex);
            r.style.setProperty('--b', b.hex);
            r.classList.add('swirl');
            sfx.whoosh();
            Kit.later(() => {
                r.classList.remove('swirl');
                r.innerHTML = `<span class="jelly happy" style="animation:none">${jellyArt(result, 1)}</span>`;
                Kit.bounce(r);
                sfx.cheer();
                tintFor(result);
                Kit.burstFrom(r, [result.hex, '#fff', '#FFD54A'], 36);
                $('#mix-name').style.setProperty('--cd', result.label || result.dark);
                $('#mix-name').textContent = nameOf(result);
                if (a.id === b.id) say(`${a.name} and ${b.name.toLowerCase()} stay ${a.name.toLowerCase()}!`, `${a.fr} et ${b.fr.toLowerCase()}, ça reste ${a.fr.toLowerCase()}${NBSP}!`);
                else say(`${a.name} and ${b.name.toLowerCase()} make ${result.name.toLowerCase()}!`, `${a.fr} et ${b.fr.toLowerCase()}, ça fait ${result.fr.toLowerCase()}${NBSP}!`);
                if (isNew) {
                    found.add(k);
                    Kit.store.setJson('colors-mixes', [...found]);
                    renderRecipes(k);
                    if (found.size === RECIPES.length) Kit.later(() => { Kit.cheer(T('🌈 You found all the colors!', `🌈 Toutes les couleurs${NBSP}!`), 2400); Kit.confetti(); sfx.fanfare(); }, 2000);
                }
                mixing = false;
            }, 950);
        }

        // ---------------- 🖌️ PAINT THE PICTURE ----------------
        const S = 'stroke="#3D3551" stroke-width="4"';
        const PICTURES = [
            // A little house with a tree and the sun.
            `<rect data-r="sky" x="2" y="2" width="396" height="296" rx="18"/>
             <rect data-r="grass" x="2" y="224" width="396" height="74"/>
             <circle data-r="sun" cx="56" cy="56" r="32"/>
             <rect data-r="wall" x="96" y="138" width="160" height="104" rx="6"/>
             <polygon data-r="roof" points="80,142 176,72 272,142"/>
             <rect data-r="door" x="156" y="180" width="42" height="62" rx="8"/>
             <rect data-r="window" x="112" y="158" width="32" height="32" rx="6"/>
             <rect data-r="window2" x="210" y="158" width="32" height="32" rx="6"/>
             <rect data-r="trunk" x="312" y="160" width="18" height="72" rx="6"/>
             <circle data-r="leaves" cx="321" cy="140" r="40"/>
             <circle cx="190" cy="212" r="4" fill="#3D3551"/>`,
            // A fish in the sea.
            `<rect data-r="water" x="2" y="2" width="396" height="296" rx="18"/>
             <path data-r="sand" d="M2 250 Q100 225 200 250 T398 245 V298 H2 Z"/>
             <path data-r="weed" d="M50 250 Q30 200 55 170 Q75 140 52 100 Q90 140 70 180 Q55 215 72 250 Z"/>
             <polygon data-r="tail" points="110,150 52,104 52,196"/>
             <ellipse data-r="fish" cx="200" cy="150" rx="96" ry="58"/>
             <path data-r="fin" d="M180 96 Q210 60 240 98 Z"/>
             <circle cx="252" cy="138" r="9" fill="#3D3551"/><circle cx="255" cy="135" r="3" fill="#fff"/>
             <path d="M262 168 Q276 174 286 166" fill="none" ${S} stroke-linecap="round"/>
             <circle data-r="bubble1" cx="320" cy="90" r="14"/><circle data-r="bubble2" cx="344" cy="52" r="10"/><circle data-r="bubble3" cx="330" cy="22" r="7"/>
             <polygon data-r="star" points="330,232 337,250 356,250 341,261 347,279 330,268 313,279 319,261 304,250 323,250"/>`,
            // A rainbow over two clouds.
            `<rect data-r="sky" x="2" y="2" width="396" height="296" rx="18"/>
             ${[0, 1, 2, 3, 4, 5].map(i => { const r2 = 170 - i * 20, r1 = r2 - 20; return `<path data-r="band${i}" d="M${200 - r2} 250 A${r2} ${r2} 0 0 1 ${200 + r2} 250 L${200 + r1} 250 A${r1} ${r1} 0 0 0 ${200 - r1} 250 Z"/>`; }).join('')}
             <path data-r="cloud1" d="M10 262 Q8 226 44 230 Q56 200 86 216 Q112 208 112 240 Q128 262 100 270 H24 Q8 270 10 262 Z"/>
             <path data-r="cloud2" d="M290 262 Q288 226 324 230 Q336 200 366 216 Q392 208 392 240 Q398 262 380 270 H304 Q288 270 290 262 Z"/>
             <circle data-r="sun" cx="352" cy="58" r="30"/>`
        ];
        const PAINT_COLORS = COLORS.filter(c => c.id !== 'gray');
        let picIndex = 0, brush = byId('red');
        function renderPicture() {
            $('#picture').innerHTML = `<svg viewBox="0 0 400 300" role="img" aria-label="${T('Picture to paint', 'Image à peindre')}">${PICTURES[picIndex]}</svg>`;
            $('#picture').querySelectorAll('[data-r]').forEach(el => el.setAttribute('fill', '#FFFFFF'));
        }
        function renderPalette() {
            $('#palette').innerHTML = PAINT_COLORS.map(c => `<button type="button" class="swatch" data-id="${c.id}" style="--c:${c.hex}" aria-label="${nameOf(c)}" aria-pressed="${c === brush}"></button>`).join('');
        }
        $('#palette').addEventListener('click', event => {
            const sw = event.target.closest('.swatch');
            if (!sw) return;
            brush = byId(sw.dataset.id);
            $('#palette').querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', String(b === sw)));
            Kit.bounce(sw);
            sfx.boing(Kit.note(brush.note));
            sayColor(brush);
        });
        $('#picture').addEventListener('click', event => {
            const part = event.target.closest('[data-r]');
            if (!part) return;
            part.setAttribute('fill', brush.hex);
            part.classList.remove('splash'); void part.getBoundingClientRect(); part.classList.add('splash');
            sfx.splash();
            Kit.burst(event.clientX, event.clientY, [brush.id === 'white' ? '#DCE1EA' : brush.hex, '#fff'], 14, 0.7);
            const parts = [...$('#picture').querySelectorAll('[data-r]')];
            if (parts.every(p => p.getAttribute('fill') !== '#FFFFFF') && !$('#picture')._done) {
                $('#picture')._done = true;
                Kit.later(() => { Kit.cheer(T('🎨 What a masterpiece!', `🎨 Quel chef-d'œuvre${NBSP}!`), 2000); Kit.confetti(110); sfx.fanfare(); say('What a beautiful picture!', `Quelle belle image${NBSP}!`); }, 300);
            }
        });
        $('#next-pic').addEventListener('click', () => { picIndex = (picIndex + 1) % PICTURES.length; $('#picture')._done = false; renderPicture(); sfx.whoosh(); });
        $('#clear-pic').addEventListener('click', () => { $('#picture')._done = false; renderPicture(); sfx.splash(); });
        function openPaint() {
            Kit.show(paint);
            $('#picture')._done = false;
            renderPicture();
            renderPalette();
            say('Pick a color, then tap the picture!', `Choisis une couleur, puis touche l'image${NBSP}!`);
        }

        // ---------------- START ----------------
        function renderBadges() { $('#find-badge').textContent = T(`Level ${findLevel + 1}`, `Niv. ${findLevel + 1}`); }
        $('#go-explore').addEventListener('click', () => { sfx.pop(); openExplore(); });
        $('#go-find').addEventListener('click', () => { sfx.pop(); openFind(); });
        $('#go-mix').addEventListener('click', () => { sfx.pop(); openMix(); });
        $('#go-paint').addEventListener('click', () => { sfx.pop(); openPaint(); });
        Kit.onLang(() => {
            renderBadges();
            if (!explore.hidden) $('#explore-grid').innerHTML = COLORS.map((c, i) => jellyButton(c, i, { name: true, hint: true })).join('');
            if (!find.hidden) renderFind();
            if (!mix.hidden) renderRecipes();
            if (!paint.hidden) renderPalette();
        });
        goStart();
    }());
    </script>
</body>
