<!DOCTYPE html>
<html lang="en" data-title-fr="Blocs rigolos">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Stack smiley jelly blocks and fill lines. Big buttons, gentle speed and no game over. English and French.">
    <title>Stacky Smiles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/kit.css?v=20261029">
    <script src="/assets/js/site-lang.js?v=20261028"></script>
    <script src="/assets/js/kit.js?v=20261029"></script>
    <style>
        :root { --tint: #E6E0FF; }
        .title-art { width: min(320px, 80vw); height: 120px; }
        #game { padding-left: 8px; padding-right: 8px; gap: 10px; }
        .game-layout {
            flex: 1;
            width: 100%;
            max-width: 980px;
            min-height: 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-areas: "left board right";
            align-items: center;
            gap: 14px;
        }
        .side { display: flex; flex-direction: column; gap: 14px; align-items: center; }
        .side.left { grid-area: left; }
        .side.right { grid-area: right; }
        .board-wrap { grid-area: board; min-height: 0; height: 100%; display: grid; place-items: center; }
        .board-frame { position: relative; padding: 10px; border-radius: 28px; background: #fff; box-shadow: 0 10px 0 rgba(61,53,81,0.12), 0 20px 40px rgba(61,53,81,0.12); }
        #board { display: block; border-radius: 20px; touch-action: none; }
        .next-box { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 24px; background: #fff; box-shadow: 0 6px 0 rgba(61,53,81,0.1); font-weight: 900; color: var(--muted); }
        #next { width: 86px; height: 86px; }
        .pad {
            --c: var(--blue); --cd: var(--blue-d);
            width: 84px; height: 84px;
            border: 0;
            border-radius: 28px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 75%, #fff), var(--c));
            box-shadow: 0 7px 0 var(--cd);
            color: #fff;
            font-size: 38px;
            line-height: 1;
            touch-action: none;
        }
        .pad.down, .pad:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--cd); }
        .pad.turn { --c: var(--purple); --cd: var(--purple-d); }
        .pad.drop { --c: var(--pink); --cd: var(--pink-d); }
        @media (max-width: 720px), (max-aspect-ratio: 4/5) {
            .game-layout { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; grid-template-areas: "board board" "left right"; gap: 10px; }
            .side { flex-direction: row; justify-content: center; }
            .pad { width: 72px; height: 72px; font-size: 32px; }
            .next-box { display: none; }
        }
    </style>
</head>
<body>
    <main class="kit-screen" id="start">
        <canvas class="title-art" id="title-art" aria-hidden="true"></canvas>
        <h1 class="kit-title" style="--title-shadow:#9B6CF0"><span class="bob" data-fr="Blocs">Stacky</span> <span class="bob" style="animation-delay:-1.3s" data-fr="rigolos">Smiles</span></h1>
        <p class="kit-sub" data-fr="Empile les blocs souriants et remplis des lignes !">Stack the smiley blocks and fill a line!</p>
        <div class="kit-modes" style="max-width:640px">
            <button class="kit-mode" type="button" id="go-play" style="--c:#9B6CF0"><span class="kit-badge" id="play-badge"></span><span class="kit-mode-art"><span>🧱</span></span><span class="kit-mode-label"><b data-fr="On joue !">Let's stack!</b><small data-fr="5 lignes pour passer au niveau suivant">5 lines to reach the next level</small></span></button>
            <button class="kit-mode" type="button" id="go-pick" style="--c:#FF9F43"><span class="kit-mode-art"><span>🔢</span></span><span class="kit-mode-label"><b data-fr="Choisir un niveau">Choose a level</b><small data-fr="Les niveaux finis s'ouvrent">Finished levels open up</small></span></button>
        </div>
    </main>

    <main class="kit-screen" id="pick" hidden>
        <h2 class="kit-title" style="font-size:2.4rem;--title-shadow:#FF9F43" data-fr="Choisis un niveau">Choose a level</h2>
        <div id="picker"></div>
    </main>

    <main class="kit-screen fit" id="game" hidden>
        <div class="kit-hud"><span class="kit-level" id="level-badge"></span><span class="kit-stars" id="stars"></span></div>
        <div class="game-layout">
            <div class="side left">
                <button class="pad" type="button" id="btn-left" aria-label="Move left" data-fr-aria-label="Gauche">◀</button>
                <button class="pad" type="button" id="btn-right" aria-label="Move right" data-fr-aria-label="Droite">▶</button>
            </div>
            <div class="board-wrap" id="board-area"><div class="board-frame"><canvas id="board" aria-label="Blocks board" data-fr-aria-label="Plateau de blocs"></canvas></div></div>
            <div class="side right">
                <div class="next-box"><span data-fr="Suivant">Next</span><canvas id="next" aria-hidden="true"></canvas></div>
                <button class="pad turn" type="button" id="btn-turn" aria-label="Turn" data-fr-aria-label="Tourner">⟳</button>
                <button class="pad drop" type="button" id="btn-drop" aria-label="Drop" data-fr-aria-label="Lâcher">▼</button>
            </div>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        const { T, $, sfx, say } = Kit;
        const NBSP = ' ';
        const COLS = 8, ROWS = 14;
        const SHAPES = {
            dot: { cells: [[1]], c: '#FF7DB8', cd: '#C93F86' },
            duo: { cells: [[1, 1]], c: '#2EC4B6', cd: '#0E857A' },
            tri: { cells: [[1, 1, 1]], c: '#3D9BF0', cd: '#1D6FC4' },
            corner: { cells: [[1, 0], [1, 1]], c: '#9B6CF0', cd: '#6A3FD1' },
            O: { cells: [[1, 1], [1, 1]], c: '#FFC93B', cd: '#D49A00' },
            I: { cells: [[1, 1, 1, 1]], c: '#3FBF62', cd: '#1F8A3E' },
            T: { cells: [[0, 1, 0], [1, 1, 1]], c: '#FF9A2E', cd: '#C9600A' },
            L: { cells: [[0, 0, 1], [1, 1, 1]], c: '#FF5A5F', cd: '#C9303A' },
            J: { cells: [[1, 0, 0], [1, 1, 1]], c: '#3D9BF0', cd: '#1D6FC4' },
            S: { cells: [[0, 1, 1], [1, 1, 0]], c: '#2EC4B6', cd: '#0E857A' },
            Z: { cells: [[1, 1, 0], [0, 1, 1]], c: '#FF7DB8', cd: '#C93F86' }
        };
        // Each level adds bigger pieces, falls a bit faster and has its own sky.
        const LEVELS = [
            { pieces: ['dot', 'duo', 'tri', 'corner'], speed: 1150, sky: ['#FFE8F2', '#FFD3E6'], tint: '#FFE3EF' },
            { pieces: ['duo', 'tri', 'corner', 'O'], speed: 1050, sky: ['#FFF1D9', '#FFDDA8'], tint: '#FFF0D6' },
            { pieces: ['tri', 'corner', 'O', 'I', 'T'], speed: 950, sky: ['#E3F8E6', '#BDEBC5'], tint: '#E2F6E5' },
            { pieces: ['corner', 'O', 'I', 'T', 'L', 'J'], speed: 850, sky: ['#E2F1FF', '#B9DCFF'], tint: '#E0EEFF' },
            { pieces: ['O', 'I', 'T', 'L', 'J', 'S', 'Z'], speed: 760, sky: ['#EFE7FF', '#D3C2FF'], tint: '#EDE5FF' },
            { pieces: ['O', 'I', 'T', 'L', 'J', 'S', 'Z'], speed: 640, sky: ['#2B2F6B', '#16184A'], tint: '#D9DBF5', night: true }
        ];
        const LINES = 5;
        const levelStore = Kit.levelStore('stacky-level', LEVELS.length);
        let level = levelStore.get();
        let cleared = Math.min(LEVELS.length, Math.max(0, Number(Kit.store.get('stacky-cleared', 0)) || 0));
        const save = () => { levelStore.set(level); Kit.store.set('stacky-cleared', cleared); };

        const start = $('#start'), pick = $('#pick'), game = $('#game');
        const board = $('#board'), ctx = board.getContext('2d'), nextCv = $('#next'), nextCtx = nextCv.getContext('2d');
        Kit.topbar({ onBack: () => goStart() });

        // ---------- Smiley jelly blocks ----------
        function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
        function block(c, x, y, s, color, dark, mood) {
            const pad = Math.max(1.5, s * 0.05), w = s - pad * 2, edge = s * 0.09, bx = x + pad, by = y + pad;
            c.fillStyle = dark; rr(c, bx, by + edge, w, w - edge, s * 0.28); c.fill();
            c.fillStyle = color; rr(c, bx, by, w, w - edge, s * 0.28); c.fill();
            c.fillStyle = 'rgba(255,255,255,0.45)'; rr(c, bx + w * 0.16, by + w * 0.1, w * 0.3, w * 0.1, w * 0.05); c.fill();
            if (s < 16) return;
            const cx = bx + w / 2, ey = by + w * 0.42, dx = w * 0.18;
            c.fillStyle = c.strokeStyle = '#2D2A38';
            c.lineCap = 'round';
            c.lineWidth = Math.max(1.6, s * 0.06);
            if (mood === 'happy') {
                [-1, 1].forEach(sd => { c.beginPath(); c.arc(cx + sd * dx, ey + w * 0.03, w * 0.07, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); });
                c.beginPath(); c.arc(cx, by + w * 0.55, w * 0.14, 0, Math.PI); c.fill();
            } else {
                [-1, 1].forEach(sd => {
                    c.beginPath();
                    if (mood === 'blink') { c.moveTo(cx + sd * dx - w * 0.05, ey); c.lineTo(cx + sd * dx + w * 0.05, ey); c.stroke(); }
                    else { const big = mood === 'awake' ? 1.2 : 1; c.ellipse(cx + sd * dx, ey, w * 0.055 * big, w * 0.07 * big, 0, 0, Math.PI * 2); c.fill(); }
                });
                c.beginPath(); c.arc(cx, by + w * 0.52, w * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
            }
            c.fillStyle = 'rgba(255,120,160,0.45)';
            [-1, 1].forEach(sd => { c.beginPath(); c.ellipse(cx + sd * w * 0.31, by + w * 0.56, w * 0.07, w * 0.045, 0, 0, Math.PI * 2); c.fill(); });
        }

        // ---------- Game state ----------
        let grid = [], piece = null, nextId = null, bag = [], lines = 0, cell = 40, dpr = 1;
        let running = false, busy = false, fallTimer = 0, landTimer = 0, lastTime = 0, clearing = [], clearStart = 0;
        const emptyGrid = () => Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
        const fromBag = () => { if (!bag.length) bag = Kit.shuffle([...LEVELS[level].pieces, ...LEVELS[level].pieces]); return bag.pop(); };
        function fits(cells, x, y) {
            for (let r = 0; r < cells.length; r++) for (let c = 0; c < cells[r].length; c++) {
                if (!cells[r][c]) continue;
                const gx = x + c, gy = y + r;
                if (gx < 0 || gx >= COLS || gy >= ROWS) return false;
                if (gy >= 0 && grid[gy][gx]) return false;
            }
            return true;
        }
        function spawn() {
            const id = nextId || fromBag();
            nextId = fromBag();
            const cells = SHAPES[id].cells.map(r => [...r]);
            piece = { id, cells, x: Math.floor((COLS - cells[0].length) / 2), y: 0 };
            fallTimer = landTimer = 0;
            drawNext();
            if (!fits(piece.cells, piece.x, piece.y)) tidyUp();
        }
        function move(dx) {
            if (!piece || busy) return false;
            if (fits(piece.cells, piece.x + dx, piece.y)) { piece.x += dx; landTimer = 0; return true; }
            return false;
        }
        const rotate = cells => cells[0].map((_, c) => cells.map(row => row[c]).reverse());
        function turn() {
            if (!piece || busy) return;
            const t = rotate(piece.cells);
            for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1]]) {
                if (fits(t, piece.x + dx, piece.y + dy)) { piece.cells = t; piece.x += dx; piece.y += dy; landTimer = 0; Kit.tone(660, { dur: 0.08, vol: 0.08, type: 'triangle' }); Kit.tone(880, { at: 0.05, dur: 0.08, vol: 0.06, type: 'triangle' }); return; }
            }
            sfx.oops();
        }
        function ghostY() { let y = piece.y; while (fits(piece.cells, piece.x, y + 1)) y++; return y; }
        function stepDown() { if (!piece || busy) return false; if (fits(piece.cells, piece.x, piece.y + 1)) { piece.y++; fallTimer = 0; return true; } return false; }
        function hardDrop() {
            if (!piece || busy) return;
            const from = piece.y;
            piece.y = ghostY();
            if (piece.y > from) burstPiece(piece, 4);
            settle();
        }
        function settle() {
            const shape = SHAPES[piece.id];
            piece.cells.forEach((row, r) => row.forEach((v, c) => { if (v && piece.y + r >= 0) grid[piece.y + r][piece.x + c] = { c: shape.c, cd: shape.cd, seed: Math.random() * 100 }; }));
            Kit.tone(140, { dur: 0.16, vol: 0.14 });
            piece = null;
            const full = [];
            grid.forEach((row, r) => { if (row.every(Boolean)) full.push(r); });
            if (full.length) {
                busy = true;
                clearing = full;
                clearStart = performance.now();
                [523.25, 659.25, 783.99, 1046.5, 1318.5].slice(0, 2 + full.length).forEach((f, i) => Kit.tone(f, { at: i * 0.07, dur: 0.28, vol: 0.13 }));
                full.forEach(r => { for (let c = 0; c < COLS; c++) sparkle(c, r, grid[r][c].c, 3); });
                Kit.later(() => finishClear(full), 520);
            } else spawn();
        }
        function finishClear(full) {
            grid = grid.filter((_, r) => !full.includes(r));
            while (grid.length < ROWS) grid.unshift(new Array(COLS).fill(null));
            clearing = [];
            const before = lines;
            lines = Math.min(LINES, lines + full.length);
            renderHud(before);
            if (lines >= LINES) { levelUp(); return; }
            const [en, fr] = Kit.pick([['Yay!', `Ouais${NBSP}!`], ['A line!', `Une ligne${NBSP}!`], ['Super!', `Super${NBSP}!`], ['Well done!', `Bravo${NBSP}!`]]);
            say(en, fr);
            busy = false;
            spawn();
        }
        function levelUp() {
            cleared = Math.max(cleared, level + 1);
            const last = level === LEVELS.length - 1;
            if (!last) level++;
            save();
            sfx.fanfare();
            Kit.confetti(140);
            Kit.cheer(last ? T('🏆 You did it!', `🏆 Tu as réussi${NBSP}!`) : T(`⭐ Level ${level + 1}!`, `⭐ Niveau ${level + 1}${NBSP}!`), 2000);
            say(last ? 'You did it! Amazing!' : `Super! Level ${level + 1}!`, last ? `Tu as réussi${NBSP}! Génial${NBSP}!` : `Super${NBSP}! Niveau ${level + 1}${NBSP}!`);
            Kit.later(() => sweep(() => { lines = 0; bag = []; nextId = null; applyLevelLook(); renderHud(); busy = false; spawn(); }), 900);
        }
        // No game over: a tower that reaches the top pops away and play goes on.
        function tidyUp() {
            busy = true;
            piece = null;
            say("Wow, what a tall tower! Let's make room!", `Oh, quelle grande tour${NBSP}! On fait de la place${NBSP}!`);
            sweep(() => { busy = false; spawn(); });
        }
        function sweep(done) {
            let r = 0;
            const tick = () => {
                if (r >= ROWS) { done(); return; }
                if (grid[r].some(Boolean)) { grid[r].forEach((b, c) => { if (b) sparkle(c, r, b.c, 2); }); Kit.tone(300 + r * 40, { dur: 0.12, vol: 0.07, type: 'triangle' }); }
                grid[r] = new Array(COLS).fill(null);
                r++;
                Kit.later(tick, 60);
            };
            tick();
        }

        // ---------- Drawing ----------
        function resize() {
            if (game.hidden) return;
            const area = $('#board-area').getBoundingClientRect();
            cell = Math.max(16, Math.floor(Math.min((area.width - 24) / COLS, (area.height - 24) / ROWS, 60)));
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            board.style.width = cell * COLS + 'px';
            board.style.height = cell * ROWS + 'px';
            board.width = cell * COLS * dpr;
            board.height = cell * ROWS * dpr;
            nextCv.width = nextCv.height = 86 * dpr;
            drawNext();
        }
        function draw(now) {
            const W = cell * COLS, H = cell * ROWS, sky = LEVELS[level].sky;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            if (LEVELS[level].night) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.arc((i * 53) % W, (i * 97) % H, 1.5 + (i % 3), 0, Math.PI * 2); ctx.fill(); }
            }
            for (let c = 1; c < COLS; c++) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(c * cell - 1, 0, 2, H); }
            if (piece) {
                const gy = ghostY(), shape = SHAPES[piece.id];
                ctx.save();
                piece.cells.forEach((row, r) => row.forEach((v, c) => {
                    if (!v) return;
                    rr(ctx, (piece.x + c) * cell + 3, (gy + r) * cell + 3, cell - 6, cell - 6, cell * 0.26);
                    ctx.fillStyle = shape.c + '33'; ctx.fill();
                    ctx.setLineDash([cell * 0.14, cell * 0.1]); ctx.lineWidth = Math.max(2, cell * 0.06); ctx.strokeStyle = shape.cd; ctx.stroke();
                }));
                ctx.restore();
            }
            const flash = clearing.length ? Math.min(1, (now - clearStart) / 520) : 0;
            grid.forEach((row, r) => row.forEach((b, c) => {
                if (!b) return;
                if (clearing.includes(r)) {
                    const lift = Math.sin(flash * Math.PI) * cell * 0.25, s = cell * Math.max(0.05, 1 - Math.max(0, flash - 0.6) * 2.2);
                    block(ctx, c * cell + (cell - s) / 2, r * cell + (cell - s) / 2 - lift, s, b.c, b.cd, 'happy');
                } else block(ctx, c * cell, r * cell, cell, b.c, b.cd, ((now / 1000 + b.seed) % 5) < 0.12 ? 'blink' : 'rest');
            }));
            if (piece) {
                const shape = SHAPES[piece.id];
                piece.cells.forEach((row, r) => row.forEach((v, c) => { if (v && piece.y + r >= 0) block(ctx, (piece.x + c) * cell, (piece.y + r) * cell, cell, shape.c, shape.cd, 'awake'); }));
            }
        }
        function drawNext() {
            if (!nextId) return;
            const size = 86, cells = SHAPES[nextId].cells, s = Math.floor(size * 0.8 / Math.max(cells.length, cells[0].length, 2));
            nextCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            nextCtx.clearRect(0, 0, size, size);
            const ox = (size - cells[0].length * s) / 2, oy = (size - cells.length * s) / 2;
            cells.forEach((row, r) => row.forEach((v, c) => { if (v) block(nextCtx, ox + c * s, oy + r * s, s, SHAPES[nextId].c, SHAPES[nextId].cd, 'awake'); }));
        }
        function loop(now) {
            if (!running) return;
            const dt = Math.min(100, now - (lastTime || now));
            lastTime = now;
            if (piece && !busy) {
                fallTimer += dt;
                if (!fits(piece.cells, piece.x, piece.y + 1)) { landTimer += dt; if (landTimer > Math.max(450, LEVELS[level].speed * 0.6)) settle(); }
                else if (fallTimer >= LEVELS[level].speed) stepDown();
            }
            draw(now);
            requestAnimationFrame(loop);
        }
        function sparkle(c, r, color, n) {
            const rect = board.getBoundingClientRect();
            Kit.burst(rect.left + (c + 0.5) * cell, rect.top + (r + 0.5) * cell, [color, '#fff'], n, 0.6);
        }
        function burstPiece(p, n) { p.cells.forEach((row, r) => row.forEach((v, c) => { if (v) sparkle(p.x + c, p.y + r, SHAPES[p.id].c, n); })); }

        // ---------- Controls: drag to slide, tap to turn, flick down to drop ----------
        let drag = null;
        const colUnder = x => Math.floor((x - board.getBoundingClientRect().left) / cell);
        function slideTo(tx) { if (!piece || busy) return; let moved = false; while (piece.x < tx && move(1)) moved = true; while (piece.x > tx && move(-1)) moved = true; if (moved) Kit.tone(520, { dur: 0.06, vol: 0.06, type: 'triangle' }); }
        board.addEventListener('pointerdown', e => {
            e.preventDefault();
            try { board.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            drag = { x: e.clientX, y: e.clientY, t: performance.now(), startX: piece ? piece.x : 0, moved: false, dropped: false };
        });
        board.addEventListener('pointermove', e => {
            if (!piece || busy) return;
            if (!drag) { if (e.pointerType === 'mouse') { const w = piece.cells[0].length; slideTo(Math.max(0, Math.min(COLS - w, colUnder(e.clientX) - Math.floor((w - 1) / 2)))); } return; }
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) drag.moved = true;
            if (drag.dropped) return;
            if (dy > cell * 1.8 && dy > Math.abs(dx) * 1.4 && performance.now() - drag.t < 450) { drag.dropped = true; hardDrop(); return; }
            slideTo(drag.startX + Math.round(dx / (cell * 0.9)));
        });
        const endDrag = e => { if (!drag) return; if (!drag.moved && !drag.dropped && performance.now() - drag.t < 400 && e.type === 'pointerup') turn(); drag = null; };
        board.addEventListener('pointerup', endDrag);
        board.addEventListener('pointercancel', endDrag);
        board.addEventListener('contextmenu', e => e.preventDefault());
        function hold(btn, action, repeat) {
            let d = 0, r = 0;
            const stop = () => { btn.classList.remove('down'); clearTimeout(d); clearInterval(r); };
            btn.addEventListener('pointerdown', e => {
                e.preventDefault();
                try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                btn.classList.add('down');
                action();
                if (repeat) d = setTimeout(() => { r = setInterval(action, 110); }, 280);
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, stop));
            btn.addEventListener('click', e => { if (e.detail === 0) action(); });
        }
        hold($('#btn-left'), () => { if (move(-1)) Kit.tone(520, { dur: 0.06, vol: 0.06, type: 'triangle' }); else sfx.oops(); }, true);
        hold($('#btn-right'), () => { if (move(1)) Kit.tone(520, { dur: 0.06, vol: 0.06, type: 'triangle' }); else sfx.oops(); }, true);
        hold($('#btn-turn'), turn, false);
        hold($('#btn-drop'), hardDrop, false);
        document.addEventListener('keydown', e => {
            if (game.hidden) return;
            const keys = { ArrowLeft: () => move(-1), ArrowRight: () => move(1), ArrowUp: turn, ArrowDown: stepDown, ' ': hardDrop };
            const act = keys[e.key];
            if (!act) return;
            if (e.key === ' ' && document.activeElement && document.activeElement.classList.contains('pad')) return;
            e.preventDefault();
            if (e.key === 'ArrowUp' && e.repeat) return;
            act();
        });

        // ---------- Screens ----------
        function renderHud(before) {
            $('#level-badge').textContent = T(`Level ${level + 1}`, `Niveau ${level + 1}`);
            Kit.stars($('#stars'), LINES, lines);
            for (let i = before === undefined ? lines : before; i < lines; i++) { const s = $('#stars').children[i]; if (s) s.classList.add('pop'); }
        }
        function applyLevelLook() { Kit.tint(LEVELS[level].tint); }
        function play(n) {
            level = n;
            lines = 0; busy = false; bag = []; nextId = null; grid = emptyGrid(); piece = null;
            save();
            Kit.show(game);
            applyLevelLook();
            resize();
            renderHud();
            spawn();
            running = true;
            lastTime = 0;
            requestAnimationFrame(loop);
            say(`Level ${level + 1}! Stack the blocks!`, `Niveau ${level + 1}${NBSP}! Empile les blocs${NBSP}!`);
        }
        Kit.onLeave(game, () => { running = false; piece = null; busy = false; });
        function goStart() { Kit.show(start, { back: false }); Kit.tint('#E6E0FF'); $('#play-badge').textContent = T(`Level ${level + 1}`, `Niv. ${level + 1}`); drawTitle(); }
        function openPick() {
            if (cleared === 0) { Kit.bounce($('#go-pick'), 'wobble'); sfx.oops(); say('Finish level 1 first!', `Termine le niveau 1 d'abord${NBSP}!`); return; }
            Kit.show(pick);
            Kit.picker($('#picker'), { count: LEVELS.length, open: n => n <= cleared, onPick: play });
        }
        function drawTitle() {
            const art = $('#title-art'), r = art.getBoundingClientRect();
            if (!r.width) return;
            const d = Math.min(window.devicePixelRatio || 1, 2);
            art.width = r.width * d; art.height = r.height * d;
            const c = art.getContext('2d');
            c.setTransform(d, 0, 0, d, 0, 0);
            const s = r.height / 3, ox = (r.width - s * 8) / 2;
            const put = (id, cells, x, y) => cells.forEach((row, rr2) => row.forEach((v, col) => { if (v) block(c, ox + (x + col) * s, (y + rr2) * s, s, SHAPES[id].c, SHAPES[id].cd, 'happy'); }));
            put('L', [[1, 0], [1, 0], [1, 1]], 0, 0); put('O', SHAPES.O.cells, 2, 1); put('T', [[1, 1, 1], [0, 1, 0]], 4, 1); put('dot', [[1]], 7, 2); put('duo', [[1, 1]], 4, 0);
        }
        $('#go-play').addEventListener('click', () => { sfx.pop(); play(level); });
        $('#go-pick').addEventListener('click', openPick);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) running = false;
            else if (!game.hidden && !running) { running = true; lastTime = 0; requestAnimationFrame(loop); }
        });
        let rt = 0;
        window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (!start.hidden) drawTitle(); }, 80); });
        Kit.onLang(() => { if (!game.hidden) renderHud(); if (!start.hidden) $('#play-badge').textContent = T(`Level ${level + 1}`, `Niv. ${level + 1}`); });
        goStart();
    }());
    </script>
</body>
</html>
